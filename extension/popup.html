<div id="privacy-dashboard">
  <div class="privacy-score">
    <h3>Current Site: <span id="current-domain">example.com</span></h3>
    <div class="score-ring" data-score="75">
      <span>75%</span>
    </div>
    <p>GDPR Compliance Rating</p>
  </div>

  <div class="data-controls">
    <h4>Your Data Controls</h4>
    <div class="control-group">
      <label>
        <input type="checkbox" id="strict-mode" checked>
        Block Non-Essential Cookies
      </label>
    </div>

    <div class="monetization-card">
      <h4>Monetize This Visit</h4>
      <p>Earn <strong>0.05 ECO</strong> by sharing anonymized behavior data</p>
      <button id="monetize-session">Enable Monetization</button>
    </div>
  </div>

  <div class="data-valuation">
    <h4>Your Data Portfolio Value</h4>
    <div class="portfolio-value">
      <span class="crypto-value">3.24 ETH</span>
      <span class="fiat-value">$5,287.16 USD</span>
    </div>
    <a href="https://market.authblock.org/portfolio" target="_blank">
      Visit Data Marketplace
    </a>
  </div>
</div>
