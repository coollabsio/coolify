services:
  coolify:
    environment:
      SENTINEL_HOST_ENABLED: "true"
      SENTINEL_HOST_IMAGE: "coolify-sentinel-host:dev"
      SENTINEL_HOST_SKIP_IMAGE_PULL: "true"
      FLUX_PORT: "${FLUX_PORT:-7443}"
      FLUX_PUBLIC_URL: "http://coolify-flux:7443"
      FLUX_ISSUER: "coolify-dev"
      FLUX_SIGNING_KEY_ID: "dev-key"
      FLUX_SIGNING_PRIVATE_KEY: "Q0NDQ0NDQ0NDQ0NDQ0NDQ0NDQ0NDQ0NDQ0NDQ0NDQ0Mi/Cl3kvC2/8C/z9t+2wwKoU4CWjZewONC6G44Kct0tg=="
      FLUX_SIGNING_PUBLIC_KEY: "Ivwpd5Lwtv/Av8/bftsMCqFOAlo2XsDjQuhuOCnLdLY="
      FLUX_INTERNAL_TOKEN: "coolify-flux-development-token"

  flux:
    image: coolify-flux:dev
    build:
      context: "${SENTINEL_SOURCE_PATH:-/root/devel/sentinel}"
      dockerfile: Dockerfile.flux
    container_name: coolify-flux
    restart: unless-stopped
    environment:
      FLUX_LISTEN_ADDR: "0.0.0.0:7443"
      FLUX_ISSUER: "coolify-dev"
      FLUX_SIGNING_KEY_ID: "dev-key"
      FLUX_SIGNING_PUBLIC_KEY: "Ivwpd5Lwtv/Av8/bftsMCqFOAlo2XsDjQuhuOCnLdLY="
      FLUX_INTERNAL_EVENTS_URL: "http://coolify:8080/api/v1/internal/sentinel/control/events"
      FLUX_INTERNAL_TOKEN: "coolify-flux-development-token"
    ports:
      - "${FLUX_PORT:-7443}:7443"
    networks:
      - coolify

  sentinel-host-image:
    profiles: ["build"]
    image: coolify-sentinel-host:dev
    build:
      context: "${SENTINEL_SOURCE_PATH:-/root/devel/sentinel}"
      dockerfile: Dockerfile.host
      args:
        VERSION: dev

  testing-host:
    image: coolify-testing-host-systemd:dev
    build:
      target: systemd
    init: false
    privileged: true
    cgroup: host
    stop_signal: SIGRTMIN+3
    tmpfs:
      - /run
      - /run/lock
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    healthcheck:
      test: ["CMD-SHELL", "systemctl is-active --quiet ssh.service"]
      interval: 5s
      retries: 10
      timeout: 2s
