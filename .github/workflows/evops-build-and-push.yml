on:
  push:
    branches:
      - v4.x

jobs:
  build:
    runs-on: private

    steps:
      - uses: actions/checkout@v4

      - name: Login to Docker Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - run: ./.evops/build-and-push.sh
