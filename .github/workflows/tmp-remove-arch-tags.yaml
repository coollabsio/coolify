name: TMP Remove arch tags

on:
  workflow_dispatch:

permissions: {}

cache-mode: none

concurrency:
  group: clean-manifests
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  remove:
    name: Remove arch tags
    if: ${{ github.repository == 'coollabsio/coolify' }}
    permissions:
      contents: read
    environment:
      name: cleanup
      deployment: false
    runs-on: ubuntu-26.04 # https://github.com/actions/runner-images
    timeout-minutes: 60
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: List the arch tags to remove
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_CLEANUP_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_CLEANUP_TOKEN }}
        run: scripts/tmp-remove-arch-tags.sh

      - name: Upload the list of arch tags to remove
        if: ${{ always() }}
        uses: actions/upload-artifact@v7.0.2
        with:
          name: arch-tags-to-remove
          path: scripts/arch-tags-to-remove.tsv
          if-no-files-found: ignore
          retention-days: 90
