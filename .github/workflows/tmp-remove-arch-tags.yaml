name: TMP Remove arch tags

on:
  workflow_dispatch:
    inputs:
      remove:
        description: The number of arch tags to remove from the top of the list, 0 only lists them
        type: number
        default: 0

permissions: {}

cache-mode: none

concurrency:
  group: clean-manifests
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  remove:
    name: Remove arch tags
    if: ${{ github.repository == 'coollabsio/coolify' }}
    permissions:
      contents: read
      actions: write # to disable this workflow after a failure
      packages: write # to move the arch tags on ghcr.io and delete the placeholder
      pull-requests: read # to list the open pull requests, their images are kept
    environment:
      name: cleanup
      deployment: false
    runs-on: ubuntu-26.04 # https://github.com/actions/runner-images
    timeout-minutes: 60
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Remove the arch tags
        env:
          GH_TOKEN: ${{ github.token }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_CLEANUP_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_CLEANUP_TOKEN }}
          REMOVE: ${{ inputs.remove }}
        run: |
          if [ "$REMOVE" = 0 ]; then
            scripts/tmp-remove-arch-tags.sh
          else
            scripts/tmp-remove-arch-tags.sh --remove "$REMOVE"
          fi

      - name: Upload the lists of arch tags
        if: ${{ always() }}
        uses: actions/upload-artifact@v7.0.2
        with:
          name: arch-tags
          path: |
            scripts/arch-tags-to-remove.tsv
            scripts/removed-arch-tags.tsv
          if-no-files-found: ignore
          retention-days: 90

      - name: Disable this workflow after a failure
        if: ${{ failure() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow disable tmp-remove-arch-tags.yaml --repo "$GITHUB_REPOSITORY"
