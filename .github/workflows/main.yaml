name: Main

on:
  schedule:
    - cron: "50 7,15 * * *"
  workflow_dispatch:

permissions: {}

cache-mode: none

concurrency:
  group: main
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  plan:
    name: Plan build
    if: ${{ github.repository == 'coollabsio/coolify' }}
    permissions:
      contents: read
    runs-on: ubuntu-26.04 # https://github.com/actions/runner-images
    timeout-minutes: 10
    outputs:
      build: ${{ steps.plan.outputs.build }}
    steps:
      - name: Check out main
        uses: actions/checkout@v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Plan the main build
        id: plan
        env:
          BRANCH: main
        run: |
          labels="$(docker buildx imagetools inspect ghcr.io/coollabsio/coolify:main --format '{{ json (index .Image "linux/amd64").Config.Labels }}')" || labels='{}'
          MAIN_VERSION="$(jq -r '.["org.opencontainers.image.version"] // empty' <<< "$labels")"
          MAIN_REVISION="$(jq -r '.["org.opencontainers.image.revision"] // empty' <<< "$labels")"
          export MAIN_VERSION MAIN_REVISION
          build="$(scripts/plan-version.sh --main)"
          echo "build=$build" | tee -a "$GITHUB_OUTPUT"

  build:
    name: Build
    needs: plan
    if: ${{ needs.plan.outputs.build != '' }}
    permissions:
      contents: read
    uses: $/.github/workflows/build.yaml
    with:
      ref: ${{ fromJSON(needs.plan.outputs.build).revision }}
      coolify: ${{ fromJSON(needs.plan.outputs.build).image }}

  publish:
    name: Publish image
    needs: build
    permissions:
      packages: write # push the built main to ghcr.io and move the main tag
    runs-on: ubuntu-26.04 # https://github.com/actions/runner-images
    timeout-minutes: 30
    steps:
      - name: Download the built images
        uses: actions/download-artifact@v8.0.2
        with:
          pattern: image-*
          path: ${{ runner.temp }}/images

      - name: Log in to ghcr.io
        uses: docker/login-action@v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push the built main
        run: |
          sources=()
          for index in "$RUNNER_TEMP"/images/*/index.json; do
            sources+=("oci-layout://${index%/index.json}@$(jq -r '.manifests[0].digest' "$index")")
          done
          labels="$(docker buildx imagetools inspect "${sources[0]}" --format '{{ json .Image.Config.Labels }}' \
            | jq -r 'to_entries[] | "--annotation=index:\(.key)=\(.value)"')"
          mapfile -t annotations <<< "$labels"
          docker buildx imagetools create "${annotations[@]}" --tag ghcr.io/coollabsio/coolify:main "${sources[@]}"
