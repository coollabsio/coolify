name: Build

on:
  schedule:
    - cron: "50 7 * * 1"
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: The commit to build, the commit of the run when empty
        type: string
        default: ""
      coolify:
        description: The Coolify version to build, the version release.json sets for the branch when empty
        type: string
        default: ""

permissions: {}

cache-mode: none

concurrency:
  group: build-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  plan:
    name: Plan build
    permissions:
      contents: read
    runs-on: ubuntu-26.04 # https://github.com/actions/runner-images
    timeout-minutes: 10
    outputs:
      coolify: ${{ inputs.coolify || steps.plan.outputs.coolify }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Plan the Coolify version
        id: plan
        env:
          BRANCH: ${{ github.base_ref || github.ref_name }}
          PULL_REQUEST: ${{ github.event.pull_request.number }}
        run: |
          coolify="$(scripts/plan-version.sh --build)"
          echo "coolify=$coolify" >> "$GITHUB_OUTPUT"

  build:
    name: Build image (${{ matrix.platform }})
    needs: plan
    permissions:
      contents: read
    runs-on: ${{ matrix.runner }} # https://github.com/actions/runner-images
    timeout-minutes: 60
    strategy:
      matrix:
        platform: [linux/amd64, linux/arm64]
        include:
          - platform: linux/amd64
            arch: amd64
            runner: ubuntu-26.04
          - platform: linux/arm64
            arch: arm64
            runner: ubuntu-26.04-arm
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Read the commit date and hash
        id: args
        run: |
          {
            echo "epoch=$(git log -1 --format=%ct)"
            echo "created=$(TZ=UTC git log -1 --format=%cd --date=format-local:%Y-%m-%dT%H:%M:%SZ)"
            echo "sha=$(git rev-parse HEAD)"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4.4.1
        with:
          cache-binary: false

      - name: Build the image
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          file: docker/production/Dockerfile
          platforms: ${{ matrix.platform }}
          tags: coollabsio/coolify:test
          outputs: type=oci,dest=${{ runner.temp }}/image,tar=false,rewrite-timestamp=true,compression=zstd,compression-level=11,force-compression=true
          build-args: |
            COOLIFY_VERSION=${{ needs.plan.outputs.coolify }}
            SOURCE_DATE_EPOCH=${{ steps.args.outputs.epoch }}
            CREATED=${{ steps.args.outputs.created }}
            GIT_SHA=${{ steps.args.outputs.sha }}
          provenance: mode=max
          sbom: true

      - name: Upload the image
        uses: actions/upload-artifact@v7.0.2
        with:
          name: image-${{ matrix.arch }}
          path: ${{ runner.temp }}/image
          if-no-files-found: error
          retention-days: 1
