apiVersion: v1
kind: Pod
metadata:
  name: {{ include "coolify.fullname" . }}-test-web-health
  labels:
    {{- include "coolify.labels" . | nindent 4 }}
    app.kubernetes.io/component: test
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  containers:
    - name: curl
      image: curlimages/curl:8.17.0
      command:
        - sh
        - -ec
      args:
        - curl --fail --silent --show-error http://{{ include "coolify.fullname" . }}:{{ .Values.service.port }}/api/health
