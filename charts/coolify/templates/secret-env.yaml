{{- if not .Values.env.existingSecret }}
{{- $secretName := include "coolify.envSecretName" . -}}
{{- $appKey := include "coolify.secretValue" (dict "root" . "name" $secretName "key" "APP_KEY" "value" .Values.app.key "generated" (printf "base64:%s" (randAlphaNum 32 | b64enc))) -}}
{{- $dbPassword := include "coolify.secretValue" (dict "root" . "name" $secretName "key" "DB_PASSWORD" "value" .Values.database.password "generated" (randAlphaNum 32)) -}}
{{- $redisPassword := include "coolify.secretValue" (dict "root" . "name" $secretName "key" "REDIS_PASSWORD" "value" .Values.redisConnection.password "generated" (randAlphaNum 32)) -}}
{{- $pusherAppId := include "coolify.secretValue" (dict "root" . "name" $secretName "key" "PUSHER_APP_ID" "value" .Values.pusher.appId "generated" (randAlphaNum 16)) -}}
{{- $pusherAppKey := include "coolify.secretValue" (dict "root" . "name" $secretName "key" "PUSHER_APP_KEY" "value" .Values.pusher.appKey "generated" (randAlphaNum 32)) -}}
{{- $pusherAppSecret := include "coolify.secretValue" (dict "root" . "name" $secretName "key" "PUSHER_APP_SECRET" "value" .Values.pusher.appSecret "generated" (randAlphaNum 32)) -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  labels:
    {{- include "coolify.labels" . | nindent 4 }}
type: Opaque
stringData:
  APP_KEY: {{ $appKey | quote }}
  DB_PASSWORD: {{ $dbPassword | quote }}
  REDIS_PASSWORD: {{ $redisPassword | quote }}
  PUSHER_APP_ID: {{ $pusherAppId | quote }}
  PUSHER_APP_KEY: {{ $pusherAppKey | quote }}
  PUSHER_APP_SECRET: {{ $pusherAppSecret | quote }}
  .env: |
    APP_NAME={{ .Values.app.name | quote }}
    APP_ENV={{ .Values.app.env }}
    APP_KEY={{ $appKey }}
    APP_URL={{ .Values.app.url }}
    APP_DEBUG={{ .Values.app.debug }}
    SELF_HOSTED=true
    AUTOUPDATE={{ .Values.app.autoUpdate }}
    BASE_CONFIG_PATH={{ .Values.app.baseConfigPath }}
    TRUSTED_PROXIES={{ .Values.app.trustedProxies | quote }}
    CDN_URL={{ .Values.app.cdnUrl }}
    DB_CONNECTION=pgsql
    DB_HOST={{ include "coolify.databaseHost" . }}
    DB_PORT={{ .Values.database.port }}
    DB_DATABASE={{ ternary .Values.postgresql.auth.database .Values.database.name .Values.postgresql.enabled }}
    DB_USERNAME={{ ternary .Values.postgresql.auth.username .Values.database.username .Values.postgresql.enabled }}
    DB_PASSWORD={{ ternary "" $dbPassword (ne .Values.database.existingSecret.name "") }}
    REDIS_HOST={{ include "coolify.redisHost" . }}
    REDIS_PORT={{ .Values.redisConnection.port }}
    REDIS_PASSWORD={{ ternary "" $redisPassword (ne .Values.redisConnection.existingSecret.name "") }}
    BROADCAST_DRIVER=pusher
    PUSHER_APP_ID={{ $pusherAppId }}
    PUSHER_APP_KEY={{ $pusherAppKey }}
    PUSHER_APP_SECRET={{ $pusherAppSecret }}
    PUSHER_BACKEND_HOST={{ include "coolify.fullname" . }}-realtime
    PUSHER_BACKEND_PORT={{ .Values.realtime.service.pusherPort }}
    PUSHER_SCHEME={{ .Values.realtime.publicScheme }}
    PUSHER_HOST={{ .Values.realtime.publicHost }}
    PUSHER_PORT={{ .Values.realtime.publicPort }}
    REGISTRY_URL={{ .Values.image.registry }}
    HELPER_IMAGE={{ .Values.image.registry }}/coollabsio/coolify-helper
    REALTIME_IMAGE={{ .Values.realtimeImage.registry }}/{{ .Values.realtimeImage.repository }}
    MIGRATION_ENABLED=false
    SEEDER_ENABLED=false
    HORIZON_ENABLED=false
    SCHEDULER_ENABLED=false
    NIGHTWATCH_ENABLED=false
{{- range $name, $value := .Values.env.extra }}
    {{ $name }}={{ $value | quote }}
{{- end }}
{{- end }}
