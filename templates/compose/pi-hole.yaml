# documentation: https://pi-hole.net/
# slogan: Network-wide Ad Blocking
# category: proxy
# tags: ad-block,dns,sinkhole,ntp,dhcp
# logo: svgs/pihole.svg
# port: 80

services:
  pihole:
    image: pihole/pihole:2026.11.0
    ports:
      # DNS ports. By default they are bound to 127.0.0.1, so only the server itself can use this Pi-hole.
      # To serve your network, set PIHOLE_DNS_BIND_ADDRESS to the server's LAN or VPN (for example Tailscale) IP address.
      # Do not use 0.0.0.0 on a server with a public IP address: it makes the server an open DNS resolver.
      # Docker publishes ports past ufw, so a ufw rule does not protect port 53. Use a firewall of your hosting provider instead.
      - "${PIHOLE_DNS_BIND_ADDRESS:-127.0.0.1}:53:53/tcp"
      - "${PIHOLE_DNS_BIND_ADDRESS:-127.0.0.1}:53:53/udp"
      # Uncomment the line below if you are using Pi-hole as your DHCP server
      # - "67:67/udp"
      # Uncomment the line below if you are using Pi-hole as your NTP server
      # - "${PIHOLE_DNS_BIND_ADDRESS:-127.0.0.1}:123:123/udp"
    environment:
      - SERVICE_URL_PIHOLE_80
      - TZ=${TZ:-Europe/London}
      - FTLCONF_webserver_api_password=${SERVICE_PASSWORD_PIHOLE}
      - FTLCONF_dns_listeningMode=${FTLCONF_dns_listeningMode:-all}
      - PIHOLE_DNS_BIND_ADDRESS=${PIHOLE_DNS_BIND_ADDRESS:-127.0.0.1}
    volumes:
      - pihole-data:/etc/pihole
    cap_add:
      # See https://github.com/pi-hole/docker-pi-hole#note-on-capabilities
      # Required if you are using Pi-hole as your DHCP server, else not needed
      - NET_ADMIN
      # Required if you are using Pi-hole as your NTP client to be able to set the host's system time
      - SYS_TIME
