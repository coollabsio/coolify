# documentation: https://sentroy.com/docs
# slogan: Self-hostable workspace OS — mail, storage, auth, status, WhatsApp & more, one deploy.
# category: productivity
# tags: platform, workspace, productivity, self-hosted, mongodb, nextjs
# logo: svgs/sentroy.svg
# port: 3000
#
# ── Sentroy platform (whole-suite one-click) ─────────────────────────────────
# Public prebuilt images (ghcr.io/sentroy-co/sentroy-oss-*). Client bundles are
# built with a domain sentinel and rewritten at container start from
# SENTROY_ROOT_DOMAIN (scripts/runtime-domain.sh) — the SAME image serves any
# domain, so this is a true image-mode one-click (no build).
#
# BEFORE DEPLOY (operator):
#   1. Set SENTROY_ROOT_DOMAIN to your root domain (e.g. acme.com). Every app is
#      served at a fixed subdomain of it: core=<root>, mail=mail.<root>,
#      storage=storage.<root>, auth=auth.<root>, status=status.<root>,
#      studio=studio.<root>, whatsapp=whatsapp.<root>, linear=linear.<root>,
#      downloader=youtube.<root>, backup=backup.<root>, cdn=cdn.<root>.
#   2. Point wildcard DNS (*.<root> + <root>) at this Coolify server, then set
#      each service's domain in Coolify to its subdomain above.
#   3. Object storage (S3-compatible) is REQUIRED for Storage + Backup: fill
#      IDRIVE_* (endpoint/region/bucket/keys). All other integrations (Google/
#      GitHub OAuth, Turnstile, IPinfo) are OPTIONAL — blank = feature off.
#   All secrets (Mongo, auth, internal, per-app keys, mail admin token) are
#   auto-generated by Coolify and shown in the panel — nothing to invent.
#
# RESOURCES: the full suite is ~14 services; budget ≥8 GB RAM / 4 vCPU. To run a
# subset, delete the services you don't need before deploying.
# Email SENDING/RECEIVING is a separate template (sentroy-mailserver) — it needs
# SMTP ports (25/587/465) + PTR/rDNS that a shared app host usually can't give.

x-common-env: &common-env
  # Operator's single domain knob → runtime-domain.sh rewrites client bundles +
  # every server-side URL below is derived from it.
  SENTROY_ROOT_DOMAIN: $SENTROY_ROOT_DOMAIN
  DOMAIN: $SENTROY_ROOT_DOMAIN
  MONGODB_URI: mongodb://sentroy:$SERVICE_PASSWORD_MONGO@mongo:27017/sentroy?authSource=admin
  MONGODB_DATABASE: sentroy
  BETTER_AUTH_SECRET: $SERVICE_PASSWORD_64_AUTH
  BETTER_AUTH_URL: https://$SENTROY_ROOT_DOMAIN
  AUTH_COOKIE_DOMAIN: .$SENTROY_ROOT_DOMAIN
  AUTH_TRUSTED_ORIGINS: https://$SENTROY_ROOT_DOMAIN
  INTERNAL_API_SECRET: $SERVICE_PASSWORD_INTERNAL
  SENTROY_ENV_MASTER_KEY: $SERVICE_PASSWORD_64_ENVMASTER
  CORE_APP_URL: https://$SENTROY_ROOT_DOMAIN
  MAIL_APP_URL: https://mail.$SENTROY_ROOT_DOMAIN
  STORAGE_APP_URL: https://storage.$SENTROY_ROOT_DOMAIN
  NODE_ENV: production
  # Optional social login (blank = disabled).
  GOOGLE_CLIENT_ID: $GOOGLE_CLIENT_ID
  GOOGLE_CLIENT_SECRET: $GOOGLE_CLIENT_SECRET
  GITHUB_CLIENT_ID: $GITHUB_CLIENT_ID
  GITHUB_CLIENT_SECRET: $GITHUB_CLIENT_SECRET

services:
  # ── Database ────────────────────────────────────────────────────────────────
  mongo:
    image: mongo:7
    environment:
      MONGO_INITDB_ROOT_USERNAME: sentroy
      MONGO_INITDB_ROOT_PASSWORD: $SERVICE_PASSWORD_MONGO
    volumes:
      - sentroy-mongo:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ── core (sentroy.com) — landing, auth, admin, API gateway, OS, docs ──────────
  core:
    image: ghcr.io/sentroy-co/sentroy-oss-core:latest
    environment:
      <<: *common-env
      SERVICE_FQDN_CORE_3000: /
      # First-run platform admin (created on boot if absent).
      ADMIN_EMAIL: $SERVICE_USER_ADMIN@$SENTROY_ROOT_DOMAIN
      ADMIN_PASSWORD: $SERVICE_PASSWORD_ADMIN
      SENTROY_ADMIN_API_KEY: $SERVICE_PASSWORD_64_ADMINAPI
      CDN_API_SECRET: $SERVICE_PASSWORD_CDN
      CDN_API_URL: http://cdn:4100
      # Optional integrations (blank = off).
      IPINFO_TOKEN: $IPINFO_TOKEN
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: $NEXT_PUBLIC_TURNSTILE_SITE_KEY
      BETTER_AUTH_TURNSTILE_SECRET: $BETTER_AUTH_TURNSTILE_SECRET
      TURNSTILE_DISABLED: "true"
      NEXT_PUBLIC_TURNSTILE_DISABLED: "true"
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 8s
      retries: 6
      start_period: 90s

  # ── storage (storage.<root>) + cdn (cdn.<root>) ───────────────────────────────
  storage:
    image: ghcr.io/sentroy-co/sentroy-oss-storage:latest
    environment:
      <<: *common-env
      SERVICE_FQDN_STORAGE_3002: /
      PORT: "3002"
      CDN_API_SECRET: $SERVICE_PASSWORD_CDN
      CDN_API_URL: http://cdn:4100
      # S3-compatible object storage — REQUIRED for uploads.
      IDRIVE_ENDPOINT: $IDRIVE_ENDPOINT
      IDRIVE_REGION: $IDRIVE_REGION
      IDRIVE_BUCKET: $IDRIVE_BUCKET
      IDRIVE_ACCESS_KEY: $IDRIVE_ACCESS_KEY
      IDRIVE_SECRET_KEY: $IDRIVE_SECRET_KEY
    depends_on:
      mongo:
        condition: service_healthy

  cdn:
    image: ghcr.io/sentroy-co/sentroy-oss-cdn:latest
    environment:
      SERVICE_FQDN_CDN_4100: /
      PORT: "4100"
      BASE_URL: https://cdn.$SENTROY_ROOT_DOMAIN
      CDN_API_SECRET: $SERVICE_PASSWORD_CDN
      CDN_CORS_ORIGINS: https://storage.$SENTROY_ROOT_DOMAIN
      IDRIVE_ENDPOINT: $IDRIVE_ENDPOINT
      IDRIVE_REGION: $IDRIVE_REGION
      IDRIVE_BUCKET: $IDRIVE_BUCKET
      IDRIVE_ACCESS_KEY: $IDRIVE_ACCESS_KEY
      IDRIVE_SECRET_KEY: $IDRIVE_SECRET_KEY

  # ── auth (auth.<root>) — OAuth/OIDC provider + Auth-as-a-Service ──────────────
  auth2:
    image: ghcr.io/sentroy-co/sentroy-oss-auth2:latest
    environment:
      <<: *common-env
      SERVICE_FQDN_AUTH2_3003: /
      PORT: "3003"
      # RS256 signing key optional — HS256 (BETTER_AUTH_SECRET) fallback if blank.
      OAUTH_RSA_PRIVATE_KEY: $OAUTH_RSA_PRIVATE_KEY
    depends_on:
      mongo:
        condition: service_healthy

  # ── status (status.<root>) — public status page + admin ──────────────────────
  status:
    image: ghcr.io/sentroy-co/sentroy-oss-status:latest
    environment:
      <<: *common-env
      SERVICE_FQDN_STATUS_3004: /
      PORT: "3004"
    depends_on:
      mongo:
        condition: service_healthy

  # ── studio (studio.<root>) — DJ-first DAW ─────────────────────────────────────
  studio:
    image: ghcr.io/sentroy-co/sentroy-oss-studio:latest
    environment:
      <<: *common-env
      SERVICE_FQDN_STUDIO_3006: /
      PORT: "3006"
    depends_on:
      mongo:
        condition: service_healthy

  # ── whatsapp (whatsapp.<root>) + gateway (internal) ───────────────────────────
  whatsapp:
    image: ghcr.io/sentroy-co/sentroy-oss-whatsapp:latest
    environment:
      <<: *common-env
      SERVICE_FQDN_WHATSAPP_3007: /
      PORT: "3007"
      WHATSAPP_GATEWAY_URL: http://whatsapp-gateway:4200
      WHATSAPP_ENC_KEY: $SERVICE_PASSWORD_64_WHATSAPP
    depends_on:
      mongo:
        condition: service_healthy

  whatsapp-gateway:
    image: ghcr.io/sentroy-co/sentroy-oss-whatsapp-gateway:latest
    environment:
      PORT: "4200"
      MONGODB_URI: mongodb://sentroy:$SERVICE_PASSWORD_MONGO@mongo:27017/sentroy?authSource=admin
      WHATSAPP_ENC_KEY: $SERVICE_PASSWORD_64_WHATSAPP
    depends_on:
      mongo:
        condition: service_healthy

  # ── linear (linear.<root>) — issue tracker ────────────────────────────────────
  linear:
    image: ghcr.io/sentroy-co/sentroy-oss-linear:latest
    environment:
      <<: *common-env
      SERVICE_FQDN_LINEAR_3009: /
      PORT: "3009"
    depends_on:
      mongo:
        condition: service_healthy

  # ── downloader (youtube.<root>) + worker (internal) ───────────────────────────
  downloader:
    image: ghcr.io/sentroy-co/sentroy-oss-downloader:latest
    environment:
      SERVICE_FQDN_DOWNLOADER_3008: /
      PORT: "3008"
      SENTROY_ROOT_DOMAIN: $SENTROY_ROOT_DOMAIN
      DOWNLOADER_WORKER_URL: http://downloader-worker:4300
      DOWNLOADER_API_SECRET: $SERVICE_PASSWORD_DOWNLOADER
      NODE_ENV: production
      TURNSTILE_SECRET: $BETTER_AUTH_TURNSTILE_SECRET

  downloader-worker:
    image: ghcr.io/sentroy-co/sentroy-oss-downloader-worker:latest
    environment:
      PORT: "4300"
      DOWNLOADER_API_SECRET: $SERVICE_PASSWORD_DOWNLOADER
    volumes:
      - sentroy-downloads:/downloads

  # ── backup (backup.<root>) + worker (internal) — MongoDB Backuper ─────────────
  backup:
    image: ghcr.io/sentroy-co/sentroy-oss-backup:latest
    environment:
      <<: *common-env
      SERVICE_FQDN_BACKUP_3010: /
      PORT: "3010"
      BACKUP_WORKER_URL: http://backup-worker:4400
      BACKUP_API_SECRET: $SERVICE_PASSWORD_BACKUP
      IDRIVE_ENDPOINT: $IDRIVE_ENDPOINT
      IDRIVE_REGION: $IDRIVE_REGION
      IDRIVE_ACCESS_KEY: $IDRIVE_ACCESS_KEY
      IDRIVE_SECRET_KEY: $IDRIVE_SECRET_KEY
    depends_on:
      mongo:
        condition: service_healthy

  backup-worker:
    image: ghcr.io/sentroy-co/sentroy-oss-backup-worker:latest
    environment:
      PORT: "4400"
      BACKUP_API_SECRET: $SERVICE_PASSWORD_BACKUP
      MONGODB_URI: mongodb://sentroy:$SERVICE_PASSWORD_MONGO@mongo:27017/sentroy?authSource=admin

volumes:
  sentroy-mongo:
  sentroy-downloads:
