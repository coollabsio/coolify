# documentation: https://github.com/peakimages/opencode
# slogan: Open source AI coding agent as a server for the OpenCode web UI, desktop app, mobile app and terminal.
# category: ai
# tags: opencode, ai, agent, coding, assistant, llm, ide, development
# logo: svgs/opencode.svg
# port: 4096

services:
  opencode:
    image: peakimages/opencode:2.3.1-v0.1.0
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      - SERVICE_URL_OPENCODE_4096
      - OPENCODE_PASSWORD=${SERVICE_PASSWORD_64_OPENCODE}
    volumes:
      - opencode-data:/home/nonroot
