# WordPress + OpenLiteSpeed Service Template for Coolify
# Provides a production-ready WordPress stack using OpenLiteSpeed as the web server.
# - OpenLiteSpeed handles HTTP/HTTPS with built-in LiteSpeed Cache support
# - MariaDB for the database backend
# - Persistent volumes for WordPress files and database data
# - Compatible with Coolify's built-in Traefik proxy

services:
  openlitespeed:
    image: litespeedtech/openlitespeed:latest
    environment:
      - OLS_DOMAIN=${SERVICE_FQDN_OPENLITESPEED}
      - PHP_PROC=2
      - SERVICE_FQDN_OPENLITESPEED
    volumes:
      - wordpress-data:/var/www/vhosts
      - ols-logs:/usr/local/lsws/logs
      - ols-conf:/usr/local/lsws/conf
    depends_on:
      mariadb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8088"]
      interval: 5s
      timeout: 5s
      retries: 10
    labels:
      - traefik.enable=true
      - traefik.http.routers.openlitespeed-${SERVICE_NAME}-http.rule=Host(`${SERVICE_FQDN_OPENLITESPEED}`)
      - traefik.http.routers.openlitespeed-${SERVICE_NAME}-http.entryPoints=http
      - traefik.http.routers.openlitespeed-${SERVICE_NAME}-http.middlewares=redirect-to-https
      - traefik.http.routers.openlitespeed-${SERVICE_NAME}-https.rule=Host(`${SERVICE_FQDN_OPENLITESPEED}`)
      - traefik.http.routers.openlitespeed-${SERVICE_NAME}-https.entryPoints=https
      - traefik.http.routers.openlitespeed-${SERVICE_NAME}-https.tls.certresolver=letsencrypt
      - traefik.http.services.openlitespeed-${SERVICE_NAME}.loadbalancer.server.port=8088

  wordpress:
    image: wordpress:php8.3-fpm-alpine
    environment:
      - WORDPRESS_DB_HOST=mariadb:3306
      - WORDPRESS_DB_USER=${SERVICE_USER_MYSQL}
      - WORDPRESS_DB_PASSWORD=${SERVICE_PASSWORD_MYSQL}
      - WORDPRESS_DB_NAME=${MYSQL_DATABASE:-wordpress}
      - WORDPRESS_TABLE_PREFIX=${WORDPRESS_TABLE_PREFIX:-wp_}
      - WORDPRESS_DEBUG=${WORDPRESS_DEBUG:-false}
      - WORDPRESS_CONFIG_EXTRA=
          define('WP_HOME', 'https://${SERVICE_FQDN_OPENLITESPEED}');
          define('WP_SITEURL', 'https://${SERVICE_FQDN_OPENLITESPEED}');
          define('FORCE_SSL_ADMIN', true);
          if (strpos($_SERVER['HTTP_X_FORWARDED_PROTO'], 'https') !== false) { $_SERVER['HTTPS'] = 'on'; }
    volumes:
      - wordpress-data:/var/www/html
    depends_on:
      mariadb:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "php-fpm -t || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10

  mariadb:
    image: mariadb:11
    environment:
      - MYSQL_ROOT_PASSWORD=${SERVICE_PASSWORD_ROOT_MYSQL}
      - MYSQL_DATABASE=${MYSQL_DATABASE:-wordpress}
      - MYSQL_USER=${SERVICE_USER_MYSQL}
      - MYSQL_PASSWORD=${SERVICE_PASSWORD_MYSQL}
    volumes:
      - mariadb-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  wordpress-data:
  mariadb-data:
  ols-logs:
  ols-conf:
