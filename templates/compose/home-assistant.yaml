# documentation: https://www.home-assistant.io/
# slogan: Open source home automation that puts local control and privacy first.
# category: home-automation
# tags: home-assistant, home-automation, smart-home, mqtt, zigbee, zwave
# logo: svgs/home-assistant.svg
# port: 8123

services:
  homeassistant:
    image: homeassistant/home-assistant:${IMAGE_TAG:-stable}
    environment:
      - SERVICE_URL_HOMEASSISTANT_8123
      - TZ=Europe/Berlin
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - homeassistant-data:/config
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8123"]
      interval: 30s
      timeout: 10s
      retries: 5

volumes:
  homeassistant-data: {}
