# documentation: https://docs.openreplay.com/
# slogan: OpenReplay is an open-source session replay suite that lets you see what users do on your web app, helping you troubleshoot issues faster.
# tags: analytics, session-replay, monitoring, debugging, user-experience
# category: analytics
# logo: svgs/openreplay.png
# port: 80
services:
  postgresql:
    image: postgres:16
    environment:
      - POSTGRES_PASSWORD=${SERVICE_PASSWORD_POSTGRES}
      - POSTGRES_USER=postgres
      - POSTGRES_DB=postgres
    volumes:
      - openreplay-pgdata:/var/lib/postgresql/data

  clickhouse:
    image: clickhouse/clickhouse-server:24.3-alpine
    volumes:
      - openreplay-clickhouse:/var/lib/clickhouse
    environment:
      - CLICKHOUSE_USER=default
      - CLICKHOUSE_PASSWORD=
      - CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT=1

  redis:
    image: ghcr.io/openreplay/valkey:8
    volumes:
      - openreplay-redisdata:/bitnami/redis/data
    environment:
      - ALLOW_EMPTY_PASSWORD=yes

  minio:
    image: minio/minio:latest
    volumes:
      - openreplay-miniodata:/data
    environment:
      - MINIO_ROOT_USER=${SERVICE_USER_MINIO}
      - MINIO_ROOT_PASSWORD=${SERVICE_PASSWORD_MINIO}
    command: server /data

  alerts:
    image: public.ecr.aws/p1t3u8a3/alerts:v1.25.0
    volumes:
      - openreplay-shared:/mnt/efs
    environment:
      - POSTGRES_HOST=postgresql
      - POSTGRES_PORT=5432
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${SERVICE_PASSWORD_POSTGRES}
      - POSTGRES_DB=postgres
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - MINIO_HOST=minio
      - MINIO_PORT=9000
      - MINIO_ACCESS_KEY=${SERVICE_USER_MINIO}
      - MINIO_SECRET_KEY=${SERVICE_PASSWORD_MINIO}
    depends_on:
      - postgresql
      - redis
      - minio
    restart: unless-stopped

  api:
    image: public.ecr.aws/p1t3u8a3/api:v1.25.0
    volumes:
      - openreplay-shared:/mnt/efs
    environment:
