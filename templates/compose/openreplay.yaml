    environment:
      - CH_USERNAME=default
      - CH_PASSWORD=
      - CLICKHOUSE_STRING=openreplay-clickhouse:9000/default
      - LICENSE_KEY=${LICENSE_KEY}
      - pg_password=${SERVICE_PASSWORD_POSTGRES}
      - POSTGRES_STRING=postgres://postgres:${SERVICE_PASSWORD_POSTGRES}@openreplay-postgresql:5432/postgres?sslmode=disable
      - REDIS_STRING=redis://openreplay-redis:6379
