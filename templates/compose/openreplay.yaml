# documentation: https://docs.openreplay.com
# slogan: OpenReplay is an open-source session replay stack for developers. Self-host it for full control over your data.
# category: analytics
# tags: analytics, session-replay, monitoring, debugging, privacy
# logo: svgs/openreplay.svg
# port: 80

services:
  postgresql:
    image: ghcr.io/openreplay/postgres:15.8.0-2
    volumes:
      - postgresql-data:/bitnami/postgresql
    environment:
      - POSTGRESQL_PASSWORD=${SERVICE_PASSWORD_POSTGRES}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 20s
      retries: 10

  clickhouse:
    image: clickhouse/clickhouse-server:24.12-alpine
    volumes:
      - clickhouse-data:/var/lib/clickhouse
    environment:
      - CLICKHOUSE_USER=default
      - CLICKHOUSE_PASSWORD=
      - CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT=1
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 -O - http://127.0.0.1:8123/ping || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  redis:
    image: ghcr.io/openreplay/valkey:8.0.1-1
    volumes:
      - redis-data:/data
    environment:
      - ALLOW_EMPTY_PASSWORD=yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: ghcr.io/openreplay/minio:2024.11.7-0
    volumes:
      - minio-data:/bitnami/minio/data
    environment:
      - MINIO_ROOT_USER=${SERVICE_USER_MINIO}
      - MINIO_ROOT_PASSWORD=${SERVICE_PASSWORD_MINIO}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  alerts:
    image: public.ecr.aws/p1t3u8a3/alerts:v1.23.0
    depends_on:
      postgresql:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - shared-data:/mnt/efs
    restart: unless-stopped

  api:
    image: public.ecr.aws/p1t3u8a3/api:v1.23.0
    depends_on:
      postgresql:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - shared-data:/mnt/efs
    restart: unless-stopped

  http:
    image: public.ecr.aws/p1t3u8a3/http:v1.23.0
    depends_on:
      postgresql:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - shared-data:/mnt/efs
    restart: unless-stopped

  frontend:
    image: public.ecr.aws/p1t3u8a3/frontend:v1.23.0
    environment:
      - SERVICE_FQDN_OPENREPLAY_80
    depends_on:
      - api
      - http
    volumes:
      - shared-data:/mnt/efs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:80"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  sink:
    image: public.ecr.aws/p1t3u8a3/sink:v1.23.0
    depends_on:
      - clickhouse
    volumes:
      - shared-data:/mnt/efs
    restart: unless-stopped

  storage:
    image: public.ecr.aws/p1t3u8a3/storage:v1.23.0
    depends_on:
      - minio
    volumes:
      - shared-data:/mnt/efs
    restart: unless-stopped
