    restart: unless-stopped

  canvases-openreplay:
    image: public.ecr.aws/p1t3u8a3/canvases:${COMMON_VERSION:-1.40.0}
    container_name: canvases
    networks:
      - openreplay-net
    volumes:
      - shared-volume:/mnt/efs
    env_file:
      - docker-envs/canvases.env
    restart: unless-stopped

  chalice-openreplay:
    image: public.ecr.aws/p1t3u8a3/chalice:${COMMON_VERSION:-1.40.0}
    container_name: chalice
    networks:
      - openreplay-net
    volumes:
      - shared-volume:/mnt/efs
    env_file:
      - docker-envs/chalice.env
    restart: unless-stopped

  db-openreplay:
    image: public.ecr.aws/p1t3u8a3/db:${COMMON_VERSION:-1.40.0}
    container_name: db
    networks:
      - openreplay-net
    volumes:
      - shared-volume:/mnt/efs
    env_file:
      - docker-envs/db.env
    restart: unless-stopped

  ender-openreplay:
    image: public.ecr.aws/p1t3u8a3/ender:${COMMON_VERSION:-1.40.0}
    container_name: ender
    networks:
      - openreplay-net
    volumes:
      - shared-volume:/mnt/efs
    env_file:
      - docker-envs/ender.env
    restart: unless-stopped

  frontend-openreplay:
    image: public.ecr.aws/p1t3u8a3/frontend:${COMMON_VERSION:-1.40.0}
    container_name: frontend
    networks:
      - openreplay-net
    volumes:
      - shared-volume:/mnt/efs
    env_file:
      - docker-envs/frontend.env
    restart: unless-stopped

  heuristics-openreplay:
    image: public.ecr.aws/p1t3u8a3/heuristics:${COMMON_VERSION:-1.40.0}
    container_name: heuristics
    networks:
      - openreplay-net
    volumes:
      - shared-volume:/mnt/efs
    env_file:
      - docker-envs/heuristics.env
    restart: unless-stopped

  nginx-openreplay:
    image: nginx:latest
    container_name: nginx
    networks:
      - openreplay-net
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    restart: unless-stopped
    depends_on:
      - frontend-openreplay
      - api-openreplay

volumes:
  pgdata:
  clickhouse:
  redisdata:
  miniodata:
  shared-volume:

networks:
  openreplay-net:
