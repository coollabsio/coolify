# documentation: https://docs.openreplay.com/en/deployment/deploy-docker/
# slogan: Open-source session replay tool that shows you exactly what users did on your app.
# category: monitoring
# tags: session replay, analytics, monitoring, observability, debugging
# logo: svgs/openreplay.svg
# amd_only: true

services:

  # ── infrastructure ───────────────────────────────────────────────────────────

  postgresql:
    image: ghcr.io/openreplay/postgres:17
    restart: unless-stopped
    volumes:
      - pgdata:/bitnami/postgresql
    networks:
      openreplay-net:
        aliases:
          - postgresql.db.svc.cluster.local
    environment:
      - POSTGRESQL_PASSWORD=$SERVICE_PASSWORD_POSTGRES
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -h 127.0.0.1"]
      interval: 5s
      timeout: 10s
      retries: 20

  clickhouse:
    image: clickhouse/clickhouse-server:25.11-alpine
    restart: unless-stopped
    volumes:
      - clickhousedata:/var/lib/clickhouse
    networks:
      openreplay-net:
        aliases:
          - clickhouse-openreplay-clickhouse.db.svc.cluster.local
    environment:
      - CLICKHOUSE_USER=default
      - CLICKHOUSE_PASSWORD=
      - CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT=1
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --query 'SELECT 1'"]
      interval: 10s
      timeout: 10s
      retries: 20

  redis:
    image: ghcr.io/openreplay/valkey:8
    restart: unless-stopped
    volumes:
      - redisdata:/data
    networks:
      openreplay-net:
        aliases:
          - redis-master.db.svc.cluster.local
    environment:
      - ALLOW_EMPTY_PASSWORD=yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio:
    image: rustfs/rustfs:1.0.0-beta.1
    restart: unless-stopped
    volumes:
      - miniodata:/data
    networks:
      openreplay-net:
        aliases:
          - minio.db.svc.cluster.local
    environment:
      - RUSTFS_ACCESS_KEY=$SERVICE_PASSWORD_64_S3KEY
      - RUSTFS_SECRET_KEY=$SERVICE_PASSWORD_64_S3SECRET
      - RUSTFS_ADDRESS=0.0.0.0:9000
      - RUSTFS_CONSOLE_ENABLE=true
      - RUSTFS_CONSOLE_ADDRESS=0.0.0.0:9001
      - RUSTFS_VOLUMES=/data
    labels:
      - traefik.enable=true
      - "traefik.http.routers.minio-openreplay.rule=Host(`${SERVICE_FQDN_FRONTEND_8080}`) && PathPrefix(`/mobs`, `/sessions-assets`, `/sourcemaps`, `/ios-images`, `/uxtesting-records`, `/records`, `/spots`, `/static`)"
      - traefik.http.routers.minio-openreplay.priority=20
      - traefik.http.services.minio-openreplay.loadbalancer.server.port=9000

  # ── init containers ──────────────────────────────────────────────────────────

  minio-setup:
    image: minio/mc:latest
    restart: on-failure
    depends_on:
      - minio
    networks:
      - openreplay-net
    environment:
      - MINIO_ACCESS_KEY=$SERVICE_PASSWORD_64_S3KEY
      - MINIO_SECRET_KEY=$SERVICE_PASSWORD_64_S3SECRET
    entrypoint:
      - /bin/sh
      - -c
      - |
        until mc alias set minio http://minio:9000 "$${MINIO_ACCESS_KEY}" "$${MINIO_SECRET_KEY}" 2>/dev/null; do
          echo "Waiting for minio..."
          sleep 3
        done
        for bucket in mobs sessions-assets sourcemaps ios-images spots records frontend uxtesting-records; do
          mc mb --ignore-existing "minio/$$bucket" || true
        done

  db-migrate:
    image: postgres:17-alpine
    restart: on-failure
    depends_on:
      postgresql:
        condition: service_healthy
    networks:
      - openreplay-net
    environment:
      - PGHOST=postgresql.db.svc.cluster.local
      - PGPORT=5432
      - PGDATABASE=postgres
      - PGUSER=postgres
      - PGPASSWORD=$SERVICE_PASSWORD_POSTGRES
    entrypoint:
      - /bin/sh
      - -c
      - |
        apk add --no-cache wget
        wget -q -O /tmp/pg_schema.sql \
          https://raw.githubusercontent.com/openreplay/openreplay/v1.23.0/scripts/schema/db/init_dbs/postgresql/init_schema.sql
        psql -f /tmp/pg_schema.sql 2>&1 || echo "Migration may have partially applied (safe to ignore on re-deploy)"

  clickhouse-migrate:
    image: clickhouse/clickhouse-server:25.11-alpine
    restart: on-failure
    depends_on:
      clickhouse:
        condition: service_healthy
    networks:
      - openreplay-net
    entrypoint:
      - /bin/sh
      - -c
      - |
        wget -q -O /tmp/ch_schema.sql \
          https://raw.githubusercontent.com/openreplay/openreplay/v1.23.0/scripts/schema/db/init_dbs/clickhouse/create/init_schema.sql
        clickhouse-client -h clickhouse-openreplay-clickhouse.db.svc.cluster.local --port 9000 \
          --multiquery < /tmp/ch_schema.sql 2>&1 || echo "Migration may have partially applied (safe to ignore on re-deploy)"

  # ── microservices ─────────────────────────────────────────────────────────────

  frontend:
    image: public.ecr.aws/p1t3u8a3/frontend:v1.23.0
    restart: unless-stopped
    volumes:
      - shared-volume:/mnt/efs
    networks:
      - openreplay-net
    environment:
      - SERVICE_URL_FRONTEND_8080
      - TRACKER_HOST=${SERVICE_URL_FRONTEND}
      - HTTP_PORT=80

  chalice:
    image: public.ecr.aws/p1t3u8a3/chalice:v1.23.0
    restart: unless-stopped
    depends_on:
      - postgresql
      - redis
      - clickhouse
    volumes:
      - shared-volume:/mnt/efs
    networks:
      - openreplay-net
    labels:
      - traefik.enable=true
      - "traefik.http.routers.chalice-openreplay.rule=Host(`${SERVICE_FQDN_FRONTEND_8080}`) && PathPrefix(`/api`)"
      - traefik.http.routers.chalice-openreplay.priority=20
      - traefik.http.middlewares.chalice-strip.stripprefix.prefixes=/api
      - traefik.http.routers.chalice-openreplay.middlewares=chalice-strip
      - traefik.http.services.chalice-openreplay.loadbalancer.server.port=8000
    environment:
      - REDIS_STRING=redis://redis-master.db.svc.cluster.local:6379
      - KAFKA_SERVERS=kafka.db.svc.cluster.local
      - ch_username=default
      - ch_password=
      - ch_host=clickhouse-openreplay-clickhouse.db.svc.cluster.local
      - ch_port=9000
      - ch_port_http=8123
      - sourcemaps_reader=http://sourcemapreader-openreplay.app.svc.cluster.local:9000/{}/sourcemaps
      - ASSIST_URL=http://assist-openreplay.app.svc.cluster.local:9001/assist/%s
      - JWT_REFRESH_SECRET=$SERVICE_PASSWORD_64_JWTREFRESH
      - JWT_SPOT_REFRESH_SECRET=$SERVICE_PASSWORD_64_JWTSPOTREFRESH
      - ASSIST_JWT_SECRET=$SERVICE_PASSWORD_64_ASSISTJWT
      - JWT_SECRET=$SERVICE_PASSWORD_64_JWT
      - ASSIST_KEY=$SERVICE_PASSWORD_64_ASSISTKEY
      - JWT_SPOT_SECRET=$SERVICE_PASSWORD_64_JWTSPOT
      - LICENSE_KEY=
      - version_number=v1.23.0
      - pg_host=postgresql.db.svc.cluster.local
      - pg_port=5432
      - pg_dbname=postgres
      - pg_user=postgres
      - pg_password=$SERVICE_PASSWORD_POSTGRES
      - SITE_URL=${SERVICE_URL_FRONTEND}
      - S3_HOST=${SERVICE_URL_FRONTEND}
      - S3_KEY=$SERVICE_PASSWORD_64_S3KEY
      - S3_SECRET=$SERVICE_PASSWORD_64_S3SECRET
      - AWS_DEFAULT_REGION=us-east-1
      - sessions_region=us-east-1
      - ASSIST_RECORDS_BUCKET=records
      - sessions_bucket=mobs
      - IOS_VIDEO_BUCKET=mobs
      - sourcemaps_bucket=sourcemaps
      - js_cache_bucket=sessions-assets
      - EMAIL_HOST=${EMAIL_HOST:-}
      - EMAIL_PORT=${EMAIL_PORT:-587}
      - EMAIL_USER=${EMAIL_USER:-}
      - EMAIL_PASSWORD=${EMAIL_PASSWORD:-}
      - EMAIL_USE_TLS=${EMAIL_USE_TLS:-true}
      - EMAIL_USE_SSL=${EMAIL_USE_SSL:-false}
      - EMAIL_FROM=${EMAIL_FROM:-OpenReplay<do-not-reply@openreplay.com>}
      - CH_COMPRESSION=false
      - JWT_EXPIRATION=86400
      - LOGLEVEL=INFO
      - PYTHONUNBUFFERED=0

  api:
    image: public.ecr.aws/p1t3u8a3/api:v1.23.0
    restart: unless-stopped
    depends_on:
      - postgresql
      - redis
      - clickhouse
    volumes:
      - shared-volume:/mnt/efs
    networks:
      - openreplay-net
    labels:
      - traefik.enable=true
      - "traefik.http.routers.api-openreplay.rule=Host(`${SERVICE_FQDN_FRONTEND_8080}`) && PathPrefix(`/v2/api`)"
      - traefik.http.routers.api-openreplay.priority=30
      - traefik.http.middlewares.api-strip.stripprefix.prefixes=/v2/api
      - traefik.http.routers.api-openreplay.middlewares=api-strip
      - traefik.http.services.api-openreplay.loadbalancer.server.port=8080
    environment:
      - JWT_SECRET=$SERVICE_PASSWORD_64_JWT
      - ASSIST_JWT_SECRET=$SERVICE_PASSWORD_64_ASSISTJWT
      - AWS_ACCESS_KEY_ID=$SERVICE_PASSWORD_64_S3KEY
      - AWS_SECRET_ACCESS_KEY=$SERVICE_PASSWORD_64_S3SECRET
      - AWS_ENDPOINT=${SERVICE_URL_FRONTEND}
      - AWS_REGION=us-east-1
      - BUCKET_NAME=mobs
      - CH_USERNAME=default
      - CH_PASSWORD=
      - CLICKHOUSE_STRING=clickhouse-openreplay-clickhouse.db.svc.cluster.local:9000/default
      - CLICKHOUSE_HTTP_STRING=clickhouse-openreplay-clickhouse.db.svc.cluster.local:8123/default
      - pg_password=$SERVICE_PASSWORD_POSTGRES
      - POSTGRES_STRING=postgres://postgres:${SERVICE_PASSWORD_POSTGRES}@postgresql.db.svc.cluster.local:5432/postgres?sslmode=disable
      - ASSIST_URL=http://assist-openreplay.app.svc.cluster.local:9001/assist/%s
      - ASSIST_KEY=$SERVICE_PASSWORD_64_ASSISTKEY
      - REDIS_STRING=redis://redis-master.db.svc.cluster.local:6379
      - KAFKA_SERVERS=kafka.db.svc.cluster.local:9092
      - KAFKA_USE_SSL=false

  http:
    image: public.ecr.aws/p1t3u8a3/http:v1.23.0
    restart: unless-stopped
    depends_on:
      - postgresql
      - redis
    volumes:
      - shared-volume:/mnt/efs
    networks:
      - openreplay-net
    labels:
      - traefik.enable=true
      - "traefik.http.routers.http-openreplay.rule=Host(`${SERVICE_FQDN_FRONTEND_8080}`) && PathPrefix(`/ingest`)"
      - traefik.http.routers.http-openreplay.priority=20
      - traefik.http.middlewares.http-strip.stripprefix.prefixes=/ingest
      - traefik.http.routers.http-openreplay.middlewares=http-strip
      - traefik.http.services.http-openreplay.loadbalancer.server.port=8080
    environment:
      - BUCKET_NAME=uxtesting-records
      - CACHE_ASSETS=true
      - AWS_ACCESS_KEY_ID=$SERVICE_PASSWORD_64_S3KEY
      - AWS_SECRET_ACCESS_KEY=$SERVICE_PASSWORD_64_S3SECRET
      - AWS_REGION=us-east-1
      - AWS_ENDPOINT=${SERVICE_URL_FRONTEND}
      - LICENSE_KEY=
      - KAFKA_SERVERS=kafka.db.svc.cluster.local:9092
      - KAFKA_USE_SSL=false
      - pg_password=$SERVICE_PASSWORD_POSTGRES
      - POSTGRES_STRING=postgres://postgres:${SERVICE_PASSWORD_POSTGRES}@postgresql.db.svc.cluster.local:5432/postgres?sslmode=disable
      - REDIS_STRING=redis://redis-master.db.svc.cluster.local:6379
      - JWT_SECRET=$SERVICE_PASSWORD_64_JWT
      - JWT_SPOT_SECRET=$SERVICE_PASSWORD_64_JWTSPOT

  integrations:
    image: public.ecr.aws/p1t3u8a3/integrations:v1.23.0
    restart: unless-stopped
    depends_on:
      - postgresql
      - redis
    volumes:
      - shared-volume:/mnt/efs
    networks:
      - openreplay-net
    labels:
      - traefik.enable=true
      - "traefik.http.routers.integrations-openreplay.rule=Host(`${SERVICE_FQDN_FRONTEND_8080}`) && PathPrefix(`/integrations`)"
      - traefik.http.routers.integrations-openreplay.priority=20
      - traefik.http.middlewares.integrations-strip.stripprefix.prefixes=/integrations
      - traefik.http.routers.integrations-openreplay.middlewares=integrations-strip
      - traefik.http.services.integrations-openreplay.loadbalancer.server.port=8080
    environment:
      - AWS_ACCESS_KEY_ID=$SERVICE_PASSWORD_64_S3KEY
      - AWS_SECRET_ACCESS_KEY=$SERVICE_PASSWORD_64_S3SECRET
      - AWS_ENDPOINT=${SERVICE_URL_FRONTEND}
      - AWS_REGION=us-east-1
      - BUCKET_NAME=mobs
      - JWT_SECRET=$SERVICE_PASSWORD_64_JWT
      - LICENSE_KEY=
      - KAFKA_SERVERS=kafka.db.svc.cluster.local:9092
      - KAFKA_USE_SSL=false
      - pg_password=$SERVICE_PASSWORD_POSTGRES
      - POSTGRES_STRING=postgres://postgres:${SERVICE_PASSWORD_POSTGRES}@postgresql.db.svc.cluster.local:5432/postgres?sslmode=disable
      - REDIS_STRING=redis://redis-master.db.svc.cluster.local:6379

  spot:
    image: public.ecr.aws/p1t3u8a3/spot:v1.23.0
    restart: unless-stopped
    depends_on:
      - postgresql
      - redis
    volumes:
      - shared-volume:/mnt/efs
    networks:
      - openreplay-net
    labels:
      - traefik.enable=true
      - "traefik.http.routers.spot-openreplay.rule=Host(`${SERVICE_FQDN_FRONTEND_8080}`) && PathPrefix(`/spot`)"
      - traefik.http.routers.spot-openreplay.priority=20
      - traefik.http.middlewares.spot-strip.stripprefix.prefixes=/spot
      - traefik.http.routers.spot-openreplay.middlewares=spot-strip
      - traefik.http.services.spot-openreplay.loadbalancer.server.port=8080
    environment:
      - CACHE_ASSETS=true
      - FS_CLEAN_HRS=24
      - AWS_ACCESS_KEY_ID=$SERVICE_PASSWORD_64_S3KEY
      - AWS_SECRET_ACCESS_KEY=$SERVICE_PASSWORD_64_S3SECRET
      - BUCKET_NAME=spots
      - AWS_REGION=us-east-1
      - AWS_ENDPOINT=${SERVICE_URL_FRONTEND}
      - LICENSE_KEY=
      - KAFKA_SERVERS=kafka.db.svc.cluster.local:9092
      - KAFKA_USE_SSL=false
      - JWT_SECRET=$SERVICE_PASSWORD_64_JWT
      - JWT_SPOT_SECRET=$SERVICE_PASSWORD_64_JWTSPOT
      - pg_password=$SERVICE_PASSWORD_POSTGRES
      - POSTGRES_STRING=postgres://postgres:${SERVICE_PASSWORD_POSTGRES}@postgresql.db.svc.cluster.local:5432/postgres?sslmode=disable
      - REDIS_STRING=redis://redis-master.db.svc.cluster.local:6379

  assist:
    image: public.ecr.aws/p1t3u8a3/assist:v1.23.0
    restart: unless-stopped
    depends_on:
      - redis
    volumes:
      - shared-volume:/mnt/efs
    networks:
      openreplay-net:
        aliases:
          - assist-openreplay
          - assist-openreplay.app.svc.cluster.local
    labels:
      - traefik.enable=true
      - "traefik.http.routers.assist-openreplay.rule=Host(`${SERVICE_FQDN_FRONTEND_8080}`) && (PathPrefix(`/assist`) || PathPrefix(`/ws-assist`))"
      - traefik.http.routers.assist-openreplay.priority=20
      - "traefik.http.middlewares.assist-strip.stripprefix.prefixes=/assist,/ws-assist"
      - traefik.http.routers.assist-openreplay.middlewares=assist-strip
      - traefik.http.services.assist-openreplay.loadbalancer.server.port=9001
    environment:
      - ASSIST_JWT_SECRET=$SERVICE_PASSWORD_64_ASSISTJWT
      - ASSIST_KEY=$SERVICE_PASSWORD_64_ASSISTKEY
      - AWS_DEFAULT_REGION=us-east-1
      - REDIS_URL=redis-master.db.svc.cluster.local
      - CLEAR_SOCKET_TIME=720
      - debug=0
      - redis=false

  alerts:
    image: public.ecr.aws/p1t3u8a3/alerts:v1.23.0
    restart: unless-stopped
    depends_on:
      - postgresql
      - redis
      - clickhouse
    volumes:
      - shared-volume:/mnt/efs
    networks:
      openreplay-net:
        aliases:
          - alerts-openreplay
          - alerts-openreplay.app.svc.cluster.local
    environment:
      - pg_host=postgresql.db.svc.cluster.local
      - pg_port=5432
      - pg_dbname=postgres
      - pg_user=postgres
      - pg_password=$SERVICE_PASSWORD_POSTGRES
      - ch_host=clickhouse-openreplay-clickhouse.db.svc.cluster.local
      - ch_port=9000
      - ch_port_http=8123
      - ch_username=default
      - ch_password=
      - SITE_URL=${SERVICE_URL_FRONTEND}
      - S3_HOST=${SERVICE_URL_FRONTEND}
      - S3_KEY=$SERVICE_PASSWORD_64_S3KEY
      - S3_SECRET=$SERVICE_PASSWORD_64_S3SECRET
      - AWS_DEFAULT_REGION=us-east-1
      - EMAIL_HOST=${EMAIL_HOST:-}
      - EMAIL_PORT=${EMAIL_PORT:-587}
      - EMAIL_USER=${EMAIL_USER:-}
      - EMAIL_PASSWORD=${EMAIL_PASSWORD:-}
      - EMAIL_USE_TLS=${EMAIL_USE_TLS:-true}
      - EMAIL_USE_SSL=${EMAIL_USE_SSL:-false}
      - EMAIL_FROM=${EMAIL_FROM:-OpenReplay<do-not-reply@openreplay.com>}
      - LOGLEVEL=INFO
      - PYTHONUNBUFFERED=0

  images:
    image: public.ecr.aws/p1t3u8a3/images:v1.23.0
    restart: unless-stopped
    depends_on:
      - redis
      - minio
    volumes:
      - shared-volume:/mnt/efs
    networks:
      - openreplay-net
    environment:
      - AWS_ACCESS_KEY_ID=$SERVICE_PASSWORD_64_S3KEY
      - AWS_SECRET_ACCESS_KEY=$SERVICE_PASSWORD_64_S3SECRET
      - AWS_ENDPOINT=${SERVICE_URL_FRONTEND}
      - AWS_REGION=us-east-1
      - BUCKET_NAME=mobs
      - LICENSE_KEY=
      - KAFKA_SERVERS=kafka.db.svc.cluster.local:9092
      - KAFKA_USE_SSL=false
      - REDIS_STRING=redis://redis-master.db.svc.cluster.local:6379
      - FS_CLEAN_HRS=24

  sink:
    image: public.ecr.aws/p1t3u8a3/sink:v1.23.0
    restart: unless-stopped
    depends_on:
      - redis
    volumes:
      - shared-volume:/mnt/efs
    networks:
      - openreplay-net
    environment:
      - LICENSE_KEY=
      - KAFKA_SERVERS=kafka.db.svc.cluster.local:9092
      - KAFKA_USE_SSL=false
      - ASSETS_ORIGIN=${SERVICE_URL_FRONTEND}/sessions-assets
      - REDIS_STRING=redis://redis-master.db.svc.cluster.local:6379

  sourcemapreader:
    image: public.ecr.aws/p1t3u8a3/sourcemapreader:v1.23.0
    restart: unless-stopped
    depends_on:
      - minio
    volumes:
      - shared-volume:/mnt/efs
    networks:
      openreplay-net:
        aliases:
          - sourcemapreader-openreplay
          - sourcemapreader-openreplay.app.svc.cluster.local
    environment:
      - SMR_HOST=0.0.0.0
      - S3_HOST=http://minio.db.svc.cluster.local:9000
      - S3_KEY=$SERVICE_PASSWORD_64_S3KEY
      - S3_SECRET=$SERVICE_PASSWORD_64_S3SECRET
      - AWS_REGION=us-east-1
      - LICENSE_KEY=
      - ASSETS_ORIGIN=${SERVICE_URL_FRONTEND}/sessions-assets

  storage:
    image: public.ecr.aws/p1t3u8a3/storage:v1.23.0
    restart: unless-stopped
    depends_on:
      - redis
      - minio
    volumes:
      - shared-volume:/mnt/efs
    networks:
      - openreplay-net
    environment:
      - AWS_ACCESS_KEY_ID=$SERVICE_PASSWORD_64_S3KEY
      - AWS_SECRET_ACCESS_KEY=$SERVICE_PASSWORD_64_S3SECRET
      - AWS_ENDPOINT=${SERVICE_URL_FRONTEND}
      - AWS_REGION=us-east-1
      - BUCKET_NAME=mobs
      - LICENSE_KEY=
      - KAFKA_SERVERS=kafka.db.svc.cluster.local:9092
      - KAFKA_USE_SSL=false
      - REDIS_STRING=redis://redis-master.db.svc.cluster.local:6379
      - FS_CLEAN_HRS=24

  assets:
    image: public.ecr.aws/p1t3u8a3/assets:v1.23.0
    restart: unless-stopped
    depends_on:
      - redis
      - minio
    volumes:
      - shared-volume:/mnt/efs
    networks:
      - openreplay-net
    environment:
      - AWS_ACCESS_KEY_ID=$SERVICE_PASSWORD_64_S3KEY
      - AWS_SECRET_ACCESS_KEY=$SERVICE_PASSWORD_64_S3SECRET
      - BUCKET_NAME=sessions-assets
      - LICENSE_KEY=
      - AWS_ENDPOINT=${SERVICE_URL_FRONTEND}
      - AWS_REGION=us-east-1
      - KAFKA_SERVERS=kafka.db.svc.cluster.local:9092
      - KAFKA_USE_SSL=false
      - ASSETS_ORIGIN=${SERVICE_URL_FRONTEND}/sessions-assets
      - REDIS_STRING=redis://redis-master.db.svc.cluster.local:6379

  canvases:
    image: public.ecr.aws/p1t3u8a3/canvases:v1.23.0
    restart: unless-stopped
    depends_on:
      - redis
      - minio
    volumes:
      - shared-volume:/mnt/efs
    networks:
      - openreplay-net
    environment:
      - AWS_ACCESS_KEY_ID=$SERVICE_PASSWORD_64_S3KEY
      - AWS_SECRET_ACCESS_KEY=$SERVICE_PASSWORD_64_S3SECRET
      - AWS_ENDPOINT=${SERVICE_URL_FRONTEND}
      - AWS_REGION=us-east-1
      - BUCKET_NAME=mobs
      - LICENSE_KEY=
      - KAFKA_SERVERS=kafka.db.svc.cluster.local:9092
      - KAFKA_USE_SSL=false
      - REDIS_STRING=redis://redis-master.db.svc.cluster.local:6379
      - FS_CLEAN_HRS=24

  db:
    image: public.ecr.aws/p1t3u8a3/db:v1.23.0
    restart: unless-stopped
    depends_on:
      - postgresql
      - redis
      - clickhouse
    volumes:
      - shared-volume:/mnt/efs
    networks:
      - openreplay-net
    environment:
      - CH_USERNAME=default
      - CH_PASSWORD=
      - CLICKHOUSE_STRING=clickhouse-openreplay-clickhouse.db.svc.cluster.local:9000/default
      - LICENSE_KEY=
      - KAFKA_SERVERS=kafka.db.svc.cluster.local:9092
      - KAFKA_USE_SSL=false
