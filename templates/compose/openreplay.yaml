  nginx:
    image: nginx:1.27-alpine
    pull_policy: missing
    # Embed nginx config at container start so external file is not required
    command: >
      /bin/sh -lc "cat > /etc/nginx/conf.d/default.conf <<'NGINX_CONF'
      upstream frontend {
        server frontend:8080;
      }
      upstream api {
        server api:8080;
      }
      upstream assets {
        server assets:8080;
      }
      upstream http {
        server http:8888;
      }
      upstream assist {
        server assist:9001;
      }
      server {
        listen 80;
        server_name _;
        client_max_body_size 500M;
        location / {
          proxy_pass http://frontend;
          proxy_set_header Host $host;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $scheme;
        }
        location /api/ {
          proxy_pass http://api/;
          proxy_set_header Host $host;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $scheme;
        }
        location /assets/ {
          proxy_pass http://assets/;
          proxy_set_header Host $host;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $scheme;
        }
        location /ingest/ {
          proxy_pass http://http/;
          proxy_set_header Host $host;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $scheme;
        }
        location /ws-assist/ {
          proxy_pass http://assist/;
          proxy_http_version 1.1;
          proxy_set_header Upgrade $http_upgrade;
          proxy_set_header Connection "upgrade";
          proxy_set_header Host $host;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $scheme;
        }
      }
      NGINX_CONF
      nginx -g 'daemon off;'"
    depends_on:
      - frontend
      - api
      - assets
      - http
      - assist
    restart: unless-stopped

volumes:
  openreplay-pgdata:
  openreplay-clickhouse:
  openreplay-redisdata:
  openreplay-miniodata:
  openreplay-shared:
