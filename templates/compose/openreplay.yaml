          #!/bin/sh
          until nc -z -w3 postgresql.db.svc.cluster.local 5432 2>/dev/null; do sleep 2; done
          exec /home/openreplay/service
    entrypoint: ["/bin/sh", "/scripts/wait-for-pg.sh"]
