# documentation: https://openreplay.com/docs
# slogan: OpenReplay is a self-hosted, open-source session replay suite. See exactly what users do on your app and troubleshoot issues faster.
# category: analytics
# tags: analytics, session-replay, monitoring, debugging, user-tracking
# logo: svgs/openreplay.svg
# port: 80
# minram: 8GB
# mincpu: 2

services:
  nginx:
    image: nginx:alpine
    volumes:
      - type: bind
        source: ./nginx.conf
        target: /etc/nginx/conf.d/default.conf
        content: |
          map $$http_upgrade $$connection_upgrade {
            default upgrade;
            '' close;
          }
          map $$http_x_forwarded_for $$real_ip {
            ~^(\d+\.\d+\.\d+\.\d+) $$1;
            default $$remote_addr;
          }
          map $$http_x_forwarded_proto $$origin_proto {
            default $$http_x_forwarded_proto;
            '' $$scheme;
          }
          server {
            listen 80;
            client_body_buffer_size 512k;
            client_max_body_size 10m;
            proxy_buffer_size 64k;
            proxy_buffers 32 64k;
            proxy_busy_buffers_size 128k;
            proxy_connect_timeout 120s;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
            real_ip_header X-Forwarded-For;
            set_real_ip_from 0.0.0.0/0;
            real_ip_recursive on;
            add_header X-XSS-Protection "1; mode=block" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "same-origin" always;
            server_tokens off;

            location ~ ^/(mobs|sessions-assets|frontend|static|sourcemaps|ios-images|uxtesting-records|records|spots)/ {
              proxy_set_header X-Real-IP $$remote_addr;
              proxy_set_header X-Forwarded-For $$proxy_add_x_forwarded_for;
              proxy_set_header X-Forwarded-Proto $$scheme;
              proxy_set_header Host $$http_host;
              proxy_http_version 1.1;
              proxy_set_header Connection "";
              chunked_transfer_encoding off;
              proxy_pass http://minio:9000;
            }

            location /ingest/ {
              rewrite ^/ingest/(.*) /$$1 break;
              proxy_http_version 1.1;
              proxy_set_header Upgrade $$http_upgrade;
              proxy_set_header Connection "Upgrade";
              proxy_set_header X-Forwarded-For $$real_ip;
              proxy_set_header Host $$host;
              proxy_pass http://http-openreplay:8080;
              add_header 'Access-Control-Allow-Origin' '*' always;
              add_header 'Access-Control-Allow-Methods' 'POST' always;
              add_header 'Access-Control-Allow-Headers' 'Content-Type,Authorization,Content-Encoding' always;
            }

            location /integrations/ {
              rewrite ^/integrations/(.*) /$$1 break;
              proxy_http_version 1.1;
              proxy_set_header Upgrade $$http_upgrade;
              proxy_set_header Connection "Upgrade";
              proxy_set_header X-Forwarded-For $$real_ip;
              proxy_set_header Host $$host;
              proxy_pass http://integrations-openreplay:8080;
              add_header 'Access-Control-Allow-Origin' '*' always;
              add_header 'Access-Control-Allow-Methods' 'POST,PATCH,OPTIONS,DELETE' always;
              add_header 'Access-Control-Allow-Headers' 'Content-Type,Authorization,Content-Encoding' always;
            }

            location /v2/api/ {
              rewrite ^/v2/api/(.*) /$$1 break;
              proxy_http_version 1.1;
              proxy_set_header Upgrade $$http_upgrade;
              proxy_set_header Connection "Upgrade";
              proxy_set_header Host $$host;
              proxy_set_header X-Forwarded-Proto $$origin_proto;
              proxy_set_header X-Forwarded-For $$real_ip;
              proxy_set_header X-Real-IP $$real_ip;
              proxy_pass http://api-openreplay:8080;
              add_header 'Access-Control-Allow-Origin' '$$http_origin' always;
              add_header 'Access-Control-Allow-Methods' 'POST, GET, PATCH, DELETE, OPTIONS, PUT' always;
              add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization, Content-Encoding' always;
              add_header 'Access-Control-Allow-Credentials' 'true' always;
            }

            location /api/ {
              rewrite ^/api/(.*) /$$1 break;
              proxy_http_version 1.1;
              proxy_set_header Upgrade $$http_upgrade;
              proxy_set_header Connection "Upgrade";
              proxy_set_header Host $$host;
              proxy_set_header X-Forwarded-Proto $$origin_proto;
              proxy_set_header X-Forwarded-For $$real_ip;
              proxy_pass http://chalice-openreplay:8000;
              add_header Cache-Control "no-store,no-cache" always;
            }

            location /spot/ {
              rewrite ^/spot/(.*) /$$1 break;
              proxy_http_version 1.1;
              proxy_set_header Upgrade $$http_upgrade;
              proxy_set_header Connection "Upgrade";
              proxy_set_header Host $$host;
              proxy_set_header X-Forwarded-Proto $$origin_proto;
              proxy_set_header X-Forwarded-For $$real_ip;
              proxy_set_header X-Real-IP $$real_ip;
              proxy_pass http://spot-openreplay:8080;
              add_header 'Access-Control-Allow-Origin' '*' always;
            }

            location /assist/ {
              rewrite ^/assist/(.*) /$$1 break;
              proxy_http_version 1.1;
              proxy_set_header Upgrade $$http_upgrade;
              proxy_set_header Connection $$connection_upgrade;
              proxy_set_header Host $$host;
              proxy_set_header X-Real-IP $$real_ip;
              proxy_set_header X-Forwarded-For $$proxy_add_x_forwarded_for;
              proxy_set_header X-Forwarded-Proto $$origin_proto;
              proxy_read_timeout 3600s;
              proxy_send_timeout 3600s;
              proxy_connect_timeout 75s;
              proxy_buffering off;
              proxy_pass http://assist-openreplay:9001;
            }

            location /script/ {
              rewrite ^/script/(.*)/openreplay(.*).js$$ /$$1/openreplay$$2.js break;
              proxy_http_version 1.1;
              proxy_ssl_protocols TLSv1.2 TLSv1.3;
              proxy_ssl_server_name on;
              proxy_set_header Host static.openreplay.com;
              proxy_pass https://static.openreplay.com;
            }

            location / {
              index /index.html;
              rewrite ^((?!.(js|css|png|svg|jpg|woff|woff2)).)*$$ /index.html break;
              proxy_set_header Host $$http_host;
              proxy_set_header X-Forwarded-For $$real_ip;
              proxy_set_header X-Forwarded-Proto $$origin_proto;
              proxy_pass http://frontend-openreplay:8080;
              proxy_intercept_errors on;
              error_page 404 =200 /index.html;
            }
          }
    depends_on:
      - frontend-openreplay
      - api-openreplay
      - chalice-openreplay
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:80"]
      interval: 10s
      timeout: 5s
      retries: 10

  postgresql:
    image: ghcr.io/openreplay/postgres:17
    environment:
      - POSTGRESQL_PASSWORD=$SERVICE_PASSWORD_POSTGRES
    volumes:
      - pgdata:/bitnami/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  clickhouse:
    image: clickhouse/clickhouse-server:25.11-alpine
    environment:
      - CLICKHOUSE_USER=default
      - CLICKHOUSE_PASSWORD=
      - CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT=1
    volumes:
      - clickhouse-data:/var/lib/clickhouse

  redis:
    image: ghcr.io/openreplay/valkey:8
    environment:
      - ALLOW_EMPTY_PASSWORD=yes
    volumes:
      - redisdata:/data

  minio:
    image: ghcr.io/openreplay/minio:2025
    environment:
      - MINIO_ROOT_USER=$SERVICE_USER_MINIO
      - MINIO_ROOT_PASSWORD=$SERVICE_PASSWORD_MINIO
    volumes:
      - miniodata:/bitnami/minio/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend-openreplay:
    image: public.ecr.aws/p1t3u8a3/frontend:v1.23.0
    environment:
      - SERVICE_URL_NGINX
      - TRACKER_HOST=${SITE_URL}/script
      - HTTP_PORT=8080
    volumes:
      - shared-volume:/mnt/efs
    restart: unless-stopped

  api-openreplay:
    image: public.ecr.aws/p1t3u8a3/api:v1.23.0
    environment:
      - TOKEN_SECRET=$SERVICE_PASSWORD_64_TOKEN
      - JWT_SECRET=$SERVICE_PASSWORD_64_JWT
      - ASSIST_JWT_SECRET=$SERVICE_PASSWORD_64_ASSISTJWT
      - ASSIST_KEY=$SERVICE_PASSWORD_32_ASSISTKEY
      - AWS_ACCESS_KEY_ID=$SERVICE_USER_MINIO
      - AWS_SECRET_ACCESS_KEY=$SERVICE_PASSWORD_MINIO
      - AWS_ENDPOINT=${SITE_URL}
      - AWS_REGION=us-east-1
      - BUCKET_NAME=mobs
      - CH_USERNAME=default
      - CH_PASSWORD=
      - CLICKHOUSE_STRING=clickhouse:9000/default
      - CLICKHOUSE_HTTP_STRING=clickhouse:8123/default
      - pg_password=$SERVICE_PASSWORD_POSTGRES
      - POSTGRES_STRING=postgres://postgres:$SERVICE_PASSWORD_POSTGRES@postgresql:5432/postgres?sslmode=disable
      - REDIS_STRING=redis://redis:6379
    volumes:
      - shared-volume:/mnt/efs
    depends_on:
      postgresql:
        condition: service_healthy
    restart: unless-stopped

  http-openreplay:
    image: public.ecr.aws/p1t3u8a3/http:v1.23.0
    environment:
      - BUCKET_NAME=uxtesting-records
      - CACHE_ASSETS=true
      - AWS_ACCESS_KEY_ID=$SERVICE_USER_MINIO
      - AWS_SECRET_ACCESS_KEY=$SERVICE_PASSWORD_MINIO
      - AWS_ENDPOINT=${SITE_URL}
      - AWS_REGION=us-east-1
      - LICENSE_KEY=
      - pg_password=$SERVICE_PASSWORD_POSTGRES
      - POSTGRES_STRING=postgres://postgres:$SERVICE_PASSWORD_POSTGRES@postgresql:5432/postgres?sslmode=disable
      - REDIS_STRING=redis://redis:6379
      - JWT_SECRET=$SERVICE_PASSWORD_64_JWT
      - JWT_SPOT_SECRET=$SERVICE_PASSWORD_64_JWTSPOT
    volumes:
      - shared-volume:/mnt/efs
    depends_on:
      postgresql:
        condition: service_healthy
    restart: unless-stopped

  sink-openreplay:
    image: public.ecr.aws/p1t3u8a3/sink:v1.23.0
    environment:
      - LICENSE_KEY=
      - ASSETS_ORIGIN=${SITE_URL}/sessions-assets
      - REDIS_STRING=redis://redis:6379
    volumes:
      - shared-volume:/mnt/efs
    depends_on:
      postgresql:
        condition: service_healthy
    restart: unless-stopped

  storage-openreplay:
    image: public.ecr.aws/p1t3u8a3/storage:v1.23.0
    environment:
      - AWS_ACCESS_KEY_ID=$SERVICE_USER_MINIO
      - AWS_SECRET_ACCESS_KEY=$SERVICE_PASSWORD_MINIO
      - AWS_ENDPOINT=${SITE_URL}
      - AWS_REGION=us-east-1
      - BUCKET_NAME=mobs
      - LICENSE_KEY=
      - REDIS_STRING=redis://redis:6379
      - FS_CLEAN_HRS=24
    volumes:
      - shared-volume:/mnt/efs
    depends_on:
      postgresql:
        condition: service_healthy
    restart: unless-stopped

  images-openreplay:
    image: public.ecr.aws/p1t3u8a3/images:v1.23.0
    environment:
      - AWS_ACCESS_KEY_ID=$SERVICE_USER_MINIO
      - AWS_SECRET_ACCESS_KEY=$SERVICE_PASSWORD_MINIO
      - AWS_ENDPOINT=${SITE_URL}
      - AWS_REGION=us-east-1
      - BUCKET_NAME=mobs
      - LICENSE_KEY=
      - REDIS_STRING=redis://redis:6379
      - FS_CLEAN_HRS=24
    volumes:
      - shared-volume:/mnt/efs
    restart: unless-stopped

  assets-openreplay:
    image: public.ecr.aws/p1t3u8a3/assets:v1.23.0
    environment:
      - AWS_ACCESS_KEY_ID=$SERVICE_USER_MINIO
      - AWS_SECRET_ACCESS_KEY=$SERVICE_PASSWORD_MINIO
      - BUCKET_NAME=sessions-assets
      - LICENSE_KEY=
      - AWS_ENDPOINT=${SITE_URL}
      - AWS_REGION=us-east-1
      - ASSETS_ORIGIN=${SITE_URL}/sessions-assets
      - REDIS_STRING=redis://redis:6379
    volumes:
      - shared-volume:/mnt/efs
    restart: unless-stopped

  assist-openreplay:
    image: public.ecr.aws/p1t3u8a3/assist:v1.23.0
    environment:
      - ASSIST_JWT_SECRET=$SERVICE_PASSWORD_64_ASSISTJWT
      - ASSIST_KEY=$SERVICE_PASSWORD_32_ASSISTKEY
      - AWS_DEFAULT_REGION=us-east-1
      - REDIS_URL=redis
      - CLEAR_SOCKET_TIME=720
      - debug=0
      - redis=false
    volumes:
      - shared-volume:/mnt/efs
    restart: unless-stopped

  chalice-openreplay:
    image: public.ecr.aws/p1t3u8a3/chalice:v1.23.0
    environment:
      - REDIS_STRING=redis://redis:6379
      - ch_username=default
      - ch_password=
      - ch_host=clickhouse
      - ch_port=9000
      - ch_port_http=8123
      - sourcemaps_reader=http://sourcemapreader-openreplay:9000/{}/sourcemaps
      - ASSIST_URL=http://assist-openreplay:9001/assist/%s
      - JWT_REFRESH_SECRET=$SERVICE_PASSWORD_64_JWTREFRESH
      - JWT_SPOT_REFRESH_SECRET=$SERVICE_PASSWORD_64_JWTSPOTREFRESH
      - ASSIST_JWT_SECRET=$SERVICE_PASSWORD_64_ASSISTJWT
      - JWT_SECRET=$SERVICE_PASSWORD_64_JWT
      - ASSIST_KEY=$SERVICE_PASSWORD_32_ASSISTKEY
      - JWT_SPOT_SECRET=$SERVICE_PASSWORD_64_JWTSPOT
      - LICENSE_KEY=
      - pg_host=postgresql
      - pg_port=5432
      - pg_dbname=postgres
      - pg_user=postgres
      - pg_password=$SERVICE_PASSWORD_POSTGRES
      - SITE_URL=${SITE_URL}
      - S3_HOST=${SITE_URL}
      - S3_KEY=$SERVICE_USER_MINIO
      - S3_SECRET=$SERVICE_PASSWORD_MINIO
      - AWS_DEFAULT_REGION=us-east-1
      - sessions_region=us-east-1
      - ASSIST_RECORDS_BUCKET=records
      - sessions_bucket=mobs
      - IOS_VIDEO_BUCKET=mobs
      - sourcemaps_bucket=sourcemaps
      - js_cache_bucket=sessions-assets
      - EMAIL_HOST=${EMAIL_HOST}
      - EMAIL_PORT=${EMAIL_PORT:-587}
      - EMAIL_USER=${EMAIL_USER}
      - EMAIL_PASSWORD=${EMAIL_PASSWORD}
      - EMAIL_USE_TLS=${EMAIL_USE_TLS:-true}
      - EMAIL_FROM=${EMAIL_FROM:-OpenReplay<do-not-reply@openreplay.com>}
      - LOGLEVEL=INFO
      - PYTHONUNBUFFERED=0
    volumes:
      - shared-volume:/mnt/efs
    depends_on:
      postgresql:
        condition: service_healthy
    restart: unless-stopped

  db-openreplay:
    image: public.ecr.aws/p1t3u8a3/db:v1.23.0
    environment:
      - CH_USERNAME=default
      - CH_PASSWORD=
      - CLICKHOUSE_STRING=clickhouse:9000/default
      - LICENSE_KEY=
      - pg_password=$SERVICE_PASSWORD_POSTGRES
      - POSTGRES_STRING=postgres://postgres:$SERVICE_PASSWORD_POSTGRES@postgresql:5432/postgres?sslmode=disable
      - REDIS_STRING=redis://redis:6379
      - ch_db=default
    volumes:
      - shared-volume:/mnt/efs
    depends_on:
      postgresql:
        condition: service_healthy
    restart: unless-stopped

  ender-openreplay:
    image: public.ecr.aws/p1t3u8a3/ender:v1.23.0
    environment:
      - LICENSE_KEY=
      - pg_password=$SERVICE_PASSWORD_POSTGRES
      - POSTGRES_STRING=postgres://postgres:$SERVICE_PASSWORD_POSTGRES@postgresql:5432/postgres?sslmode=disable
      - REDIS_STRING=redis://redis:6379
    volumes:
      - shared-volume:/mnt/efs
    depends_on:
      postgresql:
        condition: service_healthy
    restart: unless-stopped

  heuristics-openreplay:
    image: public.ecr.aws/p1t3u8a3/heuristics:v1.23.0
    environment:
      - LICENSE_KEY=
      - REDIS_STRING=redis://redis:6379
    volumes:
      - shared-volume:/mnt/efs
    restart: unless-stopped

  alerts-openreplay:
    image: public.ecr.aws/p1t3u8a3/alerts:v1.23.0
    environment:
      - pg_host=postgresql
      - pg_port=5432
      - pg_dbname=postgres
      - pg_user=postgres
      - pg_password=$SERVICE_PASSWORD_POSTGRES
      - ch_host=clickhouse
      - ch_port=9000
      - ch_port_http=8123
      - ch_username=default
      - ch_password=
      - SITE_URL=${SITE_URL}
      - S3_HOST=${SITE_URL}
      - S3_KEY=$SERVICE_USER_MINIO
      - S3_SECRET=$SERVICE_PASSWORD_MINIO
      - AWS_DEFAULT_REGION=us-east-1
      - EMAIL_HOST=${EMAIL_HOST}
      - EMAIL_PORT=${EMAIL_PORT:-587}
      - EMAIL_USER=${EMAIL_USER}
      - EMAIL_PASSWORD=${EMAIL_PASSWORD}
      - EMAIL_USE_TLS=${EMAIL_USE_TLS:-true}
      - EMAIL_FROM=${EMAIL_FROM:-OpenReplay<do-not-reply@openreplay.com>}
      - LOGLEVEL=INFO
      - PYTHONUNBUFFERED=0
    volumes:
      - shared-volume:/mnt/efs
    restart: unless-stopped

  integrations-openreplay:
    image: public.ecr.aws/p1t3u8a3/integrations:v1.23.0
    environment:
      - AWS_ACCESS_KEY_ID=$SERVICE_USER_MINIO
      - AWS_SECRET_ACCESS_KEY=$SERVICE_PASSWORD_MINIO
      - AWS_ENDPOINT=${SITE_URL}
      - AWS_REGION=us-east-1
      - BUCKET_NAME=mobs
      - JWT_SECRET=$SERVICE_PASSWORD_64_JWT
      - LICENSE_KEY=
      - pg_password=$SERVICE_PASSWORD_POSTGRES
      - POSTGRES_STRING=postgres://postgres:$SERVICE_PASSWORD_POSTGRES@postgresql:5432/postgres?sslmode=disable
      - REDIS_STRING=redis://redis:6379
      - TOKEN_SECRET=$SERVICE_PASSWORD_64_TOKEN
    volumes:
      - shared-volume:/mnt/efs
    depends_on:
      postgresql:
        condition: service_healthy
    restart: unless-stopped

  spot-openreplay:
    image: public.ecr.aws/p1t3u8a3/spot:v1.23.0
    environment:
      - CACHE_ASSETS=true
      - FS_CLEAN_HRS=24
      - TOKEN_SECRET=$SERVICE_PASSWORD_64_TOKEN
      - AWS_ACCESS_KEY_ID=$SERVICE_USER_MINIO
      - AWS_SECRET_ACCESS_KEY=$SERVICE_PASSWORD_MINIO
      - BUCKET_NAME=spots
      - AWS_REGION=us-east-1
      - AWS_ENDPOINT=${SITE_URL}
      - LICENSE_KEY=
      - JWT_SECRET=$SERVICE_PASSWORD_64_JWT
      - JWT_SPOT_SECRET=$SERVICE_PASSWORD_64_JWTSPOT
      - pg_password=$SERVICE_PASSWORD_POSTGRES
      - POSTGRES_STRING=postgres://postgres:$SERVICE_PASSWORD_POSTGRES@postgresql:5432/postgres?sslmode=disable
      - REDIS_STRING=redis://redis:6379
    volumes:
      - shared-volume:/mnt/efs
    depends_on:
      postgresql:
        condition: service_healthy
    restart: unless-stopped

  sourcemapreader-openreplay:
    image: public.ecr.aws/p1t3u8a3/sourcemapreader:v1.23.0
    environment:
      - SMR_HOST=0.0.0.0
      - S3_HOST=http://minio:9000
      - S3_KEY=$SERVICE_USER_MINIO
      - S3_SECRET=$SERVICE_PASSWORD_MINIO
      - AWS_REGION=us-east-1
      - LICENSE_KEY=
      - ASSETS_ORIGIN=${SITE_URL}/sessions-assets
    volumes:
      - shared-volume:/mnt/efs
    restart: unless-stopped

  canvases-openreplay:
    image: public.ecr.aws/p1t3u8a3/canvases:v1.23.0
    environment:
      - AWS_ACCESS_KEY_ID=$SERVICE_USER_MINIO
      - AWS_SECRET_ACCESS_KEY=$SERVICE_PASSWORD_MINIO
      - AWS_ENDPOINT=${SITE_URL}
      - AWS_REGION=us-east-1
      - BUCKET_NAME=mobs
      - LICENSE_KEY=
      - REDIS_STRING=redis://redis:6379
      - FS_CLEAN_HRS=24
    volumes:
      - shared-volume:/mnt/efs
    depends_on:
      postgresql:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  clickhouse-data:
  redisdata:
  miniodata:
  shared-volume:
