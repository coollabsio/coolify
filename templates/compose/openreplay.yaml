      - openreplay-shared-volume:/mnt/efs
    environment:
      - TOKEN_SECRET=${SERVICE_PASSWORD_64_TOKENSECRET}
      - ch_db=default
      - JWT_SECRET=${SERVICE_PASSWORD_64_JWT}
      - ASSIST_JWT_SECRET=${SERVICE_PASSWORD_64_ASSISTJWT}
      - AWS_ACCESS_KEY_ID=${SERVICE_USER_MINIO}
      - AWS_SECRET_ACCESS_KEY=${SERVICE_PASSWORD_MINIO}
      - AWS_ENDPOINT=http://openreplay-minio:9000
      - AWS_REGION=us-east-1
      - BUCKET_NAME=mobs
      - CH_USERNAME=default
      - CH_PASSWORD=
      - CLICKHOUSE_STRING=openreplay-clickhouse:9000/default
      - CLICKHOUSE_HTTP_STRING=openreplay-clickhouse:8123/default
      - pg_password=${SERVICE_PASSWORD_POSTGRES}
      - POSTGRES_STRING=postgres://postgres:${SERVICE_PASSWORD_POSTGRES}@openreplay-postgresql:5432/postgres?sslmode=disable
      - ASSIST_URL=http://openreplay-assist:9001/assist/%s
      - ASSIST_KEY=${SERVICE_PASSWORD_64_ASSISTKEY}
      - REDIS_STRING=redis://openreplay-redis:6379
