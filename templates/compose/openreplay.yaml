# documentation: https://docs.openreplay.com/
# slogan: Open-source session replay for developers.
# category: Analytics
# tags: session replay, debugging, privacy, analytics
# logo: svgs/openreplay.svg
# port: 8080

services:
  openreplay:
    image: openreplay/openreplay:latest
    environment:
      - SERVICE_FQDN
      - APP_NAME=${APP_NAME:-OpenReplay}
      - MINIO_ACCESS_KEY=$SERVICE_PASSWORD_64
      - MINIO_SECRET_KEY=$SERVICE_PASSWORD_64_MINIO
      - DOMAIN_NAME=$SERVICE_FQDN_HOSTNAME
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
