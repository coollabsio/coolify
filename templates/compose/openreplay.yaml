      - ch_port_http=8123
      - sourcemaps_reader=http://openreplay-sourcemapreader:9000/{}/sourcemaps
      - ASSIST_URL=http://openreplay-assist:9001/assist/%s
      - JWT_REFRESH_SECRET=${SERVICE_PASSWORD_64_JWTREFRESH}
      - JWT_SPOT_REFRESH_SECRET=${SERVICE_PASSWORD_64_JWTSPOTREFRESH}
      - ASSIST_JWT_SECRET=${SERVICE_PASSWORD_64_ASSISTJWT}
      - JWT_SECRET=${SERVICE_PASSWORD_64_JWT}
      - ASSIST_KEY=${SERVICE_PASSWORD_64_ASSISTKEY}
      - JWT_SPOT_SECRET=${SERVICE_PASSWORD_64_JWTSPOT}
      - LICENSE_KEY=${LICENSE_KEY}
      - version_number=v1.25.0
      - pg_host=openreplay-postgresql
      - pg_port=5432
      - pg_dbname=postgres
      - pg_user=postgres
      - pg_password=${SERVICE_PASSWORD_POSTGRES}
      - SITE_URL=${SERVICE_URL_OPENREPLAY}
      - S3_HOST=http://openreplay-minio:9000
      - S3_KEY=${SERVICE_USER_MINIO}
      - S3_SECRET=${SERVICE_PASSWORD_MINIO}
      - AWS_DEFAULT_REGION=us-east-1
      - sessions_region=us-east-1
      - ASSIST_RECORDS_BUCKET=records
      - sessions_bucket=mobs
      - IOS_VIDEO_BUCKET=mobs
      - sourcemaps_bucket=sourcemaps
      - js_cache_bucket=sessions-assets
      - EMAIL_HOST=${EMAIL_HOST}
      - EMAIL_PORT=${EMAIL_PORT:-587}
      - EMAIL_USER=${EMAIL_USER}
      - EMAIL_PASSWORD=${EMAIL_PASSWORD}
      - EMAIL_USE_TLS=${EMAIL_USE_TLS:-true}
      - EMAIL_USE_SSL=${EMAIL_USE_SSL:-false}
      - EMAIL_SSL_KEY=${EMAIL_SSL_KEY}
      - EMAIL_SSL_CERT=${EMAIL_SSL_CERT}
      - EMAIL_FROM=${EMAIL_FROM:-OpenReplay<do-not-reply@openreplay.com>}
      - CH_COMPRESSION=false
      - JWT_EXPIRATION=86400
      - LOGLEVEL=${LOGLEVEL:-INFO}
      - PYTHONUNBUFFERED=0
      - jwt_algorithm=HS512
      - root_path=/api
    depends_on:
      openreplay-init:
        condition: service_completed_successfully
