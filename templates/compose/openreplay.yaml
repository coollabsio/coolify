# documentation: https://docs.openreplay.com/en/deployment/deploy-docker/
# slogan: Open-source session replay and product analytics for developers
# category: analytics
# tags: session-replay, analytics, monitoring, debugging, product-analytics, open-source, ux
# logo: svgs/openreplay.svg
# port: 80

services:
  openreplay-postgresql:
    image: ghcr.io/openreplay/postgres:17
    volumes:
      - openreplay-pgdata:/bitnami/postgresql
    environment:
      - POSTGRES_PASSWORD=${SERVICE_PASSWORD_POSTGRES}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s

  openreplay-clickhouse:
    image: clickhouse/clickhouse-server:25.11-alpine
    volumes:
      - openreplay-clickhouse-data:/var/lib/clickhouse
      - type: bind
        source: ./clickhouse-config.xml
        target: /etc/clickhouse-server/config.d/openreplay-config.xml
        read_only: true
        content: '<clickhouse><logger><level>warning</level><console>true</console></logger><query_thread_log remove="remove"/><query_log remove="remove"/><text_log remove="remove"/><trace_log remove="remove"/><metric_log remove="remove"/><asynchronous_metric_log remove="remove"/><session_log remove="remove"/><part_log remove="remove"/><listen_host>0.0.0.0</listen_host></clickhouse>'
      - type: bind
        source: ./clickhouse-user-config.xml
        target: /etc/clickhouse-server/users.d/openreplay-user-config.xml
        read_only: true
        content: '<clickhouse><profiles><default><log_queries>0</log_queries><log_query_threads>0</log_query_threads></default></profiles></clickhouse>'
    environment:
      - CLICKHOUSE_USER=default
      - CLICKHOUSE_PASSWORD=
      - CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT=1
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 -O - http://127.0.0.1:8123/ping || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s

  openreplay-redis:
    image: ghcr.io/openreplay/valkey:8
    volumes:
      - openreplay-redisdata:/bitnami/redis/data
    environment:
      - ALLOW_EMPTY_PASSWORD=yes
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 15

  openreplay-minio:
    image: ghcr.io/openreplay/minio:2025
    volumes:
      - openreplay-miniodata:/bitnami/minio/data
    environment:
      - MINIO_ROOT_USER=${SERVICE_USER_MINIO}
      - MINIO_ROOT_PASSWORD=${SERVICE_PASSWORD_MINIO}
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:9000/minio/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s

  openreplay-init:
    image: ghcr.io/openreplay/postgres:17
    restart: "no"
    depends_on:
      openreplay-postgresql:
        condition: service_healthy
      openreplay-clickhouse:
        condition: service_healthy
      openreplay-minio:
        condition: service_healthy
    environment:
      - PGHOST=openreplay-postgresql
      - PGPORT=5432
      - PGDATABASE=postgres
      - PGUSER=postgres
      - PGPASSWORD=${SERVICE_PASSWORD_POSTGRES}
      - MINIO_HOST=http://openreplay-minio:9000
      - MINIO_ACCESS_KEY=${SERVICE_USER_MINIO}
      - MINIO_SECRET_KEY=${SERVICE_PASSWORD_MINIO}
      - CH_HOST=openreplay-clickhouse
    volumes:
      - openreplay-shared-volume:/mnt/efs
      - openreplay-miniodata:/mnt/minio
      - openreplay-pgdata:/mnt/postgres
      - type: bind
        source: ./init-openreplay.sh
        target: /tmp/init-openreplay.sh
        content: |
          #!/bin/bash
          set -e

          echo "=== Fixing filesystem permissions ==="
          chown -R 1001:1001 /mnt/efs /mnt/minio /mnt/postgres 2>/dev/null || true

          echo "=== Initializing PostgreSQL schema ==="
          until psql -c '\q' 2>/dev/null; do
            echo "Waiting for PostgreSQL..."
            sleep 2
          done

          DB_EXISTS=$$(psql -t -c "SELECT EXISTS (SELECT 1 FROM information_schema.tables WHERE table_schema = 'public' AND table_name = 'tenants');" 2>/dev/null | tr -d '[:space:]')
          if [ "$$DB_EXISTS" = "t" ]; then
            echo "PostgreSQL schema already initialized, skipping."
          else
            echo "Downloading and applying PostgreSQL schema..."
            apt-get update -qq && apt-get install -y -qq curl > /dev/null 2>&1
            curl -fsSL "https://raw.githubusercontent.com/openreplay/openreplay/main/scripts/schema/db/init_dbs/postgresql/init_schema.sql" -o /tmp/init_pg.sql
            psql -v ON_ERROR_STOP=1 -f /tmp/init_pg.sql || echo "PostgreSQL schema init completed (some warnings may be expected)."
          fi

          echo "=== Initializing ClickHouse schema ==="
          apt-get install -y -qq netcat-openbsd > /dev/null 2>&1 || apt-get install -y -qq netcat > /dev/null 2>&1 || true
          until nc -z -w5 "$$CH_HOST" 8123 2>/dev/null; do
            echo "Waiting for ClickHouse..."
            sleep 2
          done

          CH_DB_EXISTS=$$(curl -s "http://$$CH_HOST:8123/?query=SELECT+count()+FROM+system.tables+WHERE+database='default'+AND+name='events'" 2>/dev/null | tr -d '[:space:]')
          if [ "$$CH_DB_EXISTS" != "0" ] && [ -n "$$CH_DB_EXISTS" ]; then
            echo "ClickHouse schema already initialized, skipping."
          else
            echo "Downloading and applying ClickHouse schema..."
            curl -fsSL "https://raw.githubusercontent.com/openreplay/openreplay/main/scripts/schema/db/init_dbs/clickhouse/create/init_schema.sql" -o /tmp/init_ch.sql
            curl -s "http://$$CH_HOST:8123/" --data-binary @/tmp/init_ch.sql || echo "ClickHouse schema init completed (some warnings may be expected)."
          fi

          echo "=== Creating MinIO buckets ==="
          apt-get install -y -qq wget > /dev/null 2>&1 || true
          wget -q https://dl.min.io/client/mc/release/linux-amd64/mc -O /usr/local/bin/mc && chmod +x /usr/local/bin/mc

          mc alias set orminio "$$MINIO_HOST" "$$MINIO_ACCESS_KEY" "$$MINIO_SECRET_KEY" --api S3v4

          for bucket in mobs sessions-assets static sourcemaps sessions-mobile-assets quickwit vault-data records spots; do
            mc mb "orminio/$$bucket" 2>/dev/null || true
          done

          mc anonymous set download orminio/sessions-assets 2>/dev/null || true

          echo "=== Initialization complete ==="
    entrypoint: ["bash", "/tmp/init-openreplay.sh"]

  openreplay-alerts:
    image: public.ecr.aws/p1t3u8a3/alerts:v1.25.0
    volumes:
      - openreplay-shared-volume:/mnt/efs
    environment:
      - version_number=v1.25.0
      - pg_host=openreplay-postgresql
      - pg_port=5432
      - pg_dbname=postgres
      - ch_host=openreplay-clickhouse
      - ch_port=9000
      - ch_port_http=8123
      - ch_username=default
      - ch_password=
      - pg_user=postgres
      - pg_password=${SERVICE_PASSWORD_POSTGRES}
      - SITE_URL=${SERVICE_URL_OPENREPLAY}
      - S3_HOST=http://openreplay-minio:9000
      - S3_KEY=${SERVICE_USER_MINIO}
      - S3_SECRET=${SERVICE_PASSWORD_MINIO}
      - AWS_DEFAULT_REGION=us-east-1
      - EMAIL_HOST=${EMAIL_HOST}
      - EMAIL_PORT=${EMAIL_PORT:-587}
      - EMAIL_USER=${EMAIL_USER}
      - EMAIL_PASSWORD=${EMAIL_PASSWORD}
      - EMAIL_USE_TLS=${EMAIL_USE_TLS:-true}
      - EMAIL_USE_SSL=${EMAIL_USE_SSL:-false}
      - EMAIL_SSL_KEY=${EMAIL_SSL_KEY}
      - EMAIL_SSL_CERT=${EMAIL_SSL_CERT}
      - EMAIL_FROM=${EMAIL_FROM:-OpenReplay<do-not-reply@openreplay.com>}
      - LOGLEVEL=${LOGLEVEL:-INFO}
      - PYTHONUNBUFFERED=0
    depends_on:
      openreplay-init:
        condition: service_completed_successfully
    restart: unless-stopped

  openreplay-api:
    image: public.ecr.aws/p1t3u8a3/api:v1.25.0
