# documentation: https://booklore.org/docs/getting-started
# slogan: Booklore is an open-source library management system for your digital book collection. It supports Kobo, KOReader and OPDS and automatic meta-data fetching.
# tags: media,books,kobo,epub,ebook,KOreader
# logo: svgs/booklore.svg
# port: 80

services:
  booklore:
    image: "booklore/booklore:v1.16.5"
    environment:
      - SERVICE_URL_BOOKLORE
      - USER_ID=${BOOKLORE_USER_ID:-0}
      - GROUP_ID=${BOOKLORE_GROUP_ID:-0}
      - TZ=${TZ:-UTC}
      - DATABASE_URL=${DATABASE_URL:?jdbc:mariadb://mariadb:3306/booklore}
      - DATABASE_USERNAME=${SERVICE_USER_DB}
      - DATABASE_PASSWORD=${SERVICE_PASSWORD_DB}
      - BOOKLORE_PORT=80
    depends_on:
      mariadb:
        condition: service_healthy
    volumes:
      - "booklore-data:/app/data"
      - "booklore-books:/books"
      - type: bind
        source: ~/booklore
        target: /bookdrop
        is_directory: true
    healthcheck:
      test: "wget --no-verbose --tries=1 --spider http://localhost/login || exit 1"
  mariadb:
    image: "mariadb:12.2.1-ubi10-rc"
    environment:
      - "TZ=${TZ}"
      - "MARIADB_ROOT_PASSWORD=${SERVICE_PASSWORD_DBROOT}"
      - "MARIADB_DATABASE=booklore"
      - "MARIADB_USER=${SERVICE_USER_DB}"
      - "MARIADB_PASSWORD=${SERVICE_PASSWORD_DB}"
    volumes:
      - "db-data:/config"
    healthcheck:
      test:
        - CMD
        - mariadb-admin
        - ping
        - "-h"
        - localhost
        - "-u"
        - "${SERVICE_USER_DB}"      # Replace with your username
        - "--password=${SERVICE_PASSWORD_DB}" # Replace with your password
