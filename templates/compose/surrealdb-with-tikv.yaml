# documentation: https://surrealdb.com/docs/surrealdb/installation/running/tikv
# slogan: SurrealDB backed by a distributed TiKV cluster for horizontal scalability.
# category: database
# tags: db, database, document, graph, sql, nosql, distributed, tikv, surrealdb
# logo: svgs/surrealdb.svg
# port: 8000

services:
  surrealdb:
    image: surrealdb/surrealdb:latest
    command:
      - start
      - --user
      - ${SERVICE_USER_SURREALDB}
      - --pass
      - ${SERVICE_PASSWORD_SURREALDB}
      - --bind
      - 0.0.0.0:8000
      - tikv://pd:2379
    environment:
      - SERVICE_URL_SURREALDB_8000
      - SERVICE_USER_SURREALDB
      - SERVICE_PASSWORD_SURREALDB
    depends_on:
      pd:
        condition: service_started
      tikv:
        condition: service_started
    healthcheck:
      test:
        - CMD
        - /surreal
        - is-ready
        - --endpoint
        - http://localhost:8000
      interval: 10s
      timeout: 5s
      retries: 15

  pd:
    image: pingcap/pd:latest
    command:
      - --name=pd
      - --data-dir=/data/pd
      - --client-urls=http://0.0.0.0:2379
      - --advertise-client-urls=http://pd:2379
      - --peer-urls=http://0.0.0.0:2380
      - --advertise-peer-urls=http://pd:2380
      - --initial-cluster=pd=http://pd:2380
    volumes:
      - tikv-pd-data:/data
    restart: unless-stopped

  tikv:
    image: pingcap/tikv:latest
    command:
      - --addr=0.0.0.0:20160
      - --advertise-addr=tikv:20160
      - --status-addr=0.0.0.0:20180
      - --data-dir=/data/tikv
      - --pd-endpoints=pd:2379
    volumes:
      - tikv-data:/data
    depends_on:
      pd:
        condition: service_started
    restart: unless-stopped
