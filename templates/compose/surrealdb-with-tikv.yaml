# documentation: https://surrealdb.com/docs/surrealdb/installation/running/tikv
# slogan: SurrealDB with a single-node TiKV backing store for scalable deployments.
# category: database
# tags: database,document,graph,multimodel,surrealdb,tikv
# logo: svgs/default.webp
# port: 8000

services:
  surrealdb:
    image: surrealdb/surrealdb:latest
    command:
      - start
      - --log
      - ${SURREAL_LOG_LEVEL:-info}
      - --user
      - ${SERVICE_USER_SURREALDB}
      - --pass
      - ${SERVICE_PASSWORD_SURREALDB}
      - tikv://pd:2379
    environment:
      - SERVICE_URL_SURREALDB_8000
      - SERVICE_USER_SURREALDB=${SERVICE_USER_SURREALDB:-root}
      - SERVICE_PASSWORD_SURREALDB
      - SURREAL_LOG_LEVEL=${SURREAL_LOG_LEVEL:-info}
    depends_on:
      pd:
        condition: service_started
      tikv:
        condition: service_started
    healthcheck:
      test:
        - CMD
        - surreal
        - isready
        - --conn
        - http://127.0.0.1:8000
      interval: 5s
      timeout: 20s
      retries: 10

  pd:
    image: pingcap/pd:latest
    command:
      - --name=pd
      - --data-dir=/data/pd
      - --client-urls=http://0.0.0.0:2379
      - --peer-urls=http://0.0.0.0:2380
      - --advertise-client-urls=http://pd:2379
      - --advertise-peer-urls=http://pd:2380
      - --initial-cluster=pd=http://pd:2380
    volumes:
      - surrealdb-pd-data:/data/pd

  tikv:
    image: pingcap/tikv:latest
    command:
      - --addr=0.0.0.0:20160
      - --advertise-addr=tikv:20160
      - --data-dir=/data/tikv
      - --pd=pd:2379
    depends_on:
      pd:
        condition: service_started
    volumes:
      - surrealdb-tikv-data:/data/tikv
