# documentation: https://surrealdb.com/docs/surrealdb/installation/running/docker
# slogan: SurrealDB with TiKV distributed storage backend for production workloads.
# category: database
# tags: surrealdb, database, multi-model, tikv, distributed, production
# logo: svgs/surrealdb.svg
# port: 8000

services:
  surrealdb:
    image: surrealdb/surrealdb:latest
    user: root
    command: start --user root --pass ${SERVICE_PASSWORD_SURREALDB} tikv://pd:2379
    environment:
      - SERVICE_URL_SURREALDB_8000
    depends_on:
      tikv:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "surreal", "isready", "--endpoint", "http://127.0.0.1:8000"]
      interval: 5s
      timeout: 20s
      retries: 10

  pd:
    image: pingcap/pd:latest
    command:
      - --name=pd
      - --client-urls=http://0.0.0.0:2379
      - --peer-urls=http://0.0.0.0:2380
      - --data-dir=/data/pd
    volumes:
      - pd-data:/data/pd
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:2379/health"]
      interval: 5s
      timeout: 10s
      retries: 15

  tikv:
    image: pingcap/tikv:latest
    command:
      - --pd-endpoints=http://pd:2379
      - --addr=0.0.0.0:20160
      - --data-dir=/data/tikv
    volumes:
      - tikv-data:/data/tikv
    depends_on:
      pd:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:20180/status"]
      interval: 5s
      timeout: 10s
      retries: 15
