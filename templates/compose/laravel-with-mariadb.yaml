# documentation: https://laravel.com/docs
# slogan: Laravel is a PHP web application framework with expressive, elegant syntax.
# category: framework
# tags: laravel, php, framework, web, application, mariadb
# logo: svgs/laravel.svg
# env_file: laravel.env

services:
  laravel:
    image: php:8.3-fpm-alpine
    volumes:
      - laravel-files:/var/www/html
      - type: bind
        source: ./supervisord.conf
        target: /etc/supervisord.conf
        content: |
          [supervisord]
          nodaemon=true
          pidfile=/tmp/supervisord.pid
          logfile=/dev/null
          logfile_maxbytes=0
          loglevel=info

          [program:php-fpm]
          command=php-fpm
          redirect_stderr=true
          stdout_logfile=/dev/stdout
          stdout_logfile_maxbytes=0
          stderr_logfile=/dev/stderr
          stderr_logfile_maxbytes=0
          autostart=true
          autorestart=true

          [program:scheduler]
          command=sh -c "while true; do if [ -f /var/www/html/artisan ]; then php /var/www/html/artisan schedule:run --verbose --no-interaction 2>&1; else echo 'Waiting for Laravel installation...'; fi; sleep 60; done"
          redirect_stderr=true
          stdout_logfile=/dev/stdout
          stdout_logfile_maxbytes=0
          stderr_logfile=/dev/stderr
          stderr_logfile_maxbytes=0
          autostart=true
          autorestart=true

          [program:queue-worker]
          process_name=%(program_name)s_%(process_num)02d
          command=sh -c "while [ ! -f /var/www/html/artisan ]; do echo 'Waiting for Laravel installation...'; sleep 10; done; php /var/www/html/artisan queue:work --sleep=3 --tries=3 --max-time=3600"
          redirect_stderr=true
          stdout_logfile=/dev/stdout
          stdout_logfile_maxbytes=0
          stderr_logfile=/dev/stderr
          stderr_logfile_maxbytes=0
          autostart=true
          autorestart=true
          numprocs=2
          stopwaitsecs=3600

      - type: bind
        source: ./entrypoint.sh
        target: /entrypoint.sh
        mode: "0755"
        content: |
          #!/bin/sh
          set -e

          echo "Starting Laravel setup..."

          # Ensure entrypoint script is executable
          chmod +x /entrypoint.sh 2>/dev/null || true

          # Always install supervisor and basic tools first
          if ! command -v supervisord >/dev/null 2>&1; then
            echo "Installing supervisor and required packages..."
            apk add --no-cache supervisor curl git unzip
          fi

          # Check if PHP extensions are already installed
          if php -m | grep -q "pdo_mysql" && \
             php -m | grep -q "mbstring" && \
             php -m | grep -q "zip" && \
             php -m | grep -q "gd" && \
             php -m | grep -q "intl" && \
             php -m | grep -q "opcache"; then
            echo "PHP extensions already installed, skipping compilation..."
          else
            echo "Installing PHP extensions..."

            # Install required packages for PHP extensions
            apk add --no-cache \
              oniguruma-dev \
              libzip-dev \
              postgresql-dev \
              mysql-client \
              mariadb-client \
              freetype-dev \
              libjpeg-turbo-dev \
              libpng-dev \
              icu-dev \
              libxml2-dev

            # Install PHP extensions
            # Compile extensions in parallel (warnings about existing directories are normal)
            docker-php-ext-install -j$(nproc) \
              pdo_mysql \
              pdo_pgsql \
              mbstring \
              zip \
              exif \
              pcntl \
              bcmath \
              gd \
              intl \
              opcache 2>&1 | grep -vE "(mkdir: can't create directory|File exists)" || true

            echo "PHP extensions installed successfully!"
          fi

          # Configure PHP-FPM (only if not already configured)
          if ! grep -q "listen = 0.0.0.0:9000" /usr/local/etc/php-fpm.d/www.conf 2>/dev/null; then
            sed -i 's/listen = 127.0.0.1:9000/listen = 0.0.0.0:9000/' /usr/local/etc/php-fpm.d/www.conf
            sed -i 's/;clear_env = no/clear_env = no/' /usr/local/etc/php-fpm.d/www.conf
          fi

          # Install Composer if not present
          if ! command -v composer >/dev/null 2>&1; then
            echo "Installing Composer..."
            curl -sS https://getcomposer.org/installer | php -- --install-dir=/usr/local/bin --filename=composer
            chmod +x /usr/local/bin/composer
            echo "Composer installed successfully!"
          fi

          # Create Laravel directories if they don't exist (before installation)
          mkdir -p /var/www/html
          mkdir -p /var/www/html/storage/logs
          mkdir -p /var/www/html/storage/framework/cache
          mkdir -p /var/www/html/storage/framework/sessions
          mkdir -p /var/www/html/storage/framework/views
          mkdir -p /var/www/html/bootstrap/cache

          # Install Laravel if not present
          if [ ! -f /var/www/html/artisan ]; then
            echo "Laravel not found. Installing Laravel..."
            cd /var/www/html

            # Only clear if directory is not empty
            if [ "$(ls -A /var/www/html 2>/dev/null)" ]; then
              echo "Clearing existing files..."
              rm -rf * .[!.]* 2>/dev/null || true
            fi

            echo "Creating Laravel project..."
            composer create-project laravel/laravel . --prefer-dist --no-interaction --no-scripts

            # Run post-install scripts after installation
            if [ -f /var/www/html/artisan ]; then
              echo "Running Laravel post-install scripts..."
              php artisan key:generate --force || true
            fi

            echo "Laravel installed successfully!"
          else
            echo "Laravel already installed, skipping installation..."
          fi

          # Ensure Laravel directories exist and have correct permissions
          mkdir -p /var/www/html/storage/logs
          mkdir -p /var/www/html/storage/framework/cache
          mkdir -p /var/www/html/storage/framework/sessions
          mkdir -p /var/www/html/storage/framework/views
          mkdir -p /var/www/html/bootstrap/cache

          # Set permissions
          chown -R www-data:www-data /var/www/html
          chmod -R 775 /var/www/html/storage
          chmod -R 775 /var/www/html/bootstrap/cache

          # Wait for Laravel to be fully installed before starting supervisor
          echo "Waiting for Laravel installation to complete..."
          max_wait=300
          waited=0
          while [ ! -f /var/www/html/artisan ]; do
            if [ $waited -ge $max_wait ]; then
              echo "ERROR: Laravel installation timeout after ${max_wait}s"
              exit 1
            fi
            sleep 2
            waited=$((waited + 2))
          done
          echo "Laravel is ready!"

          echo "Starting supervisor..."
          exec /usr/bin/supervisord -c /etc/supervisord.conf
    environment:
      - SERVICE_URL_LARAVEL
      - DB_CONNECTION=mysql
      - DB_HOST=mariadb
      - DB_PORT=3306
      - DB_DATABASE=$SERVICE_DATABASE_LARAVEL
      - DB_USERNAME=$SERVICE_USER_LARAVEL
      - DB_PASSWORD=$SERVICE_PASSWORD_LARAVEL
      - APP_NAME=Laravel
      - APP_ENV=production
      - APP_KEY=
      - APP_DEBUG=false
      - APP_URL=$SERVICE_URL_LARAVEL
      - LOG_CHANNEL=stack
      - LOG_LEVEL=debug
      - QUEUE_CONNECTION=database
      - CACHE_DRIVER=file
      - SESSION_DRIVER=file
      - REDIS_HOST=redis
      - REDIS_PASSWORD=$SERVICE_PASSWORD_REDIS
      - REDIS_PORT=6379
    depends_on:
      mariadb:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Avoid `pgrep` (often missing on php-fpm-alpine). Verify config + artisan + TCP :9000 with bundled `php`.
    healthcheck:
      test: ["CMD-SHELL", "php-fpm -t >/dev/null 2>&1 && test -f /var/www/html/artisan && php -r \"exit(@fsockopen('127.0.0.1',9000)?0:1);\""]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 900s
    entrypoint: ["/bin/sh", "/entrypoint.sh"]

  nginx:
    image: nginx:alpine
    # Skip /docker-entrypoint.d/ scripts: they try to PATCH nginx.conf (read-only bind) and can hit io_setup on constrained hosts.
    # Shell wrapper: log to stderr so Coolify log UI shows startup before the first HTTP request.
    entrypoint: ["/bin/sh", "-c"]
    command: "echo '[nginx] starting' >&2; exec nginx -g 'daemon off;'"
    volumes:
      - laravel-files:/var/www/html:ro
      - type: bind
        source: ./nginx-main.conf
        target: /etc/nginx/nginx.conf
        content: |
          # Minimal + aio off; keep events simple for broad compatibility.
          user nginx;
          worker_processes 1;
          error_log /dev/stderr warn;
          pid /var/run/nginx.pid;

          events {
              worker_connections 1024;
          }

          http {
              include /etc/nginx/mime.types;
              default_type application/octet-stream;
              aio off;
              aio_write off;
              sendfile off;
              directio off;
              keepalive_timeout 65;
              client_max_body_size 100M;
              include /etc/nginx/conf.d/*.conf;
          }
      - type: bind
        source: ./nginx.conf
        target: /etc/nginx/conf.d/default.conf
        content: |
          server {
              listen 80;
              server_name _;
              root /var/www/html/public;
              index index.php index.html;
              aio off;
              aio_write off;

              client_max_body_size 100M;

              access_log /dev/stdout;
              error_log /dev/stderr;

              # Resolve upstreams via Docker embedded DNS to avoid startup crashes
              # when the `laravel` container is not yet resolvable.
              resolver 127.0.0.11 ipv6=off valid=10s;
              set $php_upstream "laravel:9000";

              location / {
                  try_files $uri $uri/ /index.php?$query_string;
              }

              location ~ \.php$ {
                  fastcgi_pass $php_upstream;
                  fastcgi_index index.php;
                  fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
                  include fastcgi_params;
                  fastcgi_read_timeout 300;
                  fastcgi_buffers 16 16k;
                  fastcgi_buffer_size 32k;
              }

              location ~ /\.(?!well-known).* {
                  deny all;
              }
          }
    depends_on:
      laravel:
        condition: service_started
    restart: unless-stopped
    expose:
      - "80"
    healthcheck:
      test: ["CMD-SHELL", "nginx -t >/dev/null 2>&1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  mariadb:
    image: mariadb:11
    volumes:
      - mariadb-data:/var/lib/mysql
    environment:
      - MYSQL_ROOT_PASSWORD=$SERVICE_PASSWORD_ROOT
      - MYSQL_DATABASE=$SERVICE_DATABASE_LARAVEL
      - MYSQL_USER=$SERVICE_USER_LARAVEL
      - MYSQL_PASSWORD=$SERVICE_PASSWORD_LARAVEL
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 20s
      retries: 10

  redis:
    image: redis:7-alpine
    command: redis-server --requirepass ${SERVICE_PASSWORD_REDIS}
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"${SERVICE_PASSWORD_REDIS}\" ping | grep -q PONG || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  laravel-files:
  mariadb-data:
  redis-data:
