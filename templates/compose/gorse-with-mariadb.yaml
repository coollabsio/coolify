# documentation: https://gorse.io/docs
# slogan: An open-source recommender system service written in Go.
# category: ai
# tags: recommendation, machine-learning, ai, recommender, personalization, mariadb
# logo: svgs/gorse.png
# port: 8088

services:
  gorse:
    image: zhenghaoz/gorse-in-one:latest
    environment:
      - SERVICE_URL_GORSE_8088
      - GORSE_CACHE_STORE=redis://redis:6379
      - GORSE_DATA_STORE=mysql://${SERVICE_USER_MYSQL}:${SERVICE_PASSWORD_MYSQL}@tcp(mariadb:3306)/${MYSQL_DATABASE:-gorse}
      - GORSE_SERVER_API_KEY=${SERVICE_PASSWORD_APIKEY}
      - GORSE_DASHBOARD_USER_NAME=${GORSE_DASHBOARD_USER_NAME:-admin}
      - GORSE_DASHBOARD_PASSWORD=${SERVICE_PASSWORD_GORSE}
    depends_on:
      redis:
        condition: service_healthy
      mariadb:
        condition: service_healthy
    volumes:
      - gorse-data:/var/lib/gorse
    healthcheck:
      test: ["CMD-SHELL", "echo > /dev/tcp/127.0.0.1/8088 || exit 1"]
      interval: 5s
      timeout: 20s
      retries: 10

  redis:
    image: redis:8-alpine
    volumes:
      - gorse-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 3

  mariadb:
    image: mariadb:12
    volumes:
      - gorse-mariadb-data:/var/lib/mysql
    environment:
      - MYSQL_USER=${SERVICE_USER_MYSQL}
      - MYSQL_PASSWORD=${SERVICE_PASSWORD_MYSQL}
      - MYSQL_DATABASE=${MYSQL_DATABASE:-gorse}
      - MYSQL_ROOT_PASSWORD=${SERVICE_PASSWORD_MYSQLROOT}
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 20s
      retries: 10
