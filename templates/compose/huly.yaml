# documentation: https://github.com/hcengineering/huly-selfhost
# slogan: Huly is an open-source all-in-one project management platform for teams.
# category: productivity
# tags: project-management,team-collaboration,notion,jira,linear,workspace
# port: 80

services:
  nginx:
    image: nginx:1.29.2
    environment:
      - SERVICE_URL_HULY_80
    volumes:
      - type: bind
        source: ./nginx/default.conf
        target: /etc/nginx/conf.d/default.conf
        read_only: true
        content: |
          server {
              listen 80;
              client_max_body_size 100M;

              proxy_set_header Host $host;
              proxy_set_header X-Real-IP $remote_addr;
              proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
              proxy_set_header X-Forwarded-Proto $scheme;

              location / {
                  proxy_pass http://front:8080;
              }

              location /_accounts {
                  proxy_pass http://account:3000;
              }

              location /_collaborator {
                  proxy_pass http://collaborator:3078;
                  proxy_http_version 1.1;
                  proxy_set_header Upgrade $http_upgrade;
                  proxy_set_header Connection "upgrade";
              }

              location /_transactor {
                  proxy_pass http://transactor:3333;
                  proxy_http_version 1.1;
                  proxy_set_header Upgrade $http_upgrade;
                  proxy_set_header Connection "upgrade";
              }

              location ~ ^/eyJ {
                  proxy_pass http://transactor:3333;
                  proxy_http_version 1.1;
                  proxy_set_header Upgrade $http_upgrade;
                  proxy_set_header Connection "upgrade";
              }

              location /_rekoni {
                  proxy_pass http://rekoni:4004;
              }

              location /_stats {
                  proxy_pass http://stats:4900;
              }

              location /health {
                  access_log off;
                  return 200 "healthy\n";
                  add_header Content-Type text/plain;
              }
          }
    depends_on:
      front:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1/health || exit 1"]
      interval: 5s
      timeout: 20s
      retries: 10

  cockroach:
    image: cockroachdb/cockroach:latest-v24.2
    command: start-single-node --accept-sql-without-tls
    environment:
      - COCKROACH_DATABASE=${COCKROACH_DATABASE:-huly}
      - COCKROACH_USER=${SERVICE_USER_COCKROACH}
      - COCKROACH_PASSWORD=${SERVICE_PASSWORD_COCKROACH}
    volumes:
      - huly-cockroach-data:/cockroach/cockroach-data
      - huly-cockroach-certs:/cockroach/certs
    healthcheck:
      test: ["CMD-SHELL", "cockroach sql --insecure --execute='select 1' >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20

  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v24.3.6
    command:
      - redpanda
      - start
      - --kafka-addr
      - internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr
      - internal://redpanda:9092,external://localhost:19092
      - --pandaproxy-addr
      - internal://0.0.0.0:8082,external://0.0.0.0:18082
      - --advertise-pandaproxy-addr
      - internal://redpanda:8082,external://localhost:18082
      - --schema-registry-addr
      - internal://0.0.0.0:8081,external://0.0.0.0:18081
      - --rpc-addr
      - redpanda:33145
      - --advertise-rpc-addr
      - redpanda:33145
      - --mode
      - dev-container
      - --smp
      - '1'
      - --default-log-level=info
    environment:
      - REDPANDA_SUPERUSER_USERNAME=${SERVICE_USER_REDPANDA}
      - REDPANDA_SUPERUSER_PASSWORD=${SERVICE_PASSWORD_REDPANDA}
    volumes:
      - huly-redpanda-data:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster info -X user=${SERVICE_USER_REDPANDA} -X pass=${SERVICE_PASSWORD_REDPANDA} >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20

  minio:
    image: ghcr.io/coollabsio/minio:RELEASE.2025-10-15T17-29-55Z
    command: server /data --address ":9000" --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=${SERVICE_USER_MINIO}
      - MINIO_ROOT_PASSWORD=${SERVICE_PASSWORD_MINIO}
    volumes:
      - huly-files:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 20s
      retries: 10

  elastic:
    image: elasticsearch:7.14.2
    command: |
      /bin/sh -c "./bin/elasticsearch-plugin list | grep -q ingest-attachment || yes | ./bin/elasticsearch-plugin install --silent ingest-attachment;
      /usr/local/bin/docker-entrypoint.sh eswrapper"
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms1024m -Xmx1024m
      - http.cors.enabled=true
      - http.cors.allow-origin=*
    volumes:
      - huly-elastic-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9200/_cluster/health | grep -vq '\"status\":\"red\"' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20

  account:
    image: hardcoreeng/account:${HULY_VERSION:-v0.7.423}
    environment:
      - SERVER_PORT=3000
      - SERVER_SECRET=${SERVICE_PASSWORD_64_SECRET}
      - DB_URL=postgresql://${SERVICE_USER_COCKROACH}:${SERVICE_PASSWORD_COCKROACH}@cockroach:26257/${COCKROACH_DATABASE:-huly}?sslmode=disable
      - TRANSACTOR_URL=ws://transactor:3333;wss://${SERVICE_FQDN_HULY}/_transactor
      - FRONT_URL=${SERVICE_URL_HULY}
      - ACCOUNTS_URL=${SERVICE_URL_HULY}/_accounts
      - ACCOUNT_PORT=3000
      - STATS_URL=http://stats:4900
      - QUEUE_CONFIG=redpanda:9092
      - STORAGE_CONFIG=minio|minio?accessKey=${SERVICE_USER_MINIO}&secretKey=${SERVICE_PASSWORD_MINIO}
    depends_on:
      cockroach:
        condition: service_healthy
      redpanda:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:3000 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20

  front:
    image: hardcoreeng/front:${HULY_VERSION:-v0.7.423}
    environment:
      - SERVER_PORT=8080
      - SERVER_SECRET=${SERVICE_PASSWORD_64_SECRET}
      - ACCOUNTS_URL=${SERVICE_URL_HULY}/_accounts
      - ACCOUNTS_URL_INTERNAL=http://account:3000
      - LOVE_ENDPOINT=${SERVICE_URL_HULY}/_love
      - REKONI_URL=${SERVICE_URL_HULY}/_rekoni
      - CALENDAR_URL=${SERVICE_URL_HULY}/_calendar
      - GMAIL_URL=${SERVICE_URL_HULY}/_gmail
      - TELEGRAM_URL=${SERVICE_URL_HULY}/_telegram
      - UPLOAD_URL=/files
      - ELASTIC_URL=http://elastic:9200
      - COLLABORATOR_URL=wss://${SERVICE_FQDN_HULY}/_collaborator
      - STORAGE_CONFIG=minio|minio?accessKey=${SERVICE_USER_MINIO}&secretKey=${SERVICE_PASSWORD_MINIO}
      - TITLE=${HULY_TITLE:-Huly Self Host}
      - DEFAULT_LANGUAGE=${HULY_DEFAULT_LANGUAGE:-en}
      - LAST_NAME_FIRST=${LAST_NAME_FIRST:-true}
      - DESKTOP_UPDATES_CHANNEL=${DESKTOP_CHANNEL}
      - DISABLED_FEATURES=auto-translate,mailboxes
      - STATS_URL=${SERVICE_URL_HULY}/_stats
    depends_on:
      account:
        condition: service_healthy
      collaborator:
        condition: service_started
      transactor:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20

  transactor:
    image: hardcoreeng/transactor:${HULY_VERSION:-v0.7.423}
    environment:
      - SERVER_PORT=3333
      - SERVER_SECRET=${SERVICE_PASSWORD_64_SECRET}
      - DB_URL=postgresql://${SERVICE_USER_COCKROACH}:${SERVICE_PASSWORD_COCKROACH}@cockroach:26257/${COCKROACH_DATABASE:-huly}?sslmode=disable
      - METRICS_CONSOLE=false
      - METRICS_FILE=metrics.txt
      - STORAGE_CONFIG=minio|minio?accessKey=${SERVICE_USER_MINIO}&secretKey=${SERVICE_PASSWORD_MINIO}
      - REKONI_URL=http://rekoni:4004
      - FRONT_URL=${SERVICE_URL_HULY}
      - SERVER_PROVIDER=ws
      - ACCOUNTS_URL=http://account:3000
      - STATS_URL=http://stats:4900
      - QUEUE_CONFIG=redpanda:9092
      - LAST_NAME_FIRST=${LAST_NAME_FIRST:-true}
      - UPLOAD_URL=/files
      - FULLTEXT_URL=http://fulltext:4700
    depends_on:
      cockroach:
        condition: service_healthy
      redpanda:
        condition: service_healthy
      elastic:
        condition: service_healthy
      minio:
        condition: service_healthy

  workspace:
    image: hardcoreeng/workspace:${HULY_VERSION:-v0.7.423}
    environment:
      - SERVER_SECRET=${SERVICE_PASSWORD_64_SECRET}
      - DB_URL=postgresql://${SERVICE_USER_COCKROACH}:${SERVICE_PASSWORD_COCKROACH}@cockroach:26257/${COCKROACH_DATABASE:-huly}?sslmode=disable
      - TRANSACTOR_URL=ws://transactor:3333;wss://${SERVICE_FQDN_HULY}/_transactor
      - STORAGE_CONFIG=minio|minio?accessKey=${SERVICE_USER_MINIO}&secretKey=${SERVICE_PASSWORD_MINIO}
      - MODEL_ENABLED=*
      - ACCOUNTS_URL=http://account:3000
      - STATS_URL=http://stats:4900
      - QUEUE_CONFIG=redpanda:9092
      - ACCOUNTS_DB_URL=postgresql://${SERVICE_USER_COCKROACH}:${SERVICE_PASSWORD_COCKROACH}@cockroach:26257/${COCKROACH_DATABASE:-huly}?sslmode=disable
    depends_on:
      account:
        condition: service_healthy
      transactor:
        condition: service_started

  fulltext:
    image: hardcoreeng/fulltext:${HULY_VERSION:-v0.7.423}
    environment:
      - SERVER_PORT=4700
      - SERVER_SECRET=${SERVICE_PASSWORD_64_SECRET}
      - DB_URL=postgresql://${SERVICE_USER_COCKROACH}:${SERVICE_PASSWORD_COCKROACH}@cockroach:26257/${COCKROACH_DATABASE:-huly}?sslmode=disable
      - FULLTEXT_DB_URL=http://elastic:9200
      - ELASTIC_INDEX_NAME=huly_storage_index
      - STORAGE_CONFIG=minio|minio?accessKey=${SERVICE_USER_MINIO}&secretKey=${SERVICE_PASSWORD_MINIO}
      - MODEL_ENABLED=*
      - ACCOUNTS_URL=http://account:3000
      - STATS_URL=http://stats:4900
      - QUEUE_CONFIG=redpanda:9092
    depends_on:
      elastic:
        condition: service_healthy
      redpanda:
        condition: service_healthy

  collaborator:
    image: hardcoreeng/collaborator:${HULY_VERSION:-v0.7.423}
    environment:
      - COLLABORATOR_PORT=3078
      - SECRET=${SERVICE_PASSWORD_64_SECRET}
      - ACCOUNTS_URL=http://account:3000
      - STORAGE_CONFIG=minio|minio?accessKey=${SERVICE_USER_MINIO}&secretKey=${SERVICE_PASSWORD_MINIO}
      - STATS_URL=http://stats:4900
    depends_on:
      account:
        condition: service_healthy
      transactor:
        condition: service_started

  rekoni:
    image: hardcoreeng/rekoni-service:${HULY_VERSION:-v0.7.423}
    environment:
      - SECRET=${SERVICE_PASSWORD_64_SECRET}
    deploy:
      resources:
        limits:
          memory: 500M

  stats:
    image: hardcoreeng/stats:${HULY_VERSION:-v0.7.423}
    environment:
      - PORT=4900
      - SERVER_SECRET=${SERVICE_PASSWORD_64_SECRET}
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:4900 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  kvs:
    image: hardcoreeng/hulykvs:${HULY_VERSION:-v0.7.423}
    ports:
      - 8094:8094
    environment:
      - HULY_DB_CONNECTION=postgresql://${SERVICE_USER_COCKROACH}:${SERVICE_PASSWORD_COCKROACH}@cockroach:26257/${COCKROACH_DATABASE:-huly}?sslmode=disable
      - HULY_TOKEN_SECRET=${SERVICE_PASSWORD_64_SECRET}
    depends_on:
      cockroach:
        condition: service_healthy
