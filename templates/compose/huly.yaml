# documentation: https://github.com/hcengineering/huly-selfhost
# slogan: All-in-one open source project management platform, an alternative to Linear, Jira, Slack and Notion.
# category: productivity
# tags: huly,project,management,tracker,linear,jira,slack,notion,collaboration
# logo: svgs/huly.svg
# port: 80

services:
  huly:
    image: nginx:1.29.2-alpine
    environment:
      - SERVICE_URL_HULY_80
    volumes:
      - type: bind
        source: ./nginx/huly.conf
        target: /etc/nginx/conf.d/default.conf
        read_only: true
        content: |
          server {
              listen 80;
              server_name _;
              client_max_body_size 100M;

              location / {
                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto $scheme;
                  proxy_pass http://front:8080;
              }

              location /_accounts {
                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto $scheme;

                  rewrite ^/_accounts(/.*)$ $1 break;
                  proxy_pass http://account:3000/;
              }

              location /_collaborator {
                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto $scheme;

                  proxy_http_version 1.1;
                  proxy_set_header Upgrade $http_upgrade;
                  proxy_set_header Connection "upgrade";
                  rewrite ^/_collaborator(/.*)$ $1 break;
                  proxy_pass http://collaborator:3078/;
              }

              location /_transactor {
                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto $scheme;

                  proxy_http_version 1.1;
                  proxy_set_header Upgrade $http_upgrade;
                  proxy_set_header Connection "upgrade";
                  rewrite ^/_transactor(/.*)$ $1 break;
                  proxy_pass http://transactor:3333/;
              }

              location ~ ^/eyJ {
                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto $scheme;

                  proxy_http_version 1.1;
                  proxy_set_header Upgrade $http_upgrade;
                  proxy_set_header Connection "upgrade";
                  proxy_pass http://transactor:3333;
              }

              location /_rekoni {
                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto $scheme;

                  rewrite ^/_rekoni(/.*)$ $1 break;
                  proxy_pass http://rekoni:4004/;
              }

              location /_stats {
                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto $scheme;

                  rewrite ^/_stats(/.*)$ $1 break;
                  proxy_pass http://stats:4900/;
              }



          }
    depends_on:
      front:
        condition: service_healthy
      account:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:80/"]
      interval: 10s
      timeout: 5s
      retries: 10

  cockroach:
    image: cockroachdb/cockroach:v24.2.10
    command: start-single-node --accept-sql-without-tls
    environment:
      - COCKROACH_DATABASE=huly
      - COCKROACH_USER=huly
      - COCKROACH_PASSWORD=${SERVICE_PASSWORD_COCKROACH}
    volumes:
      - huly-cockroach-data:/cockroach/cockroach-data
      - huly-cockroach-certs:/cockroach/certs
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:8080/health?ready=1"]
      interval: 10s
      timeout: 5s
      retries: 20

  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v24.3.6
    command:
      - redpanda
      - start
      - --kafka-addr internal://0.0.0.0:9092
      - --advertise-kafka-addr internal://redpanda:9092
      - --pandaproxy-addr internal://0.0.0.0:8082
      - --advertise-pandaproxy-addr internal://redpanda:8082
      - --schema-registry-addr internal://0.0.0.0:8081
      - --rpc-addr redpanda:33145
      - --advertise-rpc-addr redpanda:33145
      - --mode dev-container
      - --smp 1
      - --memory 1G
      - --default-log-level=info
    volumes:
      - huly-redpanda:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD", "rpk", "cluster", "info"]
      interval: 10s
      timeout: 5s
      retries: 20

  minio:
    image: ghcr.io/coollabsio/minio:RELEASE.2025-10-15T17-29-55Z
    command: server /data --address ":9000" --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=${SERVICE_USER_MINIO}
      - MINIO_ROOT_PASSWORD=${SERVICE_PASSWORD_MINIO}
    volumes:
      - huly-files:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 20s
      retries: 10

  elastic:
    image: elasticsearch:7.14.2
    command: |
      /bin/sh -c "./bin/elasticsearch-plugin list | grep -q ingest-attachment || yes | ./bin/elasticsearch-plugin install --silent ingest-attachment;
      /usr/local/bin/docker-entrypoint.sh eswrapper"
    environment:
      - discovery.type=single-node
      - ES_JAVA_OPTS=-Xms1024m -Xmx1024m
    volumes:
      - huly-elastic:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://127.0.0.1:9200/_cluster/health | grep -vq '\"status\":\"red\"'"]
      interval: 20s
      timeout: 10s
      retries: 10

  rekoni:
    image: hardcoreeng/rekoni-service:v0.7.426
    environment:
      - SECRET=${SERVICE_PASSWORD_64_HULY}
    deploy:
      resources:
        limits:
          memory: 500M

  transactor:
    image: hardcoreeng/transactor:v0.7.426
    environment:
      - SERVER_PORT=3333
      - SERVER_SECRET=${SERVICE_PASSWORD_64_HULY}
      - DB_URL=postgres://huly:${SERVICE_PASSWORD_COCKROACH}@cockroach:26257/huly
      - STORAGE_CONFIG=minio|minio?accessKey=${SERVICE_USER_MINIO}&secretKey=${SERVICE_PASSWORD_MINIO}
      - FRONT_URL=${SERVICE_URL_HULY}
      - ACCOUNTS_URL=http://account:3000
      - FULLTEXT_URL=http://fulltext:4700
      - STATS_URL=http://stats:4900
      - LAST_NAME_FIRST=${LAST_NAME_FIRST:-true}
      - QUEUE_CONFIG=redpanda:9092
    depends_on:
      cockroach:
        condition: service_healthy
      redpanda:
        condition: service_healthy
      minio:
        condition: service_healthy

  collaborator:
    image: hardcoreeng/collaborator:v0.7.426
    environment:
      - COLLABORATOR_PORT=3078
      - SECRET=${SERVICE_PASSWORD_64_HULY}
      - ACCOUNTS_URL=http://account:3000
      - STATS_URL=http://stats:4900
      - STORAGE_CONFIG=minio|minio?accessKey=${SERVICE_USER_MINIO}&secretKey=${SERVICE_PASSWORD_MINIO}
    depends_on:
      minio:
        condition: service_healthy

  account:
    image: hardcoreeng/account:v0.7.426
    environment:
      - SERVER_PORT=3000
      - SERVER_SECRET=${SERVICE_PASSWORD_64_HULY}
      - DB_URL=postgres://huly:${SERVICE_PASSWORD_COCKROACH}@cockroach:26257/huly
      - TRANSACTOR_URL=ws://transactor:3333;wss://${SERVICE_FQDN_HULY}/_transactor
      - STORAGE_CONFIG=minio|minio?accessKey=${SERVICE_USER_MINIO}&secretKey=${SERVICE_PASSWORD_MINIO}
      - FRONT_URL=${SERVICE_URL_HULY}
      - STATS_URL=${SERVICE_URL_HULY}/_stats
      - MODEL_ENABLED=*
      - ACCOUNTS_URL=${SERVICE_URL_HULY}/_accounts
      - ACCOUNT_PORT=3000
      - QUEUE_CONFIG=redpanda:9092
    depends_on:
      cockroach:
        condition: service_healthy
      redpanda:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000').then(()=>process.exit(0)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 20

  workspace:
    image: hardcoreeng/workspace:v0.7.426
    environment:
      - SERVER_SECRET=${SERVICE_PASSWORD_64_HULY}
      - DB_URL=postgres://huly:${SERVICE_PASSWORD_COCKROACH}@cockroach:26257/huly
      - ACCOUNTS_DB_URL=postgres://huly:${SERVICE_PASSWORD_COCKROACH}@cockroach:26257/huly
      - TRANSACTOR_URL=ws://transactor:3333;wss://${SERVICE_FQDN_HULY}/_transactor
      - STORAGE_CONFIG=minio|minio?accessKey=${SERVICE_USER_MINIO}&secretKey=${SERVICE_PASSWORD_MINIO}
      - MODEL_ENABLED=*
      - ACCOUNTS_URL=http://account:3000
      - STATS_URL=http://stats:4900
      - QUEUE_CONFIG=redpanda:9092
    depends_on:
      cockroach:
        condition: service_healthy
      redpanda:
        condition: service_healthy
      minio:
        condition: service_healthy

  front:
    image: hardcoreeng/front:v0.7.426
    environment:
      - SERVER_PORT=8080
      - SERVER_SECRET=${SERVICE_PASSWORD_64_HULY}
      - LOVE_ENDPOINT=${SERVICE_URL_HULY}/_love
      - ACCOUNTS_URL=${SERVICE_URL_HULY}/_accounts
      - ACCOUNTS_URL_INTERNAL=http://account:3000
      - REKONI_URL=${SERVICE_URL_HULY}/_rekoni
      - CALENDAR_URL=${SERVICE_URL_HULY}/_calendar
      - GMAIL_URL=${SERVICE_URL_HULY}/_gmail
      - TELEGRAM_URL=${SERVICE_URL_HULY}/_telegram
      - STATS_URL=${SERVICE_URL_HULY}/_stats
      - UPLOAD_URL=/files
      - ELASTIC_URL=http://elastic:9200
      - COLLABORATOR_URL=wss://${SERVICE_FQDN_HULY}/_collaborator
      - STORAGE_CONFIG=minio|minio?accessKey=${SERVICE_USER_MINIO}&secretKey=${SERVICE_PASSWORD_MINIO}
      - TITLE=${TITLE:-Huly}
      - DEFAULT_LANGUAGE=${DEFAULT_LANGUAGE:-en}
      - LAST_NAME_FIRST=${LAST_NAME_FIRST:-true}
      - DESKTOP_UPDATES_CHANNEL=${DESKTOP_UPDATES_CHANNEL:-0.7.426}
      - DISABLED_FEATURES=auto-translate,mailboxes
    depends_on:
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080').then(()=>process.exit(0)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 20

  fulltext:
    image: hardcoreeng/fulltext:v0.7.426
    environment:
      - SERVER_SECRET=${SERVICE_PASSWORD_64_HULY}
      - DB_URL=postgres://huly:${SERVICE_PASSWORD_COCKROACH}@cockroach:26257/huly
      - FULLTEXT_DB_URL=http://elastic:9200
      - ELASTIC_INDEX_NAME=huly_storage_index
      - STORAGE_CONFIG=minio|minio?accessKey=${SERVICE_USER_MINIO}&secretKey=${SERVICE_PASSWORD_MINIO}
      - REKONI_URL=http://rekoni:4004
      - ACCOUNTS_URL=http://account:3000
      - STATS_URL=http://stats:4900
      - QUEUE_CONFIG=redpanda:9092
    depends_on:
      cockroach:
        condition: service_healthy
      redpanda:
        condition: service_healthy
      minio:
        condition: service_healthy
      elastic:
        condition: service_healthy

  stats:
    image: hardcoreeng/stats:v0.7.426
    environment:
      - PORT=4900
      - SERVER_SECRET=${SERVICE_PASSWORD_64_HULY}

  kvs:
    image: hardcoreeng/hulykvs:v0.7.426
    environment:
      - HULY_DB_CONNECTION=postgres://huly:${SERVICE_PASSWORD_COCKROACH}@cockroach:26257/huly
      - HULY_TOKEN_SECRET=${SERVICE_PASSWORD_64_HULY}
    depends_on:
      cockroach:
        condition: service_healthy
