# documentation: https://docs.huly.io
# slogan: Huly is an all-in-one project management platform, a Linear/Jira/Notion alternative.
# category: productivity
# tags: project-management, kanban, crm, collaboration, notion-alternative
# logo: svgs/huly.svg
# port: 80

services:
  huly:
    image: nginx:1.21.3
    volumes:
      - type: bind
        source: ./huly-nginx.conf
        target: /etc/nginx/conf.d/default.conf
        content: |
          server {
              listen 80;
              server_name _;
              client_max_body_size 100M;

              location / {
                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto $scheme;
                  proxy_pass http://front:8080;
              }

              location /_accounts {
                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto $scheme;
                  rewrite ^/_accounts(/.*)$ $1 break;
                  proxy_pass http://account:3000/;
              }

              location /_collaborator {
                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto $scheme;
                  proxy_http_version 1.1;
                  proxy_set_header Upgrade $http_upgrade;
                  proxy_set_header Connection "upgrade";
                  rewrite ^/_collaborator(/.*)$ $1 break;
                  proxy_pass http://collaborator:3078/;
              }

              location /_transactor {
                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto $scheme;
                  proxy_http_version 1.1;
                  proxy_set_header Upgrade $http_upgrade;
                  proxy_set_header Connection "upgrade";
                  rewrite ^/_transactor(/.*)$ $1 break;
                  proxy_pass http://transactor:3333/;
              }

              location ~ ^/eyJ {
                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto $scheme;
                  proxy_http_version 1.1;
                  proxy_set_header Upgrade $http_upgrade;
                  proxy_set_header Connection "upgrade";
                  proxy_pass http://transactor:3333;
              }

              location /_rekoni {
                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto $scheme;
                  rewrite ^/_rekoni(/.*)$ $1 break;
                  proxy_pass http://rekoni:4004/;
              }

              location /_stats {
                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto $scheme;
                  rewrite ^/_stats(/.*)$ $1 break;
                  proxy_pass http://stats:4900/;
              }
          }
    environment:
      - SERVICE_URL_HULY
      - SERVICE_FQDN_HULY
    depends_on:
      - front
      - account
      - transactor
      - collaborator
      - rekoni
      - stats
    healthcheck:
      test:
        - CMD-SHELL
        - nginx -t || exit 1
      interval: 5s
      timeout: 20s
      retries: 10
    restart: unless-stopped

  cockroach:
    image: cockroachdb/cockroach:latest-v24.2
    command: start-single-node --accept-sql-without-tls
    environment:
      - COCKROACH_DATABASE=defaultdb
      - COCKROACH_USER=selfhost
      - COCKROACH_PASSWORD=$SERVICE_PASSWORD_COCKROACH
    volumes:
      - huly-cr-data:/cockroach/cockroach-data
      - huly-cr-certs:/cockroach/certs
    healthcheck:
      test:
        - CMD-SHELL
        - "curl -f http://localhost:8080/health?ready=1 || exit 1"
      interval: 10s
      timeout: 10s
      retries: 20
    restart: unless-stopped

  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v24.3.6
    command:
      - redpanda
      - start
      - --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr internal://redpanda:9092,external://localhost:19092
      - --pandaproxy-addr internal://0.0.0.0:8082,external://0.0.0.0:18082
      - --advertise-pandaproxy-addr internal://redpanda:8082,external://localhost:18082
      - --schema-registry-addr internal://0.0.0.0:8081,external://0.0.0.0:18081
      - --rpc-addr redpanda:33145
      - --advertise-rpc-addr redpanda:33145
      - --mode dev-container
      - --smp 1
      - --default-log-level=info
    volumes:
      - huly-redpanda:/var/lib/redpanda/data
    environment:
      - REDPANDA_SUPERUSER_USERNAME=superadmin
      - REDPANDA_SUPERUSER_PASSWORD=$SERVICE_PASSWORD_REDPANDA
    healthcheck:
      test:
        - CMD
        - rpk
        - cluster
        - info
        - -X
        - user=superadmin
        - -X
        - pass=$SERVICE_PASSWORD_REDPANDA
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  minio:
    image: minio/minio
    command: server /data --address ":9000" --console-address ":9001"
    volumes:
      - huly-files:/data
    environment:
      - MINIO_ROOT_USER=$SERVICE_USER_MINIO
      - MINIO_ROOT_PASSWORD=$SERVICE_PASSWORD_MINIO
    healthcheck:
      test:
        - CMD
        - mc
        - ready
        - local
      interval: 5s
      retries: 10
    restart: unless-stopped

  elastic:
    image: elasticsearch:7.14.2
    command: |
      /bin/sh -c "./bin/elasticsearch-plugin list | grep -q ingest-attachment || yes | ./bin/elasticsearch-plugin install --silent ingest-attachment;
      /usr/local/bin/docker-entrypoint.sh eswrapper"
    volumes:
      - huly-elastic:/usr/share/elasticsearch/data
    environment:
      - ELASTICSEARCH_PORT_NUMBER=9200
      - discovery.type=single-node
      - ES_JAVA_OPTS=-Xms1024m -Xmx1024m
      - http.cors.enabled=true
      - http.cors.allow-origin=https://$SERVICE_FQDN_HULY
    healthcheck:
      interval: 20s
      retries: 10
      test: curl -s http://localhost:9200/_cluster/health | grep -vq '"status":"red"'
    restart: unless-stopped

  rekoni:
    image: hardcoreeng/rekoni-service:v0.7.426
    environment:
      - SECRET=$SERVICE_PASSWORD_64_SECRET
    deploy:
      resources:
        limits:
          memory: 500M
    restart: unless-stopped

  transactor:
    image: hardcoreeng/transactor:v0.7.426
    environment:
      - SERVER_PORT=3333
      - SERVER_SECRET=$SERVICE_PASSWORD_64_SECRET
      - DB_URL=postgres://selfhost:$SERVICE_PASSWORD_COCKROACH@cockroach:26257/defaultdb
      - STORAGE_CONFIG=minio|minio?accessKey=$SERVICE_USER_MINIO&secretKey=$SERVICE_PASSWORD_MINIO
      - FRONT_URL=https://$SERVICE_FQDN_HULY
      - ACCOUNTS_URL=http://account:3000
      - FULLTEXT_URL=http://fulltext:4700
      - STATS_URL=http://stats:4900
      - LAST_NAME_FIRST=${LAST_NAME_FIRST:-true}
      - QUEUE_CONFIG=redpanda:9092
    depends_on:
      - cockroach
      - redpanda
      - minio
    restart: unless-stopped

  collaborator:
    image: hardcoreeng/collaborator:v0.7.426
    environment:
      - COLLABORATOR_PORT=3078
      - SECRET=$SERVICE_PASSWORD_64_SECRET
      - ACCOUNTS_URL=http://account:3000
      - STATS_URL=http://stats:4900
      - STORAGE_CONFIG=minio|minio?accessKey=$SERVICE_USER_MINIO&secretKey=$SERVICE_PASSWORD_MINIO
    restart: unless-stopped

  account:
    image: hardcoreeng/account:v0.7.426
    environment:
      - SERVER_PORT=3000
      - SERVER_SECRET=$SERVICE_PASSWORD_64_SECRET
      - DB_URL=postgres://selfhost:$SERVICE_PASSWORD_COCKROACH@cockroach:26257/defaultdb
      - TRANSACTOR_URL=ws://transactor:3333;wss://$SERVICE_FQDN_HULY/_transactor
      - STORAGE_CONFIG=minio|minio?accessKey=$SERVICE_USER_MINIO&secretKey=$SERVICE_PASSWORD_MINIO
      - FRONT_URL=https://$SERVICE_FQDN_HULY
      - STATS_URL=https://$SERVICE_FQDN_HULY/_stats
      - MODEL_ENABLED=*
      - ACCOUNTS_URL=https://$SERVICE_FQDN_HULY/_accounts
      - ACCOUNT_PORT=3000
      - QUEUE_CONFIG=redpanda:9092
    depends_on:
      - cockroach
      - transactor
    restart: unless-stopped

  workspace:
    image: hardcoreeng/workspace:v0.7.426
    environment:
      - SERVER_SECRET=$SERVICE_PASSWORD_64_SECRET
      - DB_URL=postgres://selfhost:$SERVICE_PASSWORD_COCKROACH@cockroach:26257/defaultdb
      - TRANSACTOR_URL=ws://transactor:3333;wss://$SERVICE_FQDN_HULY/_transactor
      - STORAGE_CONFIG=minio|minio?accessKey=$SERVICE_USER_MINIO&secretKey=$SERVICE_PASSWORD_MINIO
      - MODEL_ENABLED=*
      - ACCOUNTS_URL=http://account:3000
      - STATS_URL=http://stats:4900
      - QUEUE_CONFIG=redpanda:9092
      - ACCOUNTS_DB_URL=postgres://selfhost:$SERVICE_PASSWORD_COCKROACH@cockroach:26257/defaultdb
    depends_on:
      - cockroach
      - transactor
      - account
    restart: unless-stopped

  front:
    image: hardcoreeng/front:v0.7.426
    environment:
      - SERVER_PORT=8080
      - SERVER_SECRET=$SERVICE_PASSWORD_64_SECRET
      - LOVE_ENDPOINT=https://$SERVICE_FQDN_HULY/_love
      - ACCOUNTS_URL=https://$SERVICE_FQDN_HULY/_accounts
      - ACCOUNTS_URL_INTERNAL=http://account:3000
      - REKONI_URL=https://$SERVICE_FQDN_HULY/_rekoni
      - CALENDAR_URL=https://$SERVICE_FQDN_HULY/_calendar
      - GMAIL_URL=https://$SERVICE_FQDN_HULY/_gmail
      - TELEGRAM_URL=https://$SERVICE_FQDN_HULY/_telegram
      - STATS_URL=https://$SERVICE_FQDN_HULY/_stats
      - UPLOAD_URL=/files
      - ELASTIC_URL=http://elastic:9200
      - COLLABORATOR_URL=wss://$SERVICE_FQDN_HULY/_collaborator
      - STORAGE_CONFIG=minio|minio?accessKey=$SERVICE_USER_MINIO&secretKey=$SERVICE_PASSWORD_MINIO
      - TITLE=${TITLE:-Huly}
      - DEFAULT_LANGUAGE=${DEFAULT_LANGUAGE:-en}
      - LAST_NAME_FIRST=${LAST_NAME_FIRST:-true}
      - DESKTOP_UPDATES_CHANNEL=0.7.426
      - DISABLED_FEATURES=auto-translate,mailboxes
    depends_on:
      - account
      - transactor
      - elastic
    restart: unless-stopped

  fulltext:
    image: hardcoreeng/fulltext:v0.7.426
    environment:
      - SERVER_SECRET=$SERVICE_PASSWORD_64_SECRET
      - DB_URL=postgres://selfhost:$SERVICE_PASSWORD_COCKROACH@cockroach:26257/defaultdb
      - FULLTEXT_DB_URL=http://elastic:9200
      - ELASTIC_INDEX_NAME=huly_storage_index
      - STORAGE_CONFIG=minio|minio?accessKey=$SERVICE_USER_MINIO&secretKey=$SERVICE_PASSWORD_MINIO
      - REKONI_URL=http://rekoni:4004
      - ACCOUNTS_URL=http://account:3000
      - STATS_URL=http://stats:4900
      - QUEUE_CONFIG=redpanda:9092
    depends_on:
      - cockroach
      - elastic
      - rekoni
    restart: unless-stopped

  stats:
    image: hardcoreeng/stats:v0.7.426
    environment:
      - PORT=4900
      - SERVER_SECRET=$SERVICE_PASSWORD_64_SECRET
    restart: unless-stopped

  kvs:
    image: hardcoreeng/hulykvs:v0.7.426
    depends_on:
      cockroach:
        condition: service_started
    environment:
      - HULY_DB_CONNECTION=postgres://selfhost:$SERVICE_PASSWORD_COCKROACH@cockroach:26257/defaultdb
      - HULY_TOKEN_SECRET=$SERVICE_PASSWORD_64_SECRET
    restart: unless-stopped
