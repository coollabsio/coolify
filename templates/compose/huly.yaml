# documentation: https://github.com/hcengineering/huly-selfhost
# category: project-management
# slogan: Open-source all-in-one project management and collaboration platform
# tags: project-management, linear, jira, slack, notion, crm, collaboration
# port: 8080

services:
  front:
    image: "hardcoreeng/front:${HULY_VERSION:-v0.7.423}"
    environment:
      - SERVICE_URL_HULY_8080
      - SERVER_PORT=8080
      - SERVER_SECRET=${SERVICE_PASSWORD_HULYSECRET}
      - LOVE_ENDPOINT=${LOVE_ENDPOINT}
      - ACCOUNTS_URL=${SERVICE_URL_ACCOUNT}
      - ACCOUNTS_URL_INTERNAL=http://account:3000
      - REKONI_URL=${SERVICE_URL_REKONI}
      - CALENDAR_URL=${CALENDAR_URL}
      - GMAIL_URL=${GMAIL_URL}
      - TELEGRAM_URL=${TELEGRAM_URL}
      - STATS_URL=${SERVICE_URL_STATS}
      - UPLOAD_URL=${SERVICE_URL_MINIO}
      - ELASTIC_URL=http://elastic:9200
      - COLLABORATOR_URL=wss://${SERVICE_FQDN_COLLABORATOR}
      - COLLABORATOR_API_URL=${SERVICE_URL_COLLABORATOR}
      - STORAGE_CONFIG=minio|minio?accessKey=${SERVICE_USER_MINIO}&secretKey=${SERVICE_PASSWORD_MINIO}
      - TITLE=${HULY_TITLE:-Huly Self Host}
      - DEFAULT_LANGUAGE=${DEFAULT_LANGUAGE:-en}
      - LAST_NAME_FIRST=${LAST_NAME_FIRST:-true}
      - DESKTOP_UPDATES_CHANNEL=${DESKTOP_CHANNEL}
      - DISABLED_FEATURES=${DISABLED_FEATURES:-auto-translate,mailboxes}
    depends_on:
      account:
        condition: service_started
      collaborator:
        condition: service_started
      elastic:
        condition: service_healthy
      minio:
        condition: service_healthy
      transactor:
        condition: service_started
    restart: unless-stopped

  account:
    image: "hardcoreeng/account:${HULY_VERSION:-v0.7.423}"
    environment:
      - SERVICE_URL_ACCOUNT_3000
      - SERVER_PORT=3000
      - SERVER_SECRET=${SERVICE_PASSWORD_HULYSECRET}
      - DB_URL=postgresql://${SERVICE_USER_COCKROACH}:${SERVICE_PASSWORD_COCKROACH}@cockroach:26257/${COCKROACH_DATABASE:-huly}?sslmode=disable
      - TRANSACTOR_URL=ws://transactor:3333;wss://${SERVICE_FQDN_TRANSACTOR}
      - STORAGE_CONFIG=minio|minio?accessKey=${SERVICE_USER_MINIO}&secretKey=${SERVICE_PASSWORD_MINIO}
      - FRONT_URL=${SERVICE_URL_HULY}
      - STATS_URL=${SERVICE_URL_STATS}
      - MODEL_ENABLED=*
      - ACCOUNTS_URL=${SERVICE_URL_ACCOUNT}
      - ACCOUNT_PORT=3000
      - QUEUE_CONFIG=redpanda:9092
    depends_on:
      cockroach:
        condition: service_started
      minio:
        condition: service_healthy
      redpanda:
        condition: service_healthy
    restart: unless-stopped

  workspace:
    image: "hardcoreeng/workspace:${HULY_VERSION:-v0.7.423}"
    environment:
      - SERVER_SECRET=${SERVICE_PASSWORD_HULYSECRET}
      - DB_URL=postgresql://${SERVICE_USER_COCKROACH}:${SERVICE_PASSWORD_COCKROACH}@cockroach:26257/${COCKROACH_DATABASE:-huly}?sslmode=disable
      - TRANSACTOR_URL=ws://transactor:3333;wss://${SERVICE_FQDN_TRANSACTOR}
      - STORAGE_CONFIG=minio|minio?accessKey=${SERVICE_USER_MINIO}&secretKey=${SERVICE_PASSWORD_MINIO}
      - MODEL_ENABLED=*
      - ACCOUNTS_URL=http://account:3000
      - STATS_URL=http://stats:4900
      - QUEUE_CONFIG=redpanda:9092
      - ACCOUNTS_DB_URL=postgresql://${SERVICE_USER_COCKROACH}:${SERVICE_PASSWORD_COCKROACH}@cockroach:26257/${COCKROACH_DATABASE:-huly}?sslmode=disable
    depends_on:
      cockroach:
        condition: service_started
      redpanda:
        condition: service_healthy
    restart: unless-stopped

  transactor:
    image: "hardcoreeng/transactor:${HULY_VERSION:-v0.7.423}"
    environment:
      - SERVICE_URL_TRANSACTOR_3333
      - SERVER_PORT=3333
      - SERVER_SECRET=${SERVICE_PASSWORD_HULYSECRET}
      - DB_URL=postgresql://${SERVICE_USER_COCKROACH}:${SERVICE_PASSWORD_COCKROACH}@cockroach:26257/${COCKROACH_DATABASE:-huly}?sslmode=disable
      - STORAGE_CONFIG=minio|minio?accessKey=${SERVICE_USER_MINIO}&secretKey=${SERVICE_PASSWORD_MINIO}
      - FRONT_URL=${SERVICE_URL_HULY}
      - ACCOUNTS_URL=http://account:3000
      - FULLTEXT_URL=http://fulltext:4700
      - STATS_URL=http://stats:4900
      - LAST_NAME_FIRST=${LAST_NAME_FIRST:-true}
      - QUEUE_CONFIG=redpanda:9092
    depends_on:
      cockroach:
        condition: service_started
      redpanda:
        condition: service_healthy
    restart: unless-stopped

  collaborator:
    image: "hardcoreeng/collaborator:${HULY_VERSION:-v0.7.423}"
    environment:
      - SERVICE_URL_COLLABORATOR_3078
      - COLLABORATOR_PORT=3078
      - SECRET=${SERVICE_PASSWORD_HULYSECRET}
      - ACCOUNTS_URL=http://account:3000
      - STATS_URL=http://stats:4900
      - STORAGE_CONFIG=minio|minio?accessKey=${SERVICE_USER_MINIO}&secretKey=${SERVICE_PASSWORD_MINIO}
    restart: unless-stopped

  fulltext:
    image: "hardcoreeng/fulltext:${HULY_VERSION:-v0.7.423}"
    environment:
      - SERVER_SECRET=${SERVICE_PASSWORD_HULYSECRET}
      - DB_URL=postgresql://${SERVICE_USER_COCKROACH}:${SERVICE_PASSWORD_COCKROACH}@cockroach:26257/${COCKROACH_DATABASE:-huly}?sslmode=disable
      - FULLTEXT_DB_URL=http://elastic:9200
      - ELASTIC_INDEX_NAME=huly_storage_index
      - STORAGE_CONFIG=minio|minio?accessKey=${SERVICE_USER_MINIO}&secretKey=${SERVICE_PASSWORD_MINIO}
      - REKONI_URL=http://rekoni:4004
      - ACCOUNTS_URL=http://account:3000
      - STATS_URL=http://stats:4900
      - QUEUE_CONFIG=redpanda:9092
    depends_on:
      elastic:
        condition: service_healthy
      redpanda:
        condition: service_healthy
    restart: unless-stopped

  stats:
    image: "hardcoreeng/stats:${HULY_VERSION:-v0.7.423}"
    environment:
      - SERVICE_URL_STATS_4900
      - PORT=4900
      - SERVER_SECRET=${SERVICE_PASSWORD_HULYSECRET}
    restart: unless-stopped

  kvs:
    image: "hardcoreeng/hulykvs:${HULY_VERSION:-v0.7.423}"
    environment:
      - HULY_DB_CONNECTION=postgresql://${SERVICE_USER_COCKROACH}:${SERVICE_PASSWORD_COCKROACH}@cockroach:26257/${COCKROACH_DATABASE:-huly}?sslmode=disable
      - HULY_TOKEN_SECRET=${SERVICE_PASSWORD_HULYSECRET}
    depends_on:
      cockroach:
        condition: service_started
    restart: unless-stopped

  rekoni:
    image: "hardcoreeng/rekoni-service:${HULY_VERSION:-v0.7.423}"
    environment:
      - SERVICE_URL_REKONI_4004
      - SECRET=${SERVICE_PASSWORD_HULYSECRET}
    deploy:
      resources:
        limits:
          memory: 500M
    restart: unless-stopped

  cockroach:
    image: cockroachdb/cockroach:latest-v24.2
    command: start-single-node --accept-sql-without-tls
    environment:
      - COCKROACH_DATABASE=${COCKROACH_DATABASE:-huly}
      - COCKROACH_USER=${SERVICE_USER_COCKROACH}
      - COCKROACH_PASSWORD=${SERVICE_PASSWORD_COCKROACH}
    volumes:
      - cockroach-data:/cockroach/cockroach-data
      - cockroach-certs:/cockroach/certs
    restart: unless-stopped

  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v24.3.6
    command:
      - redpanda
      - start
      - --kafka-addr
      - internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr
      - internal://redpanda:9092,external://localhost:19092
      - --pandaproxy-addr
      - internal://0.0.0.0:8082,external://0.0.0.0:18082
      - --advertise-pandaproxy-addr
      - internal://redpanda:8082,external://localhost:18082
      - --schema-registry-addr
      - internal://0.0.0.0:8081,external://0.0.0.0:18081
      - --rpc-addr
      - redpanda:33145
      - --advertise-rpc-addr
      - redpanda:33145
      - --mode
      - dev-container
      - --smp
      - "1"
      - --default-log-level=info
    volumes:
      - redpanda-data:/var/lib/redpanda/data
    environment:
      - REDPANDA_SUPERUSER_USERNAME=${SERVICE_USER_REDPANDA}
      - REDPANDA_SUPERUSER_PASSWORD=${SERVICE_PASSWORD_REDPANDA}
    healthcheck:
      test:
        - CMD
        - rpk
        - cluster
        - info
        - -X
        - user=${SERVICE_USER_REDPANDA}
        - -X
        - pass=${SERVICE_PASSWORD_REDPANDA}
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --address ":9000" --console-address ":9001"
    environment:
      - SERVICE_URL_MINIO_9000
      - MINIO_ROOT_USER=${SERVICE_USER_MINIO}
      - MINIO_ROOT_PASSWORD=${SERVICE_PASSWORD_MINIO}
    volumes:
      - files-data:/data
    healthcheck:
      test:
        - CMD
        - mc
        - ready
        - local
      interval: 5s
      retries: 10
    restart: unless-stopped

  elastic:
    image: elasticsearch:7.14.2
    command: |
      /bin/sh -c "./bin/elasticsearch-plugin list | grep -q ingest-attachment || yes | ./bin/elasticsearch-plugin install --silent ingest-attachment;
      /usr/local/bin/docker-entrypoint.sh eswrapper"
    volumes:
      - elastic-data:/usr/share/elasticsearch/data
    environment:
      - ELASTICSEARCH_PORT_NUMBER=9200
      - BITNAMI_DEBUG=true
      - discovery.type=single-node
      - ES_JAVA_OPTS=-Xms1024m -Xmx1024m
      - http.cors.enabled=true
      - http.cors.allow-origin=${SERVICE_URL_HULY}
    healthcheck:
      test:
        - CMD-SHELL
        - curl -s http://127.0.0.1:9200/_cluster/health | grep -vq '"status":"red"'
      interval: 20s
      retries: 10
    restart: unless-stopped

volumes:
  cockroach-data:
  cockroach-certs:
  redpanda-data:
  files-data:
  elastic-data:
