# documentation: https://github.com/hcengineering/huly-selfhost
# slogan: Open-source all-in-one project management platform.
# category: productivity
# tags: huly,linear,jira,slack,notion,motion,project-management,collaboration,workspace
# logo: svgs/huly.svg
# port: 80

services:
  huly:
    image: nginx:1.29.2
    environment:
      - SERVICE_URL_HULY_80
    volumes:
      - type: bind
        source: ./nginx/huly.conf
        target: /etc/nginx/conf.d/default.conf
        read_only: true
        content: |
          server {
              listen 80;
              server_name _;
              client_max_body_size 100M;
              resolver 127.0.0.11 valid=10s;

              set $front_backend "http://front:8080";
              set $account_backend "http://account:3000";
              set $collaborator_backend "http://collaborator:3078";
              set $transactor_backend "http://transactor:3333";
              set $rekoni_backend "http://rekoni:4004";
              set $stats_backend "http://stats:4900";

              location / {
                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto $scheme;
                  proxy_pass $front_backend;
              }

              location /_accounts {
                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto $scheme;
                  rewrite ^/_accounts/?(.*)$ /$1 break;
                  proxy_pass $account_backend;
              }

              location /_collaborator {
                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto $scheme;
                  proxy_http_version 1.1;
                  proxy_set_header Upgrade $http_upgrade;
                  proxy_set_header Connection "upgrade";
                  rewrite ^/_collaborator/?(.*)$ /$1 break;
                  proxy_pass $collaborator_backend;
              }

              location /_transactor {
                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto $scheme;
                  proxy_http_version 1.1;
                  proxy_set_header Upgrade $http_upgrade;
                  proxy_set_header Connection "upgrade";
                  rewrite ^/_transactor/?(.*)$ /$1 break;
                  proxy_pass $transactor_backend;
              }

              location ~ ^/eyJ {
                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto $scheme;
                  proxy_http_version 1.1;
                  proxy_set_header Upgrade $http_upgrade;
                  proxy_set_header Connection "upgrade";
                  proxy_pass $transactor_backend;
              }

              location /_rekoni {
                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto $scheme;
                  rewrite ^/_rekoni/?(.*)$ /$1 break;
                  proxy_pass $rekoni_backend;
              }

              location /_stats {
                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto $scheme;
                  rewrite ^/_stats/?(.*)$ /$1 break;
                  proxy_pass $stats_backend;
              }

              location /health {
                  access_log off;
                  add_header Content-Type text/plain;
                  return 200 "healthy\n";
              }
          }
    depends_on:
      front:
        condition: service_started
      account:
        condition: service_started
      transactor:
        condition: service_started
      collaborator:
        condition: service_started
      rekoni:
        condition: service_started
      stats:
        condition: service_started
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 5s
      timeout: 10s
      retries: 10

  cockroach:
    image: cockroachdb/cockroach:latest-v24.2
    command: start-single-node --accept-sql-without-tls
    environment:
      - COCKROACH_DATABASE=${COCKROACH_DATABASE:-defaultdb}
      - COCKROACH_USER=${SERVICE_USER_COCKROACH}
      - COCKROACH_PASSWORD=${SERVICE_PASSWORD_COCKROACH}
    volumes:
      - cockroach-data:/cockroach/cockroach-data
      - cockroach-certs:/cockroach/certs
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "cockroach sql --url \"postgresql://$${COCKROACH_USER}:$${COCKROACH_PASSWORD}@localhost:26257/$${COCKROACH_DATABASE}?sslmode=disable\" --execute='select 1' >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 10

  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v24.3.6
    command:
      - redpanda
      - start
      - --kafka-addr
      - internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr
      - internal://redpanda:9092,external://localhost:19092
      - --pandaproxy-addr
      - internal://0.0.0.0:8082,external://0.0.0.0:18082
      - --advertise-pandaproxy-addr
      - internal://redpanda:8082,external://localhost:18082
      - --schema-registry-addr
      - internal://0.0.0.0:8081,external://0.0.0.0:18081
      - --rpc-addr
      - redpanda:33145
      - --advertise-rpc-addr
      - redpanda:33145
      - --mode
      - dev-container
      - --smp
      - "1"
      - --default-log-level=info
    environment:
      - REDPANDA_SUPERUSER_USERNAME=${SERVICE_USER_REDPANDA}
      - REDPANDA_SUPERUSER_PASSWORD=${SERVICE_PASSWORD_REDPANDA}
    volumes:
      - redpanda-data:/var/lib/redpanda/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster info >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    image: ghcr.io/coollabsio/minio:RELEASE.2025-10-15T17-29-55Z
    command: server /data --address ":9000" --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=${SERVICE_USER_MINIO}
      - MINIO_ROOT_PASSWORD=${SERVICE_PASSWORD_MINIO}
    volumes:
      - huly-files:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 20s
      retries: 10

  elastic:
    image: elasticsearch:7.14.2
    command: |
      /bin/sh -c "./bin/elasticsearch-plugin list | grep -q ingest-attachment || yes | ./bin/elasticsearch-plugin install --silent ingest-attachment;
      /usr/local/bin/docker-entrypoint.sh eswrapper"
    environment:
      - ELASTICSEARCH_PORT_NUMBER=9200
      - BITNAMI_DEBUG=true
      - discovery.type=single-node
      - ES_JAVA_OPTS=-Xms1024m -Xmx1024m
      - http.cors.enabled=true
      - http.cors.allow-origin=http://localhost:8082
    volumes:
      - elastic-data:/usr/share/elasticsearch/data
    restart: unless-stopped
    healthcheck:
      test: curl -s http://localhost:9200/_cluster/health | grep -vq '"status":"red"'
      interval: 20s
      timeout: 5s
      retries: 10

  rekoni:
    image: hardcoreeng/rekoni-service:${HULY_VERSION:-v0.7.423}
    environment:
      - SECRET=${SERVICE_PASSWORD_HULYSECRET}
    deploy:
      resources:
        limits:
          memory: 500M
    restart: unless-stopped

  transactor:
    image: hardcoreeng/transactor:${HULY_VERSION:-v0.7.423}
    environment:
      - SERVER_PORT=3333
      - SERVER_SECRET=${SERVICE_PASSWORD_HULYSECRET}
      - DB_URL=postgresql://${SERVICE_USER_COCKROACH}:${SERVICE_PASSWORD_COCKROACH}@cockroach:26257/${COCKROACH_DATABASE:-defaultdb}?sslmode=disable
      - STORAGE_CONFIG=minio|minio?accessKey=${SERVICE_USER_MINIO}&secretKey=${SERVICE_PASSWORD_MINIO}
      - FRONT_URL=${SERVICE_URL_HULY}
      - ACCOUNTS_URL=http://account:3000
      - FULLTEXT_URL=http://fulltext:4700
      - STATS_URL=http://stats:4900
      - LAST_NAME_FIRST=${LAST_NAME_FIRST:-true}
      - QUEUE_CONFIG=redpanda:9092
    depends_on:
      cockroach:
        condition: service_healthy
      redpanda:
        condition: service_healthy
      minio:
        condition: service_healthy
      elastic:
        condition: service_healthy
    restart: unless-stopped

  collaborator:
    image: hardcoreeng/collaborator:${HULY_VERSION:-v0.7.423}
    environment:
      - COLLABORATOR_PORT=3078
      - SECRET=${SERVICE_PASSWORD_HULYSECRET}
      - ACCOUNTS_URL=http://account:3000
      - STATS_URL=http://stats:4900
      - STORAGE_CONFIG=minio|minio?accessKey=${SERVICE_USER_MINIO}&secretKey=${SERVICE_PASSWORD_MINIO}
    depends_on:
      account:
        condition: service_started
      stats:
        condition: service_started
      minio:
        condition: service_healthy
    restart: unless-stopped

  account:
    image: hardcoreeng/account:${HULY_VERSION:-v0.7.423}
    environment:
      - SERVER_PORT=3000
      - SERVER_SECRET=${SERVICE_PASSWORD_HULYSECRET}
      - DB_URL=postgresql://${SERVICE_USER_COCKROACH}:${SERVICE_PASSWORD_COCKROACH}@cockroach:26257/${COCKROACH_DATABASE:-defaultdb}?sslmode=disable
      - TRANSACTOR_URL=ws://transactor:3333;${HULY_WS_PROTOCOL:-wss}://${SERVICE_FQDN_HULY}/_transactor
      - STORAGE_CONFIG=minio|minio?accessKey=${SERVICE_USER_MINIO}&secretKey=${SERVICE_PASSWORD_MINIO}
      - FRONT_URL=${SERVICE_URL_HULY}
      - STATS_URL=${SERVICE_URL_HULY}/_stats
      - MODEL_ENABLED=*
      - ACCOUNTS_URL=${SERVICE_URL_HULY}/_accounts
      - ACCOUNT_PORT=3000
      - QUEUE_CONFIG=redpanda:9092
    depends_on:
      cockroach:
        condition: service_healthy
      redpanda:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: unless-stopped

  workspace:
    image: hardcoreeng/workspace:${HULY_VERSION:-v0.7.423}
    environment:
      - SERVER_SECRET=${SERVICE_PASSWORD_HULYSECRET}
      - DB_URL=postgresql://${SERVICE_USER_COCKROACH}:${SERVICE_PASSWORD_COCKROACH}@cockroach:26257/${COCKROACH_DATABASE:-defaultdb}?sslmode=disable
      - TRANSACTOR_URL=ws://transactor:3333;${HULY_WS_PROTOCOL:-wss}://${SERVICE_FQDN_HULY}/_transactor
      - STORAGE_CONFIG=minio|minio?accessKey=${SERVICE_USER_MINIO}&secretKey=${SERVICE_PASSWORD_MINIO}
      - MODEL_ENABLED=*
      - ACCOUNTS_URL=http://account:3000
      - STATS_URL=http://stats:4900
      - QUEUE_CONFIG=redpanda:9092
      - ACCOUNTS_DB_URL=postgresql://${SERVICE_USER_COCKROACH}:${SERVICE_PASSWORD_COCKROACH}@cockroach:26257/${COCKROACH_DATABASE:-defaultdb}?sslmode=disable
      - INIT_REPO_DIR=${INIT_REPO_DIR:-/no-init-scripts}
    depends_on:
      cockroach:
        condition: service_healthy
      redpanda:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: unless-stopped

  front:
    image: hardcoreeng/front:${HULY_VERSION:-v0.7.423}
    environment:
      - SERVER_PORT=8080
      - SERVER_SECRET=${SERVICE_PASSWORD_HULYSECRET}
      - LOVE_ENDPOINT=${SERVICE_URL_HULY}/_love
      - ACCOUNTS_URL=${SERVICE_URL_HULY}/_accounts
      - ACCOUNTS_URL_INTERNAL=http://account:3000
      - REKONI_URL=${SERVICE_URL_HULY}/_rekoni
      - CALENDAR_URL=${SERVICE_URL_HULY}/_calendar
      - GMAIL_URL=${SERVICE_URL_HULY}/_gmail
      - TELEGRAM_URL=${SERVICE_URL_HULY}/_telegram
      - STATS_URL=${SERVICE_URL_HULY}/_stats
      - UPLOAD_URL=/files
      - ELASTIC_URL=http://elastic:9200
      - COLLABORATOR_URL=${HULY_WS_PROTOCOL:-wss}://${SERVICE_FQDN_HULY}/_collaborator
      - STORAGE_CONFIG=minio|minio?accessKey=${SERVICE_USER_MINIO}&secretKey=${SERVICE_PASSWORD_MINIO}
      - TITLE=${TITLE:-Huly Self Host}
      - DEFAULT_LANGUAGE=${DEFAULT_LANGUAGE:-en}
      - LAST_NAME_FIRST=${LAST_NAME_FIRST:-true}
      - DESKTOP_UPDATES_CHANNEL=${DESKTOP_CHANNEL:-0.7.423}
      - DISABLED_FEATURES=${DISABLED_FEATURES:-auto-translate,mailboxes}
      - DISABLE_SIGNUP=${DISABLE_SIGNUP:-false}
    depends_on:
      account:
        condition: service_started
      transactor:
        condition: service_started
      collaborator:
        condition: service_started
      elastic:
        condition: service_healthy
    restart: unless-stopped

  fulltext:
    image: hardcoreeng/fulltext:${HULY_VERSION:-v0.7.423}
    environment:
      - SERVER_SECRET=${SERVICE_PASSWORD_HULYSECRET}
      - DB_URL=postgresql://${SERVICE_USER_COCKROACH}:${SERVICE_PASSWORD_COCKROACH}@cockroach:26257/${COCKROACH_DATABASE:-defaultdb}?sslmode=disable
      - FULLTEXT_DB_URL=http://elastic:9200
      - ELASTIC_INDEX_NAME=huly_storage_index
      - STORAGE_CONFIG=minio|minio?accessKey=${SERVICE_USER_MINIO}&secretKey=${SERVICE_PASSWORD_MINIO}
      - REKONI_URL=http://rekoni:4004
      - ACCOUNTS_URL=http://account:3000
      - STATS_URL=http://stats:4900
      - QUEUE_CONFIG=redpanda:9092
    depends_on:
      cockroach:
        condition: service_healthy
      redpanda:
        condition: service_healthy
      elastic:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: unless-stopped

  stats:
    image: hardcoreeng/stats:${HULY_VERSION:-v0.7.423}
    environment:
      - PORT=4900
      - SERVER_SECRET=${SERVICE_PASSWORD_HULYSECRET}
    restart: unless-stopped

  kvs:
    image: hardcoreeng/hulykvs:${HULY_VERSION:-v0.7.423}
    environment:
      - HULY_DB_CONNECTION=postgresql://${SERVICE_USER_COCKROACH}:${SERVICE_PASSWORD_COCKROACH}@cockroach:26257/${COCKROACH_DATABASE:-defaultdb}?sslmode=disable
      - HULY_TOKEN_SECRET=${SERVICE_PASSWORD_HULYSECRET}
    depends_on:
      cockroach:
        condition: service_healthy
    restart: unless-stopped

volumes:
  cockroach-data:
  cockroach-certs:
  redpanda-data:
  huly-files:
  elastic-data:
