# documentation: https://github.com/hcengineering/huly-selfhost
# slogan: Open source all-in-one project management platform (issues, docs, chat, video) - an alternative to Linear, Jira, Slack and Notion.
# category: productivity
# tags: huly,project,management,issues,tracker,chat,linear,jira,slack,notion
# logo: svgs/huly.svg
# port: 80

services:
  huly:
    image: nginx:1.27-alpine
    environment:
      - SERVICE_URL_HULY
    volumes:
      - type: bind
        source: ./nginx/default.conf
        target: /etc/nginx/conf.d/default.conf
        read_only: true
        content: |
          server {
              listen 80;
              server_name _;
              client_max_body_size 100M;

              location / {
                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto $scheme;
                  proxy_pass http://front:8080;
              }

              location /_accounts {
                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto $scheme;
                  rewrite ^/_accounts(/.*)$ $1 break;
                  proxy_pass http://account:3000/;
              }

              location /_collaborator {
                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto $scheme;
                  proxy_http_version 1.1;
                  proxy_set_header Upgrade $http_upgrade;
                  proxy_set_header Connection "upgrade";
                  rewrite ^/_collaborator(/.*)$ $1 break;
                  proxy_pass http://collaborator:3078/;
              }

              location /_transactor {
                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto $scheme;
                  proxy_http_version 1.1;
                  proxy_set_header Upgrade $http_upgrade;
                  proxy_set_header Connection "upgrade";
                  rewrite ^/_transactor(/.*)$ $1 break;
                  proxy_pass http://transactor:3333/;
              }

              location ~ ^/eyJ {
                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto $scheme;
                  proxy_http_version 1.1;
                  proxy_set_header Upgrade $http_upgrade;
                  proxy_set_header Connection "upgrade";
                  proxy_pass http://transactor:3333;
              }

              location /_rekoni {
                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto $scheme;
                  rewrite ^/_rekoni(/.*)$ $1 break;
                  proxy_pass http://rekoni:4004/;
              }

              location /_stats {
                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto $scheme;
                  rewrite ^/_stats(/.*)$ $1 break;
                  proxy_pass http://stats:4900/;
              }
          }
    depends_on:
      - front
      - account
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:80/"]
      interval: 10s
      timeout: 5s
      retries: 10

  cockroach:
    image: cockroachdb/cockroach:latest-v24.2
    command: start-single-node --accept-sql-without-tls
    environment:
      - COCKROACH_DATABASE=${COCKROACH_DATABASE:-defaultdb}
      - COCKROACH_USER=${SERVICE_USER_COCKROACH}
      - COCKROACH_PASSWORD=${SERVICE_PASSWORD_COCKROACH}
    volumes:
      - huly-cockroach-data:/cockroach/cockroach-data
      - huly-cockroach-certs:/cockroach/certs

  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v24.3.6
    command:
      - redpanda
      - start
      - --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr internal://redpanda:9092,external://localhost:19092
      - --pandaproxy-addr internal://0.0.0.0:8082,external://0.0.0.0:18082
      - --advertise-pandaproxy-addr internal://redpanda:8082,external://localhost:18082
      - --schema-registry-addr internal://0.0.0.0:8081,external://0.0.0.0:18081
      - --rpc-addr redpanda:33145
      - --advertise-rpc-addr redpanda:33145
      - --mode dev-container
      - --smp 1
      - --default-log-level=info
    volumes:
      - huly-redpanda:/var/lib/redpanda/data
    environment:
      - REDPANDA_SUPERUSER_USERNAME=${SERVICE_USER_REDPANDA}
      - REDPANDA_SUPERUSER_PASSWORD=${SERVICE_PASSWORD_REDPANDA}
    healthcheck:
      test: ["CMD", "rpk", "cluster", "health", "--exit-when-healthy"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    image: ghcr.io/coollabsio/minio:RELEASE.2025-10-15T17-29-55Z # Released on 15 October 2025
    command: server /data --address ":9000" --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=${SERVICE_USER_MINIO}
      - MINIO_ROOT_PASSWORD=${SERVICE_PASSWORD_MINIO}
    volumes:
      - huly-files:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 20s
      retries: 10

  elastic:
    image: elasticsearch:7.14.2
    command: |
      /bin/sh -c "./bin/elasticsearch-plugin list | grep -q ingest-attachment || yes | ./bin/elasticsearch-plugin install --silent ingest-attachment;
      /usr/local/bin/docker-entrypoint.sh eswrapper"
    volumes:
      - huly-elastic:/usr/share/elasticsearch/data
    environment:
      - ELASTICSEARCH_PORT_NUMBER=9200
      - BITNAMI_DEBUG=true
      - discovery.type=single-node
      - ES_JAVA_OPTS=-Xms1024m -Xmx1024m
      - http.cors.enabled=true
      - http.cors.allow-origin=http://localhost:8082
    healthcheck:
      test: curl -s http://127.0.0.1:9200/_cluster/health | grep -vq '"status":"red"'
      interval: 20s
      timeout: 5s
      retries: 10

  rekoni:
    image: hardcoreeng/rekoni-service:${HULY_VERSION:-v0.7.426}
    environment:
      - SECRET=${SERVICE_PASSWORD_64_SECRET}
    deploy:
      resources:
        limits:
          memory: 500M

  transactor:
    image: hardcoreeng/transactor:${HULY_VERSION:-v0.7.426}
    environment:
      - SERVER_PORT=3333
      - SERVER_SECRET=${SERVICE_PASSWORD_64_SECRET}
      - DB_URL=postgres://${SERVICE_USER_COCKROACH}:${SERVICE_PASSWORD_COCKROACH}@cockroach:26257/${COCKROACH_DATABASE:-defaultdb}
      - STORAGE_CONFIG=minio|minio?accessKey=${SERVICE_USER_MINIO}&secretKey=${SERVICE_PASSWORD_MINIO}
      - FRONT_URL=${SERVICE_URL_HULY}
      - ACCOUNTS_URL=http://account:3000
      - FULLTEXT_URL=http://fulltext:4700
      - STATS_URL=http://stats:4900
      - LAST_NAME_FIRST=${LAST_NAME_FIRST:-true}
      - QUEUE_CONFIG=redpanda:9092
    depends_on:
      - cockroach
      - redpanda
      - minio

  collaborator:
    image: hardcoreeng/collaborator:${HULY_VERSION:-v0.7.426}
    environment:
      - COLLABORATOR_PORT=3078
      - SECRET=${SERVICE_PASSWORD_64_SECRET}
      - ACCOUNTS_URL=http://account:3000
      - STATS_URL=http://stats:4900
      - STORAGE_CONFIG=minio|minio?accessKey=${SERVICE_USER_MINIO}&secretKey=${SERVICE_PASSWORD_MINIO}
    depends_on:
      - minio

  account:
    image: hardcoreeng/account:${HULY_VERSION:-v0.7.426}
    environment:
      - SERVER_PORT=3000
      - SERVER_SECRET=${SERVICE_PASSWORD_64_SECRET}
      - DB_URL=postgres://${SERVICE_USER_COCKROACH}:${SERVICE_PASSWORD_COCKROACH}@cockroach:26257/${COCKROACH_DATABASE:-defaultdb}
      - TRANSACTOR_URL=ws://transactor:3333;wss://${SERVICE_FQDN_HULY}/_transactor
      - STORAGE_CONFIG=minio|minio?accessKey=${SERVICE_USER_MINIO}&secretKey=${SERVICE_PASSWORD_MINIO}
      - FRONT_URL=${SERVICE_URL_HULY}
      - STATS_URL=${SERVICE_URL_HULY}/_stats
      - MODEL_ENABLED=*
      - ACCOUNTS_URL=${SERVICE_URL_HULY}/_accounts
      - ACCOUNT_PORT=3000
      - QUEUE_CONFIG=redpanda:9092
    depends_on:
      - cockroach
      - redpanda
      - minio

  workspace:
    image: hardcoreeng/workspace:${HULY_VERSION:-v0.7.426}
    environment:
      - SERVER_SECRET=${SERVICE_PASSWORD_64_SECRET}
      - DB_URL=postgres://${SERVICE_USER_COCKROACH}:${SERVICE_PASSWORD_COCKROACH}@cockroach:26257/${COCKROACH_DATABASE:-defaultdb}
      - TRANSACTOR_URL=ws://transactor:3333;wss://${SERVICE_FQDN_HULY}/_transactor
      - STORAGE_CONFIG=minio|minio?accessKey=${SERVICE_USER_MINIO}&secretKey=${SERVICE_PASSWORD_MINIO}
      - MODEL_ENABLED=*
      - ACCOUNTS_URL=http://account:3000
      - STATS_URL=http://stats:4900
      - QUEUE_CONFIG=redpanda:9092
      - ACCOUNTS_DB_URL=postgres://${SERVICE_USER_COCKROACH}:${SERVICE_PASSWORD_COCKROACH}@cockroach:26257/${COCKROACH_DATABASE:-defaultdb}
    depends_on:
      - cockroach
      - redpanda
      - minio

  front:
    image: hardcoreeng/front:${HULY_VERSION:-v0.7.426}
    environment:
      - SERVER_PORT=8080
      - SERVER_SECRET=${SERVICE_PASSWORD_64_SECRET}
      - LOVE_ENDPOINT=${SERVICE_URL_HULY}/_love
      - ACCOUNTS_URL=${SERVICE_URL_HULY}/_accounts
      - ACCOUNTS_URL_INTERNAL=http://account:3000
      - REKONI_URL=${SERVICE_URL_HULY}/_rekoni
      - CALENDAR_URL=${SERVICE_URL_HULY}/_calendar
      - GMAIL_URL=${SERVICE_URL_HULY}/_gmail
      - TELEGRAM_URL=${SERVICE_URL_HULY}/_telegram
      - STATS_URL=${SERVICE_URL_HULY}/_stats
      - UPLOAD_URL=/files
      - ELASTIC_URL=http://elastic:9200
      - COLLABORATOR_URL=wss://${SERVICE_FQDN_HULY}/_collaborator
      - STORAGE_CONFIG=minio|minio?accessKey=${SERVICE_USER_MINIO}&secretKey=${SERVICE_PASSWORD_MINIO}
      - TITLE=${TITLE:-Huly Self Host}
      - DEFAULT_LANGUAGE=${DEFAULT_LANGUAGE:-en}
      - LAST_NAME_FIRST=${LAST_NAME_FIRST:-true}
      - DESKTOP_UPDATES_CHANNEL=${DESKTOP_UPDATES_CHANNEL:-0.7.426}
      - DISABLED_FEATURES=auto-translate,mailboxes
    depends_on:
      - account
      - transactor
      - elastic
      - minio

  fulltext:
    image: hardcoreeng/fulltext:${HULY_VERSION:-v0.7.426}
    environment:
      - SERVER_SECRET=${SERVICE_PASSWORD_64_SECRET}
      - DB_URL=postgres://${SERVICE_USER_COCKROACH}:${SERVICE_PASSWORD_COCKROACH}@cockroach:26257/${COCKROACH_DATABASE:-defaultdb}
      - FULLTEXT_DB_URL=http://elastic:9200
      - ELASTIC_INDEX_NAME=huly_storage_index
      - STORAGE_CONFIG=minio|minio?accessKey=${SERVICE_USER_MINIO}&secretKey=${SERVICE_PASSWORD_MINIO}
      - REKONI_URL=http://rekoni:4004
      - ACCOUNTS_URL=http://account:3000
      - STATS_URL=http://stats:4900
      - QUEUE_CONFIG=redpanda:9092
    depends_on:
      - cockroach
      - redpanda
      - elastic
      - minio

  stats:
    image: hardcoreeng/stats:${HULY_VERSION:-v0.7.426}
    environment:
      - PORT=4900
      - SERVER_SECRET=${SERVICE_PASSWORD_64_SECRET}

  kvs:
    image: hardcoreeng/hulykvs:${HULY_VERSION:-v0.7.426}
    environment:
      - HULY_DB_CONNECTION=postgres://${SERVICE_USER_COCKROACH}:${SERVICE_PASSWORD_COCKROACH}@cockroach:26257/${COCKROACH_DATABASE:-defaultdb}
      - HULY_TOKEN_SECRET=${SERVICE_PASSWORD_64_SECRET}
    depends_on:
      - cockroach

volumes:
  huly-cockroach-data:
  huly-cockroach-certs:
  huly-redpanda:
  huly-files:
  huly-elastic:
