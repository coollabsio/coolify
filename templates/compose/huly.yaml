# documentation: https://huly.io/docs/host/getting-started
# slogan: Open-source project management platform - an alternative to Linear, Jira, Slack, and Notion.
# category: productivity
# tags: project-management, collaboration, tasks, issues, kanban, scrum, agile, open-source, huly
# logo: svgs/huly.svg
# port: 80

services:
  nginx:
    image: nginx:1.27
    volumes:
      - type: bind
        source: ./nginx/nginx.conf
        target: /etc/nginx/conf.d/default.conf
        read_only: true
        content: |
          server {
              listen 80;
              server_name _;
              client_max_body_size 100M;

              location / {
                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto $scheme;
                  proxy_pass http://front:8080;
              }

              location /_accounts {
                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto $scheme;
                  rewrite ^/_accounts(/.*)$ $1 break;
                  proxy_pass http://account:3000/;
              }

              location /_collaborator {
                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto $scheme;
                  proxy_http_version 1.1;
                  proxy_set_header Upgrade $http_upgrade;
                  proxy_set_header Connection "upgrade";
                  rewrite ^/_collaborator(/.*)$ $1 break;
                  proxy_pass http://collaborator:3078/;
              }

              location /_transactor {
                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto $scheme;
                  proxy_http_version 1.1;
                  proxy_set_header Upgrade $http_upgrade;
                  proxy_set_header Connection "upgrade";
                  rewrite ^/_transactor(/.*)$ $1 break;
                  proxy_pass http://transactor:3333/;
              }

              location ~ ^/eyJ {
                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto $scheme;
                  proxy_http_version 1.1;
                  proxy_set_header Upgrade $http_upgrade;
                  proxy_set_header Connection "upgrade";
                  proxy_pass http://transactor:3333;
              }

              location /_rekoni {
                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto $scheme;
                  rewrite ^/_rekoni(/.*)$ $1 break;
                  proxy_pass http://rekoni:4004/;
              }

              location /_stats {
                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto $scheme;
                  rewrite ^/_stats(/.*)$ $1 break;
                  proxy_pass http://stats:4900/;
              }

              location /health {
                  access_log off;
                  return 200 "healthy\n";
                  add_header Content-Type text/plain;
              }
          }
    environment:
      - SERVICE_URL_HULY
    depends_on:
      - front
      - account
      - collaborator
      - transactor
      - rekoni
      - stats
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  cockroach:
    image: cockroachdb/cockroach:latest-v24.2
    command: start-single-node --accept-sql-without-tls
    environment:
      - COCKROACH_DATABASE=${CR_DATABASE:-huly}
      - COCKROACH_USER=${SERVICE_USER_COCKROACH}
      - COCKROACH_PASSWORD=${SERVICE_PASSWORD_COCKROACH}
    volumes:
      - huly-cockroach-data:/cockroach/cockroach-data
      - huly-cockroach-certs:/cockroach/certs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health?ready=1"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v24.3.6
    command:
      - redpanda
      - start
      - --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr internal://redpanda:9092,external://localhost:19092
      - --pandaproxy-addr internal://0.0.0.0:8082,external://0.0.0.0:18082
      - --advertise-pandaproxy-addr internal://redpanda:8082,external://localhost:18082
      - --schema-registry-addr internal://0.0.0.0:8081,external://0.0.0.0:18081
      - --rpc-addr redpanda:33145
      - --advertise-rpc-addr redpanda:33145
      - --mode dev-container
      - --smp 1
      - --default-log-level=info
    volumes:
      - huly-redpanda:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD", "rpk", "cluster", "info"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  minio:
    image: minio/minio
    command: server /data --address ":9000" --console-address ":9001"
    volumes:
      - huly-minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  elastic:
    image: elasticsearch:7.14.2
    command: |
      /bin/sh -c "./bin/elasticsearch-plugin list | grep -q ingest-attachment || yes | ./bin/elasticsearch-plugin install --silent ingest-attachment;
      /usr/local/bin/docker-entrypoint.sh eswrapper"
    volumes:
      - huly-elastic-data:/usr/share/elasticsearch/data
    environment:
      - ELASTICSEARCH_PORT_NUMBER=9200
      - BITNAMI_DEBUG=true
      - discovery.type=single-node
      - ES_JAVA_OPTS=-Xms1024m -Xmx1024m
      - http.cors.enabled=true
      - http.cors.allow-origin=http://localhost:8082
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -vq '\"status\":\"red\"'"]
      interval: 20s
      timeout: 10s
      retries: 10
    restart: unless-stopped

  rekoni:
    image: hardcoreeng/rekoni-service:${HULY_VERSION:-v0.7.353}
    environment:
      - SECRET=$SERVICE_PASSWORD_64_HULY
    deploy:
      resources:
        limits:
          memory: 500M
    restart: unless-stopped

  transactor:
    image: hardcoreeng/transactor:${HULY_VERSION:-v0.7.353}
    environment:
      - SERVER_PORT=3333
      - SERVER_SECRET=$SERVICE_PASSWORD_64_HULY
      - DB_URL=postgres://${SERVICE_USER_COCKROACH}:${SERVICE_PASSWORD_COCKROACH}@cockroach:26257/${CR_DATABASE:-huly}
      - STORAGE_CONFIG=minio|minio?accessKey=minioadmin&secretKey=minioadmin
      - FRONT_URL=http://localhost:8087
      - ACCOUNTS_URL=http://account:3000
      - FULLTEXT_URL=http://fulltext:4700
      - STATS_URL=http://stats:4900
      - LAST_NAME_FIRST=${LAST_NAME_FIRST:-true}
      - QUEUE_CONFIG=redpanda:9092
    depends_on:
      cockroach:
        condition: service_healthy
      minio:
        condition: service_healthy
      redpanda:
        condition: service_healthy
    restart: unless-stopped

  collaborator:
    image: hardcoreeng/collaborator:${HULY_VERSION:-v0.7.353}
    environment:
      - COLLABORATOR_PORT=3078
      - SECRET=$SERVICE_PASSWORD_64_HULY
      - ACCOUNTS_URL=http://account:3000
      - STATS_URL=http://stats:4900
      - STORAGE_CONFIG=minio|minio?accessKey=minioadmin&secretKey=minioadmin
    restart: unless-stopped

  account:
    image: hardcoreeng/account:${HULY_VERSION:-v0.7.353}
    environment:
      - SERVER_PORT=3000
      - SERVER_SECRET=$SERVICE_PASSWORD_64_HULY
      - DB_URL=postgres://${SERVICE_USER_COCKROACH}:${SERVICE_PASSWORD_COCKROACH}@cockroach:26257/${CR_DATABASE:-huly}
      - TRANSACTOR_URL=ws://transactor:3333;wss://${SERVICE_URL_HULY}/_transactor
      - STORAGE_CONFIG=minio|minio?accessKey=minioadmin&secretKey=minioadmin
      - FRONT_URL=${SERVICE_URL_HULY}
      - STATS_URL=${SERVICE_URL_HULY}/_stats
      - MODEL_ENABLED=*
      - ACCOUNTS_URL=${SERVICE_URL_HULY}/_accounts
      - ACCOUNT_PORT=3000
      - QUEUE_CONFIG=redpanda:9092
    depends_on:
      cockroach:
        condition: service_healthy
    restart: unless-stopped

  workspace:
    exclude_from_hc: true
    image: hardcoreeng/workspace:${HULY_VERSION:-v0.7.353}
    environment:
      - SERVER_SECRET=$SERVICE_PASSWORD_64_HULY
      - DB_URL=postgres://${SERVICE_USER_COCKROACH}:${SERVICE_PASSWORD_COCKROACH}@cockroach:26257/${CR_DATABASE:-huly}
      - TRANSACTOR_URL=ws://transactor:3333;wss://${SERVICE_URL_HULY}/_transactor
      - STORAGE_CONFIG=minio|minio?accessKey=minioadmin&secretKey=minioadmin
      - MODEL_ENABLED=*
      - ACCOUNTS_URL=http://account:3000
      - STATS_URL=http://stats:4900
      - QUEUE_CONFIG=redpanda:9092
      - ACCOUNTS_DB_URL=postgres://${SERVICE_USER_COCKROACH}:${SERVICE_PASSWORD_COCKROACH}@cockroach:26257/${CR_DATABASE:-huly}
    depends_on:
      cockroach:
        condition: service_healthy
    restart: unless-stopped

  front:
    image: hardcoreeng/front:${HULY_VERSION:-v0.7.353}
    environment:
      - SERVER_PORT=8080
      - SERVER_SECRET=$SERVICE_PASSWORD_64_HULY
      - LOVE_ENDPOINT=${SERVICE_URL_HULY}/_love
      - ACCOUNTS_URL=${SERVICE_URL_HULY}/_accounts
      - ACCOUNTS_URL_INTERNAL=http://account:3000
      - REKONI_URL=${SERVICE_URL_HULY}/_rekoni
      - CALENDAR_URL=${SERVICE_URL_HULY}/_calendar
      - GMAIL_URL=${SERVICE_URL_HULY}/_gmail
      - TELEGRAM_URL=${SERVICE_URL_HULY}/_telegram
      - STATS_URL=${SERVICE_URL_HULY}/_stats
      - UPLOAD_URL=/files
      - ELASTIC_URL=http://elastic:9200
      - COLLABORATOR_URL=wss://${SERVICE_URL_HULY}/_collaborator
      - STORAGE_CONFIG=minio|minio?accessKey=minioadmin&secretKey=minioadmin
      - TITLE=${TITLE:-Huly Self Host}
      - DEFAULT_LANGUAGE=${DEFAULT_LANGUAGE:-en}
      - LAST_NAME_FIRST=${LAST_NAME_FIRST:-true}
    depends_on:
      elastic:
        condition: service_healthy
    restart: unless-stopped

  fulltext:
    image: hardcoreeng/fulltext:${HULY_VERSION:-v0.7.353}
    environment:
      - SERVER_SECRET=$SERVICE_PASSWORD_64_HULY
      - DB_URL=postgres://${SERVICE_USER_COCKROACH}:${SERVICE_PASSWORD_COCKROACH}@cockroach:26257/${CR_DATABASE:-huly}
      - FULLTEXT_DB_URL=http://elastic:9200
      - ELASTIC_INDEX_NAME=huly_storage_index
      - STORAGE_CONFIG=minio|minio?accessKey=minioadmin&secretKey=minioadmin
      - REKONI_URL=http://rekoni:4004
      - ACCOUNTS_URL=http://account:3000
      - STATS_URL=http://stats:4900
      - QUEUE_CONFIG=redpanda:9092
    depends_on:
      elastic:
        condition: service_healthy
      cockroach:
        condition: service_healthy
    restart: unless-stopped

  stats:
    image: hardcoreeng/stats:${HULY_VERSION:-v0.7.353}
    environment:
      - PORT=4900
      - SERVER_SECRET=$SERVICE_PASSWORD_64_HULY
    restart: unless-stopped
