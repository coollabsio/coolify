# documentation: https://docs.huly.io/getting-started/self-hosting
# category: productivity
# slogan: Open Source All-in-One Project Management Platform
# tags: linear,jira,slack,project,management,notion,motion
# logo: svgs/huly.svg
# port: 80

services:
  huly:
    image: "nginx:1.29.1"
    environment:
      - SERVICE_URL_HULY
    volumes:
      - type: bind
        source: ./huly.nginx
        target: /etc/nginx/conf.d/default.conf
        read_only: true
        content: |
          server {
              listen 80;
              server_name _;
              client_max_body_size 100M;

              location / {
                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto $scheme;
                  proxy_pass http://front:8080;
              }

              location /_accounts {
                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto $scheme;
                  rewrite ^/_accounts(/.*)$ $1 break;
                  proxy_pass http://account:3000/;
              }

              location /_collaborator {
                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto $scheme;
                  proxy_http_version 1.1;
                  proxy_set_header Upgrade $http_upgrade;
                  proxy_set_header Connection "upgrade";
                  rewrite ^/_collaborator(/.*)$ $1 break;
                  proxy_pass http://collaborator:3078/;
              }

              location /_transactor {
                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto $scheme;
                  proxy_http_version 1.1;
                  proxy_set_header Upgrade $http_upgrade;
                  proxy_set_header Connection "upgrade";
                  rewrite ^/_transactor(/.*)$ $1 break;
                  proxy_pass http://transactor:3333/;
              }

              location ~ ^/eyJ {
                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto $scheme;
                  proxy_http_version 1.1;
                  proxy_set_header Upgrade $http_upgrade;
                  proxy_set_header Connection "upgrade";
                  proxy_pass http://transactor:3333;
              }

              location /_rekoni {
                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto $scheme;
                  rewrite ^/_rekoni(/.*)$ $1 break;
                  proxy_pass http://rekoni:4004/;
              }

              location /_stats {
                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto $scheme;
                  rewrite ^/_stats(/.*)$ $1 break;
                  proxy_pass http://stats:4900/;
              }
          }
    restart: unless-stopped
  cockroach:
    image: "cockroachdb/cockroach:latest-v24.2"
    command: start-single-node --accept-sql-without-tls
    environment:
      - COCKROACH_DATABASE=crdb
      - 'COCKROACH_USER=${SERVICE_USER_COCKROACH}'
      - 'COCKROACH_PASSWORD=${SERVICE_PASSWORD_COCKROACH}'
    volumes:
      - cr_data:/cockroach/cockroach-data
      - cr_certs:/cockroach/certs
    restart: unless-stopped
  redpanda:
    image: "docker.redpanda.com/redpandadata/redpanda:v24.3.6"
    command:
      - redpanda
      - start
      - --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr internal://redpanda:9092,external://localhost:19092
      - --pandaproxy-addr internal://0.0.0.0:8082,external://0.0.0.0:18082
      - --advertise-pandaproxy-addr internal://redpanda:8082,external://localhost:18082
      - --schema-registry-addr internal://0.0.0.0:8081,external://0.0.0.0:18081
      - --rpc-addr redpanda:33145
      - --advertise-rpc-addr redpanda:33145
      - --mode dev-container
      - --smp 1
      - --default-log-level=info
    volumes:
      - redpanda:/var/lib/redpanda/data
    environment:
      - 'REDPANDA_SUPERUSER_USERNAME=${SERVICE_USER_REDPANDA}'
      - 'REDPANDA_SUPERUSER_PASSWORD=${SERVICE_PASSWORD_REDPANDA}'
    healthcheck:
      test: ['CMD', 'rpk', 'cluster', 'info', '-X', 'user=${SERVICE_USER_REDPANDA}', '-X', 'pass=${SERVICE_PASSWORD_REDPANDA}']
      interval: 10s
      timeout: 5s
      retries: 10
  minio:
    image: "minio/minio"
    command: server /data --address ":9000" --console-address ":9001"
    environment:
      - 'MINIO_ROOT_USER=${SERVICE_USER_MINIO}'
      - 'MINIO_ROOT_PASSWORD=${SERVICE_PASSWORD_MINIO}'
    volumes:
      - files:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      retries: 10
    restart: unless-stopped
  elastic:
    image: "elasticsearch:7.14.2"
    command: |
      /bin/sh -c "./bin/elasticsearch-plugin list | grep -q ingest-attachment || yes | ./bin/elasticsearch-plugin install --silent ingest-attachment;
      /usr/local/bin/docker-entrypoint.sh eswrapper"
    volumes:
      - elastic:/usr/share/elasticsearch/data
    environment:
      - ELASTICSEARCH_PORT_NUMBER=9200
      - discovery.type=single-node
      - ES_JAVA_OPTS=-Xms1024m -Xmx1024m
      - http.cors.enabled=true
    healthcheck:
      interval: 20s
      retries: 10
      test: curl -s http://localhost:9200/_cluster/health | grep -vq '"status":"red"'
    restart: unless-stopped
  rekoni:
    image: "hardcoreeng/rekoni-service:s0.7.437"
    environment:
      - 'SECRET=${SERVICE_PASSWORD_SECRET}'
    deploy:
      resources:
        limits:
          memory: 500M
    restart: unless-stopped
  transactor:
    image: "hardcoreeng/transactor:s0.7.437"
    environment:
      - SERVER_PORT=3333
      - 'SERVER_SECRET=${SERVICE_PASSWORD_SECRET}'
      - 'DB_URL=cockroach://${SERVICE_USER_COCKROACH}:${SERVICE_PASSWORD_COCKROACH}@cockroach:26257/crdb'
      - 'STORAGE_CONFIG=minio|minio?accessKey=${SERVICE_USER_MINIO}&secretKey=${SERVICE_PASSWORD_MINIO}'
      - FRONT_URL=http://localhost:8087
      - ACCOUNTS_URL=http://account:3000
      - FULLTEXT_URL=http://fulltext:4700
      - STATS_URL=http://stats:4900
      - LAST_NAME_FIRST=true
      - QUEUE_CONFIG=redpanda:9092
    restart: unless-stopped
  collaborator:
    image: "hardcoreeng/collaborator:s0.7.437"
    environment:
      - COLLABORATOR_PORT=3078
      - 'SECRET=${SERVICE_PASSWORD_SECRET}'
      - ACCOUNTS_URL=http://account:3000
      - STATS_URL=http://stats:4900
      - 'STORAGE_CONFIG=minio|minio?accessKey=${SERVICE_USER_MINIO}&secretKey=${SERVICE_PASSWORD_MINIO}'
    restart: unless-stopped
  account:
    image: "hardcoreeng/account:s0.7.437"
    environment:
      - SERVER_PORT=3000
      - 'SERVER_SECRET=${SERVICE_PASSWORD_SECRET}'
      - 'DB_URL=cockroach://${SERVICE_USER_COCKROACH}:${SERVICE_PASSWORD_COCKROACH}@cockroach:26257/crdb'
      - 'TRANSACTOR_URL=ws://transactor:3333;wss://${SERVICE_FQDN_HULY}/_transactor'
      - 'STORAGE_CONFIG=minio|minio?accessKey=${SERVICE_USER_MINIO}&secretKey=${SERVICE_PASSWORD_MINIO}'
      - 'FRONT_URL=${SERVICE_URL_HULY}'
      - 'STATS_URL=${SERVICE_URL_HULY}/_stats'
      - MODEL_ENABLED='*'
      - 'ACCOUNTS_URL=${SERVICE_URL_HULY}/_accounts'
      - ACCOUNT_PORT=3000
      - QUEUE_CONFIG=redpanda:9092
    restart: unless-stopped
  workspace:
    image: "hardcoreeng/workspace:s0.7.437"
    environment:
      - 'SERVER_SECRET=${SERVICE_PASSWORD_SECRET}'
      - 'DB_URL=cockroach://${SERVICE_USER_COCKROACH}:${SERVICE_PASSWORD_COCKROACH}@cockroach:26257/crdb'
      - 'ACCOUNTS_DB_URL=cockroach://${SERVICE_USER_COCKROACH}:${SERVICE_PASSWORD_COCKROACH}@cockroach:26257/crdb'
      - 'TRANSACTOR_URL=ws://transactor:3333;wss://${SERVICE_FQDN_HULY}/_transactor'
      - 'STORAGE_CONFIG=minio|minio?accessKey=${SERVICE_USER_MINIO}&secretKey=${SERVICE_PASSWORD_MINIO}'
      - MODEL_ENABLED='*'
      - ACCOUNTS_URL=http://account:3000
      - STATS_URL=http://stats:4900
      - QUEUE_CONFIG=redpanda:9092
    restart: unless-stopped
  front:
    image: "hardcoreeng/front:s0.7.437"
    environment:
      - SERVER_PORT=8080
      - 'SERVER_SECRET=${SERVICE_PASSWORD_SECRET}'
      - 'ACCOUNTS_URL=${SERVICE_URL_HULY}/_accounts'
      - ACCOUNTS_URL_INTERNAL=http://account:3000
      - 'REKONI_URL=${SERVICE_URL_HULY}/_rekoni'
      - 'STATS_URL=${SERVICE_URL_HULY}/_stats'
      - UPLOAD_URL=/files
      - ELASTIC_URL=http://elastic:9200
      - 'COLLABORATOR_URL=wss://${SERVICE_FQDN_HULY}/_collaborator'
      - 'STORAGE_CONFIG=minio|minio?accessKey=${SERVICE_USER_MINIO}&secretKey=${SERVICE_PASSWORD_MINIO}'
      - TITLE=Huly Self Hosted
      - DEFAULT_LANGUAGE=en
      - LAST_NAME_FIRST=true
      - DISABLED_FEATURES=auto-translate,mailboxes
    restart: unless-stopped
  fulltext:
    image: "hardcoreeng/fulltext:s0.7.437"
    environment:
      - 'SERVER_SECRET=${SERVICE_PASSWORD_SECRET}'
      - 'DB_URL=cockroach://${SERVICE_USER_COCKROACH}:${SERVICE_PASSWORD_COCKROACH}@cockroach:26257/crdb'
      - FULLTEXT_DB_URL=http://elastic:9200
      - ELASTIC_INDEX_NAME=huly_storage_index
      - 'STORAGE_CONFIG=minio|minio?accessKey=${SERVICE_USER_MINIO}&secretKey=${SERVICE_PASSWORD_MINIO}'
      - REKONI_URL=http://rekoni:4004
      - ACCOUNTS_URL=http://account:3000
      - STATS_URL=http://stats:4900
      - QUEUE_CONFIG=redpanda:9092
    restart: unless-stopped
  stats:
    image: "hardcoreeng/stats:s0.7.437"
    environment:
      - PORT=4900
      - 'SERVER_SECRET=${SERVICE_PASSWORD_SECRET}'
    restart: unless-stopped
  kvs:
    image: "hardcoreeng/hulykvs:s0.7.437"
    depends_on:
      cockroach:
        condition: service_started
    environment:
      - 'HULY_DB_CONNECTION=cockroach://${SERVICE_USER_COCKROACH}:${SERVICE_PASSWORD_COCKROACH}@cockroach:26257/crdb'
      - 'HULY_TOKEN_SECRET=${SERVICE_PASSWORD_SECRET}'
    restart: unless-stopped

volumes:
  elastic:
  files:
  cr_data:
  cr_certs:
  redpanda:
