# documentation: https://laravel.com/docs
# slogan: Despliega Laravel RootKit desde GitHub con MariaDB y phpMyAdmin
# category: framework
# tags: laravel, php, framework, web, application, mariadb, phpmyadmin, github, rootkit
# logo: svgs/laravel.svg

services:
  laravel:
    image: php:${SERVICE_PHP_VERSION:-8.4}-fpm-alpine
    volumes:
      - laravel-files:/var/www/html
      - type: bind
        source: ./supervisord.conf
        target: /etc/supervisord.conf
        content: |
          [supervisord]
          nodaemon=true
          pidfile=/tmp/supervisord.pid
          logfile=/dev/null
          logfile_maxbytes=0
          loglevel=info

          [program:php-fpm]
          command=php-fpm
          redirect_stderr=true
          stdout_logfile=/dev/stdout
          stdout_logfile_maxbytes=0
          stderr_logfile=/dev/stderr
          stderr_logfile_maxbytes=0
          autostart=true
          autorestart=true

          [program:scheduler]
          command=sh -c "while [ ! -f /var/www/html/artisan ]; do echo 'Waiting for Laravel installation...'; sleep 10; done; cd /var/www/html && php artisan optimize:clear >/dev/null 2>&1 || true; php artisan config:clear >/dev/null 2>&1 || true; while true; do if [ \"${SERVICE_LARAVEL_SCHEDULER_ENABLED:-true}\" != \"true\" ]; then echo 'Laravel scheduler disabled via SERVICE_LARAVEL_SCHEDULER_ENABLED'; sleep 60; continue; fi; if php artisan schedule:list --no-interaction >/dev/null 2>&1; then php artisan schedule:run --no-interaction 2>&1; else echo 'Laravel scheduler unavailable, retrying in 60 seconds'; fi; sleep 60; done"
          redirect_stderr=true
          stdout_logfile=/dev/stdout
          stdout_logfile_maxbytes=0
          stderr_logfile=/dev/stderr
          stderr_logfile_maxbytes=0
          autostart=true
          autorestart=true

          [program:queue-worker]
          process_name=%(program_name)s_%(process_num)02d
          command=sh -c "while [ ! -f /var/www/html/artisan ]; do echo 'Waiting for Laravel installation...'; sleep 10; done; php /var/www/html/artisan queue:work --sleep=3 --tries=3 --max-time=3600"
          redirect_stderr=true
          stdout_logfile=/dev/stdout
          stdout_logfile_maxbytes=0
          stderr_logfile=/dev/stderr
          stderr_logfile_maxbytes=0
          autostart=true
          autorestart=true
          numprocs=2
          stopwaitsecs=3600

      - type: bind
        source: ./entrypoint.sh
        target: /entrypoint.sh
        mode: "0755"
        content: |
          #!/bin/sh
          set -e

          echo "Starting Laravel RootKit deployment from GitHub..."

          chmod +x /entrypoint.sh 2>/dev/null || true

          if ! command -v supervisord >/dev/null 2>&1; then
            echo "Installing supervisor and required packages..."
            apk add --no-cache supervisor curl git unzip nodejs npm
          fi

          if php -m | grep -q "^pdo_mysql$" \
            && php -m | grep -q "^zip$" \
            && php -m | grep -q "^gd$" \
            && php -m | grep -q "^intl$" \
            && php -m | grep -q "^mbstring$" \
            && php -m | grep -q "^bcmath$" \
            && php -m | grep -q "^opcache$"; then
            echo "PHP extensions already installed..."
          else
            echo "Installing PHP extensions..."
            apk add --no-cache \
              libzip-dev \
              mysql-client \
              mariadb-client \
              freetype-dev \
              libjpeg-turbo-dev \
              libpng-dev \
              oniguruma-dev \
              icu-dev \
              libxml2-dev
            docker-php-ext-configure gd --with-freetype --with-jpeg
            docker-php-ext-install -j"$(nproc)" pdo_mysql zip bcmath gd intl mbstring opcache
          fi

          if ! grep -q "listen = 0.0.0.0:9000" /usr/local/etc/php-fpm.d/www.conf 2>/dev/null; then
            sed -i 's/listen = 127.0.0.1:9000/listen = 0.0.0.0:9000/' /usr/local/etc/php-fpm.d/www.conf
            sed -i 's/;clear_env = no/clear_env = no/' /usr/local/etc/php-fpm.d/www.conf
          fi

          if ! command -v composer >/dev/null 2>&1; then
            echo "Installing Composer..."
            curl -sS https://getcomposer.org/installer | php -- --install-dir=/usr/local/bin --filename=composer
            chmod +x /usr/local/bin/composer
          fi

          mkdir -p /var/www/html
          cd /var/www/html

          mkdir -p /var/www/html/public
          if [ ! -f /var/www/html/artisan ]; then
            {
              printf '%s\n' '<!doctype html>'
              printf '%s\n' '<html lang="en"><head><meta charset="utf-8" />'
              printf '%s\n' '<meta name="viewport" content="width=device-width, initial-scale=1" />'
              printf '%s\n' '<title>Coolify: Laravel provisioning</title>'
              printf '%s\n' '<style>:root{color-scheme:dark}body{margin:0;font-family:ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Arial;background:#0b0f19;color:#e5e7eb}.wrap{max-width:960px;margin:0 auto;padding:32px 20px}.card{background:#111827;border:1px solid #1f2937;border-radius:12px;padding:20px}h1{font-size:18px;margin:0 0 12px}p{margin:0 0 12px;color:#cbd5e1}.muted{color:#94a3b8;font-size:13px}</style></head><body>'
              printf '%s\n' '<div class="wrap"><div class="card">'
              printf '%s\n' '<h1>Provisioning in progress</h1>'
              printf '%s\n' '<p>Coolify is cloning the repository and installing dependencies. This can take a few minutes on first deploy.</p>'
              printf '%s\n' '<p class="muted">If this page does not change, check the Laravel logs in Coolify for the root cause.</p>'
              printf '%s\n' '</div></div></body></html>'
            } > /var/www/html/public/_coolify_error.html
          fi

          REPO_URL="${SERVICE_GITHUB_REPO_URL:-https://github.com/crmhawkins/copiservi.git}"
          REPO_BRANCH="${SERVICE_GITHUB_BRANCH:-main}"
          GITHUB_TOKEN="${SERVICE_GITHUB_TOKEN:-}"

          REPO_URL="${REPO_URL%/}"
          if [ -n "${GITHUB_TOKEN}" ]; then
            if echo "${REPO_URL}" | grep -Eq '^git@github\.com:'; then
              REPO_URL="https://x-access-token:${GITHUB_TOKEN}@github.com/${REPO_URL#git@github.com:}"
            elif echo "${REPO_URL}" | grep -Eq '^https?://(www\.)?github\.com/'; then
              REPO_URL="$(echo "${REPO_URL}" | sed -E "s#^https?://(www\.)?github\.com/#https://x-access-token:${GITHUB_TOKEN}@github.com/#")"
            fi
          fi
          SERVICE_PUBLIC_URL_RUNTIME=""
          if [ -z "${SERVICE_PUBLIC_URL_RUNTIME}" ] && [ -n "${SERVICE_FQDN_NGINX:-}" ]; then
            SERVICE_PUBLIC_URL_RUNTIME="https://${SERVICE_FQDN_NGINX}"
          fi
          if [ -z "${SERVICE_PUBLIC_URL_RUNTIME}" ] && [ -n "${SERVICE_FQDN_NGINX_80:-}" ]; then
            SERVICE_PUBLIC_URL_RUNTIME="https://${SERVICE_FQDN_NGINX_80%:80}"
          fi
          if [ -z "${SERVICE_PUBLIC_URL_RUNTIME}" ]; then
            SERVICE_PUBLIC_URL_RUNTIME="${SERVICE_URL_NGINX:-${SERVICE_URL_NGINX_80:-}}"
          fi
          if [ -n "${SERVICE_PUBLIC_URL_RUNTIME}" ] && [ "${SERVICE_PUBLIC_URL_RUNTIME#http://}" != "${SERVICE_PUBLIC_URL_RUNTIME}" ]; then
            SERVICE_PUBLIC_URL_RUNTIME="https://${SERVICE_PUBLIC_URL_RUNTIME#http://}"
          fi

          if [ ! -d .git ]; then
            if [ -n "${GITHUB_TOKEN}" ]; then
              echo "Cloning repository (branch: ${REPO_BRANCH}) using GitHub token..."
            else
              echo "Cloning repository ${REPO_URL} (branch: ${REPO_BRANCH})..."
            fi
            rm -rf * .[!.]* 2>/dev/null || true
            git clone --branch "${REPO_BRANCH}" --single-branch "${REPO_URL}" .
          else
            echo "Repository already exists. Syncing branch ${REPO_BRANCH}..."
            set +e
            git fetch --all --prune 2>&1
            git checkout -B "${REPO_BRANCH}" "origin/${REPO_BRANCH}" 2>&1
            GIT_SYNC_EXIT="$?"
            set -e
            if [ "$GIT_SYNC_EXIT" -ne 0 ]; then
              echo "Failed to checkout branch ${REPO_BRANCH}. Falling back to repository default branch."
            fi
          fi

          git config --global --add safe.directory /var/www/html || true

          if [ -f composer.json ]; then
            echo "Installing Composer dependencies..."
            set +e
            COMPOSER_OUTPUT="$(composer install --no-interaction --prefer-dist --optimize-autoloader 2>&1)"
            COMPOSER_EXIT="$?"
            set -e
            if [ "$COMPOSER_EXIT" -ne 0 ]; then
              echo "$COMPOSER_OUTPUT" >&2

              mkdir -p /var/www/html/public

              REQUIRED="$(printf '%s' "$COMPOSER_OUTPUT" | grep -Eo 'requires php[^\\n]+' | head -n 1 || true)"
              CURRENT="$(php -r 'echo PHP_VERSION;' 2>/dev/null || true)"

              {
                printf '%s\n' '<!doctype html>'
                printf '%s\n' '<html lang="en"><head><meta charset="utf-8" />'
                printf '%s\n' '<meta name="viewport" content="width=device-width, initial-scale=1" />'
                printf '%s\n' '<title>Coolify: Laravel install failed</title>'
                printf '%s\n' '<style>:root{color-scheme:dark}body{margin:0;font-family:ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Arial;background:#0b0f19;color:#e5e7eb}.wrap{max-width:960px;margin:0 auto;padding:32px 20px}.card{background:#111827;border:1px solid #1f2937;border-radius:12px;padding:20px}h1{font-size:18px;margin:0 0 12px}p{margin:0 0 12px;color:#cbd5e1}pre{white-space:pre-wrap;word-break:break-word;background:#0b1220;border:1px solid #1f2937;border-radius:10px;padding:12px;color:#e5e7eb}.muted{color:#94a3b8;font-size:13px}</style></head><body>'
                printf '%s\n' '<div class="wrap"><div class="card">'
                printf '%s\n' '<h1>Laravel dependency install failed</h1>'
                printf '%s\n' '<p>This service could not run <code>composer install</code>.</p>'
                printf '%s\n' "<p><strong>Current PHP:</strong> ${CURRENT}</p>"
                printf '%s\n' "<p><strong>Requirement:</strong> ${REQUIRED}</p>"
                printf '%s\n' '<p class="muted">Fix: In Coolify, set this service PHP Version to a compatible value (for copiservi use 8.3 or newer) and redeploy.</p>'
                printf '%s\n' '<pre>'
                printf '%s\n' "$COMPOSER_OUTPUT"
                printf '%s\n' '</pre></div></div></body></html>'
              } > /var/www/html/public/_coolify_error.html
            fi
          fi

          if [ -f package.json ]; then
            echo "Installing Node dependencies and building Vite assets..."
            echo "Node version: $(node -v 2>/dev/null || echo unavailable)"
            echo "NPM version: $(npm -v 2>/dev/null || echo unavailable)"
            set +e
            if [ -f package-lock.json ]; then
              NPM_OUTPUT="$(npm ci --no-audit --no-fund 2>&1 && npm run build 2>&1)"
            else
              NPM_OUTPUT="$(npm install --no-audit --no-fund 2>&1 && npm run build 2>&1)"
            fi
            NPM_EXIT="$?"
            set -e
            if [ "$NPM_EXIT" -ne 0 ]; then
              echo "$NPM_OUTPUT" >&2
              mkdir -p /var/www/html/public
              {
                printf '%s\n' '<!doctype html>'
                printf '%s\n' '<html lang="en"><head><meta charset="utf-8" />'
                printf '%s\n' '<meta name="viewport" content="width=device-width, initial-scale=1" />'
                printf '%s\n' '<title>Coolify: Frontend build failed</title>'
                printf '%s\n' '<style>:root{color-scheme:dark}body{margin:0;font-family:ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Arial;background:#0b0f19;color:#e5e7eb}.wrap{max-width:960px;margin:0 auto;padding:32px 20px}.card{background:#111827;border:1px solid #1f2937;border-radius:12px;padding:20px}h1{font-size:18px;margin:0 0 12px}p{margin:0 0 12px;color:#cbd5e1}pre{white-space:pre-wrap;word-break:break-word;background:#0b1220;border:1px solid #1f2937;border-radius:10px;padding:12px;color:#e5e7eb}.muted{color:#94a3b8;font-size:13px}</style></head><body>'
                printf '%s\n' '<div class="wrap"><div class="card">'
                printf '%s\n' '<h1>Frontend asset build failed</h1>'
                printf '%s\n' '<p>The service could not run <code>npm run build</code>, so CSS/JS assets are missing.</p>'
                printf '%s\n' '<p class="muted">Check Laravel logs in Coolify to see the exact npm error, fix the project build dependencies, and redeploy.</p>'
                printf '%s\n' '<pre>'
                printf '%s\n' "$NPM_OUTPUT"
                printf '%s\n' '</pre></div></div></body></html>'
              } > /var/www/html/public/_coolify_error.html
              exit 1
            fi

            if [ ! -f /var/www/html/public/build/manifest.json ]; then
              echo "Vite build finished but manifest was not generated." >&2
              mkdir -p /var/www/html/public
              {
                printf '%s\n' '<!doctype html>'
                printf '%s\n' '<html lang="en"><head><meta charset="utf-8" />'
                printf '%s\n' '<meta name="viewport" content="width=device-width, initial-scale=1" />'
                printf '%s\n' '<title>Coolify: Vite manifest missing</title>'
                printf '%s\n' '<style>:root{color-scheme:dark}body{margin:0;font-family:ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Arial;background:#0b0f19;color:#e5e7eb}.wrap{max-width:960px;margin:0 auto;padding:32px 20px}.card{background:#111827;border:1px solid #1f2937;border-radius:12px;padding:20px}h1{font-size:18px;margin:0 0 12px}p{margin:0 0 12px;color:#cbd5e1}pre{white-space:pre-wrap;word-break:break-word;background:#0b1220;border:1px solid #1f2937;border-radius:10px;padding:12px;color:#e5e7eb}.muted{color:#94a3b8;font-size:13px}</style></head><body>'
                printf '%s\n' '<div class="wrap"><div class="card">'
                printf '%s\n' '<h1>Vite manifest not found</h1>'
                printf '%s\n' '<p>Build command finished, but <code>public/build/manifest.json</code> does not exist.</p>'
                printf '%s\n' '<p class="muted">Review package scripts and vite config in the Laravel project, then redeploy.</p>'
                printf '%s\n' '<pre>'
                printf '%s\n' "$NPM_OUTPUT"
                printf '%s\n' '</pre></div></div></body></html>'
              } > /var/www/html/public/_coolify_error.html
              exit 1
            fi
            echo "Vite manifest detected:"
            ls -la /var/www/html/public/build/manifest.json
          fi

          DB_NAME="${SERVICE_DATABASE_LARAVEL:-${MYSQL_DATABASE:-laravel}}"
          DB_USER="${SERVICE_USER_LARAVEL:-${MYSQL_USER:-laravel}}"
          DB_PASSWORD="${SERVICE_PASSWORD_LARAVEL:-${MYSQL_PASSWORD:-password}}"

          if [ ! -f .env ]; then
             if [ -f .env.example ]; then
               cp .env.example .env
             else
               touch .env
             fi
             echo "" >> .env
             echo "DB_CONNECTION=mysql" >> .env
             echo "DB_HOST=mariadb" >> .env
             echo "DB_PORT=3306" >> .env
             echo "DB_DATABASE=${DB_NAME}" >> .env
             echo "DB_USERNAME=${DB_USER}" >> .env
             echo "DB_PASSWORD=${DB_PASSWORD}" >> .env
             echo "APP_URL=${SERVICE_PUBLIC_URL_RUNTIME}" >> .env
             echo "ASSET_URL=" >> .env
          fi

          upsert_env() {
            key="$1"
            value="$2"
            escaped_value=$(printf '%s\n' "$value" | sed 's/[\/&]/\\&/g')
            if grep -Eq "^${key}=" .env; then
              sed -i "s/^${key}=.*/${key}=${escaped_value}/" .env
            else
              echo "${key}=${value}" >> .env
            fi
          }

          upsert_env "APP_URL" "${SERVICE_PUBLIC_URL_RUNTIME}"
          # Keep assets on same host/domain as current request.
          # This avoids cert/domain mismatch when service internal URLs differ.
          upsert_env "ASSET_URL" ""
          upsert_env "DB_CONNECTION" "mysql"
          upsert_env "DB_HOST" "mariadb"
          upsert_env "DB_PORT" "3306"
          upsert_env "DB_DATABASE" "${DB_NAME}"
          upsert_env "DB_USERNAME" "${DB_USER}"
          upsert_env "DB_PASSWORD" "${DB_PASSWORD}"
          upsert_env "CACHE_STORE" "file"
          upsert_env "CACHE_DRIVER" "file"
          upsert_env "SESSION_DRIVER" "file"

          if [ -f artisan ]; then
            echo "Running Laravel setup tasks..."
            CURRENT_APP_KEY="$(grep -E '^APP_KEY=' .env 2>/dev/null | tail -n 1 | cut -d '=' -f2-)"
            if [ -z "${CURRENT_APP_KEY}" ]; then
              php artisan key:generate --force || true
            fi
            php artisan optimize:clear || true
            php artisan view:clear || true
            php artisan config:clear || true
            DB_CONNECTION=mysql \
              DB_HOST=mariadb \
              DB_PORT=3306 \
              DB_DATABASE="${DB_NAME}" \
              DB_USERNAME="${DB_USER}" \
              DB_PASSWORD="${DB_PASSWORD}" \
              php artisan about >/dev/null 2>&1 || true
          fi

          mkdir -p /var/www/html/storage/logs
          mkdir -p /var/www/html/storage/framework/cache
          mkdir -p /var/www/html/storage/framework/sessions
          mkdir -p /var/www/html/storage/framework/views
          mkdir -p /var/www/html/bootstrap/cache

          chown -R www-data:www-data /var/www/html
          chmod -R 775 /var/www/html/storage
          chmod -R 775 /var/www/html/bootstrap/cache

          max_wait=300
          waited=0
          while [ ! -f /var/www/html/artisan ]; do
            if [ $waited -ge $max_wait ]; then
              echo "WARNING: Laravel not ready after ${max_wait}s. Starting anyway so nginx can show an error page."
              mkdir -p /var/www/html/public
              if [ ! -f /var/www/html/public/_coolify_error.html ]; then
                {
                  printf '%s\n' '<!doctype html>'
                  printf '%s\n' '<html lang="en"><head><meta charset="utf-8" />'
                  printf '%s\n' '<meta name="viewport" content="width=device-width, initial-scale=1" />'
                  printf '%s\n' '<title>Coolify: Laravel not ready</title>'
                  printf '%s\n' '<style>:root{color-scheme:dark}body{margin:0;font-family:ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Arial;background:#0b0f19;color:#e5e7eb}.wrap{max-width:960px;margin:0 auto;padding:32px 20px}.card{background:#111827;border:1px solid #1f2937;border-radius:12px;padding:20px}h1{font-size:18px;margin:0 0 12px}p{margin:0 0 12px;color:#cbd5e1}.muted{color:#94a3b8;font-size:13px}</style></head><body>'
                  printf '%s\n' '<div class="wrap"><div class="card">'
                  printf '%s\n' '<h1>Laravel is not ready yet</h1>'
                  printf '%s\n' '<p>The application did not finish installing (no <code>artisan</code> file found).</p>'
                  printf '%s\n' '<p class="muted">Check the Laravel container logs in Coolify for the installation error and redeploy.</p>'
                  printf '%s\n' '</div></div></body></html>'
                } > /var/www/html/public/_coolify_error.html
              fi
              break
            fi
            sleep 2
            waited=$((waited + 2))
          done
          if [ -f /var/www/html/artisan ]; then
            echo "Laravel is ready!"
            rm -f /var/www/html/public/_coolify_error.html 2>/dev/null || true
          fi

          echo "Starting supervisor..."
          exec /usr/bin/supervisord -c /etc/supervisord.conf
    environment:
      - SERVICE_GITHUB_REPO_URL=$SERVICE_GITHUB_REPO_URL
      - SERVICE_GITHUB_BRANCH=$SERVICE_GITHUB_BRANCH
      - SERVICE_PHP_VERSION=$SERVICE_PHP_VERSION
      - SERVICE_FQDN_NGINX
      - SERVICE_FQDN_NGINX_80
      - APP_NAME=Laravel RootKit
      - APP_ENV=production
      - APP_DEBUG=false
      - LOG_CHANNEL=stack
      - LOG_LEVEL=debug
      - DB_CONNECTION=mysql
      - DB_HOST=mariadb
      - DB_PORT=3306
      - DB_DATABASE=${SERVICE_DATABASE_LARAVEL}
      - DB_USERNAME=${SERVICE_USER_LARAVEL:-laravel}
      - DB_PASSWORD=${SERVICE_PASSWORD_LARAVEL:-password}
      - QUEUE_CONNECTION=database
      - CACHE_STORE=file
      - CACHE_DRIVER=file
      - SESSION_DRIVER=file
      - SERVICE_LARAVEL_SCHEDULER_ENABLED=${SERVICE_LARAVEL_SCHEDULER_ENABLED:-true}
    depends_on:
      mariadb:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "php-fpm -t >/dev/null 2>&1 && test -f /var/www/html/artisan && php -r \"exit(@fsockopen('127.0.0.1',9000)?0:1);\""]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 900s
    entrypoint: ["/bin/sh", "/entrypoint.sh"]

  nginx:
    image: nginx:alpine
    command: ["nginx", "-g", "daemon off;"]
    volumes:
      - laravel-files:/var/www/html:ro
      - type: bind
        source: ./nginx-main.conf
        target: /etc/nginx/nginx.conf
        content: |
          user nginx;
          worker_processes 1;
          error_log /dev/stderr warn;
          pid /var/run/nginx.pid;

          events {
              worker_connections 1024;
          }

          http {
              include /etc/nginx/mime.types;
              default_type application/octet-stream;
              aio off;
              aio_write off;
              sendfile off;
              directio off;
              keepalive_timeout 65;
              client_max_body_size 100M;
              include /etc/nginx/conf.d/*.conf;
          }
      - type: bind
        source: ./nginx.conf
        target: /etc/nginx/conf.d/default.conf
        content: |
          server {
              listen 80;
              server_name _;
              root /var/www/html/public;
              index index.php index.html;
              aio off;
              aio_write off;

              client_max_body_size 100M;

              access_log /dev/stdout;
              error_log /dev/stderr;

              resolver 127.0.0.11 ipv6=off valid=10s;
              set $php_upstream "laravel:9000";

              location / {
                  try_files $uri $uri/ /index.php?$query_string;
              }

              location ~ \.php$ {
                  fastcgi_pass $php_upstream;
                  fastcgi_index index.php;
                  fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
                  fastcgi_param HTTP_X_FORWARDED_PROTO $http_x_forwarded_proto;
                  fastcgi_param HTTP_X_FORWARDED_HOST $http_host;
                  fastcgi_param HTTP_X_FORWARDED_FOR $proxy_add_x_forwarded_for;
                  fastcgi_param HTTPS $http_x_forwarded_proto;
                  include fastcgi_params;
                  fastcgi_read_timeout 300;
                  fastcgi_buffers 16 16k;
                  fastcgi_buffer_size 32k;
              }

              location ~ /\.(?!well-known).* {
                  deny all;
              }
          }
    depends_on:
      laravel:
        condition: service_healthy
    restart: unless-stopped
    expose:
      - "80"
    healthcheck:
      test: ["CMD-SHELL", "nginx -t >/dev/null 2>&1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  mariadb:
    image: mariadb:11
    volumes:
      - mariadb-data:/var/lib/mysql
    environment:
      - MYSQL_ROOT_PASSWORD=$SERVICE_PASSWORD_ROOT
      - MYSQL_DATABASE=${SERVICE_DATABASE_LARAVEL}
      - MYSQL_USER=${SERVICE_USER_LARAVEL:-laravel}
      - MYSQL_PASSWORD=${SERVICE_PASSWORD_LARAVEL:-password}
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 20s
      retries: 10

  phpmyadmin:
    image: phpmyadmin:latest
    environment:
      - SERVICE_URL_PHPMYADMIN
      - PMA_HOST=mariadb
      - PMA_USER=root
      - PMA_PASSWORD=$SERVICE_PASSWORD_ROOT
      - PMA_PORT=3306
      - PMA_ARBITRARY=0
      - PMA_ABSOLUTE_URI=$SERVICE_URL_PHPMYADMIN/
      - UPLOAD_LIMIT=300M
    depends_on:
      mariadb:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "php -r 'exit((int)!@fsockopen(\"127.0.0.1\",80));'"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  laravel-files:
  mariadb-data:
