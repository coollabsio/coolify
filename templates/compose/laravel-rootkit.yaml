# documentation: https://laravel.com/docs
# slogan: Despliega Laravel RootKit desde GitHub con MariaDB y phpMyAdmin
# category: framework
# tags: laravel, php, framework, web, application, mariadb, phpmyadmin, github, rootkit
# logo: svgs/laravel.svg

services:
  laravel:
    image: php:${SERVICE_PHP_VERSION:-8.4}-fpm-alpine
    volumes:
      - laravel-files:/var/www/html
      - type: bind
        source: ./supervisord.conf
        target: /etc/supervisord.conf
        content: |
          [supervisord]
          nodaemon=true
          pidfile=/tmp/supervisord.pid
          logfile=/dev/null
          logfile_maxbytes=0
          loglevel=info

          [program:php-fpm]
          command=php-fpm
          redirect_stderr=true
          stdout_logfile=/dev/stdout
          stdout_logfile_maxbytes=0
          stderr_logfile=/dev/stderr
          stderr_logfile_maxbytes=0
          autostart=true
          autorestart=true

          [program:scheduler]
          command=sh -c "while true; do if [ -f /var/www/html/artisan ]; then php /var/www/html/artisan schedule:run --verbose --no-interaction 2>&1; else echo 'Waiting for Laravel installation...'; fi; sleep 60; done"
          redirect_stderr=true
          stdout_logfile=/dev/stdout
          stdout_logfile_maxbytes=0
          stderr_logfile=/dev/stderr
          stderr_logfile_maxbytes=0
          autostart=true
          autorestart=true

          [program:queue-worker]
          process_name=%(program_name)s_%(process_num)02d
          command=sh -c "while [ ! -f /var/www/html/artisan ]; do echo 'Waiting for Laravel installation...'; sleep 10; done; php /var/www/html/artisan queue:work --sleep=3 --tries=3 --max-time=3600"
          redirect_stderr=true
          stdout_logfile=/dev/stdout
          stdout_logfile_maxbytes=0
          stderr_logfile=/dev/stderr
          stderr_logfile_maxbytes=0
          autostart=true
          autorestart=true
          numprocs=2
          stopwaitsecs=3600

      - type: bind
        source: ./entrypoint.sh
        target: /entrypoint.sh
        mode: "0755"
        content: |
          #!/bin/sh
          set -e

          echo "Starting Laravel RootKit deployment from GitHub..."

          chmod +x /entrypoint.sh 2>/dev/null || true

          if ! command -v supervisord >/dev/null 2>&1; then
            echo "Installing supervisor and required packages..."
            apk add --no-cache supervisor curl git unzip
          fi

          if php -m | grep -q "^pdo_mysql$" \
            && php -m | grep -q "^zip$" \
            && php -m | grep -q "^gd$" \
            && php -m | grep -q "^intl$" \
            && php -m | grep -q "^mbstring$" \
            && php -m | grep -q "^bcmath$" \
            && php -m | grep -q "^opcache$"; then
            echo "PHP extensions already installed..."
          else
            echo "Installing PHP extensions..."
            apk add --no-cache \
              libzip-dev \
              mysql-client \
              mariadb-client \
              freetype-dev \
              libjpeg-turbo-dev \
              libpng-dev \
              oniguruma-dev \
              icu-dev \
              libxml2-dev
            docker-php-ext-configure gd --with-freetype --with-jpeg
            docker-php-ext-install -j"$(nproc)" pdo_mysql zip bcmath gd intl mbstring opcache
          fi

          if ! grep -q "listen = 0.0.0.0:9000" /usr/local/etc/php-fpm.d/www.conf 2>/dev/null; then
            sed -i 's/listen = 127.0.0.1:9000/listen = 0.0.0.0:9000/' /usr/local/etc/php-fpm.d/www.conf
            sed -i 's/;clear_env = no/clear_env = no/' /usr/local/etc/php-fpm.d/www.conf
          fi

          if ! command -v composer >/dev/null 2>&1; then
            echo "Installing Composer..."
            curl -sS https://getcomposer.org/installer | php -- --install-dir=/usr/local/bin --filename=composer
            chmod +x /usr/local/bin/composer
          fi

          mkdir -p /var/www/html
          cd /var/www/html

          mkdir -p /var/www/html/public
          if [ ! -f /var/www/html/artisan ]; then
            {
              printf '%s\n' '<!doctype html>'
              printf '%s\n' '<html lang="en"><head><meta charset="utf-8" />'
              printf '%s\n' '<meta name="viewport" content="width=device-width, initial-scale=1" />'
              printf '%s\n' '<title>Coolify: Laravel provisioning</title>'
              printf '%s\n' '<style>:root{color-scheme:dark}body{margin:0;font-family:ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Arial;background:#0b0f19;color:#e5e7eb}.wrap{max-width:960px;margin:0 auto;padding:32px 20px}.card{background:#111827;border:1px solid #1f2937;border-radius:12px;padding:20px}h1{font-size:18px;margin:0 0 12px}p{margin:0 0 12px;color:#cbd5e1}.muted{color:#94a3b8;font-size:13px}</style></head><body>'
              printf '%s\n' '<div class="wrap"><div class="card">'
              printf '%s\n' '<h1>Provisioning in progress</h1>'
              printf '%s\n' '<p>Coolify is cloning the repository and installing dependencies. This can take a few minutes on first deploy.</p>'
              printf '%s\n' '<p class="muted">If this page does not change, check the Laravel logs in Coolify for the root cause.</p>'
              printf '%s\n' '</div></div></body></html>'
            } > /var/www/html/public/_coolify_error.html
          fi

          REPO_URL="${SERVICE_GITHUB_REPO_URL:-https://github.com/crmhawkins/copiservi.git}"

          if [ ! -d .git ]; then
            echo "Cloning repository ${REPO_URL}..."
            rm -rf * .[!.]* 2>/dev/null || true
            git clone "${REPO_URL}" .
          else
            echo "Repository already exists..."
          fi

          git config --global --add safe.directory /var/www/html || true

          if [ -f composer.json ]; then
            echo "Installing Composer dependencies..."
            set +e
            COMPOSER_OUTPUT="$(composer install --no-interaction --prefer-dist --optimize-autoloader 2>&1)"
            COMPOSER_EXIT="$?"
            set -e
            if [ "$COMPOSER_EXIT" -ne 0 ]; then
              echo "$COMPOSER_OUTPUT" >&2

              mkdir -p /var/www/html/public

              REQUIRED="$(printf '%s' "$COMPOSER_OUTPUT" | grep -Eo 'requires php[^\\n]+' | head -n 1 || true)"
              CURRENT="$(php -r 'echo PHP_VERSION;' 2>/dev/null || true)"

              {
                printf '%s\n' '<!doctype html>'
                printf '%s\n' '<html lang="en"><head><meta charset="utf-8" />'
                printf '%s\n' '<meta name="viewport" content="width=device-width, initial-scale=1" />'
                printf '%s\n' '<title>Coolify: Laravel install failed</title>'
                printf '%s\n' '<style>:root{color-scheme:dark}body{margin:0;font-family:ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Arial;background:#0b0f19;color:#e5e7eb}.wrap{max-width:960px;margin:0 auto;padding:32px 20px}.card{background:#111827;border:1px solid #1f2937;border-radius:12px;padding:20px}h1{font-size:18px;margin:0 0 12px}p{margin:0 0 12px;color:#cbd5e1}pre{white-space:pre-wrap;word-break:break-word;background:#0b1220;border:1px solid #1f2937;border-radius:10px;padding:12px;color:#e5e7eb}.muted{color:#94a3b8;font-size:13px}</style></head><body>'
                printf '%s\n' '<div class="wrap"><div class="card">'
                printf '%s\n' '<h1>Laravel dependency install failed</h1>'
                printf '%s\n' '<p>This service could not run <code>composer install</code>.</p>'
                printf '%s\n' "<p><strong>Current PHP:</strong> ${CURRENT}</p>"
                printf '%s\n' "<p><strong>Requirement:</strong> ${REQUIRED}</p>"
                printf '%s\n' '<p class="muted">Fix: In Coolify, set this service PHP Version to a compatible value (for copiservi use 8.3 or newer) and redeploy.</p>'
                printf '%s\n' '<pre>'
                printf '%s\n' "$COMPOSER_OUTPUT"
                printf '%s\n' '</pre></div></div></body></html>'
              } > /var/www/html/public/_coolify_error.html
            fi
          fi

          DB_NAME="${SERVICE_DATABASE_LARAVEL:-${MYSQL_DATABASE:-laravel}}"
          DB_USER="${SERVICE_USER_LARAVEL:-${MYSQL_USER:-laravel}}"
          DB_PASSWORD="${SERVICE_PASSWORD_LARAVEL:-${MYSQL_PASSWORD:-password}}"

          if [ ! -f .env ]; then
             if [ -f .env.example ]; then
               cp .env.example .env
             else
               touch .env
             fi
             echo "" >> .env
             echo "DB_CONNECTION=mysql" >> .env
             echo "DB_HOST=mariadb" >> .env
             echo "DB_PORT=3306" >> .env
             echo "DB_DATABASE=${DB_NAME}" >> .env
             echo "DB_USERNAME=${DB_USER}" >> .env
             echo "DB_PASSWORD=${DB_PASSWORD}" >> .env
             echo "APP_URL=${SERVICE_PUBLIC_URL}" >> .env
          fi

          upsert_env() {
            key="$1"
            value="$2"
            escaped_value=$(printf '%s\n' "$value" | sed 's/[\/&]/\\&/g')
            if grep -Eq "^${key}=" .env; then
              sed -i "s/^${key}=.*/${key}=${escaped_value}/" .env
            else
              echo "${key}=${value}" >> .env
            fi
          }

          upsert_env "APP_KEY" ""
          upsert_env "APP_URL" "${SERVICE_PUBLIC_URL}"
          upsert_env "DB_CONNECTION" "mysql"
          upsert_env "DB_HOST" "mariadb"
          upsert_env "DB_PORT" "3306"
          upsert_env "DB_DATABASE" "${DB_NAME}"
          upsert_env "DB_USERNAME" "${DB_USER}"
          upsert_env "DB_PASSWORD" "${DB_PASSWORD}"

          if [ -f artisan ]; then
            echo "Running Laravel setup tasks..."
            php artisan key:generate --force || true
            php artisan optimize:clear || true
            DB_CONNECTION=mysql \
              DB_HOST=mariadb \
              DB_PORT=3306 \
              DB_DATABASE="${DB_NAME}" \
              DB_USERNAME="${DB_USER}" \
              DB_PASSWORD="${DB_PASSWORD}" \
              php artisan migrate --force || true
          fi

          mkdir -p /var/www/html/storage/logs
          mkdir -p /var/www/html/storage/framework/cache
          mkdir -p /var/www/html/storage/framework/sessions
          mkdir -p /var/www/html/storage/framework/views
          mkdir -p /var/www/html/bootstrap/cache

          chown -R www-data:www-data /var/www/html
          chmod -R 775 /var/www/html/storage
          chmod -R 775 /var/www/html/bootstrap/cache

          max_wait=300
          waited=0
          while [ ! -f /var/www/html/artisan ]; do
            if [ $waited -ge $max_wait ]; then
              echo "WARNING: Laravel not ready after ${max_wait}s. Starting anyway so nginx can show an error page."
              mkdir -p /var/www/html/public
              if [ ! -f /var/www/html/public/_coolify_error.html ]; then
                {
                  printf '%s\n' '<!doctype html>'
                  printf '%s\n' '<html lang="en"><head><meta charset="utf-8" />'
                  printf '%s\n' '<meta name="viewport" content="width=device-width, initial-scale=1" />'
                  printf '%s\n' '<title>Coolify: Laravel not ready</title>'
                  printf '%s\n' '<style>:root{color-scheme:dark}body{margin:0;font-family:ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Arial;background:#0b0f19;color:#e5e7eb}.wrap{max-width:960px;margin:0 auto;padding:32px 20px}.card{background:#111827;border:1px solid #1f2937;border-radius:12px;padding:20px}h1{font-size:18px;margin:0 0 12px}p{margin:0 0 12px;color:#cbd5e1}.muted{color:#94a3b8;font-size:13px}</style></head><body>'
                  printf '%s\n' '<div class="wrap"><div class="card">'
                  printf '%s\n' '<h1>Laravel is not ready yet</h1>'
                  printf '%s\n' '<p>The application did not finish installing (no <code>artisan</code> file found).</p>'
                  printf '%s\n' '<p class="muted">Check the Laravel container logs in Coolify for the installation error and redeploy.</p>'
                  printf '%s\n' '</div></div></body></html>'
                } > /var/www/html/public/_coolify_error.html
              fi
              break
            fi
            sleep 2
            waited=$((waited + 2))
          done
          if [ -f /var/www/html/artisan ]; then
            echo "Laravel is ready!"
            rm -f /var/www/html/public/_coolify_error.html 2>/dev/null || true
          fi

          echo "Starting supervisor..."
          exec /usr/bin/supervisord -c /etc/supervisord.conf
    environment:
      - SERVICE_PUBLIC_URL=${SERVICE_URL_NGINX}
      - SERVICE_GITHUB_REPO_URL=$SERVICE_GITHUB_REPO_URL
      - SERVICE_PHP_VERSION=$SERVICE_PHP_VERSION
      - APP_NAME=Laravel RootKit
      - APP_ENV=production
      - APP_DEBUG=false
      - APP_URL=${SERVICE_URL_NGINX}
      - LOG_CHANNEL=stack
      - LOG_LEVEL=debug
      - DB_CONNECTION=mysql
      - DB_HOST=mariadb
      - DB_PORT=3306
      - DB_DATABASE=${SERVICE_DATABASE_LARAVEL}
      - DB_USERNAME=${SERVICE_USER_LARAVEL:-laravel}
      - DB_PASSWORD=${SERVICE_PASSWORD_LARAVEL:-password}
      - QUEUE_CONNECTION=database
      - CACHE_DRIVER=file
      - SESSION_DRIVER=file
    depends_on:
      mariadb:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "php-fpm -t >/dev/null 2>&1 && test -f /var/www/html/artisan && php -r \"exit(@fsockopen('127.0.0.1',9000)?0:1);\""]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 900s
    entrypoint: ["/bin/sh", "/entrypoint.sh"]

  nginx:
    image: nginx:alpine
    environment:
      - SERVICE_URL_NGINX_80
    entrypoint: ["/bin/sh", "-c"]
    command: >
      echo '[nginx] validating config' >&2;
      nginx -t ||
        ( echo '--- /etc/nginx/nginx.conf ---' >&2;
          cat /etc/nginx/nginx.conf >&2 || true;
          echo '--- /etc/nginx/conf.d/default.conf ---' >&2;
          cat /etc/nginx/conf.d/default.conf >&2 || true;
          exit 1
        );
      echo '[nginx] starting' >&2;
      exec nginx -g 'daemon off;'
    volumes:
      - laravel-files:/var/www/html:ro
      - type: bind
        source: ./nginx-main.conf
        target: /etc/nginx/nginx.conf
        content: |
          user nginx;
          worker_processes 1;
          error_log /dev/stderr warn;
          pid /var/run/nginx.pid;

          events {
              worker_connections 1024;
          }

          http {
              include /etc/nginx/mime.types;
              default_type application/octet-stream;
              aio off;
              aio_write off;
              sendfile off;
              directio off;
              keepalive_timeout 65;
              client_max_body_size 100M;
              include /etc/nginx/conf.d/*.conf;
          }
      - type: bind
        source: ./nginx.conf
        target: /etc/nginx/conf.d/default.conf
        content: |
          server {
              listen 80;
              server_name _;
              root /var/www/html/public;
              index index.php index.html;
              aio off;
              aio_write off;

              client_max_body_size 100M;

              access_log /dev/stdout;
              error_log /dev/stderr;

              resolver 127.0.0.11 ipv6=off valid=10s;
              set $php_upstream "laravel:9000";

              location / {
                  try_files /_coolify_error.html $uri $uri/ /index.php?$query_string;
              }

              location ~ \.php$ {
                  fastcgi_pass $php_upstream;
                  fastcgi_index index.php;
                  fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
                  include fastcgi_params;
                  fastcgi_read_timeout 300;
                  fastcgi_buffers 16 16k;
                  fastcgi_buffer_size 32k;
              }

              location ~ /\.(?!well-known).* {
                  deny all;
              }
          }
    depends_on:
      laravel:
        condition: service_started
    restart: unless-stopped
    expose:
      - "80"
    healthcheck:
      test: ["CMD-SHELL", "nginx -t >/dev/null 2>&1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  mariadb:
    image: mariadb:11
    volumes:
      - mariadb-data:/var/lib/mysql
    environment:
      - MYSQL_ROOT_PASSWORD=$SERVICE_PASSWORD_ROOT
      - MYSQL_DATABASE=${SERVICE_DATABASE_LARAVEL}
      - MYSQL_USER=${SERVICE_USER_LARAVEL:-laravel}
      - MYSQL_PASSWORD=${SERVICE_PASSWORD_LARAVEL:-password}
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 20s
      retries: 10

  phpmyadmin:
    image: phpmyadmin:latest
    environment:
      - SERVICE_URL_PHPMYADMIN
      - PMA_HOST=mariadb
      - PMA_USER=root
      - PMA_PASSWORD=$SERVICE_PASSWORD_ROOT
      - PMA_PORT=3306
      - PMA_ARBITRARY=0
      - PMA_ABSOLUTE_URI=$SERVICE_URL_PHPMYADMIN
      - UPLOAD_LIMIT=300M
    depends_on:
      mariadb:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "php -r 'exit((int)!@fsockopen(\"127.0.0.1\",80));'"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  laravel-files:
  mariadb-data:
