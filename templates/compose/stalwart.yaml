# documentation: https://stalw.art/docs/
# slogan: Modern mail server platform
# category: Mail
# tags: mail,smtp,imap,pop3,jmap,email,sieve,messaging
# logo: svgs/stalwart.svg
# port: 8080

services:
  stalwart:
    image: 'stalwartlabs/stalwart:v1.1.0'
    environment:
    - SERVICE_URL_STALWART_8080
    expose:
    - '8080'
    ports:
      - '25:25'
      - '465:465'
      - '587:587'
      - '993:993'
      - '995:995'
      - '143:143'
      - '110:110'
      - '4190:4190'
    volumes:
      - 'stalwart-mail:/etc/stalwart'
      - 'stalwart-data:/var/lib/stalwart'
      - '/etc/localtime:/etc/localtime:ro'
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/healthz/live || curl -fsSk https://127.0.0.1:443/healthz/live"]
      interval: 30s
      timeout: 10s
      retries: 3
