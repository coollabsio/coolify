# documentation: https://supabase.io
# slogan: The open source Firebase alternative.
# category: backend
# tags: firebase, alternative, open-source
# minversion: 4.0.0-beta.228
# logo: svgs/supabase.svg
# port: 8000

# Based on supabase/supabase v1.26.08 (docker/docker-compose.yml).
# Only supabase-kong is exposed publicly; every other service talks to the
# others over the internal Docker network.
services:

  # --- API gateway. Its public URL comes from SERVICE_URL_SUPABASEKONG_8000. -
  supabase-kong:
    image: kong/kong:3.9.3
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/home/kong/kong-entrypoint.sh"]
    depends_on:
      supabase-studio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "kong", "health"]
      interval: 5s
      timeout: 5s
      retries: 5
    environment:
      - SERVICE_URL_SUPABASEKONG_8000
      # This line has to stay above SUPABASE_ANON_KEY. Coolify signs both legacy
      # keys below with SERVICE_PASSWORD_JWT, and it can only do so once that
      # secret exists: it is created by the first `${SERVICE_PASSWORD_JWT}` the
      # parser meets. When that reference comes after the keys, Coolify creates
      # SERVICE_SUPABASEANON_KEY and SERVICE_SUPABASESERVICE_KEY empty and Kong
      # answers `Unauthorized` to every anonymous request.
      - JWT_SECRET=${SERVICE_PASSWORD_JWT}
      - KONG_DATABASE=off
      - KONG_DECLARATIVE_CONFIG=/usr/local/kong/kong.yml
      - KONG_ROUTER_FLAVOR=expressions
      # https://github.com/supabase/cli/issues/14
      - KONG_DNS_ORDER=LAST,A,CNAME
      - KONG_DNS_NOT_FOUND_TTL=1
      - KONG_DNS_VALID_TTL=5
      - KONG_PLUGINS=request-transformer,cors,key-auth,acl,basic-auth,request-termination,ip-restriction,post-function
      - KONG_NGINX_PROXY_PROXY_BUFFER_SIZE=160k
      - KONG_NGINX_PROXY_PROXY_BUFFERS=64 160k
      - 'KONG_PROXY_ACCESS_LOG=/dev/stdout combined'
      # Storage route: bigger uploads and downloads should not hit the Kong
      # default of 60 seconds. The entrypoint below substitutes these values
      # into kong.yml.
      - 'KONG_STORAGE_CONNECT_TIMEOUT=${KONG_STORAGE_CONNECT_TIMEOUT:-60}'
      - 'KONG_STORAGE_WRITE_TIMEOUT=${KONG_STORAGE_WRITE_TIMEOUT:-3600}'
      - 'KONG_STORAGE_READ_TIMEOUT=${KONG_STORAGE_READ_TIMEOUT:-3600}'
      - 'KONG_STORAGE_REQUEST_BUFFERING=${KONG_STORAGE_REQUEST_BUFFERING:-false}'
      - 'KONG_STORAGE_RESPONSE_BUFFERING=${KONG_STORAGE_RESPONSE_BUFFERING:-false}'
      # Legacy API keys (HS256 JWTs) signed with SERVICE_PASSWORD_JWT. Coolify
      # generates both of them as long as the secret above exists. When they come
      # out empty, remove them from the environment of this service and let the
      # compose file be parsed again. A key with the wrong signature still passes
      # Kong (`key-auth` only compares the string) but PostgREST rejects it with
      # PGRST301.
      - SUPABASE_ANON_KEY=${SERVICE_SUPABASEANON_KEY}
      - SUPABASE_SERVICE_KEY=${SERVICE_SUPABASESERVICE_KEY}
      # Opaque API keys. Leave empty to use only the legacy keys.
      - SUPABASE_PUBLISHABLE_KEY=${SUPABASE_PUBLISHABLE_KEY:-}
      - SUPABASE_SECRET_KEY=${SUPABASE_SECRET_KEY:-}
      - ANON_KEY_ASYMMETRIC=${ASYMMETRIC_ANON_KEY:-}
      - SERVICE_ROLE_KEY_ASYMMETRIC=${ASYMMETRIC_SERVICE_ROLE_KEY:-}
      # Basic auth credentials of the Studio dashboard (served at / by the gateway).
      - DASHBOARD_USERNAME=${SERVICE_USER_ADMIN}
      - DASHBOARD_PASSWORD=${SERVICE_PASSWORD_ADMIN}
    volumes:
      # Note: Coolify writes these files on the first deploy only.
      - type: bind
        source: ./volumes/api/kong-entrypoint.sh
        target: /home/kong/kong-entrypoint.sh
        content: |
          #!/bin/sh
          # Custom entrypoint for Kong that builds Lua expressions for request-transformer
          # and performs environment variable substitution in the declarative config.

          # Build Lua expressions for translating opaque API keys to asymmetric JWTs.
          # When opaque keys are not configured (empty env vars), expressions fall through
          # to legacy-only behavior - just passing apikey as-is.
          #
          # Full expression logic (when opaque keys are configured):
          #   1. If Authorization header exists and is NOT an sb_ key -> pass through (user session JWT)
          #   2. If apikey matches secret key -> set service_role asymmetric JWT internal "API key"
          #   3. If apikey matches publishable key -> set anon asymmetric JWT internal "API key"
          #   4. Fallback: pass apikey as-is (legacy HS256 JWT)

          if [ -n "$SUPABASE_SECRET_KEY" ] && [ -n "$SUPABASE_PUBLISHABLE_KEY" ]; then
              # Opaque keys configured -> full translation expressions
              export LUA_AUTH_EXPR="\$((headers.authorization ~= nil and headers.authorization:sub(1, 10) ~= 'Bearer sb_' and headers.authorization) or (headers.apikey == '$SUPABASE_SECRET_KEY' and 'Bearer $SERVICE_ROLE_KEY_ASYMMETRIC') or (headers.apikey == '$SUPABASE_PUBLISHABLE_KEY' and 'Bearer $ANON_KEY_ASYMMETRIC') or headers.apikey)"

              # Realtime WebSocket: reads from query_params.apikey (supabase-js sends apikey
              # via query string), outputs to x-api-key header which Realtime checks first.
              export LUA_RT_WS_EXPR="\$((query_params.apikey == '$SUPABASE_SECRET_KEY' and '$SERVICE_ROLE_KEY_ASYMMETRIC') or (query_params.apikey == '$SUPABASE_PUBLISHABLE_KEY' and '$ANON_KEY_ASYMMETRIC') or query_params.apikey)"
          else
              # Legacy API keys, not sb_ API keys -> pass apikey through unchanged
              export LUA_AUTH_EXPR="\$((headers.authorization ~= nil and headers.authorization:sub(1, 10) ~= 'Bearer sb_' and headers.authorization) or headers.apikey)"
              export LUA_RT_WS_EXPR="\$(query_params.apikey)"
          fi

          # Substitute environment variables in the Kong declarative config.
          # Uses awk instead of eval/echo to preserve YAML quoting (eval strips double
          # quotes, breaking "Header: value" patterns that YAML parses as mappings).
          awk '{
            result = ""
            rest = $0
            while (match(rest, /\$[A-Za-z_][A-Za-z_0-9]*/)) {
              varname = substr(rest, RSTART + 1, RLENGTH - 1)
              if (varname in ENVIRON) {
                result = result substr(rest, 1, RSTART - 1) ENVIRON[varname]
              } else {
                result = result substr(rest, 1, RSTART + RLENGTH - 1)
              }
              rest = substr(rest, RSTART + RLENGTH)
            }
            print result rest
          }' /home/kong/temp.yml > "$KONG_DECLARATIVE_CONFIG"

          # Remove empty key-auth credentials (unconfigured opaque keys)
          sed -i '/^[[:space:]]*- key:[[:space:]]*$/d' "$KONG_DECLARATIVE_CONFIG"

          exec /entrypoint.sh kong docker-start
      - type: bind
        source: ./volumes/api/kong.yml
        target: /home/kong/temp.yml
        content: |
          _format_version: '2.1'
          _transform: true

          ###
          ### Consumers / Users
          ###
          consumers:
            - username: DASHBOARD
            - username: anon
              keyauth_credentials:
                - key: $SUPABASE_ANON_KEY
                - key: $SUPABASE_PUBLISHABLE_KEY
            - username: service_role
              keyauth_credentials:
                - key: $SUPABASE_SERVICE_KEY
                - key: $SUPABASE_SECRET_KEY

          ###
          ### Access Control List
          ###
          acls:
            - consumer: anon
              group: anon
            - consumer: service_role
              group: admin

          ###
          ### Dashboard credentials
          ###
          basicauth_credentials:
            - consumer: DASHBOARD
              username: '$DASHBOARD_USERNAME'
              password: '$DASHBOARD_PASSWORD'

          ###
          ### API Routes
          ###
          services:
            ## Open Auth routes
            - name: auth-v1-open
              _comment: 'Auth: /auth/v1/verify* -> http://supabase-auth:9999/verify*'
              url: http://supabase-auth:9999/verify
              routes:
                - name: auth-v1-open
                  strip_path: true
                  paths:
                    - /auth/v1/verify
              plugins:
                - name: cors
            - name: auth-v1-open-callback
              _comment: 'Auth: /auth/v1/callback* -> http://supabase-auth:9999/callback*'
              url: http://supabase-auth:9999/callback
              routes:
                - name: auth-v1-open-callback
                  strip_path: true
                  paths:
                    - /auth/v1/callback
              plugins:
                - name: cors
            - name: auth-v1-open-authorize
              _comment: 'Auth: /auth/v1/authorize* -> http://supabase-auth:9999/authorize*'
              url: http://supabase-auth:9999/authorize
              routes:
                - name: auth-v1-open-authorize
                  strip_path: true
                  paths:
                    - /auth/v1/authorize
              plugins:
                - name: cors
            - name: auth-v1-open-jwks
              _comment: 'Auth: /auth/v1/.well-known/jwks.json -> http://supabase-auth:9999/.well-known/jwks.json'
              url: http://supabase-auth:9999/.well-known/jwks.json
              routes:
                - name: auth-v1-open-jwks
                  strip_path: true
                  paths:
                    - /auth/v1/.well-known/jwks.json
              plugins:
                - name: cors

            - name: auth-v1-open-sso-acs
              url: "http://supabase-auth:9999/sso/saml/acs"
              routes:
                - name: auth-v1-open-sso-acs
                  strip_path: true
                  paths:
                  - /auth/v1/sso/saml/acs
              plugins:
                - name: cors

            - name: auth-v1-open-sso-metadata
              url: "http://supabase-auth:9999/sso/saml/metadata"
              routes:
                - name: auth-v1-open-sso-metadata
                  strip_path: true
                  paths:
                  - /auth/v1/sso/saml/metadata
              plugins:
                - name: cors

            ## Secure Auth routes
            - name: auth-v1
              _comment: 'Auth: /auth/v1/* -> http://supabase-auth:9999/*'
              url: http://supabase-auth:9999/
              routes:
                - name: auth-v1-all
                  strip_path: true
                  paths:
                    - /auth/v1/
              plugins:
                - name: cors
                - name: key-auth
                  config:
                    hide_credentials: false
                - name: request-transformer
                  config:
                    add:
                      headers:
                        - "Authorization: $LUA_AUTH_EXPR"
                    replace:
                      headers:
                        - "Authorization: $LUA_AUTH_EXPR"
                - name: acl
                  config:
                    hide_groups_header: true
                    allow:
                      - admin
                      - anon

            ## OpenAPI root - admin only
            - name: rest-v1-openapi
              _comment: 'PostgREST OpenAPI root: /rest/v1/ -> <http://supabase-rest:3000/> (admin only). See <https://github.com/orgs/supabase/discussions/42949>'
              url: http://supabase-rest:3000/
              routes:
                - name: rest-v1-openapi-root
                  strip_path: true
                  expression: 'http.path == "/rest/v1/"'
              plugins:
                - name: cors
                - name: key-auth
                  config:
                    hide_credentials: false
                - name: request-transformer
                  config:
                    add:
                      headers:
                        - "Authorization: $LUA_AUTH_EXPR"
                    replace:
                      headers:
                        - "Authorization: $LUA_AUTH_EXPR"
                - name: acl
                  config:
                    hide_groups_header: true
                    allow:
                      - admin

            ## Secure PostgREST routes
            - name: rest-v1
              _comment: 'PostgREST: /rest/v1/* -> http://supabase-rest:3000/*'
              url: http://supabase-rest:3000/
              routes:
                - name: rest-v1-all
                  strip_path: true
                  paths:
                    - /rest/v1/
              plugins:
                - name: cors
                - name: key-auth
                  config:
                    hide_credentials: false
                - name: request-transformer
                  config:
                    add:
                      headers:
                        - "Authorization: $LUA_AUTH_EXPR"
                    replace:
                      headers:
                        - "Authorization: $LUA_AUTH_EXPR"
                - name: acl
                  config:
                    hide_groups_header: true
                    allow:
                      - admin
                      - anon

            ## Secure GraphQL routes
            - name: graphql-v1
              _comment: 'PostgREST: /graphql/v1/* -> http://supabase-rest:3000/rpc/graphql'
              url: http://supabase-rest:3000/rpc/graphql
              routes:
                - name: graphql-v1-all
                  strip_path: true
                  paths:
                    - /graphql/v1
              plugins:
                - name: cors
                - name: key-auth
                  config:
                    hide_credentials: false
                - name: request-transformer
                  config:
                    add:
                      headers:
                        - "Content-Profile: graphql_public"
                        - "Authorization: $LUA_AUTH_EXPR"
                    replace:
                      headers:
                        - "Authorization: $LUA_AUTH_EXPR"
                - name: acl
                  config:
                    hide_groups_header: true
                    allow:
                      - admin
                      - anon

            ## Secure Realtime routes
            - name: realtime-v1-ws
              _comment: 'Realtime: /realtime/v1/* -> ws://realtime:4000/socket/*'
              url: http://realtime-dev:4000/socket
              protocol: ws
              routes:
                - name: realtime-v1-ws
                  strip_path: true
                  paths:
                    - /realtime/v1/
              plugins:
                - name: cors
                - name: key-auth
                  config:
                    hide_credentials: false
                - name: request-transformer
                  config:
                    add:
                      headers:
                        - "x-api-key:$LUA_RT_WS_EXPR"
                    replace:
                      querystring:
                        - "apikey:$LUA_RT_WS_EXPR"
                - name: acl
                  config:
                    hide_groups_header: true
                    allow:
                      - admin
                      - anon

            # Block access to /realtime/v1/api/openapi
            - name: realtime-v1-rest-openapi
              _comment: 'Realtime: /realtime/v1/api/openapi/* -> http://realtime:4000/api/openapi/* (blocked)'
              url: http://realtime-dev:4000/api/openapi
              protocol: http
              routes:
                - name: realtime-v1-rest-openapi
                  strip_path: true
                  paths:
                    - /realtime/v1/api/openapi
              plugins:
                - name: request-termination
                  config:
                    status_code: 403
                    message: "Access is forbidden."

            # Block access to /realtime/v1/api/tenants
            - name: realtime-v1-rest-tenants
              _comment: 'Realtime: /realtime/v1/api/tenants/* -> http://realtime:4000/api/tenants/* (blocked)'
              url: http://realtime-dev:4000/api/tenants
              protocol: http
              routes:
                - name: realtime-v1-rest-tenants
                  strip_path: true
                  paths:
                    - /realtime/v1/api/tenants
              plugins:
                - name: request-termination
                  config:
                    status_code: 403
                    message: "Access is forbidden."

            - name: realtime-v1-rest
              _comment: 'Realtime: /realtime/v1/api/* -> http://realtime:4000/api/*'
              url: http://realtime-dev:4000/api
              protocol: http
              routes:
                - name: realtime-v1-rest
                  strip_path: true
                  paths:
                    - /realtime/v1/api
              plugins:
                - name: cors
                - name: key-auth
                  config:
                    hide_credentials: false
                - name: request-transformer
                  config:
                    add:
                      headers:
                        - "Authorization: $LUA_AUTH_EXPR"
                    replace:
                      headers:
                        - "Authorization: $LUA_AUTH_EXPR"
                - name: acl
                  config:
                    hide_groups_header: true
                    allow:
                      - admin
                      - anon

            ## Storage API endpoint (with Authorization header transformation).
            ## No key-auth - S3 protocol requests don't carry an apikey header.
            ##
            ## The request-transformer translates opaque API keys to asymmetric JWTs
            ## and passes through existing Authorization headers (user JWTs, AWS SigV4).
            ## When no Authorization or apikey header is present (S3 presigned URLs),
            ## the Lua expression evaluates to nil which Kong renders as empty string.
            ## The post-function strips this empty header so Storage's S3 signature
            ## verification falls through to query-parameter parsing.
            - name: storage-v1
              _comment: 'Storage: /storage/v1/* -> http://supabase-storage:5000/*'
              connect_timeout: $KONG_STORAGE_CONNECT_TIMEOUT
              write_timeout: $KONG_STORAGE_WRITE_TIMEOUT
              read_timeout: $KONG_STORAGE_READ_TIMEOUT
              url: http://supabase-storage:5000/
              routes:
                - name: storage-v1-all
                  strip_path: true
                  paths:
                    - /storage/v1/
                  request_buffering: $KONG_STORAGE_REQUEST_BUFFERING
                  response_buffering: $KONG_STORAGE_RESPONSE_BUFFERING
              plugins:
                - name: cors
                - name: request-transformer
                  config:
                    add:
                      headers:
                        - "Authorization: $LUA_AUTH_EXPR"
                    replace:
                      headers:
                        - "Authorization: $LUA_AUTH_EXPR"
                - name: post-function
                  config:
                    access:
                      - |
                        local auth = kong.request.get_header("authorization")
                        if auth == nil or auth == "" or auth:find("^%s*$") then
                          kong.service.request.clear_header("authorization")
                        end

            ## Edge Functions routes
            - name: functions-v1
              _comment: 'Edge Functions: /functions/v1/* -> http://supabase-edge-functions:9000/*'
              url: http://supabase-edge-functions:9000/
              read_timeout: 150000
              routes:
                - name: functions-v1-all
                  strip_path: true
                  paths:
                    - /functions/v1/
              plugins:
                - name: cors

            ## OAuth 2.0 Authorization Server Metadata (RFC 8414)
            - name: well-known-oauth
              _comment: 'Auth: /.well-known/oauth-authorization-server -> http://supabase-auth:9999/.well-known/oauth-authorization-server'
              url: http://supabase-auth:9999/.well-known/oauth-authorization-server
              routes:
                - name: well-known-oauth
                  strip_path: true
                  paths:
                    - /.well-known/oauth-authorization-server
              plugins:
                - name: cors

            ## Analytics routes
            ## Not used - Studio and Vector talk directly to analytics via Docker networking.
            ## If external access is needed, add routes with key-auth matching Logflare's x-api-key auth.
            # - name: analytics-v1-api
            #   _comment: 'Analytics: /analytics/v1/api/endpoints/* -> http://logflare:4000/api/endpoints/*'
            #   url: http://analytics:4000/api/endpoints
            #   routes:
            #     - name: analytics-v1-api
            #       strip_path: true
            #       paths:
            #         - /analytics/v1/api/endpoints/
            # - name: analytics-v1
            #   _comment: 'Analytics: /analytics/v1/* -> http://logflare:4000/*'
            #   url: http://analytics:4000/
            #   routes:
            #     - name: dashboard-v1-all
            #       strip_path: true
            #       paths:
            #         - /analytics/v1
            #   plugins:
            #     - name: cors
            #     - name: basic-auth
            #       config:
            #         hide_credentials: true

            ## Secure Database routes
            - name: meta
              _comment: 'pg-meta: /pg/* -> http://supabase-meta:8080/*'
              url: http://supabase-meta:8080/
              routes:
                - name: meta-all
                  strip_path: true
                  paths:
                    - /pg/
              plugins:
                - name: key-auth
                  config:
                    hide_credentials: false
                - name: acl
                  config:
                    hide_groups_header: true
                    allow:
                      - admin

            ## Block access to /api/mcp
            - name: mcp-blocker
              _comment: 'Block direct access to /api/mcp'
              url: http://supabase-studio:3000/api/mcp
              routes:
                - name: mcp-blocker-route
                  strip_path: true
                  paths:
                    - /api/mcp
              plugins:
                - name: request-termination
                  config:
                    status_code: 403
                    message: "Access is forbidden."

            ## MCP endpoint - local access
            - name: mcp
              _comment: 'MCP: /mcp -> http://supabase-studio:3000/api/mcp (local access)'
              url: http://supabase-studio:3000/api/mcp
              routes:
                - name: mcp
                  strip_path: true
                  paths:
                    - /mcp
              plugins:
                # Block access to /mcp by default
                - name: request-termination
                  config:
                    status_code: 403
                    message: "Access is forbidden."
                # Enable local access (danger zone!)
                # 1. Comment out the 'request-termination' section above
                # 2. Uncomment the entire section below, including 'deny'
                # 3. Add your local IPs to the 'allow' list
                #- name: cors
                #- name: ip-restriction
                #  config:
                #    allow:
                #      - 127.0.0.1
                #      - ::1
                #    deny: []

            ## Protected Dashboard - catch all remaining routes
            - name: dashboard
              _comment: 'Studio: /* -> http://supabase-studio:3000/*'
              url: http://supabase-studio:3000/
              routes:
                - name: dashboard-all
                  strip_path: true
                  paths:
                    - /
              plugins:
                - name: cors
                - name: basic-auth
                  config:
                    hide_credentials: true

  # --- Studio (dashboard). Served at / behind the gateway. -------------------
  supabase-studio:
    image: supabase/studio:2026.08.03-sha-022b374
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://localhost:3000/api/platform/profile').then((r) => {if (r.status !== 200) throw new Error(r.status)})\""
        ]
      timeout: 10s
      interval: 5s
      retries: 3
      start_period: 20s
    environment:
      # Listen on every IPv4 interface.
      - HOSTNAME=0.0.0.0
      - STUDIO_PG_META_URL=http://supabase-meta:8080
      - POSTGRES_HOST=supabase-db
      - POSTGRES_PORT=${POSTGRES_PORT:-5432}
      - POSTGRES_DB=${POSTGRES_DB:-postgres}
      - POSTGRES_PASSWORD=${SERVICE_PASSWORD_POSTGRES}
      # See https://supabase.com/docs/guides/self-hosting/remove-superuser-access
      - POSTGRES_USER_READ_WRITE=postgres
      - PG_META_CRYPTO_KEY=${SERVICE_PASSWORD_PGMETACRYPTO}
      - 'PGRST_DB_SCHEMAS=${PGRST_DB_SCHEMAS:-public,storage,graphql_public}'
      - PGRST_DB_MAX_ROWS=${PGRST_DB_MAX_ROWS:-1000}
      - PGRST_DB_EXTRA_SEARCH_PATH=${PGRST_DB_EXTRA_SEARCH_PATH:-public}
      - 'DEFAULT_ORGANIZATION_NAME=${STUDIO_DEFAULT_ORGANIZATION:-Default Organization}'
      - 'DEFAULT_PROJECT_NAME=${STUDIO_DEFAULT_PROJECT:-Default Project}'
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - SUPABASE_URL=http://supabase-kong:8000
      - SUPABASE_PUBLIC_URL=${SERVICE_URL_SUPABASEKONG_8000}
      - SUPABASE_ANON_KEY=${SERVICE_SUPABASEANON_KEY}
      - SUPABASE_SERVICE_KEY=${SERVICE_SUPABASESERVICE_KEY}
      - AUTH_JWT_SECRET=${SERVICE_PASSWORD_JWT}
      - SUPABASE_PUBLISHABLE_KEY=${SUPABASE_PUBLISHABLE_KEY:-}
      - SUPABASE_SECRET_KEY=${SUPABASE_SECRET_KEY:-}
      # Logflare/Vector are not part of this stack.
      - ENABLED_FEATURES_LOGS_ALL=false
      - SNIPPETS_MANAGEMENT_FOLDER=/app/snippets
      - EDGE_FUNCTIONS_MANAGEMENT_FOLDER=/app/edge-functions
    volumes:
      - supabase-snippets:/app/snippets
      - supabase-functions:/app/edge-functions:ro

  # --- Postgres 17 with the Supabase extensions. -----------------------------
  supabase-db:
    image: supabase/postgres:17.6.1.136
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10
    command:
      - postgres
      - -c
      - config_file=/etc/postgresql/postgresql.conf
      - -c
      - log_min_messages=fatal
    environment:
      - POSTGRES_HOST=/var/run/postgresql
      - PGPORT=${POSTGRES_PORT:-5432}
      - POSTGRES_PORT=${POSTGRES_PORT:-5432}
      - PGPASSWORD=${SERVICE_PASSWORD_POSTGRES}
      - POSTGRES_PASSWORD=${SERVICE_PASSWORD_POSTGRES}
      - PGDATABASE=${POSTGRES_DB:-postgres}
      - POSTGRES_DB=${POSTGRES_DB:-postgres}
      - JWT_SECRET=${SERVICE_PASSWORD_JWT}
      - JWT_EXP=${JWT_EXPIRY:-3600}
    volumes:
      - supabase-db-data:/var/lib/postgresql/data
      # Keeps the pgsodium key between restarts.
      - supabase-db-config:/etc/postgresql-custom
      # The order of init-scripts/ and migrations/ matches upstream.
      - type: bind
        source: ./volumes/db/_supabase.sql
        target: /docker-entrypoint-initdb.d/migrations/97-_supabase.sql
        content: |
          \set pguser `echo "$POSTGRES_USER"`

          CREATE DATABASE _supabase WITH OWNER :pguser;
      - type: bind
        source: ./volumes/db/realtime.sql
        target: /docker-entrypoint-initdb.d/migrations/99-realtime.sql
        content: |
          \set pguser `echo "$POSTGRES_USER"`

          create schema if not exists _realtime;
          alter schema _realtime owner to :pguser;
      - type: bind
        source: ./volumes/db/logs.sql
        target: /docker-entrypoint-initdb.d/migrations/99-logs.sql
        content: |
          \set pguser `echo "$POSTGRES_USER"`

          \c _supabase
          create schema if not exists _analytics;
          alter schema _analytics owner to :pguser;
          \c postgres
      - type: bind
        source: ./volumes/db/pooler.sql
        target: /docker-entrypoint-initdb.d/migrations/99-pooler.sql
        content: |
          \set pguser `echo "$POSTGRES_USER"`

          \c _supabase
          create schema if not exists _supavisor;
          alter schema _supavisor owner to :pguser;
          \c postgres
      - type: bind
        source: ./volumes/db/webhooks.sql
        target: /docker-entrypoint-initdb.d/init-scripts/98-webhooks.sql
        content: |
          BEGIN;
            -- Create pg_net extension
            CREATE EXTENSION IF NOT EXISTS pg_net SCHEMA extensions;
            -- Create supabase_functions schema
            CREATE SCHEMA supabase_functions AUTHORIZATION supabase_admin;
            GRANT USAGE ON SCHEMA supabase_functions TO postgres, anon, authenticated, service_role;
            ALTER DEFAULT PRIVILEGES IN SCHEMA supabase_functions GRANT ALL ON TABLES TO postgres, anon, authenticated, service_role;
            ALTER DEFAULT PRIVILEGES IN SCHEMA supabase_functions GRANT ALL ON FUNCTIONS TO postgres, anon, authenticated, service_role;
            ALTER DEFAULT PRIVILEGES IN SCHEMA supabase_functions GRANT ALL ON SEQUENCES TO postgres, anon, authenticated, service_role;
            -- supabase_functions.migrations definition
            CREATE TABLE supabase_functions.migrations (
              version text PRIMARY KEY,
              inserted_at timestamptz NOT NULL DEFAULT NOW()
            );
            -- Initial supabase_functions migration
            INSERT INTO supabase_functions.migrations (version) VALUES ('initial');
            -- supabase_functions.hooks definition
            CREATE TABLE supabase_functions.hooks (
              id bigserial PRIMARY KEY,
              hook_table_id integer NOT NULL,
              hook_name text NOT NULL,
              created_at timestamptz NOT NULL DEFAULT NOW(),
              request_id bigint
            );
            CREATE INDEX supabase_functions_hooks_request_id_idx ON supabase_functions.hooks USING btree (request_id);
            CREATE INDEX supabase_functions_hooks_h_table_id_h_name_idx ON supabase_functions.hooks USING btree (hook_table_id, hook_name);
            COMMENT ON TABLE supabase_functions.hooks IS 'Supabase Functions Hooks: Audit trail for triggered hooks.';
            CREATE FUNCTION supabase_functions.http_request()
              RETURNS trigger
              LANGUAGE plpgsql
              AS $function$
              DECLARE
                request_id bigint;
                payload jsonb;
                url text := TG_ARGV[0]::text;
                method text := TG_ARGV[1]::text;
                headers jsonb DEFAULT '{}'::jsonb;
                params jsonb DEFAULT '{}'::jsonb;
                timeout_ms integer DEFAULT 1000;
              BEGIN
                IF url IS NULL OR url = 'null' THEN
                  RAISE EXCEPTION 'url argument is missing';
                END IF;

                IF method IS NULL OR method = 'null' THEN
                  RAISE EXCEPTION 'method argument is missing';
                END IF;

                IF TG_ARGV[2] IS NULL OR TG_ARGV[2] = 'null' THEN
                  headers = '{"Content-Type": "application/json"}'::jsonb;
                ELSE
                  headers = TG_ARGV[2]::jsonb;
                END IF;

                IF TG_ARGV[3] IS NULL OR TG_ARGV[3] = 'null' THEN
                  params = '{}'::jsonb;
                ELSE
                  params = TG_ARGV[3]::jsonb;
                END IF;

                IF TG_ARGV[4] IS NULL OR TG_ARGV[4] = 'null' THEN
                  timeout_ms = 1000;
                ELSE
                  timeout_ms = TG_ARGV[4]::integer;
                END IF;

                CASE
                  WHEN method = 'GET' THEN
                    SELECT http_get INTO request_id FROM net.http_get(
                      url,
                      params,
                      headers,
                      timeout_ms
                    );
                  WHEN method = 'POST' THEN
                    payload = jsonb_build_object(
                      'old_record', OLD,
                      'record', NEW,
                      'type', TG_OP,
                      'table', TG_TABLE_NAME,
                      'schema', TG_TABLE_SCHEMA
                    );

                    SELECT http_post INTO request_id FROM net.http_post(
                      url,
                      payload,
                      params,
                      headers,
                      timeout_ms
                    );
                  ELSE
                    RAISE EXCEPTION 'method argument % is invalid', method;
                END CASE;

                INSERT INTO supabase_functions.hooks
                  (hook_table_id, hook_name, request_id)
                VALUES
                  (TG_RELID, TG_NAME, request_id);

                RETURN NEW;
              END
            $function$;
            -- Supabase super admin
            DO
            $$
            BEGIN
              IF NOT EXISTS (
                SELECT 1
                FROM pg_roles
                WHERE rolname = 'supabase_functions_admin'
              )
              THEN
                CREATE USER supabase_functions_admin NOINHERIT CREATEROLE LOGIN NOREPLICATION;
              END IF;
            END
            $$;
            GRANT ALL PRIVILEGES ON SCHEMA supabase_functions TO supabase_functions_admin;
            GRANT ALL PRIVILEGES ON ALL TABLES IN SCHEMA supabase_functions TO supabase_functions_admin;
            GRANT ALL PRIVILEGES ON ALL SEQUENCES IN SCHEMA supabase_functions TO supabase_functions_admin;
            ALTER USER supabase_functions_admin SET search_path = "supabase_functions";
            ALTER table "supabase_functions".migrations OWNER TO supabase_functions_admin;
            ALTER table "supabase_functions".hooks OWNER TO supabase_functions_admin;
            ALTER function "supabase_functions".http_request() OWNER TO supabase_functions_admin;
            GRANT supabase_functions_admin TO postgres;
            -- Remove unused supabase_pg_net_admin role
            DO
            $$
            BEGIN
              IF EXISTS (
                SELECT 1
                FROM pg_roles
                WHERE rolname = 'supabase_pg_net_admin'
              )
              THEN
                REASSIGN OWNED BY supabase_pg_net_admin TO supabase_admin;
                DROP OWNED BY supabase_pg_net_admin;
                DROP ROLE supabase_pg_net_admin;
              END IF;
            END
            $$;
            -- pg_net grants when extension is already enabled
            DO
            $$
            BEGIN
              IF EXISTS (
                SELECT 1
                FROM pg_extension
                WHERE extname = 'pg_net'
              )
              THEN
                GRANT USAGE ON SCHEMA net TO supabase_functions_admin, postgres, anon, authenticated, service_role;
                ALTER function net.http_get(url text, params jsonb, headers jsonb, timeout_milliseconds integer) SECURITY DEFINER;
                ALTER function net.http_post(url text, body jsonb, params jsonb, headers jsonb, timeout_milliseconds integer) SECURITY DEFINER;
                ALTER function net.http_get(url text, params jsonb, headers jsonb, timeout_milliseconds integer) SET search_path = net;
                ALTER function net.http_post(url text, body jsonb, params jsonb, headers jsonb, timeout_milliseconds integer) SET search_path = net;
                REVOKE ALL ON FUNCTION net.http_get(url text, params jsonb, headers jsonb, timeout_milliseconds integer) FROM PUBLIC;
                REVOKE ALL ON FUNCTION net.http_post(url text, body jsonb, params jsonb, headers jsonb, timeout_milliseconds integer) FROM PUBLIC;
                GRANT EXECUTE ON FUNCTION net.http_get(url text, params jsonb, headers jsonb, timeout_milliseconds integer) TO supabase_functions_admin, postgres, anon, authenticated, service_role;
                GRANT EXECUTE ON FUNCTION net.http_post(url text, body jsonb, params jsonb, headers jsonb, timeout_milliseconds integer) TO supabase_functions_admin, postgres, anon, authenticated, service_role;
              END IF;
            END
            $$;
            -- Event trigger for pg_net
            CREATE OR REPLACE FUNCTION extensions.grant_pg_net_access()
            RETURNS event_trigger
            LANGUAGE plpgsql
            AS $$
            BEGIN
              IF EXISTS (
                SELECT 1
                FROM pg_event_trigger_ddl_commands() AS ev
                JOIN pg_extension AS ext
                ON ev.objid = ext.oid
                WHERE ext.extname = 'pg_net'
              )
              THEN
                GRANT USAGE ON SCHEMA net TO supabase_functions_admin, postgres, anon, authenticated, service_role;
                ALTER function net.http_get(url text, params jsonb, headers jsonb, timeout_milliseconds integer) SECURITY DEFINER;
                ALTER function net.http_post(url text, body jsonb, params jsonb, headers jsonb, timeout_milliseconds integer) SECURITY DEFINER;
                ALTER function net.http_get(url text, params jsonb, headers jsonb, timeout_milliseconds integer) SET search_path = net;
                ALTER function net.http_post(url text, body jsonb, params jsonb, headers jsonb, timeout_milliseconds integer) SET search_path = net;
                REVOKE ALL ON FUNCTION net.http_get(url text, params jsonb, headers jsonb, timeout_milliseconds integer) FROM PUBLIC;
                REVOKE ALL ON FUNCTION net.http_post(url text, body jsonb, params jsonb, headers jsonb, timeout_milliseconds integer) FROM PUBLIC;
                GRANT EXECUTE ON FUNCTION net.http_get(url text, params jsonb, headers jsonb, timeout_milliseconds integer) TO supabase_functions_admin, postgres, anon, authenticated, service_role;
                GRANT EXECUTE ON FUNCTION net.http_post(url text, body jsonb, params jsonb, headers jsonb, timeout_milliseconds integer) TO supabase_functions_admin, postgres, anon, authenticated, service_role;
              END IF;
            END;
            $$;
            COMMENT ON FUNCTION extensions.grant_pg_net_access IS 'Grants access to pg_net';
            DO
            $$
            BEGIN
              IF NOT EXISTS (
                SELECT 1
                FROM pg_event_trigger
                WHERE evtname = 'issue_pg_net_access'
              ) THEN
                CREATE EVENT TRIGGER issue_pg_net_access ON ddl_command_end WHEN TAG IN ('CREATE EXTENSION')
                EXECUTE PROCEDURE extensions.grant_pg_net_access();
              END IF;
            END
            $$;
            INSERT INTO supabase_functions.migrations (version) VALUES ('20210809183423_update_grants');
            ALTER function supabase_functions.http_request() SECURITY DEFINER;
            ALTER function supabase_functions.http_request() SET search_path = supabase_functions;
            REVOKE ALL ON FUNCTION supabase_functions.http_request() FROM PUBLIC;
            GRANT EXECUTE ON FUNCTION supabase_functions.http_request() TO postgres, anon, authenticated, service_role;
          COMMIT;
      - type: bind
        source: ./volumes/db/roles.sql
        target: /docker-entrypoint-initdb.d/init-scripts/99-roles.sql
        content: |
          -- NOTE: change to your own passwords for production environments
          \set pgpass `echo "$POSTGRES_PASSWORD"`

          ALTER USER authenticator WITH PASSWORD :'pgpass';
          ALTER USER pgbouncer WITH PASSWORD :'pgpass';
          ALTER USER supabase_auth_admin WITH PASSWORD :'pgpass';
          ALTER USER supabase_functions_admin WITH PASSWORD :'pgpass';
          ALTER USER supabase_storage_admin WITH PASSWORD :'pgpass';
      - type: bind
        source: ./volumes/db/jwt.sql
        target: /docker-entrypoint-initdb.d/init-scripts/99-jwt.sql
        content: |
          \set jwt_secret `echo "$JWT_SECRET"`
          \set jwt_exp `echo "$JWT_EXP"`

          ALTER DATABASE postgres SET "app.settings.jwt_secret" TO :'jwt_secret';
          ALTER DATABASE postgres SET "app.settings.jwt_exp" TO :'jwt_exp';

  # --- Auth (GoTrue): accounts, sessions, email, OAuth. ----------------------
  supabase-auth:
    image: supabase/gotrue:v2.189.0
    restart: unless-stopped
    depends_on:
      supabase-db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://127.0.0.1:9999/health"
        ]
      timeout: 5s
      interval: 5s
      retries: 3
    environment:
      - GOTRUE_API_HOST=0.0.0.0
      - GOTRUE_API_PORT=9999
      # Note: the /auth/v1 suffix belongs here.
      - GOTRUE_DB_DRIVER=postgres
      - GOTRUE_DB_DATABASE_URL=postgres://supabase_auth_admin:${SERVICE_PASSWORD_POSTGRES}@supabase-db:${POSTGRES_PORT:-5432}/${POSTGRES_DB:-postgres}
      - 'API_EXTERNAL_URL=${API_EXTERNAL_URL:-${SERVICE_URL_SUPABASEKONG_8000}/auth/v1}'
      # Site URL and redirect URLs of your own app.
      - 'GOTRUE_SITE_URL=${SITE_URL:-${SERVICE_URL_SUPABASEKONG_8000}}'
      - 'GOTRUE_URI_ALLOW_LIST=${ADDITIONAL_REDIRECT_URLS:-}'
      - 'GOTRUE_DISABLE_SIGNUP=${DISABLE_SIGNUP:-false}'
      - GOTRUE_JWT_ADMIN_ROLES=service_role
      - GOTRUE_JWT_AUD=authenticated
      - GOTRUE_JWT_DEFAULT_GROUP_NAME=authenticated
      - 'GOTRUE_JWT_EXP=${JWT_EXPIRY:-3600}'
      - GOTRUE_JWT_SECRET=${SERVICE_PASSWORD_JWT}
      - 'GOTRUE_JWT_ISSUER=${API_EXTERNAL_URL:-${SERVICE_URL_SUPABASEKONG_8000}/auth/v1}'
      - 'GOTRUE_EXTERNAL_EMAIL_ENABLED=${ENABLE_EMAIL_SIGNUP:-true}'
      - 'GOTRUE_EXTERNAL_ANONYMOUS_USERS_ENABLED=${ENABLE_ANONYMOUS_USERS:-false}'
      - 'GOTRUE_MAILER_AUTOCONFIRM=${ENABLE_EMAIL_AUTOCONFIRM:-false}'
      # Mailserver. Without it Supabase sends no confirmation or magic-link mail,
      # so fill in `SMTP_HOST` (and `SMTP_USER`/`SMTP_PASS` when your relay
      # authenticates) in the environment of this service. `SMTP_ADMIN_EMAIL` is
      # the From address, `SMTP_SENDER_NAME` the name the recipient sees. For
      # development without a mailserver you can set
      # `ENABLE_EMAIL_AUTOCONFIRM=true` instead.
      - 'GOTRUE_SMTP_ADMIN_EMAIL=${SMTP_ADMIN_EMAIL:-}'
      - 'GOTRUE_SMTP_HOST=${SMTP_HOST:-}'
      - 'GOTRUE_SMTP_PORT=${SMTP_PORT:-587}'
      - 'GOTRUE_SMTP_USER=${SMTP_USER:-}'
      - 'GOTRUE_SMTP_PASS=${SMTP_PASS:-}'
      - 'GOTRUE_SMTP_SENDER_NAME=${SMTP_SENDER_NAME:-Supabase}'
      - 'GOTRUE_MAILER_URLPATHS_INVITE=${MAILER_URLPATHS_INVITE:-/auth/v1/verify}'
      - 'GOTRUE_MAILER_URLPATHS_CONFIRMATION=${MAILER_URLPATHS_CONFIRMATION:-/auth/v1/verify}'
      - 'GOTRUE_MAILER_URLPATHS_RECOVERY=${MAILER_URLPATHS_RECOVERY:-/auth/v1/verify}'
      - 'GOTRUE_MAILER_URLPATHS_EMAIL_CHANGE=${MAILER_URLPATHS_EMAIL_CHANGE:-/auth/v1/verify}'
      # Custom mail templates. GoTrue fetches them over HTTP and appends a path
      # without `http` to SITE_URL, so `/mails/magic_link.html` is fetched from
      # `https://your-site/mails/magic_link.html`. Empty means the built-in
      # English mail, which is what a fresh install gets. Only these two are ever
      # sent by this stack; invite, recovery and email_change are never triggered.
      - 'GOTRUE_MAILER_TEMPLATES_MAGIC_LINK=${MAILER_TEMPLATES_MAGIC_LINK:-}'
      - 'GOTRUE_MAILER_SUBJECTS_MAGIC_LINK=${MAILER_SUBJECTS_MAGIC_LINK:-}'
      - 'GOTRUE_MAILER_TEMPLATES_CONFIRMATION=${MAILER_TEMPLATES_CONFIRMATION:-}'
      - 'GOTRUE_MAILER_SUBJECTS_CONFIRMATION=${MAILER_SUBJECTS_CONFIRMATION:-}'
      - 'GOTRUE_EXTERNAL_PHONE_ENABLED=${ENABLE_PHONE_SIGNUP:-true}'
      - 'GOTRUE_SMS_AUTOCONFIRM=${ENABLE_PHONE_AUTOCONFIRM:-true}'

  # --- PostgREST: automatic REST and GraphQL API on top of the schema. ------
  supabase-rest:
    image: postgrest/postgrest:v14.12
    restart: unless-stopped
    depends_on:
      supabase-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "postgrest", "--ready"]
      interval: 5s
      timeout: 5s
      retries: 3
    environment:
      - PGRST_DB_URI=postgres://authenticator:${SERVICE_PASSWORD_POSTGRES}@supabase-db:${POSTGRES_PORT:-5432}/${POSTGRES_DB:-postgres}
      - 'PGRST_DB_SCHEMAS=${PGRST_DB_SCHEMAS:-public,storage,graphql_public}'
      - PGRST_DB_MAX_ROWS=${PGRST_DB_MAX_ROWS:-1000}
      - PGRST_DB_EXTRA_SEARCH_PATH=${PGRST_DB_EXTRA_SEARCH_PATH:-public}
      - PGRST_DB_ANON_ROLE=anon
      - PGRST_ADMIN_SERVER_PORT=3001
      - PGRST_ADMIN_SERVER_HOST=localhost
      # Note: do not use ${JWT_JWKS:-...} here. Coolify turns every ${...} into a
      # variable for the whole resource, so it ends up in the Storage, Realtime
      # and Edge Functions containers as well. Storage runs JSON.parse on
      # JWT_JWKS and crashes on the JWT secret.
      - PGRST_JWT_SECRET=${SERVICE_PASSWORD_JWT}
      - PGRST_DB_USE_LEGACY_GUCS=false
      - PGRST_APP_SETTINGS_JWT_SECRET=${SERVICE_PASSWORD_JWT}
      - 'PGRST_APP_SETTINGS_JWT_EXP=${JWT_EXPIRY:-3600}'
    command:
      - postgrest

  # --- Realtime: websockets, broadcast and presence. ------------------------
  # The service name has to stay realtime-dev: Realtime derives its tenant from it.
  realtime-dev:
    image: supabase/realtime:v2.102.3
    restart: unless-stopped
    depends_on:
      supabase-db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -sSfL --head -o /dev/null -H \"Authorization: Bearer ${SERVICE_SUPABASEANON_KEY}\" http://localhost:4000/api/tenants/realtime-dev/health"
        ]
      timeout: 5s
      interval: 30s
      retries: 3
      start_period: 10s
    environment:
      - PORT=4000
      - DB_HOST=supabase-db
      - DB_PORT=${POSTGRES_PORT:-5432}
      - DB_USER=supabase_admin
      - DB_PASSWORD=${SERVICE_PASSWORD_POSTGRES}
      - DB_NAME=${POSTGRES_DB:-postgres}
      - DB_AFTER_CONNECT_QUERY=SET search_path TO _realtime
      # Has to be exactly 16 characters; only change it on a fresh install.
      - 'DB_ENC_KEY=${REALTIME_DB_ENC_KEY:-supabaserealtime}'
      - API_JWT_SECRET=${SERVICE_PASSWORD_JWT}
      - SECRET_KEY_BASE=${SERVICE_HEX_64_SECRETKEYBASE}
      - METRICS_JWT_SECRET=${SERVICE_PASSWORD_JWT}
      - ERL_AFLAGS=-proto_dist inet_tcp
      - DNS_NODES=''
      - RLIMIT_NOFILE=10000
      - APP_NAME=realtime
      - SEED_SELF_HOST=true
      - RUN_JANITOR=true
      - DISABLE_HEALTHCHECK_LOGGING=true
    command:
      - sh
      - -c
      - /app/bin/migrate && /app/bin/realtime eval 'Realtime.Release.seeds(Realtime.Repo)' && /app/bin/server

  # --- Storage: files (avatars, photos) in a local volume. ------------------
  supabase-storage:
    image: supabase/storage-api:v1.60.4
    restart: unless-stopped
    depends_on:
      supabase-db:
        condition: service_healthy
      supabase-rest:
        condition: service_started
      supabase-imgproxy:
        condition: service_started
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://127.0.0.1:5000/status"
        ]
      timeout: 5s
      interval: 5s
      retries: 3
      start_period: 10s
    environment:
      - ANON_KEY=${SERVICE_SUPABASEANON_KEY}
      - SERVICE_KEY=${SERVICE_SUPABASESERVICE_KEY}
      - POSTGREST_URL=http://supabase-rest:3000
      - AUTH_JWT_SECRET=${SERVICE_PASSWORD_JWT}
      - DATABASE_URL=postgres://supabase_storage_admin:${SERVICE_PASSWORD_POSTGRES}@supabase-db:${POSTGRES_PORT:-5432}/${POSTGRES_DB:-postgres}
      - STORAGE_PUBLIC_URL=${SERVICE_URL_SUPABASEKONG_8000}
      - REQUEST_ALLOW_X_FORWARDED_PATH=true
      - FILE_SIZE_LIMIT=${FILE_SIZE_LIMIT:-52428800}
      - STORAGE_BACKEND=file
      # Bucket name of the S3 protocol; with the 'file' backend it is the folder name.
      - GLOBAL_S3_BUCKET=${GLOBAL_S3_BUCKET:-stub}
      - FILE_STORAGE_BACKEND_PATH=/var/lib/storage
      - TENANT_ID=${STORAGE_TENANT_ID:-stub}
      - REGION=${REGION:-local}
      - ENABLE_IMAGE_TRANSFORMATION=true
      - IMGPROXY_URL=http://supabase-imgproxy:5001
      # S3 protocol endpoint (used by the Supabase CLI, aws-cli, ...).
      - S3_PROTOCOL_ACCESS_KEY_ID=${SERVICE_HEX_32_STORAGES3KEYID}
      - S3_PROTOCOL_ACCESS_KEY_SECRET=${SERVICE_HEX_64_STORAGES3KEYSECRET}
    volumes:
      - supabase-storage-data:/var/lib/storage

  # --- imgproxy: image resizing for Storage. --------------------------------
  supabase-imgproxy:
    image: darthsim/imgproxy:v3.30.1
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "imgproxy", "health"]
      timeout: 5s
      interval: 5s
      retries: 3
    environment:
      - IMGPROXY_BIND=:5001
      - IMGPROXY_LOCAL_FILESYSTEM_ROOT=/
      - IMGPROXY_USE_ETAG=true
      - 'IMGPROXY_AUTO_WEBP=${IMGPROXY_AUTO_WEBP:-true}'
      - IMGPROXY_MAX_SRC_RESOLUTION=16.8
    volumes:
      - supabase-storage-data:/var/lib/storage

  # --- postgres-meta: database management from Studio. ----------------------
  supabase-meta:
    image: supabase/postgres-meta:v0.96.6
    restart: unless-stopped
    depends_on:
      supabase-db:
        condition: service_healthy
    environment:
      - PG_META_PORT=8080
      - PG_META_DB_HOST=supabase-db
      - PG_META_DB_PORT=${POSTGRES_PORT:-5432}
      - PG_META_DB_NAME=${POSTGRES_DB:-postgres}
      - PG_META_DB_USER=postgres
      - PG_META_DB_PASSWORD=${SERVICE_PASSWORD_POSTGRES}
      - CRYPTO_KEY=${SERVICE_PASSWORD_PGMETACRYPTO}

  # --- Edge Functions (Deno). -----------------------------------------------
  supabase-edge-functions:
    image: supabase/edge-runtime:v1.74.0
    restart: unless-stopped
    depends_on:
      supabase-kong:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "timeout 1 bash -c '</dev/tcp/127.0.0.1/9000'"]
      interval: 5s
      timeout: 5s
      retries: 3
    environment:
      - JWT_SECRET=${SERVICE_PASSWORD_JWT}
      - SUPABASE_URL=http://supabase-kong:8000
      - SUPABASE_PUBLIC_URL=${SERVICE_URL_SUPABASEKONG_8000}
      - SUPABASE_ANON_KEY=${SERVICE_SUPABASEANON_KEY}
      - SUPABASE_SERVICE_ROLE_KEY=${SERVICE_SUPABASESERVICE_KEY}
      - 'SUPABASE_PUBLISHABLE_KEYS={"default":"${SUPABASE_PUBLISHABLE_KEY:-}"}'
      - 'SUPABASE_SECRET_KEYS={"default":"${SUPABASE_SECRET_KEY:-}"}'
      - SUPABASE_DB_URL=postgresql://postgres:${SERVICE_PASSWORD_POSTGRES}@supabase-db:${POSTGRES_PORT:-5432}/${POSTGRES_DB:-postgres}
      # Applies to every function at once.
      - 'VERIFY_JWT=${FUNCTIONS_VERIFY_JWT:-false}'
    volumes:
      - supabase-functions:/home/deno/functions
      - supabase-deno-cache:/root/.cache/deno
      # The main service is required; without this file the runtime does not start.
      - type: bind
        source: ./volumes/functions/main/index.ts
        target: /home/deno/functions/main/index.ts
        content: |
          import * as jose from 'jsr:@panva/jose@6'

          console.log('main function started')

          const JWT_SECRET = Deno.env.get('JWT_SECRET')
          const SUPABASE_JWKS = parseJwks(Deno.env.get('SUPABASE_JWKS'))
          const VERIFY_JWT = Deno.env.get('VERIFY_JWT') === 'true'

          // NOTE:(kallebysantos) We don't check for valid keys but just the bare array parsing,
          // let this for 'jose' lib verification
          export function parseJwks(raw: string | undefined): jose.JSONWebKeySet | null {
            if (!raw) return null
            try {
              const parsed = JSON.parse(raw)
              if (parsed?.keys && Array.isArray(parsed.keys)) {
                return parsed as jose.JSONWebKeySet
              }
              return null
            } catch {
              return null
            }
          }

          /**
           * Extract JWT token from Authorization header
           *
           * Parses the Authorization header to extract the Bearer token.
           * Expects format: "Bearer <token>"
           *
           * @param req - The HTTP request object
           * @returns The JWT token string
           * @throws Error if Authorization header is missing or malformed
           */
          function getAuthToken(req: Request) {
            const authHeader = req.headers.get('authorization')
            if (!authHeader) {
              throw new Error('Missing authorization header')
            }
            const [bearer, token] = authHeader.split(' ')
            if (bearer !== 'Bearer') {
              throw new Error(`Auth header is not 'Bearer {token}'`)
            }
            return token
          }

          async function isValidLegacyJWT(jwt: string): Promise<boolean> {
            if (!JWT_SECRET) {
              console.error('JWT_SECRET not available for HS256 token verification')
              return false
            }

            const encoder = new TextEncoder();
            const secretKey = encoder.encode(JWT_SECRET);

            try {
              await jose.jwtVerify(jwt, secretKey);
            } catch (e) {
              console.error('Symmetric Legacy JWT verification error', e);
              return false;
            }
            return true;
          }

          async function isValidJWT(jwt: string): Promise<boolean> {
            if (!SUPABASE_JWKS) {
              console.error('JWKS not available for ES256/RS256 token verification')
              return false
            }

            try {
              const localJwks = jose.createLocalJWKSet(SUPABASE_JWKS);
              await jose.jwtVerify(jwt, localJwks);
            } catch (e) {
              console.error('Asymmetric JWT verification error', e);
              return false
            }

            return true;
          }

          /**
           * Verify JWT token, handling both legacy (HS256) and newer (ES256/RS256) algorithms
           *
           * This function automatically detects the algorithm used in the token and applies
           * the appropriate verification method:
           * - HS256: Uses JWT_SECRET (symmetric key)
           * - ES256/RS256: Uses JWKS endpoint (asymmetric public keys)
           *
           * This fix ensures compatibility with both legacy tokens and newer asymmetric tokens,
           * resolving the "Key for the ES256 algorithm must be of type CryptoKey" error.
           *
           * @param jwt - The JWT token string to verify
           * @returns Promise resolving to true if verification succeeds, false otherwise
           */
          async function isValidHybridJWT(jwt: string): Promise<boolean> {
            const { alg: jwtAlgorithm } = jose.decodeProtectedHeader(jwt)

            if (jwtAlgorithm === 'HS256') {
              console.log(`Legacy token type detected, attempting ${jwtAlgorithm} verification.`)

              return await isValidLegacyJWT(jwt)
            }

            if (jwtAlgorithm === 'ES256' || jwtAlgorithm === 'RS256') {
              return await isValidJWT(jwt)
            }

            return false;
          }

          Deno.serve(async (req: Request) => {
            if (req.method !== 'OPTIONS' && VERIFY_JWT) {
              try {
                const token = getAuthToken(req)
                const isValidJWT = await isValidHybridJWT(token);

                if (!isValidJWT) {
                  return new Response(JSON.stringify({ msg: 'Invalid JWT' }), {
                    status: 401,
                    headers: { 'Content-Type': 'application/json' },
                  })
                }
              } catch (e) {
                console.error(e)
                return new Response(JSON.stringify({ msg: e.toString() }), {
                  status: 401,
                  headers: { 'Content-Type': 'application/json' },
                })
              }
            }

            const url = new URL(req.url)
            const { pathname } = url
            const path_parts = pathname.split('/')
            const service_name = path_parts[1]

            if (!service_name || service_name === '') {
              const error = { msg: 'missing function name in request' }
              return new Response(JSON.stringify(error), {
                status: 400,
                headers: { 'Content-Type': 'application/json' },
              })
            }

            const servicePath = `/home/deno/functions/${service_name}`
            console.error(`serving the request with ${servicePath}`)

            const memoryLimitMb = 150
            const workerTimeoutMs = 1 * 60 * 1000
            const noModuleCache = false
            const importMapPath = null
            const envVarsObj = Deno.env.toObject()
            const envVars = Object.keys(envVarsObj).map((k) => [k, envVarsObj[k]])

            try {
              const worker = await EdgeRuntime.userWorkers.create({
                servicePath,
                memoryLimitMb,
                workerTimeoutMs,
                noModuleCache,
                importMapPath,
                envVars,
              })
              return await worker.fetch(req)
            } catch (e) {
              const error = { msg: e.toString() }
              return new Response(JSON.stringify(error), {
                status: 500,
                headers: { 'Content-Type': 'application/json' },
              })
            }
          })
      - type: bind
        source: ./volumes/functions/hello/index.ts
        target: /home/deno/functions/hello/index.ts
        content: |
          // Follow this setup guide to integrate the Deno language server with your editor:
          // https://deno.land/manual/getting_started/setup_your_environment
          // This enables autocomplete, go to definition, etc.

          Deno.serve(async () => {
            return new Response(
              `"Hello from Edge Functions!"`,
              { headers: { "Content-Type": "application/json" } },
            )
          })

          // To invoke:
          // curl 'http://localhost:<KONG_HTTP_PORT>/functions/v1/hello' \
          //   --header 'Authorization: Bearer <anon/service_role API key>'
    command:
      - start
      - --main-service
      - /home/deno/functions/main

  # --- Supavisor: connection pooler (session on 5432, transaction on 6543). -
  supabase-supavisor:
    image: supabase/supavisor:2.9.5
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "-sSfL",
          "--head",
          "-o",
          "/dev/null",
          "http://127.0.0.1:4000/api/health"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    depends_on:
      supabase-db:
        condition: service_healthy
    # The pooler lives on the internal Docker network only. To connect from your
    # laptop, remove the comment markers below and open the ports in your
    # firewall. Pick other ports when the host already runs a Postgres.
    # There is no certificate on the pooler (upstream behaviour), so a client has
    # to pass `?sslmode=disable`. The previous Coolify template generated a
    # self-signed certificate with openssl for this; that is deliberately not
    # done here, because the direct connection to supabase-db — where
    # `supabase db push` goes — cannot use it either: that Postgres has no
    # certificates.
    #ports:
    #  - '5432:5432'  # session pooling
    #  - '6543:6543'  # transaction pooling
    environment:
      - PORT=4000
      - POSTGRES_HOST=supabase-db
      - 'POSTGRES_PORT=${POSTGRES_PORT:-5432}'
      - 'POSTGRES_DB=${POSTGRES_DB:-postgres}'
      - 'POSTGRES_PASSWORD=${SERVICE_PASSWORD_POSTGRES}'
      - 'DATABASE_URL=ecto://supabase_admin:${SERVICE_PASSWORD_POSTGRES}@supabase-db:${POSTGRES_PORT:-5432}/_supabase'
      - CLUSTER_POSTGRES=true
      - SECRET_KEY_BASE=${SERVICE_HEX_64_SECRETKEYBASE}
      - VAULT_ENC_KEY=${SERVICE_HEX_32_VAULTENC}
      - API_JWT_SECRET=${SERVICE_PASSWORD_JWT}
      - METRICS_JWT_SECRET=${SERVICE_PASSWORD_JWT}
      - REGION=local
      - ERL_AFLAGS=-proto_dist inet_tcp
      - 'POOLER_TENANT_ID=${POOLER_TENANT_ID:-supabase-pooler}'
      - 'POOLER_DEFAULT_POOL_SIZE=${POOLER_DEFAULT_POOL_SIZE:-20}'
      - 'POOLER_MAX_CLIENT_CONN=${POOLER_MAX_CLIENT_CONN:-100}'
      - POOLER_POOL_MODE=transaction
      - 'DB_POOL_SIZE=${POOLER_DB_POOL_SIZE:-5}'
    command:
      - /bin/sh
      - -c
      - "/app/bin/migrate && /app/bin/supavisor eval \"$$(cat /etc/pooler/pooler.exs)\" && /app/bin/server"
    volumes:
      - type: bind
        source: ./volumes/pooler/pooler.exs
        target: /etc/pooler/pooler.exs
        content: |
          {:ok, _} = Application.ensure_all_started(:supavisor)

          {:ok, version} =
            case Supavisor.Repo.query!("select version()") do
              %{rows: [[ver]]} -> Supavisor.Helpers.parse_pg_version(ver)
              _ -> nil
            end

          params = %{
            "external_id" => System.get_env("POOLER_TENANT_ID"),
            "db_host" => System.get_env("POSTGRES_HOST") || "db",
            "db_port" => System.get_env("POSTGRES_PORT"),
            "db_database" => System.get_env("POSTGRES_DB"),
            "require_user" => false,
            "auth_query" => "SELECT * FROM pgbouncer.get_auth($1)",
            "default_max_clients" => System.get_env("POOLER_MAX_CLIENT_CONN"),
            "default_pool_size" => System.get_env("POOLER_DEFAULT_POOL_SIZE"),
            "default_parameter_status" => %{"server_version" => version},
            "users" => [%{
              "db_user" => "pgbouncer",
              "db_password" => System.get_env("POSTGRES_PASSWORD"),
              "mode_type" => System.get_env("POOLER_POOL_MODE"),
              "pool_size" => System.get_env("POOLER_DEFAULT_POOL_SIZE"),
              "is_manager" => true
            }]
          }

          if !Supavisor.Tenants.get_tenant_by_external_id(params["external_id"]) do
            {:ok, _} = Supavisor.Tenants.create_tenant(params)
          end

volumes:
  supabase-db-data:
  supabase-db-config:
  supabase-storage-data:
  supabase-functions:
  supabase-snippets:
  supabase-deno-cache:
