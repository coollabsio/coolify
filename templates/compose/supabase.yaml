# documentation: https://supabase.io
# slogan: The open source Firebase alternative.
# category: backend
# tags: firebase, alternative, open-source
# minversion: 4.0.0-beta.228
# logo: svgs/supabase.svg
# port: 8000

services:
  supabase-envoy:
    image: envoyproxy/envoy:v1.39.1
    entrypoint: ["/bin/sh", "/docker-entrypoint.sh"]
    depends_on:
      supabase-analytics:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "timeout 1 bash -c '</dev/tcp/127.0.0.1/8000'"]
      interval: 10s
      timeout: 5s
      retries: 3
    environment:
      - SERVICE_URL_SUPABASEENVOY_8000
      - JWT_SECRET=${SERVICE_PASSWORD_JWT}
      - ANON_KEY=${SERVICE_SUPABASEANON_KEY}
      - SERVICE_ROLE_KEY=${SERVICE_SUPABASESERVICE_KEY}
      - SUPABASE_PUBLISHABLE_KEY=${SUPABASE_PUBLISHABLE_KEY:-}
      - SUPABASE_SECRET_KEY=${SUPABASE_SECRET_KEY:-}
      - ANON_KEY_ASYMMETRIC=${ANON_KEY_ASYMMETRIC:-}
      - SERVICE_ROLE_KEY_ASYMMETRIC=${SERVICE_ROLE_KEY_ASYMMETRIC:-}
      - SUPABASE_PUBLIC_URL=${SERVICE_URL_SUPABASEENVOY}
      - DASHBOARD_USERNAME=${SERVICE_USER_ADMIN}
      - DASHBOARD_PASSWORD=${SERVICE_PASSWORD_ADMIN}
    volumes:
      - type: bind
        source: ./volumes/api/envoy/envoy.yaml
        target: /etc/envoy/envoy.yaml
        read_only: true
        content: |
          dynamic_resources:
            cds_config:
              path_config_source:
                path: /etc/envoy/cds.yaml
              resource_api_version: V3
            lds_config:
              path_config_source:
                path: /etc/envoy/lds.yaml
              resource_api_version: V3

          node:
            cluster: supabase_cluster
            id: supabase_node

          overload_manager:
            resource_monitors:
              - name: envoy.resource_monitors.global_downstream_max_connections
                typed_config:
                  '@type': >-
                    type.googleapis.com/envoy.extensions.resource_monitors.downstream_connections.v3.DownstreamConnectionsConfig
                  max_active_downstream_connections: 30000

          admin:
            address:
              socket_address:
                address: 127.0.0.1
                port_value: 9901
      - type: bind
        source: ./volumes/api/envoy/cds.yaml
        target: /etc/envoy/cds.yaml
        read_only: true
        content: |
          resources:
            - '@type': type.googleapis.com/envoy.config.cluster.v3.Cluster
              name: auth
              connect_timeout: 5s
              type: STRICT_DNS
              dns_refresh_rate: 5s
              dns_failure_refresh_rate:
                base_interval: 1s
                max_interval: 1s
              lb_policy: ROUND_ROBIN
              load_assignment:
                cluster_name: auth
                endpoints:
                  - lb_endpoints:
                      - endpoint:
                          address:
                            socket_address:
                              address: supabase-auth
                              port_value: 9999
              health_checks:
                - timeout: 2s
                  interval: 5s
                  unhealthy_threshold: 3
                  healthy_threshold: 2
                  http_health_check:
                    path: /health
              circuit_breakers:
                thresholds:
                  - priority: DEFAULT
                    max_connections: 10000
                    max_pending_requests: 10000
                    max_requests: 10000

            - '@type': type.googleapis.com/envoy.config.cluster.v3.Cluster
              name: rest
              connect_timeout: 5s
              type: STRICT_DNS
              dns_refresh_rate: 5s
              dns_failure_refresh_rate:
                base_interval: 1s
                max_interval: 1s
              lb_policy: ROUND_ROBIN
              load_assignment:
                cluster_name: rest
                endpoints:
                  - lb_endpoints:
                      - endpoint:
                          address:
                            socket_address:
                              address: supabase-rest
                              port_value: 3000
              health_checks:
                - timeout: 2s
                  interval: 5s
                  unhealthy_threshold: 3
                  healthy_threshold: 2
                  http_health_check:
                    path: /
              circuit_breakers:
                thresholds:
                  - priority: DEFAULT
                    max_connections: 10000
                    max_pending_requests: 10000
                    max_requests: 10000

            - '@type': type.googleapis.com/envoy.config.cluster.v3.Cluster
              name: realtime
              connect_timeout: 5s
              type: STRICT_DNS
              dns_refresh_rate: 5s
              dns_failure_refresh_rate:
                base_interval: 1s
                max_interval: 1s
              lb_policy: ROUND_ROBIN
              load_assignment:
                cluster_name: realtime
                endpoints:
                  - lb_endpoints:
                      - endpoint:
                          address:
                            socket_address:
                              address: realtime-dev
                              port_value: 4000
              health_checks:
                - timeout: 2s
                  interval: 5s
                  unhealthy_threshold: 3
                  healthy_threshold: 2
                  http_health_check:
                    path: /
              circuit_breakers:
                thresholds:
                  - priority: DEFAULT
                    max_connections: 10000
                    max_pending_requests: 10000
                    max_requests: 10000

            - '@type': type.googleapis.com/envoy.config.cluster.v3.Cluster
              name: storage
              connect_timeout: 5s
              type: STRICT_DNS
              dns_refresh_rate: 5s
              dns_failure_refresh_rate:
                base_interval: 1s
                max_interval: 1s
              lb_policy: ROUND_ROBIN
              load_assignment:
                cluster_name: storage
                endpoints:
                  - lb_endpoints:
                      - endpoint:
                          address:
                            socket_address:
                              address: supabase-storage
                              port_value: 5000
              health_checks:
                - timeout: 2s
                  interval: 5s
                  unhealthy_threshold: 3
                  healthy_threshold: 2
                  http_health_check:
                    path: /status
              circuit_breakers:
                thresholds:
                  - priority: DEFAULT
                    max_connections: 10000
                    max_pending_requests: 10000
                    max_requests: 10000

            - '@type': type.googleapis.com/envoy.config.cluster.v3.Cluster
              name: functions
              connect_timeout: 5s
              type: STRICT_DNS
              dns_refresh_rate: 5s
              dns_failure_refresh_rate:
                base_interval: 1s
                max_interval: 1s
              lb_policy: ROUND_ROBIN
              load_assignment:
                cluster_name: functions
                endpoints:
                  - lb_endpoints:
                      - endpoint:
                          address:
                            socket_address:
                              address: supabase-edge-functions
                              port_value: 9000
              health_checks:
                - timeout: 2s
                  interval: 5s
                  unhealthy_threshold: 3
                  healthy_threshold: 2
                  tcp_health_check: {}
              circuit_breakers:
                thresholds:
                  - priority: DEFAULT
                    max_connections: 10000
                    max_pending_requests: 10000
                    max_requests: 10000

            - '@type': type.googleapis.com/envoy.config.cluster.v3.Cluster
              name: meta
              connect_timeout: 5s
              type: STRICT_DNS
              dns_refresh_rate: 5s
              dns_failure_refresh_rate:
                base_interval: 1s
                max_interval: 1s
              lb_policy: ROUND_ROBIN
              load_assignment:
                cluster_name: meta
                endpoints:
                  - lb_endpoints:
                      - endpoint:
                          address:
                            socket_address:
                              address: supabase-meta
                              port_value: 8080
              health_checks:
                - timeout: 2s
                  interval: 5s
                  unhealthy_threshold: 3
                  healthy_threshold: 2
                  http_health_check:
                    path: /health
              circuit_breakers:
                thresholds:
                  - priority: DEFAULT
                    max_connections: 10000
                    max_pending_requests: 10000
                    max_requests: 10000

            - '@type': type.googleapis.com/envoy.config.cluster.v3.Cluster
              name: studio
              connect_timeout: 5s
              type: STRICT_DNS
              dns_refresh_rate: 5s
              dns_failure_refresh_rate:
                base_interval: 1s
                max_interval: 1s
              lb_policy: ROUND_ROBIN
              load_assignment:
                cluster_name: studio
                endpoints:
                  - lb_endpoints:
                      - endpoint:
                          address:
                            socket_address:
                              address: supabase-studio
                              port_value: 3000
              health_checks:
                - timeout: 2s
                  interval: 5s
                  unhealthy_threshold: 3
                  healthy_threshold: 2
                  http_health_check:
                    path: /project/default
              circuit_breakers:
                thresholds:
                  - priority: DEFAULT
                    max_connections: 10000
                    max_pending_requests: 10000
                    max_requests: 10000
      - type: bind
        source: ./volumes/api/envoy/lds.template.yaml
        target: /etc/envoy/lds.template.yaml
        read_only: true
        content: |
          resources:
            - '@type': type.googleapis.com/envoy.config.listener.v3.Listener
              name: supabase
              per_connection_buffer_limit_bytes: 32768  # 32 KiB

              address:
                socket_address:
                  address: 0.0.0.0
                  port_value: 8000

              filter_chains:
                - filters:
                    - name: envoy.filters.network.http_connection_manager
                      typed_config:
                        '@type': >-
                          type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                        stat_prefix: ingress_http
                        normalize_path: true
                        merge_slashes: true
                        path_with_escaped_slashes_action: REJECT_REQUEST
                        use_remote_address: true
                        common_http_protocol_options:
                          headers_with_underscores_action: REJECT_REQUEST
                        upgrade_configs:
                          - upgrade_type: websocket
                        access_log:
                          - name: envoy.access_loggers.stdout
                            typed_config:
                              '@type': >-
                                type.googleapis.com/envoy.extensions.access_loggers.stream.v3.StdoutAccessLog
                              log_format:
                                text_format_source:
                                  inline_string: "%DOWNSTREAM_REMOTE_ADDRESS_WITHOUT_PORT% - - [%START_TIME(%d/%b/%Y:%H:%M:%S %z)%] \"%REQ(:METHOD)% %REQ(X-ENVOY-ORIGINAL-PATH?:PATH)% %PROTOCOL%\" %RESPONSE_CODE% %BYTES_SENT% \"%REQ(REFERER)%\" \"%REQ(USER-AGENT)%\"\n"

                        route_config:
                          name: supabase_route
                          virtual_hosts:
                            - name: supabase_host
                              domains:
                                - '*'
                              cors:
                                allow_origin_string_match:
                                  - safe_regex:
                                      regex: ".*"
                                allow_methods: "GET,POST,PUT,PATCH,DELETE,OPTIONS,HEAD,CONNECT,TRACE"
                                allow_headers: "*"
                                expose_headers: "*"
                                max_age: "3600"
                              request_headers_to_add:
                                - header:
                                    key: X-Forwarded-Host
                                    value: "%REQ(:AUTHORITY)%"
                                  append_action: ADD_IF_ABSENT
                                - header:
                                    key: X-Forwarded-Port
                                    value: "%DOWNSTREAM_LOCAL_PORT%"
                                  append_action: ADD_IF_ABSENT
                              routes:
                                - match:
                                    prefix: /auth/v1/verify
                                  route:
                                    cluster: auth
                                    prefix_rewrite: /verify
                                    timeout: 30s
                                  request_headers_to_add:
                                    - header:
                                        key: X-Forwarded-Prefix
                                        value: /auth/v1/verify
                                      append_action: ADD_IF_ABSENT
                                  typed_per_filter_config:
                                    envoy.filters.http.basic_auth:
                                      '@type': >-
                                        type.googleapis.com/envoy.config.route.v3.FilterConfig
                                      disabled: true
                                    envoy.filters.http.rbac:
                                      '@type': >-
                                        type.googleapis.com/envoy.extensions.filters.http.rbac.v3.RBACPerRoute
                                      rbac:
                                        rules:
                                          action: ALLOW
                                          policies:
                                            allow_all:
                                              permissions:
                                                - any: true
                                              principals:
                                                - any: true

                                - match:
                                    prefix: /auth/v1/callback
                                  route:
                                    cluster: auth
                                    prefix_rewrite: /callback
                                    timeout: 30s
                                  request_headers_to_add:
                                    - header:
                                        key: X-Forwarded-Prefix
                                        value: /auth/v1/callback
                                      append_action: ADD_IF_ABSENT
                                  typed_per_filter_config:
                                    envoy.filters.http.basic_auth:
                                      '@type': >-
                                        type.googleapis.com/envoy.config.route.v3.FilterConfig
                                      disabled: true
                                    envoy.filters.http.rbac:
                                      '@type': >-
                                        type.googleapis.com/envoy.extensions.filters.http.rbac.v3.RBACPerRoute
                                      rbac:
                                        rules:
                                          action: ALLOW
                                          policies:
                                            allow_all:
                                              permissions:
                                                - any: true
                                              principals:
                                                - any: true

                                - match:
                                    prefix: /auth/v1/authorize
                                  route:
                                    cluster: auth
                                    prefix_rewrite: /authorize
                                    timeout: 30s
                                  request_headers_to_add:
                                    - header:
                                        key: X-Forwarded-Prefix
                                        value: /auth/v1/authorize
                                      append_action: ADD_IF_ABSENT
                                  typed_per_filter_config:
                                    envoy.filters.http.basic_auth:
                                      '@type': >-
                                        type.googleapis.com/envoy.config.route.v3.FilterConfig
                                      disabled: true
                                    envoy.filters.http.rbac:
                                      '@type': >-
                                        type.googleapis.com/envoy.extensions.filters.http.rbac.v3.RBACPerRoute
                                      rbac:
                                        rules:
                                          action: ALLOW
                                          policies:
                                            allow_all:
                                              permissions:
                                                - any: true
                                              principals:
                                                - any: true

                                - match:
                                    prefix: /auth/v1/.well-known/jwks.json
                                  route:
                                    cluster: auth
                                    prefix_rewrite: /.well-known/jwks.json
                                    timeout: 30s
                                  request_headers_to_add:
                                    - header:
                                        key: X-Forwarded-Prefix
                                        value: /auth/v1/.well-known/jwks.json
                                      append_action: ADD_IF_ABSENT
                                  typed_per_filter_config:
                                    envoy.filters.http.basic_auth:
                                      '@type': >-
                                        type.googleapis.com/envoy.config.route.v3.FilterConfig
                                      disabled: true
                                    envoy.filters.http.rbac:
                                      '@type': >-
                                        type.googleapis.com/envoy.extensions.filters.http.rbac.v3.RBACPerRoute
                                      rbac:
                                        rules:
                                          action: ALLOW
                                          policies:
                                            allow_all:
                                              permissions:
                                                - any: true
                                              principals:
                                                - any: true

                                - match:
                                    prefix: /.well-known/oauth-authorization-server
                                  route:
                                    cluster: auth
                                    timeout: 30s
                                  request_headers_to_add:
                                    - header:
                                        key: X-Forwarded-Prefix
                                        value: /.well-known/oauth-authorization-server
                                      append_action: ADD_IF_ABSENT
                                  typed_per_filter_config:
                                    envoy.filters.http.basic_auth:
                                      '@type': >-
                                        type.googleapis.com/envoy.config.route.v3.FilterConfig
                                      disabled: true
                                    envoy.filters.http.rbac:
                                      '@type': >-
                                        type.googleapis.com/envoy.extensions.filters.http.rbac.v3.RBACPerRoute
                                      rbac:
                                        rules:
                                          action: ALLOW
                                          policies:
                                            allow_all:
                                              permissions:
                                                - any: true
                                              principals:
                                                - any: true

                                - match:
                                    prefix: /auth/v1/sso/saml/acs
                                  route:
                                    cluster: auth
                                    prefix_rewrite: /sso/saml/acs
                                    timeout: 30s
                                  request_headers_to_add:
                                    - header:
                                        key: X-Forwarded-Prefix
                                        value: /auth/v1/sso/saml/acs
                                      append_action: ADD_IF_ABSENT
                                  typed_per_filter_config:
                                    envoy.filters.http.basic_auth:
                                      '@type': >-
                                        type.googleapis.com/envoy.config.route.v3.FilterConfig
                                      disabled: true
                                    envoy.filters.http.rbac:
                                      '@type': >-
                                        type.googleapis.com/envoy.extensions.filters.http.rbac.v3.RBACPerRoute
                                      rbac:
                                        rules:
                                          action: ALLOW
                                          policies:
                                            allow_all:
                                              permissions:
                                                - any: true
                                              principals:
                                                - any: true

                                - match:
                                    prefix: /auth/v1/sso/saml/metadata
                                  route:
                                    cluster: auth
                                    prefix_rewrite: /sso/saml/metadata
                                    timeout: 30s
                                  request_headers_to_add:
                                    - header:
                                        key: X-Forwarded-Prefix
                                        value: /auth/v1/sso/saml/metadata
                                      append_action: ADD_IF_ABSENT
                                  typed_per_filter_config:
                                    envoy.filters.http.basic_auth:
                                      '@type': >-
                                        type.googleapis.com/envoy.config.route.v3.FilterConfig
                                      disabled: true
                                    envoy.filters.http.rbac:
                                      '@type': >-
                                        type.googleapis.com/envoy.extensions.filters.http.rbac.v3.RBACPerRoute
                                      rbac:
                                        rules:
                                          action: ALLOW
                                          policies:
                                            allow_all:
                                              permissions:
                                                - any: true
                                              principals:
                                                - any: true

                                - name: functions-v1-all
                                  match:
                                    prefix: /functions/v1/
                                  route:
                                    cluster: functions
                                    prefix_rewrite: /
                                    timeout: 150s
                                  request_headers_to_add:
                                    - header:
                                        key: X-Forwarded-Prefix
                                        value: /functions/v1/
                                      append_action: ADD_IF_ABSENT
                                  typed_per_filter_config:
                                    envoy.filters.http.basic_auth:
                                      '@type': >-
                                        type.googleapis.com/envoy.config.route.v3.FilterConfig
                                      disabled: true
                                    envoy.filters.http.rbac:
                                      '@type': >-
                                        type.googleapis.com/envoy.extensions.filters.http.rbac.v3.RBACPerRoute
                                      rbac:
                                        rules:
                                          action: ALLOW
                                          policies:
                                            allow_all:
                                              permissions:
                                                - any: true
                                              principals:
                                                - any: true

                                - match:
                                    prefix: /storage/v1/
                                  route:
                                    cluster: storage
                                    prefix_rewrite: /
                                    timeout: 3600s
                                  request_headers_to_add:
                                    - header:
                                        key: X-Forwarded-Prefix
                                        value: /storage/v1
                                      append_action: ADD_IF_ABSENT
                                  typed_per_filter_config:
                                    envoy.filters.http.basic_auth:
                                      '@type': >-
                                        type.googleapis.com/envoy.config.route.v3.FilterConfig
                                      disabled: true
                                    envoy.filters.http.rbac:
                                      '@type': >-
                                        type.googleapis.com/envoy.extensions.filters.http.rbac.v3.RBACPerRoute
                                      rbac:
                                        rules:
                                          action: ALLOW
                                          policies:
                                            allow_all:
                                              permissions:
                                                - any: true
                                              principals:
                                                - any: true

                                - name: auth-v1-protected
                                  match:
                                    prefix: /auth/v1/
                                  route:
                                    cluster: auth
                                    prefix_rewrite: /
                                    timeout: 30s
                                  request_headers_to_add:
                                    - header:
                                        key: X-Forwarded-Prefix
                                        value: /auth/v1/
                                      append_action: ADD_IF_ABSENT
                                  typed_per_filter_config:
                                    envoy.filters.http.basic_auth:
                                      '@type': >-
                                        type.googleapis.com/envoy.config.route.v3.FilterConfig
                                      disabled: true

                                - name: rest-v1-openapi-protected
                                  match:
                                    path: /rest/v1/
                                  route:
                                    cluster: rest
                                    prefix_rewrite: /
                                    timeout: 30s
                                  request_headers_to_add:
                                    - header:
                                        key: X-Forwarded-Prefix
                                        value: /rest/v1/
                                      append_action: ADD_IF_ABSENT
                                  typed_per_filter_config:
                                    envoy.filters.http.basic_auth:
                                      '@type': type.googleapis.com/envoy.config.route.v3.FilterConfig
                                      disabled: true
                                    envoy.filters.http.rbac:
                                      '@type': type.googleapis.com/envoy.extensions.filters.http.rbac.v3.RBACPerRoute
                                      rbac:
                                        rules:
                                          action: ALLOW
                                          policies:
                                            admin:
                                              permissions:
                                                - any: true
                                              principals:
                                                - header:
                                                    name: apikey
                                                    string_match:
                                                      exact: '${SERVICE_ROLE_KEY}'
                                                - header:
                                                    name: apikey
                                                    string_match:
                                                      exact: '${SERVICE_ROLE_KEY_ASYMMETRIC}'

                                - name: rest-v1-protected
                                  match:
                                    prefix: /rest/v1/
                                  route:
                                    cluster: rest
                                    prefix_rewrite: /
                                    timeout: 30s
                                  request_headers_to_add:
                                    - header:
                                        key: X-Forwarded-Prefix
                                        value: /rest/v1/
                                      append_action: ADD_IF_ABSENT
                                  typed_per_filter_config:
                                    envoy.filters.http.basic_auth:
                                      '@type': >-
                                        type.googleapis.com/envoy.config.route.v3.FilterConfig
                                      disabled: true

                                - name: graphql-v1-protected
                                  match:
                                    prefix: /graphql/v1
                                  route:
                                    cluster: rest
                                    prefix_rewrite: /rpc/graphql
                                    timeout: 30s
                                  request_headers_to_add:
                                    - header:
                                        key: X-Forwarded-Prefix
                                        value: /graphql/v1
                                      append_action: ADD_IF_ABSENT
                                    - header:
                                        key: Content-Profile
                                        value: graphql_public
                                      append_action: ADD_IF_ABSENT
                                  typed_per_filter_config:
                                    envoy.filters.http.basic_auth:
                                      '@type': >-
                                        type.googleapis.com/envoy.config.route.v3.FilterConfig
                                      disabled: true

                                - name: realtime-v1-api-openapi-blocked
                                  match:
                                    prefix: /realtime/v1/api/openapi
                                  route:
                                    cluster: realtime
                                    timeout: 30s
                                  request_headers_to_add:
                                    - header:
                                        key: X-Forwarded-Prefix
                                        value: /realtime/v1/api/openapi
                                      append_action: ADD_IF_ABSENT
                                  typed_per_filter_config:
                                    envoy.filters.http.basic_auth:
                                      '@type': >-
                                        type.googleapis.com/envoy.config.route.v3.FilterConfig
                                      disabled: true
                                    envoy.filters.http.rbac:
                                      '@type': >-
                                        type.googleapis.com/envoy.extensions.filters.http.rbac.v3.RBACPerRoute
                                      rbac:
                                        rules:
                                          action: DENY
                                          policies:
                                            deny_all:
                                              permissions:
                                                - any: true
                                              principals:
                                                - any: true

                                - name: realtime-v1-api-tenants-blocked
                                  match:
                                    prefix: /realtime/v1/api/tenants
                                  route:
                                    cluster: realtime
                                    timeout: 30s
                                  request_headers_to_add:
                                    - header:
                                        key: X-Forwarded-Prefix
                                        value: /realtime/v1/api/tenants
                                      append_action: ADD_IF_ABSENT
                                  typed_per_filter_config:
                                    envoy.filters.http.basic_auth:
                                      '@type': >-
                                        type.googleapis.com/envoy.config.route.v3.FilterConfig
                                      disabled: true
                                    envoy.filters.http.rbac:
                                      '@type': >-
                                        type.googleapis.com/envoy.extensions.filters.http.rbac.v3.RBACPerRoute
                                      rbac:
                                        rules:
                                          action: DENY
                                          policies:
                                            deny_all:
                                              permissions:
                                                - any: true
                                              principals:
                                                - any: true

                                - name: realtime-v1-api-protected
                                  match:
                                    prefix: /realtime/v1/api
                                  route:
                                    cluster: realtime
                                    prefix_rewrite: /api
                                    timeout: 30s
                                    host_rewrite_literal: realtime-dev.supabase-realtime
                                  request_headers_to_add:
                                    - header:
                                        key: X-Forwarded-Prefix
                                        value: /realtime/v1/api
                                      append_action: ADD_IF_ABSENT
                                  typed_per_filter_config:
                                    envoy.filters.http.basic_auth:
                                      '@type': >-
                                        type.googleapis.com/envoy.config.route.v3.FilterConfig
                                      disabled: true

