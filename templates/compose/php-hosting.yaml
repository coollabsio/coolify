# documentation: https://www.php.net/
# slogan: Simple PHP file hosting with Nginx and PHP-FPM
# category: web
# tags: php, hosting, nginx, php-fpm, website, simple
# logo: svgs/php.svg
# port: 80

services:
  php:
    image: php:8.4-fpm-alpine
    volumes:
      - php-files:/var/www/html
    environment:
      - PHP_FPM_LISTEN=0.0.0.0:9000
    healthcheck:
      test: ["CMD-SHELL", "php-fpm -t || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  nginx:
    image: nginx:alpine
    volumes:
      - php-files:/usr/share/nginx/html:ro
      - type: bind
        source: ./nginx.conf
        target: /etc/nginx/conf.d/default.conf
        content: |
          server {
              listen 80;
              server_name _;
              root /usr/share/nginx/html;
              index index.php index.html index.htm;

              access_log /dev/stdout;
              error_log /dev/stderr;

              location / {
                  try_files $uri $uri/ /index.php?$query_string;
              }

              location ~ \.php$ {
                  fastcgi_pass php:9000;
                  fastcgi_index index.php;
                  fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
                  include fastcgi_params;
              }

              # Enable gzip compression
              gzip on;
              gzip_vary on;
              gzip_min_length 1024;
              gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml+rss application/json;

              # Cache static files
              location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|ttf|eot)$ {
                  expires 1y;
                  add_header Cache-Control "public, immutable";
              }
          }
    depends_on:
      php:
        condition: service_healthy
    environment:
      - SERVICE_URL_NGINX_80
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  php-files:
    name: ${SERVICE_NAME}_php-files

networks:
  default:
    name: ${SERVICE_NAME}_network
