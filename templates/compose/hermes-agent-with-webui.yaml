# documentation: https://github.com/nesquena/hermes-webui
# slogan: Hermes Agent — autonomous AI agent with persistent memory, scheduling, and a self-hosted web chat UI.
# category: ai
# tags: ai, agent, llm, chatbot, hermes, openrouter, anthropic, openai, dashboard, desktop
# logo: svgs/hermes-agent.png
# port: 8787

services:
  hermes-agent-source:
    image: 'nousresearch/hermes-agent:latest'
    entrypoint:
      - /bin/sh
      - -c
    command:
      - |
        set -eu
        rm -rf /agent-src/* /agent-src/.[!.]* /agent-src/..?* 2>/dev/null || true
        cp -a /opt/hermes/. /agent-src/
    volumes:
      - hermes-agent-src:/agent-src
    restart: on-failure
    exclude_from_hc: true

  hermes-agent:
    image: 'nousresearch/hermes-agent:latest'
    command: gateway run
    environment:
      - SERVICE_URL_HERMESDASHBOARD_9119
      - HERMES_HOME=/home/hermes/.hermes
      - HERMES_UID=1000
      - HERMES_GID=1000
      - HERMES_DASHBOARD=1
      - HERMES_DASHBOARD_HOST=0.0.0.0
      - HERMES_DASHBOARD_PORT=9119
      - 'HERMES_DASHBOARD_PUBLIC_URL=${SERVICE_URL_HERMESDASHBOARD}'
      - 'HERMES_DASHBOARD_OAUTH_CLIENT_ID=${HERMES_DASHBOARD_OAUTH_CLIENT_ID}'
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
    volumes:
      - hermes-home:/home/hermes/.hermes
    healthcheck:
      test: ["CMD-SHELL", "test -d /home/hermes/.hermes || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  hermes-webui:
    image: ghcr.io/nesquena/hermes-webui:0.51.92
    depends_on:
      hermes-agent:
        condition: service_started
      hermes-agent-source:
        condition: service_completed_successfully
    environment:
      - SERVICE_URL_HERMESWEBUI_8787
      - HERMES_WEBUI_HOST=0.0.0.0
      - HERMES_WEBUI_PORT=8787
      - HERMES_WEBUI_STATE_DIR=/home/hermeswebui/.hermes/webui
      - WANTED_UID=1000
      - WANTED_GID=1000
      - HERMES_WEBUI_PASSWORD=${SERVICE_PASSWORD_HERMESWEBUI}
    volumes:
      - hermes-home:/home/hermeswebui/.hermes
      - hermes-agent-src:/home/hermeswebui/.hermes/hermes-agent:ro
      - hermes-workspace:/workspace
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8787/health"]
      interval: 30s
      timeout: 5s
      retries: 3
