# documentation: https://surrealdb.com/docs
# slogan: SurrealDB is a scalable, distributed, collaborative, document-graph database for the realtime web.
# category: database
# tags: database,nosql,sql,graph,document,realtime,surrealdb,surrealkv
# logo: svgs/surrealdb.svg
# port: 8000

services:
  surrealdb:
    image: surrealdb/surrealdb:v2
    environment:
      - SERVICE_URL_SURREALDB_8000
      - SURREAL_USER=$SERVICE_USER_SURREALDB
      - SURREAL_PASS=$SERVICE_PASSWORD_SURREALDB
    volumes:
      - surrealdb-data:/data
    command: start --log info --user $${SURREAL_USER} --pass $${SURREAL_PASS} surrealkv://data/srdb.db
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/health"]
      interval: 5s
      timeout: 10s
      retries: 15
