# documentation: https://surrealdb.com/docs/surrealdb/installation/running/docker
# slogan: A scalable, distributed, collaborative, document-graph database, for the realtime web.
# tags: database, nosql, graph, document, sql, realtime
# category: database
# logo: svgs/surrealdb.svg
# port: 8000

services:
  surrealdb:
    image: surrealdb/surrealdb:latest
    command: start --user $SERVICE_USER_SURREALDB --pass $SERVICE_PASSWORD_SURREALDB --bind 0.0.0.0:8000 rocksdb:/data/database.db
    volumes:
      - surrealdb-data:/data
    healthcheck:
      test: ["CMD", "/surreal", "isready", "--endpoint", "http://127.0.0.1:8000"]
      interval: 5s
      timeout: 10s
      retries: 10
