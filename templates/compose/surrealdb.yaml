# slogan: SurrealDB is an end-to-end cloud-native database for web, mobile, serverless, and traditional applications.
# category: database
# tags: database, nosql, sql, graph, realtime, surrealdb, surrealkv
# logo: svgs/surrealdb.svg
# port: 8000

services:
  surrealdb:
    image: surrealdb/surrealdb:v3.0.0
    command: start --log info surrealkv:/data/srdb
    environment:
      - SERVICE_FQDN_SURREALDB_8000
      - SURREAL_USER=${SERVICE_USER_SURREALDB}
      - SURREAL_PASS=${SERVICE_PASSWORD_SURREALDB}
      - SURREAL_BIND=0.0.0.0:8000
      - SURREAL_LOG=${SURREAL_LOG:-info}
      - SURREAL_CAPS_ALLOW_ALL=${SURREAL_CAPS_ALLOW_ALL:-true}
    volumes:
      - surrealdb-data:/data
    healthcheck:
      test: ["CMD", "/surreal", "isready", "--conn", "http://127.0.0.1:8000"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
