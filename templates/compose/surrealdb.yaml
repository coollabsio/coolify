# documentation: https://surrealdb.com/docs/surrealdb/introduction/start
# slogan: SurrealDB is the ultimate multi-model database for tomorrow's applications.
# category: database
# tags: database, multi-model, graph, document, sql
# logo: svgs/surrealdb.svg
# port: 8000

services:
  surrealdb:
    image: 'surrealdb/surrealdb:v2'
    command: start --log info --user $SERVICE_USER_SURREALDB --pass $SERVICE_PASSWORD_SURREALDB --bind 0.0.0.0:8000 file:///data/surql.db
    environment:
      - SERVICE_FQDN_SURREALDB_8000
      - SERVICE_USER_SURREALDB
      - SERVICE_PASSWORD_SURREALDB
    volumes:
      - surrealdb-data:/data
    healthcheck:
      test:
        - CMD
        - 'curl'
        - '-f'
        - 'http://127.0.0.1:8000/health'
      interval: 5s
      timeout: 20s
      retries: 10
