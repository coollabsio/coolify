# documentation: https://surrealdb.com/docs
# slogan: SurrealDB is a scalable, distributed, collaborative, document-graph database for the realtime web.
# category: database
# tags: database,nosql,graph,document,realtime,surrealdb
# logo: svgs/surrealdb.svg
# port: 8000

services:
  surrealdb:
    image: surrealdb/surrealdb:latest
    command: start --log trace --user $SERVICE_USER_SURREALDB --pass $SERVICE_PASSWORD_SURREALDB rocksdb:/data/srdb.db
    environment:
      - SERVICE_URL_SURREALDB_8000
    volumes:
      - surrealdb-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/health"]
      interval: 5s
      timeout: 10s
      retries: 15
