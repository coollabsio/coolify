# documentation: https://github.com/latitude-data/latitude-llm
# slogan: Self-hosted AI application platform with telemetry and LLM orchestration
# tags: ai,llm,telemetry,typescript,nextjs,postgres,redis
# logo: svgs/latitude-llm.svg
# port: 3000

services:
  db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=${SERVICE_USER_DB}
      - POSTGRES_PASSWORD=${SERVICE_PASSWORD_DB}
      - POSTGRES_DB=${DATABASE_NAME:-latitude_production}
    volumes:
      - ${COOLIFY_VOLUME_DB}:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $POSTGRES_USER"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    environment:
      - REDIS_PASSWORD=${SERVICE_PASSWORD_REDIS}
    command: redis-server --requirepass ${SERVICE_PASSWORD_REDIS}
    volumes:
      - ${COOLIFY_VOLUME_REDIS}:/data
    healthcheck:
      test: ["CMD", "sh", "-c", "redis-cli -a $$REDIS_PASSWORD ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 5

  migration:
    image: ${DOCKER_IMAGE:?}
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql://${SERVICE_USER_DB}:${SERVICE_PASSWORD_DB}@db:5432/${DATABASE_NAME:-latitude_production}
    command: ["pnpm", "db:migrate"]
    exclude_from_hc: true
    restart: "no"

  web:
    image: ${DOCKER_IMAGE:?}
    depends_on:
      migration:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    environment:
      # Coolify Magic Variables - Generate FQDNs
      - SERVICE_FQDN_WEB

      # Core
      - NODE_ENV=production

      # Database
      - DATABASE_URL=postgresql://${SERVICE_USER_DB}:${SERVICE_PASSWORD_DB}@db:5432/${DATABASE_NAME:-latitude_production}

      # Redis - Queue
      - QUEUE_HOST=redis
      - QUEUE_PORT=6379
      - QUEUE_PASSWORD=${SERVICE_PASSWORD_REDIS}

      # Redis - Cache
      - CACHE_HOST=redis
      - CACHE_PORT=6379
      - CACHE_PASSWORD=${SERVICE_PASSWORD_REDIS}

      # Gateway Configuration
      - GATEWAY_BIND_ADDRESS=0.0.0.0
      - GATEWAY_BIND_PORT=8787
      - GATEWAY_HOSTNAME=${SERVICE_FQDN_GATEWAY:-${SERVICE_FQDN_WEB}}
      - GATEWAY_PORT=${GATEWAY_PORT:-8080}
      - GATEWAY_SSL=${GATEWAY_SSL:-true}

      # Application URLs
      - APP_DOMAIN=${SERVICE_FQDN_WEB}
      - APP_URL=https://${SERVICE_FQDN_WEB}
      - NEXT_PUBLIC_DOCS_URL=${DOCS_URL:-https://docs.latitude.so}

      # Websockets
      - WEBSOCKETS_SERVER=https://${SERVICE_FQDN_WEBSOCKET:-${SERVICE_FQDN_WEB}}
      - WEBSOCKETS_SERVER_PORT=${WEBSOCKET_PORT:-4002}
      - WEBSOCKET_REFRESH_SECRET_TOKEN_KEY=${SERVICE_PASSWORD_WEBSOCKET_REFRESH}
      - WEBSOCKET_SECRET_TOKEN_KEY=${SERVICE_PASSWORD_WEBSOCKET}

      # File Storage
      - DRIVE_DISK=${DRIVE_DISK:-local}
      - FILE_STORAGE_ROOT_PATH=/app/storage/files
      - FILE_PUBLIC_PATH=files
      - FILES_STORAGE_PATH=/app/storage/files
      - PUBLIC_FILES_STORAGE_PATH=/app/public/files

      # Email Configuration (Required)
      - MAIL_TRANSPORT=${MAIL_TRANSPORT:?}
      - FROM_MAILER_EMAIL=${FROM_MAILER_EMAIL:?}
      - MAILGUN_API_KEY=${MAILGUN_API_KEY:-}
      - MAILGUN_EMAIL_DOMAIN=${MAILGUN_EMAIL_DOMAIN:-}

      # OAuth - Google (Required)
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:?}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:?}
      - GOOGLE_REDIRECT_URI=https://${SERVICE_FQDN_WEB}/api/auth/google/callback

      # Default Provider (Required for onboarding)
      - DEFAULT_PROVIDER_API_KEY=${DEFAULT_PROVIDER_API_KEY:?}

      # Next.js Security
      - NEXT_SERVER_ACTIONS_ENCRYPTION_KEY=${SERVICE_BASE64_ENCRYPTION}

    volumes:
      - ${COOLIFY_VOLUME_WEB_STORAGE}:/app/storage
      - ${COOLIFY_VOLUME_WEB_PUBLIC}:/app/public
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  gateway:
    image: ${DOCKER_IMAGE:?}
    depends_on:
      - web
    environment:
      # Coolify Magic Variables - Generate FQDN on port 8787
      - SERVICE_FQDN_GATEWAY_8787

      - NODE_ENV=production
      - GATEWAY_BIND_ADDRESS=0.0.0.0
      - GATEWAY_BIND_PORT=8787
      - GATEWAY_HOSTNAME=${SERVICE_FQDN_GATEWAY}
      - GATEWAY_SSL=${GATEWAY_SSL:-true}
      - DATABASE_URL=postgresql://${SERVICE_USER_DB}:${SERVICE_PASSWORD_DB}@db:5432/${DATABASE_NAME:-latitude_production}
    command: ["node", "apps/gateway/dist/index.js"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8787/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  websocket:
    image: ${DOCKER_IMAGE:?}
    depends_on:
      - redis
      - db
    environment:
      # Coolify Magic Variables - Generate FQDN on port 4002
      - SERVICE_FQDN_WEBSOCKET_4002

      - NODE_ENV=production
      - WEBSOCKETS_SERVER_PORT=4002
      - WEBSOCKET_REFRESH_SECRET_TOKEN_KEY=${SERVICE_PASSWORD_WEBSOCKET_REFRESH}
      - WEBSOCKET_SECRET_TOKEN_KEY=${SERVICE_PASSWORD_WEBSOCKET}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${SERVICE_PASSWORD_REDIS}
      - DATABASE_URL=postgresql://${SERVICE_USER_DB}:${SERVICE_PASSWORD_DB}@db:5432/${DATABASE_NAME:-latitude_production}
    command: ["node", "apps/websocket/dist/index.js"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4002/health"]
      interval: 30s
      timeout: 10s
      retries: 3
