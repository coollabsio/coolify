# documentation: https://www.elastic.co/products/kibana
# slogan: Kibana is an open-source data visualization platform that sits on top of elastic stack (with Elasticsearch).
# tags: kibana,data,visualization,dashboard,analytics,search,log,monitoring,alerting,reporting,business-intelligence
# logo: svgs/kibana.svg
# port: 5601

services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch-wolfi:8.19.0
    environment:
      - SERVICE_URL_ELASTICSEARCH_9200
      - ELASTIC_PASSWORD=${{SERVICE_PASSWORD_ELASTICSEARCH}}
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      - xpack.security.http.ssl.enabled=false
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl --user elastic:${{SERVICE_PASSWORD_ELASTICSEARCH}} --silent --fail http://localhost:9200/_cluster/health",
        ]
      interval: 10s
      timeout: 10s
      retries: 24

  kibana-setup:
    image: docker.elastic.co/elasticsearch/elasticsearch-wolfi:8.19.0
    environment:
      - ELASTIC_PASSWORD=${{SERVICE_PASSWORD_ELASTICSEARCH}}
    depends_on:
      elasticsearch:
        condition: service_healthy
    command: >
      bash -c "
        echo 'Waiting for Elasticsearch to be ready...'
        until curl --user elastic:${{SERVICE_PASSWORD_ELASTICSEARCH}} --silent --fail http://elasticsearch:9200/_cluster/health; do
          sleep 5
        done
        echo 'Setting Kibana system user password...'
        curl --user elastic:${{SERVICE_PASSWORD_ELASTICSEARCH}} -X POST 'http://elasticsearch:9200/_security/user/kibana_system/_password' -H 'Content-Type: application/json' -d '{\"password\":\"${{SERVICE_PASSWORD_ELASTICSEARCH}}\"}' || true
        echo 'Kibana setup complete'
      "
    restart: "no"

  kibana:
    image: docker.elastic.co/kibana/kibana:8.19.0
    environment:
      - SERVICE_URL_KIBANA_5601
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      - ELASTICSEARCH_USERNAME=kibana_system
      - ELASTICSEARCH_PASSWORD=${{SERVICE_PASSWORD_ELASTICSEARCH}}
    depends_on:
      kibana-setup:
        condition: service_completed_successfully
    volumes:
      - kibana-data:/usr/share/kibana/data
    healthcheck:
      test:
        ["CMD-SHELL", "curl --silent --fail http://localhost:5601/api/status"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

volumes:
  elasticsearch-data:
  kibana-data:
