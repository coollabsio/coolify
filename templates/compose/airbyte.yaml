        condition: service_started
    healthcheck:
      test:
        - CMD
        - /bin/bash
        - -ec
        - |
          exec 3<>/dev/tcp/127.0.0.1/8085
          printf 'GET /health HTTP/1.0\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3
          read -r status <&3
          [[ "$$status" == *" 200 "* ]]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  workload-launcher:
    image: airbyte/workload-launcher:2.2.0
    entrypoint: [/bin/sh, /scripts/start-workload-launcher.sh]
    command: [/bin/bash, -c, 'airbyte-app/bin/$${APPLICATION}']
    environment:
      - JAVA_OPTS=-XX:+ExitOnOutOfMemoryError -XX:MaxRAMPercentage=75.0 -XX:FlightRecorderOptions=stackdepth=256
      - AIRBYTE_EDITION=community
      - AIRBYTE_VERSION=2.2.0
      - AIRBYTE_URL=${SERVICE_URL_AIRBYTE_8001}
      - AIRBYTE_ENABLE_UNSAFE_CODE=${AIRBYTE_ENABLE_UNSAFE_CODE:-false}
      - INTERNAL_API_HOST=http://server:8001
      - DATABASE_URL=jdbc:postgresql://db:5432/${DATABASE_DB:-db-airbyte}
      - DATABASE_USER=${DATABASE_USER:-airbyte}
      - DATABASE_PASSWORD=${SERVICE_PASSWORD_POSTGRES}
      - JOB_KUBE_SERVICEACCOUNT=airbyte-admin
      - JOB_KUBE_NAMESPACE=default
      - JOB_KUBE_LOCAL_VOLUME_ENABLED=false
      - JOB_ERROR_REPORTING_STRATEGY=logging
      - LOG_LEVEL=info
      - MICROMETER_METRICS_ENABLED=false
      - MICRONAUT_ENVIRONMENTS=k8s,control-plane,edition-community
      - STORAGE_TYPE=minio
      - STORAGE_BUCKET_ACTIVITY_PAYLOAD=airbyte-bucket
      - STORAGE_BUCKET_AUDIT_LOGGING=airbyte-bucket
      - STORAGE_BUCKET_LOG=airbyte-bucket
      - STORAGE_BUCKET_STATE=airbyte-bucket
      - STORAGE_BUCKET_WORKLOAD_OUTPUT=airbyte-bucket
      - AWS_ACCESS_KEY_ID=${MINIO_ROOT_USER:-minio}
      - AWS_SECRET_ACCESS_KEY=${SERVICE_PASSWORD_MINIO}
      - MINIO_ENDPOINT=http://minio:9000
      - S3_PATH_STYLE_ACCESS=true
      - USE_CUSTOM_NODE_SELECTOR=false
      - WORKSPACE_ROOT=/workspace
      - WORKLOAD_API_HOST=http://workload-api-server:8007
      - KUBERNETES_CLIENT_MAX_IDLE_CONNECTIONS=100
      - CONNECTOR_SPECIFIC_RESOURCE_DEFAULTS_ENABLED=true
      - FILE_TRANSFER_EPHEMERAL_STORAGE_LIMIT=5G
      - FILE_TRANSFER_EPHEMERAL_STORAGE_REQUEST=5G
      - CONTROL_PLANE_TOKEN_ENDPOINT=http://server:8001/api/v1/dataplanes/token
      - WORKLOAD_LAUNCHER_PARALLELISM=10
      - DATAPLANE_CLIENT_ID_SECRET_NAME=airbyte-auth-secrets
      - DATAPLANE_CLIENT_ID_SECRET_KEY=dataplane-client-id
      - DATAPLANE_CLIENT_SECRET_SECRET_NAME=airbyte-auth-secrets
      - DATAPLANE_CLIENT_SECRET_SECRET_KEY=dataplane-client-secret
      - CONNECTOR_PROFILER_IMAGE=airbyte/async-profiler:2.2.0
      - CONNECTOR_SIDECAR_IMAGE=airbyte/connector-sidecar:2.2.0
      - CONTAINER_ORCHESTRATOR_IMAGE=airbyte/container-orchestrator:2.2.0
      - WORKLOAD_INIT_IMAGE=airbyte/workload-init-container:2.2.0
      - KUBECONFIG=/kube/config.yaml
    volumes:
      - k3s-kubeconfig:/kube:ro
      - dataplane-credentials:/credentials:ro
      - type: bind
        read_only: true
        source: ./scripts/start-workload-launcher.sh
        target: /scripts/start-workload-launcher.sh
        content: |
          #!/bin/sh

          set -eu

          client_id_file=/credentials/dataplane-client-id
          client_secret_file=/credentials/dataplane-client-secret

          [ -s "$client_id_file" ] || {
            echo "Missing generated data-plane client ID." >&2
            exit 1
          }

          [ -s "$client_secret_file" ] || {
            echo "Missing generated data-plane client secret." >&2
            exit 1
          }

          DATAPLANE_CLIENT_ID=$(cat "$client_id_file")
          DATAPLANE_CLIENT_SECRET=$(cat "$client_secret_file")
          export DATAPLANE_CLIENT_ID DATAPLANE_CLIENT_SECRET

          exec /entrypoint.sh "$@"
    depends_on:
      dataplane-credentials:
        condition: service_completed_successfully
      k3s-bootstrap:
        condition: service_completed_successfully
      server:
        condition: service_healthy
      workload-api-server:
        condition: service_started
      temporal:
        condition: service_started
    healthcheck:
      test:
        - CMD
        - /bin/bash
        - -ec
        - |
          exec 3<>/dev/tcp/127.0.0.1/8085
          printf 'GET /health/readiness HTTP/1.0\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3
          read -r status <&3
          [[ "$$status" == *" 200 "* ]]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
