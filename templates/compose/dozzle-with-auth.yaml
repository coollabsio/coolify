# documentation: https://dozzle.dev/
# slogan: Dozzle is a simple and lightweight web UI for Docker logs.
# category: devtools
# tags: dozzle,docker,logs,web-ui
# logo: svgs/dozzle.svg
# port: 8080

services:
  dozzle:
    image: amir20/dozzle:latest
    environment:
      - SERVICE_URL_DOZZLE_8080
      - DOZZLE_AUTH_PROVIDER=simple
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - type: bind
        source: ./data/users.yml
        target: /data/users.yml:ro
        content: |
          users:
            # "admin" is the username
            admin:
              email: test@email.com
              name: Admin
              # A bcrypt hash of the password you want to use. Can be computed with "python3 -c 'import bcrypt;print(bcrypt.hashpw(b"your-password",bcrypt.gensalt(11)).decode())' ". Default password is "test".
              password: $2a$11$viucCvFLlHWvBNOOI6uypuVU.D09UWb.zswRxEg0MkDPi1q/bKbdG

    healthcheck:
      test: ["CMD", "/dozzle", "healthcheck"]
      interval: 3s
      timeout: 30s
      retries: 5
