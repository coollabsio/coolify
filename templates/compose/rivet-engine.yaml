# documentation: https://www.rivet.dev/docs
# slogan: Build and scale stateful workloads with long-lived processes
# category: development
# tags: stateful, actors, realtime, backend, serverless, postgresql
# logo: svgs/rivet.svg
# port: 6420

services:
  rivet-engine:
    image: rivetdev/engine:3.1.1
    environment:
      - SERVICE_URL_RIVET_6420
      - RIVET__STORAGE__LOG_DIRECTORY=/var/lib/rivet/log
      - RIVET__STORAGE__AUTO_PROVISION_PARTITIONS=1
      - RIVET__STORAGE__BALANCING__ENABLED=false
      - RIVET__OBJECT_STORAGE__PRIMARY__FILE_SYSTEM__PATH=/var/lib/rivet/objects
      - 'RIVET__AUTH__ADMIN_TOKEN=${SERVICE_BASE64_TOKEN}'
    volumes:
      - 'rivet-log:/var/lib/rivet/log'
      - 'rivet-objects:/var/lib/rivet/objects'
    healthcheck:
      test:
        - CMD
        - curl
        - '-f'
        - http://127.0.0.1:6420/health
      interval: 2s
      timeout: 10s
      retries: 10
      start_period: 30s