# documentation: https://sentroy.com/docs/mail
# slogan: Self-hosted transactional and inbox mail server (SMTP/IMAP) with a REST API.
# category: email
# tags: email, smtp, imap, postfix, dovecot, self-hosted, api
# logo: svgs/sentroy.svg
# port: 3000

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: maildb
      POSTGRES_USER: sentroy
      POSTGRES_PASSWORD: $SERVICE_PASSWORD_POSTGRES
    volumes:
      - sentroy-mail-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sentroy -d maildb"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 30s

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes --maxmemory 128mb --maxmemory-policy noeviction
    volumes:
      - sentroy-mail-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  rspamd:
    image: ghcr.io/sentroy-co/sentroy-oss-mailserver-rspamd:latest
    volumes:
      - sentroy-mail-dkim:/etc/rspamd/dkim
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11334/ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  postfix:
    image: ghcr.io/sentroy-co/sentroy-oss-mailserver-postfix:latest
    environment:
      MAIL_HOSTNAME: $MAIL_HOSTNAME
      MAIL_DOMAIN: $MAIL_DOMAIN
    ports:
      - "25:25"
      - "587:587"
      - "465:465"
    volumes:
      - sentroy-mail-data:/var/mail
      - sentroy-mail-dkim:/etc/rspamd/dkim:ro
      - sentroy-mail-virtual:/etc/postfix/virtual
    depends_on:
      rspamd:
        condition: service_healthy

  dovecot:
    image: ghcr.io/sentroy-co/sentroy-oss-mailserver-dovecot:latest
    ports:
      - "143:143"
      - "993:993"
    volumes:
      - sentroy-mail-data:/var/mail
      - sentroy-mail-users:/etc/dovecot/users-data
    depends_on:
      postfix:
        condition: service_started

  api:
    image: ghcr.io/sentroy-co/sentroy-oss-mailserver-api:latest
    environment:
      SERVICE_FQDN_API_3000: /
      DATABASE_URL: postgresql://sentroy:$SERVICE_PASSWORD_POSTGRES@postgres:5432/maildb
      REDIS_URL: redis://redis:6379
      API_PORT: "3000"
      NODE_ENV: production
      LOG_LEVEL: info
      JWT_SECRET: $SERVICE_PASSWORD_64_JWT
      API_ALLOWED_ORIGINS: "*"
      API_BASE_URL: https://api.$MAIL_DOMAIN/api/v1
      SERVER_IP: $SERVER_IP
      MAIL_HOSTNAME: $MAIL_HOSTNAME
      SMTP_HOST: postfix
      SMTP_PORT: "25"
      SMTP_USER: api@$MAIL_HOSTNAME
      SMTP_PASS: $SERVICE_PASSWORD_SMTP
      IMAP_HOST: dovecot
      IMAP_PORT: "143"
      IMAP_USER: inbox@$MAIL_HOSTNAME
      IMAP_PASS: $SERVICE_PASSWORD_IMAP
      IMAP_MASTER_USER: sentroy
      IMAP_MASTER_PASS: $SERVICE_PASSWORD_IMAPMASTER
      DKIM_KEYS_PATH: /etc/rspamd/dkim
      QUEUE_CONCURRENCY: "5"
      DOMAIN_VERIFY_INTERVAL: "300000"
      IMAP_POOL_SIZE: "5"
      DOVECOT_USERS_FILE: /etc/dovecot/users-data/users
      ADMIN_API_KEY: $SERVICE_PASSWORD_64_ADMINTOKEN
    volumes:
      - sentroy-mail-dkim:/etc/rspamd/dkim
      - sentroy-mail-virtual:/etc/postfix/virtual
      - sentroy-mail-users:/etc/dovecot/users-data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      postfix:
        condition: service_started

volumes:
  sentroy-mail-pg:
  sentroy-mail-redis:
  sentroy-mail-data:
  sentroy-mail-dkim:
  sentroy-mail-virtual:
  sentroy-mail-users:
