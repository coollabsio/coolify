# documentation: https://docs.langflow.org/
# slogan: Langflow is an open-source, Python-based, customizable framework for building AI applications.
# category: automation
# tags: langflow,workflow,automation,open,source,low,code
# logo: svgs/langflow.svg
# port: 7860

services:
  langflow:
    image: langflowai/langflow:1.7.2
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - SERVICE_URL_LANGFLOW_7860
      - LANGFLOW_AUTO_LOGIN=${LANGFLOW_AUTO_LOGIN:-false}
      - LANGFLOW_SUPERUSER=administrator
      - LANGFLOW_SUPERUSER_PASSWORD=securepassword
      - LANGFLOW_DATABASE_URL=postgresql://$SERVICE_USER_POSTGRES:$SERVICE_PASSWORD_POSTGRES@postgres:5432/${POSTGRES_DB:-langflow}
      - LANGFLOW_CONFIG_DIR=app/langflow
      - LANGFLOW_HOST=0.0.0.0
      - PORT=7860
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:7860/health"]
      interval: 5s
      timeout: 20s
      retries: 10
    volumes:
      - langflow-data:/app/langflow

  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=$SERVICE_USER_POSTGRES
      - POSTGRES_PASSWORD=$SERVICE_PASSWORD_POSTGRES
      - POSTGRES_DB=${POSTGRES_DB:-langflow}
    volumes:
      - langflow-postgres:/var/lib/postgres/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 20s
      retries: 10

volumes:
  langflow-postgres:
  langflow-data:
