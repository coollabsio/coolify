# documentation: https://autobase.tech/docs/
# slogan: Autobase for PostgreSQL® is an open-source alternative to cloud-managed databases (self-hosted DBaaS).
# tags: database, postgres, automation, self-hosted, dbaas
# logo: svgs/autobase.svg
# port: 80

services:
  # https://github.com/vitabaks/autobase/blob/2.3.2/console/db/README.md
  autobase-console-db:
    image: autobase/console_db:2.3.2
    healthcheck:
      test: pg_isready -U postgres -h 127.0.0.1
      interval: 5s
      timeout: 5s
      retries: 10
    environment:
      - POSTGRES_PASSWORD=${SERVICE_PASSWORD_DB}
    volumes:
      - console_postgres:/var/lib/postgresql

  # https://github.com/vitabaks/autobase/blob/2.3.2/console/service/README.md
  autobase-console-api:
    image: autobase/console_api:2.3.2
    healthcheck:
      test: ["CMD", "curl", "-fsS",
            "-H", "accept: application/json",
            "-H", "Authorization: Bearer ${SERVICE_PASSWORD_UI}",
            "http://localhost:8080/api/v1/version"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      autobase-console-db:
        condition: service_healthy
    environment:
      - PG_CONSOLE_DB_HOST=autobase-console-db
      - PG_CONSOLE_DB_PASSWORD=${SERVICE_PASSWORD_DB}
      - PG_CONSOLE_AUTHORIZATION_TOKEN=${SERVICE_PASSWORD_UI}
      - PG_CONSOLE_ENCRYPTIONKEY=${SERVICE_BASE64_ENCRYPTIONKEY}
      - PG_CONSOLE_LOGGER_LEVEL=${PG_CONSOLE_LOGGER_LEVEL:-info}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /tmp/ansible:/tmp/ansible

  # https://github.com/vitabaks/autobase/blob/2.3.2/console/ui/README.md
  autobase-console-ui:
    image: autobase/console_ui:2.3.2
    healthcheck:
      test: [ "CMD", "curl", "http://localhost:80/" ]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      autobase-console-api:
        condition: service_healthy
    environment:
      - SERVICE_FQDN_AUTOBASE_CONSOLE_UI_80
      - PG_CONSOLE_AUTHORIZATION_TOKEN=${SERVICE_PASSWORD_UI}
      - PG_CONSOLE_API_HOST=autobase-console-api
