# documentation: https://hermes-agent.nousresearch.com/docs/
# slogan: The self-improving AI agent with built-in learning loop, skills, and multi-platform messaging gateway.
# category: ai
# tags: ai,agent,llm,openai,anthropic,openrouter,telegram,discord,memory,self-improving
# logo: svgs/hermes-agent.svg
# port: 9119

services:
  hermes:
    image: nousresearch/hermes-agent:latest
    command: gateway run --host 0.0.0.0 --port 8642
    environment:
      - SERVICE_FQDN_HERMES_8642
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY:-}
      - HERMES_UID=${HERMES_UID:-10000}
      - HERMES_GID=${HERMES_GID:-10000}
    volumes:
      - hermes-data:/opt/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8642/health"]
      interval: 10s
      timeout: 30s
      retries: 12
      start_period: 30s

  hermes-dashboard:
    image: nousresearch/hermes-agent:latest
    command: dashboard --host 0.0.0.0 --port 9119 --no-open
    environment:
      - SERVICE_FQDN_HERMES-DASHBOARD_9119
      - GATEWAY_HEALTH_URL=http://hermes:8642
      - HERMES_UID=${HERMES_UID:-10000}
      - HERMES_GID=${HERMES_GID:-10000}
    volumes:
      - hermes-data:/opt/data
    depends_on:
      hermes:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9119/api/status"]
      interval: 10s
      timeout: 30s
      retries: 12
      start_period: 30s

volumes:
  hermes-data:
