# documentation: https://docs.litespeedtech.com/cloud/docker/wordpress/
# slogan: WordPress running on OpenLiteSpeed, a lightweight high-performance web server.
# category: cms
# tags: wordpress,cms,blog,openlitespeed,ols,litespeed,mariadb,lscache
# logo: svgs/wordpress.svg
# port: 8080

services:
  wordpress:
    image: litespeedtech/openlitespeed:latest
    volumes:
      - wordpress-data:/var/www/vhosts/localhost/html
      - ols-conf:/usr/local/lsws/conf
      - ols-logs:/usr/local/lsws/logs
    environment:
      - SERVICE_URL_WORDPRESS_8080
      - TZ=${TZ:-UTC}
      - PHP_LSAPI_CHILDREN=${PHP_LSAPI_CHILDREN:-35}
      - LSCACHE_DOCKER_LB=${LSCACHE_DOCKER_LB:-0}
    depends_on:
      mariadb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8080"]
      interval: 10s
      timeout: 10s
      retries: 10

  mariadb:
    image: mariadb:11
    volumes:
      - mariadb-data:/var/lib/mysql
    environment:
      - MYSQL_ROOT_PASSWORD=$SERVICE_PASSWORD_ROOT
      - MYSQL_DATABASE=${MYSQL_DATABASE:-wordpress}
      - MYSQL_USER=$SERVICE_USER_MARIADB
      - MYSQL_PASSWORD=$SERVICE_PASSWORD_MARIADB
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 20s
      retries: 10
