# documentation: https://docs.litespeedtech.com/cloud/docker/ols-wordpress/
# slogan: WordPress served by OpenLiteSpeed with MariaDB and persistent application data.
# category: cms
# tags: cms, blog, content, management, wordpress, openlitespeed, mariadb
# logo: svgs/wordpress.svg
# port: 80

services:
  wordpress:
    image: litespeedtech/openlitespeed:1.8.5-lsphp85
    volumes:
      - openlitespeed-conf:/usr/local/lsws/conf
      - openlitespeed-admin-conf:/usr/local/lsws/admin/conf
      - openlitespeed-sites:/var/www/vhosts
      - openlitespeed-acme:/root/.acme.sh
      - openlitespeed-logs:/usr/local/lsws/logs
    environment:
      - SERVICE_URL_WORDPRESS_80
      - TZ=${TIMEZONE:-UTC}
      - DOMAIN=${SERVICE_URL_WORDPRESS}
      - MYSQL_DATABASE=wordpress
      - MYSQL_USER=${SERVICE_USER_WORDPRESS}
      - MYSQL_PASSWORD=${SERVICE_PASSWORD_WORDPRESS}
      - MYSQL_ROOT_PASSWORD=${SERVICE_PASSWORD_ROOT}
    depends_on:
      mariadb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1"]
      interval: 2s
      timeout: 10s
      retries: 10
  mariadb:
    image: mariadb:11.4
    command: ["--max-allowed-packet=512M"]
    volumes:
      - mariadb-data:/var/lib/mysql
    environment:
      - MYSQL_ROOT_PASSWORD=${SERVICE_PASSWORD_ROOT}
      - MYSQL_DATABASE=wordpress
      - MYSQL_USER=${SERVICE_USER_WORDPRESS}
      - MYSQL_PASSWORD=${SERVICE_PASSWORD_WORDPRESS}
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 20s
      retries: 10
