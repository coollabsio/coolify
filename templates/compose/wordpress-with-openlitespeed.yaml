# documentation: https://docs.litespeedtech.com/cloud/docker/ols-wordpress/
# slogan: WordPress with OpenLiteSpeed provides a high-performance CMS stack with persistent files and MariaDB storage.
# category: cms
# tags: cms, blog, content, management, openlitespeed, mariadb
# logo: svgs/wordpress.svg
# port: 80

services:
  wordpress:
    image: litespeedtech/openlitespeed:latest
    environment:
      - SERVICE_URL_WORDPRESS_80
      - TZ=${TZ:-UTC}
    volumes:
      - wordpress-files:/var/www/vhosts/localhost/html
      - openlitespeed-conf:/usr/local/lsws/conf
      - openlitespeed-admin-conf:/usr/local/lsws/admin/conf
      - openlitespeed-logs:/usr/local/lsws/logs
    depends_on:
      wordpress-init:
        condition: service_completed_successfully
      mariadb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:80"]
      interval: 10s
      timeout: 10s
      retries: 15

  wordpress-init:
    image: wordpress:cli-php8.3
    volumes:
      - wordpress-files:/var/www/html
    environment:
      - WORDPRESS_DB_HOST=mariadb
      - WORDPRESS_DB_USER=${SERVICE_USER_WORDPRESS}
      - WORDPRESS_DB_PASSWORD=${SERVICE_PASSWORD_WORDPRESS}
      - WORDPRESS_DB_NAME=${MARIADB_DATABASE:-wordpress}
    depends_on:
      mariadb:
        condition: service_healthy
    command:
      - /bin/sh
      - -c
      - |
        set -e
        if [ ! -f /var/www/html/wp-config.php ]; then
          wp core download --path=/var/www/html --allow-root
          wp config create --path=/var/www/html --dbname="$${WORDPRESS_DB_NAME}" --dbuser="$${WORDPRESS_DB_USER}" --dbpass="$${WORDPRESS_DB_PASSWORD}" --dbhost="$${WORDPRESS_DB_HOST}" --skip-check --allow-root
          chmod -R a+rwX /var/www/html/wp-content
        fi

  mariadb:
    image: mariadb:11
    volumes:
      - mariadb-data:/var/lib/mysql
    environment:
      - MYSQL_ROOT_PASSWORD=${SERVICE_PASSWORD_ROOT}
      - MYSQL_DATABASE=${MARIADB_DATABASE:-wordpress}
      - MYSQL_USER=${SERVICE_USER_WORDPRESS}
      - MYSQL_PASSWORD=${SERVICE_PASSWORD_WORDPRESS}
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 20s
      retries: 10
