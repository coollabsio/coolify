# WordPress + OpenLiteSpeed Service Template
# -------------------------------------------
# Provides a production-ready WordPress stack running on OpenLiteSpeed (OLS)
# web server with a MariaDB database backend.
#
# OpenLiteSpeed is an open-source, high-performance HTTP server from LiteSpeed
# Technologies. It supports native LSCache for WordPress, which dramatically
# reduces TTFB without a separate caching plugin.
#
# Images used:
#   - litespeedtech/openlitespeed  (OLS + LSPHP all-in-one)
#   - mariadb:lts                  (drop-in MySQL replacement)
#
# Coolify exposes the WordPress site via its built-in proxy on port 8088.
# The OLS Admin Panel is available on port 7080 (internal / not proxied by default).
#
# Related issue: https://github.com/coollabsio/coolify/issues/8264

services:
  wordpress:
    image: "litespeedtech/openlitespeed:${OLS_VERSION:-1.7.19}-lsphp${LSPHP_VERSION:-81}"
    environment:
      - SERVICE_FQDN_WORDPRESS_8088
      - WORDPRESS_DB_HOST=${WORDPRESS_DB_HOST:-db}
      - WORDPRESS_DB_NAME=${WORDPRESS_DB_NAME:-wordpress}
      - WORDPRESS_DB_USER=${WORDPRESS_DB_USER:-wordpress}
      - WORDPRESS_DB_PASSWORD=${WORDPRESS_DB_PASSWORD}
      - WORDPRESS_TABLE_PREFIX=${WORDPRESS_TABLE_PREFIX:-wp_}
      - OLS_ADMIN_USER=${OLS_ADMIN_USER:-admin}
      - OLS_ADMIN_PASSWORD=${OLS_ADMIN_PASSWORD}
      - OLS_ADMIN_EMAIL=${OLS_ADMIN_EMAIL:-admin@example.com}
    volumes:
      - wordpress-data:/var/www/vhosts/localhost/html
      - ols-conf:/usr/local/lsws/conf
      - ols-admin-conf:/usr/local/lsws/admin/conf
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8088"]
      interval: 5s
      timeout: 20s
      retries: 10

  db:
    image: "mariadb:${MARIADB_VERSION:-lts}"
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - MYSQL_DATABASE=${WORDPRESS_DB_NAME:-wordpress}
      - MYSQL_USER=${WORDPRESS_DB_USER:-wordpress}
      - MYSQL_PASSWORD=${WORDPRESS_DB_PASSWORD}
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test:
        - CMD
        - healthcheck.sh
        - "--su-mysql"
        - "--connect"
        - "--innodb_initialized"
      interval: 5s
      timeout: 20s
      retries: 10

volumes:
  wordpress-data:
  ols-conf:
  ols-admin-conf:
  db-data:
