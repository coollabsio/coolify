# documentation: https://docs.litespeedtech.com/cloud/docker/ols-wordpress/
# slogan: WordPress running on OpenLiteSpeed with MariaDB, Redis, and phpMyAdmin.
# category: cms
# tags: cms, blog, content, management, wordpress, openlitespeed, litespeed, mariadb, redis
# logo: svgs/wordpress.svg
# port: 80

services:
  wordpress:
    image: litespeedtech/openlitespeed:${OLS_VERSION:-1.8.5}-${PHP_VERSION:-lsphp85}
    volumes:
      - litespeed-conf:/usr/local/lsws/conf
      - litespeed-admin-conf:/usr/local/lsws/admin/conf
      - wordpress-sites:/var/www/vhosts
      - litespeed-acme:/root/.acme.sh
      - litespeed-logs:/usr/local/lsws/logs
    environment:
      - SERVICE_URL_WORDPRESS_80
      - TZ=${TIMEZONE:-UTC}
      - DOMAIN=${WORDPRESS_DOMAIN:-localhost}
    depends_on:
      wordpress-installer:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1"]
      interval: 5s
      timeout: 20s
      retries: 10

  wordpress-installer:
    image: litespeedtech/openlitespeed:${OLS_VERSION:-1.8.5}-${PHP_VERSION:-lsphp85}
    restart: "no"
    volumes:
      - wordpress-sites:/var/www/vhosts
    environment:
      - WORDPRESS_DB_HOST=mariadb
      - WORDPRESS_DB_NAME=${MYSQL_DATABASE:-wordpress}
      - WORDPRESS_DB_USER=${SERVICE_USER_WORDPRESS}
      - WORDPRESS_DB_PASSWORD=${SERVICE_PASSWORD_WORDPRESS}
    depends_on:
      mariadb:
        condition: service_healthy
    entrypoint:
      - /bin/bash
      - -lc
      - |
        set -e
        docroot=/var/www/vhosts/localhost/html
        mkdir -p "$$docroot"
        cd "$$docroot"

        if [ ! -f wp-load.php ]; then
          wp core download --allow-root --quiet
        fi

        if [ ! -f wp-config.php ]; then
          cp wp-config-sample.php wp-config.php
          wp config set DB_HOST "$$WORDPRESS_DB_HOST" --allow-root
          wp config set DB_NAME "$$WORDPRESS_DB_NAME" --allow-root
          wp config set DB_USER "$$WORDPRESS_DB_USER" --allow-root
          wp config set DB_PASSWORD "$$WORDPRESS_DB_PASSWORD" --allow-root
          wp config shuffle-salts --allow-root
        fi

        if [ ! -d wp-content/plugins/litespeed-cache ]; then
          wp plugin install litespeed-cache --allow-root --quiet || true
        fi

        chown -R 1000:1000 /var/www/vhosts/localhost

  mariadb:
    image: mariadb:11.4
    command: ["--max-allowed-packet=512M"]
    volumes:
      - mariadb-data:/var/lib/mysql
    environment:
      - MYSQL_ROOT_PASSWORD=${SERVICE_PASSWORD_ROOT}
      - MYSQL_DATABASE=${MYSQL_DATABASE:-wordpress}
      - MYSQL_USER=${SERVICE_USER_WORDPRESS}
      - MYSQL_PASSWORD=${SERVICE_PASSWORD_WORDPRESS}
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 20s
      retries: 10

  redis:
    image: redis:alpine
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 20s
      retries: 10

  phpmyadmin:
    image: phpmyadmin/phpmyadmin:${PHPMYADMIN_VERSION:-5.2.3}
    environment:
      - SERVICE_URL_PHPMYADMIN_80
      - PMA_HOST=mariadb
      - PMA_USER=${SERVICE_USER_WORDPRESS}
      - PMA_PASSWORD=${SERVICE_PASSWORD_WORDPRESS}
    depends_on:
      mariadb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1"]
      interval: 5s
      timeout: 20s
      retries: 10

volumes:
  litespeed-conf:
  litespeed-admin-conf:
  wordpress-sites:
  litespeed-acme:
  litespeed-logs:
  mariadb-data:
  redis-data:
