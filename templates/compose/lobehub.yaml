# documentation: https://lobehub.com/docs/self-hosting/platform/docker-compose
# slogan: LobeHub is an open-source AI agent workspace with accounts, sync, file uploads, and web search.
# category: ai
# tags: ai, chat, openai, llm, chatbot, agents, lobehub
# logo: svgs/lobe-chat.png
# port: 3210
#
# Before deploy, set JWKS_KEY to an RS256 JWKS JSON string.
# Generate one: https://lobehub.com/docs/self-hosting/environment-variables/auth#jwks-key
# The rustfs domain (port 9000) must be reachable from the browser for file uploads.

services:
  lobe:
    image: lobehub/lobehub:2.3.6
    environment:
      - SERVICE_URL_LOBE_3210
      - APP_URL=${SERVICE_URL_LOBE}
      - INTERNAL_APP_URL=http://127.0.0.1:3210
      - KEY_VAULTS_SECRET=${SERVICE_REALBASE64_32_KEYVAULTS}
      - AUTH_SECRET=${SERVICE_REALBASE64_32_AUTH}
      - JWKS_KEY=${JWKS_KEY:?}
      - AUTH_ALLOWED_EMAILS=${AUTH_ALLOWED_EMAILS}
      - DATABASE_URL=postgresql://postgres:${SERVICE_PASSWORD_POSTGRES}@postgresql:5432/lobechat
      - REDIS_URL=redis://redis:6379
      - REDIS_PREFIX=lobechat
      - REDIS_TLS=0
      - S3_ENDPOINT=${SERVICE_URL_RUSTFS}
      - S3_INTERNAL_ENDPOINT=http://rustfs:9000
      - S3_BUCKET=lobe
      - S3_ENABLE_PATH_STYLE=1
      - S3_ACCESS_KEY=${SERVICE_USER_RUSTFS}
      - S3_ACCESS_KEY_ID=${SERVICE_USER_RUSTFS}
      - S3_SECRET_ACCESS_KEY=${SERVICE_PASSWORD_RUSTFS}
      - S3_SET_ACL=0
      - LLM_VISION_IMAGE_USE_BASE64=1
      - SEARXNG_URL=http://searxng:8080
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    depends_on:
      postgresql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rustfs:
        condition: service_healthy
      rustfs-init:
        condition: service_completed_successfully
      searxng:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3210/api/version >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 90s

  postgresql:
    image: paradedb/paradedb:0.27.1-pg17
    # LobeHub needs pg_search. Keep pg_cron and pg_stat_statements: the image bootstrap fails without them.
    command: ["postgres", "-c", "shared_preload_libraries=pg_search,pg_cron,pg_stat_statements"]
    environment:
      - POSTGRES_DB=lobechat
      - POSTGRES_PASSWORD=${SERVICE_PASSWORD_POSTGRES}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -h 127.0.0.1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 60s

  redis:
    image: redis:7-alpine
    command: redis-server --save 60 1000 --appendonly yes
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  rustfs:
    image: rustfs/rustfs:1.0.6
    command: ["--access-key", "${SERVICE_USER_RUSTFS}", "--secret-key", "${SERVICE_PASSWORD_RUSTFS}", "/data"]
    environment:
      - SERVICE_URL_RUSTFS_9000
      - RUSTFS_ACCESS_KEY=${SERVICE_USER_RUSTFS}
      - RUSTFS_SECRET_KEY=${SERVICE_PASSWORD_RUSTFS}
      - RUSTFS_CORS_ALLOWED_ORIGINS=${SERVICE_URL_LOBE}
    volumes:
      - rustfs-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9000/health >/dev/null 2>&1 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30

  rustfs-init:
    image: rustfs/rc:v0.1.38
    depends_on:
      rustfs:
        condition: service_healthy
    environment:
      - RUSTFS_ACCESS_KEY=${SERVICE_USER_RUSTFS}
      - RUSTFS_SECRET_KEY=${SERVICE_PASSWORD_RUSTFS}
      - LOBE_ORIGIN=${SERVICE_URL_LOBE}
    volumes:
      - type: bind
        source: ./bucket.config.json
        target: /bucket.config.json
        content: |
          {
            "Version": "2012-10-17",
            "Statement": [
              {
                "Effect": "Allow",
                "Principal": { "AWS": ["*"] },
                "Action": ["s3:GetObject"],
                "Resource": ["arn:aws:s3:::lobe/*"]
              }
            ]
          }
    entrypoint: ["/bin/sh", "-c"]
    # Browsers upload with presigned URLs to the RustFS origin, so the bucket also needs a CORS rule.
    command:
      - |
        set -eu
        rc alias set rustfs http://rustfs:9000 "$$RUSTFS_ACCESS_KEY" "$$RUSTFS_SECRET_KEY"
        rc bucket create rustfs/lobe --ignore-existing
        rc bucket anonymous set-json /bucket.config.json rustfs/lobe
        printf '<CORSConfiguration><CORSRule><AllowedOrigin>%s</AllowedOrigin><AllowedMethod>GET</AllowedMethod><AllowedMethod>PUT</AllowedMethod><AllowedMethod>HEAD</AllowedMethod><AllowedHeader>*</AllowedHeader><ExposeHeader>ETag</ExposeHeader><MaxAgeSeconds>3600</MaxAgeSeconds></CORSRule></CORSConfiguration>' "$$LOBE_ORIGIN" | rc bucket cors set rustfs/lobe -
    restart: "no"
    exclude_from_hc: true

  searxng:
    image: searxng/searxng:2026.11.23-a7163d091
    environment:
      - SEARXNG_SECRET=${SERVICE_PASSWORD_SEARXNG}
    volumes:
      - type: bind
        source: ./searxng-settings.yml
        target: /etc/searxng/settings.yml
        content: |
          use_default_settings: true
          server:
            limiter: false
            image_proxy: true
          search:
            formats:
              - html
              - json
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
