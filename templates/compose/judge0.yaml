# documentation: https://ce.judge0.com/
# slogan: Judge0, where code happens.
# tags: code,run,compute
# logo: svgs/judge0.png
# port: 2358

# More info about environmental variables can be found at: https://github.com/judge0/judge0/blob/master/judge0.conf
x-logging: &default-logging
  logging:
    driver: json-file
    options:
      max-size: "100M"

services:
  judge0:
    image: judge0/judge0:1.13.1
    command:
      - bash
      - -c
      - >
        sudo mkdir -p /box &&
        sudo chmod 1777 /box &&
        exec ./scripts/server
    privileged: true
    environment:
      - SERVICE_URL_JUDGE0_2358
      # Judge0 server configuration
      - JUDGE0_TELEMETRY_ENABLE=${JUDGE0_TELEMETRY_ENABLE:-true}
      - RESTART_MAX_TRIES=${RESTART_MAX_TRIES:-10}
      - MAINTENANCE_MODE=${MAINTENANCE_MODE:-false}
      - MAINTENANCE_MESSAGE=${MAINTENANCE_MESSAGE:-Judge0 is currently in maintenance.}
      - ENABLE_WAIT_RESULT=${ENABLE_WAIT_RESULT:-true}
      - ENABLE_COMPILER_OPTIONS=${ENABLE_COMPILER_OPTIONS:-true}
      - ALLOWED_LANGUAGES_FOR_COMPILER_OPTIONS=${ALLOWED_LANGUAGES_FOR_COMPILER_OPTIONS:-}
      - ENABLE_COMMAND_LINE_ARGUMENTS=${ENABLE_COMMAND_LINE_ARGUMENTS:-true}
      - ENABLE_SUBMISSION_DELETE=${ENABLE_SUBMISSION_DELETE:-false}
      - ENABLE_BATCHED_SUBMISSIONS=${ENABLE_BATCHED_SUBMISSIONS:-true}
      - MAX_SUBMISSION_BATCH_SIZE=${MAX_SUBMISSION_BATCH_SIZE:-20}
      - ENABLE_CALLBACKS=${ENABLE_CALLBACKS:-true}
      - CALLBACKS_MAX_TRIES=${CALLBACKS_MAX_TRIES:-3}
      - CALLBACKS_TIMEOUT=${CALLBACKS_TIMEOUT:-5}
      - ENABLE_ADDITIONAL_FILES=${ENABLE_ADDITIONAL_FILES:-true}
      - SUBMISSION_CACHE_DURATION=${SUBMISSION_CACHE_DURATION:-1}
      - USE_DOCS_AS_HOMEPAGE=${USE_DOCS_AS_HOMEPAGE:-false}
      - DISABLE_IMPLICIT_BASE64_ENCODING=${DISABLE_IMPLICIT_BASE64_ENCODING:-false}
      # Worker configuration
      - INTERVAL=${INTERVAL:-0.1}
      - COUNT=${COUNT:-}
      - MAX_QUEUE_SIZE=${MAX_QUEUE_SIZE:-100}
      # Access control
      - ALLOW_ORIGIN=${ALLOW_ORIGIN:-*}
      - DISALLOW_ORIGIN=${DISALLOW_ORIGIN:-}
      - ALLOW_IP=${ALLOW_IP:-}
      - DISALLOW_IP=${DISALLOW_IP:-}
      # Authentication & authorization
      - AUTHN_HEADER=${AUTHN_HEADER:-X-Auth-Token}
      - AUTHN_TOKEN=${AUTHN_TOKEN:-}
      - AUTHZ_HEADER=${AUTHZ_HEADER:-X-Auth-User}
      - REDIS_HOST=${COOLIFY_REDIS_HOST:-redis}
      - REDIS_PORT=${REDIS_PORT:-6379}
      - REDIS_PASSWORD=${SERVICE_PASSWORD_REDIS}
      - RESQUE_NAMESPACE=${RESQUE_NAMESPACE:-}
      - POSTGRES_HOST=${COOLIFY_POSTGRES_HOST:-postgres}
      - POSTGRES_PORT=${POSTGRES_PORT:-5432}
      - POSTGRES_DB=${COOLIFY_POSTGRES_DB:-judge0}
      - POSTGRES_USER=${COOLIFY_POSTGRES_USER:-judge0}
      - POSTGRES_PASSWORD=${SERVICE_PASSWORD_POSTGRES}
      - AUTHZ_TOKEN=${SERVICE_PASSWORD_AUTHZ}
      - ENABLE_PER_PROCESS_AND_THREAD_TIME_LIMIT=${ENABLE_PER_PROCESS_AND_THREAD_TIME_LIMIT:-true}
      - ENABLE_PER_PROCESS_AND_THREAD_MEMORY_LIMIT=${ENABLE_PER_PROCESS_AND_THREAD_MEMORY_LIMIT:-true}
      - ALLOW_ENABLE_PER_PROCESS_AND_THREAD_TIME_LIMIT=${ALLOW_ENABLE_PER_PROCESS_AND_THREAD_TIME_LIMIT:-true}
      - ALLOW_ENABLE_PER_PROCESS_AND_THREAD_MEMORY_LIMIT=${ALLOW_ENABLE_PER_PROCESS_AND_THREAD_MEMORY_LIMIT:-true}
      - CPU_TIME_LIMIT=${CPU_TIME_LIMIT:-5}
      - MAX_CPU_TIME_LIMIT=${MAX_CPU_TIME_LIMIT:-15}
      - CPU_EXTRA_TIME=${CPU_EXTRA_TIME:-1}
      - MAX_CPU_EXTRA_TIME=${MAX_CPU_EXTRA_TIME:-5}
      - WALL_TIME_LIMIT=${WALL_TIME_LIMIT:-10} # Default wall time limit already (https://github.com/judge0/judge0/blob/master/judge0.conf)
      - MAX_WALL_TIME_LIMIT=${MAX_WALL_TIME_LIMIT:-20} # Default max wall time limit already (https://github.com/judge0/judge0/blob/master/judge0.conf)
      - MEMORY_LIMIT=${MEMORY_LIMIT:-128000}
      - MAX_MEMORY_LIMIT=${MAX_MEMORY_LIMIT:-512000}
      - STACK_LIMIT=${STACK_LIMIT:-64000}
      - MAX_STACK_LIMIT=${MAX_STACK_LIMIT:-128000}
      - MAX_PROCESSES_AND_OR_THREADS=${MAX_PROCESSES_AND_OR_THREADS:-60}
      - MAX_MAX_PROCESSES_AND_OR_THREADS=${MAX_MAX_PROCESSES_AND_OR_THREADS:-120}
      - MAX_FILE_SIZE=${MAX_FILE_SIZE:-1024}
      - MAX_MAX_FILE_SIZE=${MAX_MAX_FILE_SIZE:-4096}
      - NUMBER_OF_RUNS=${NUMBER_OF_RUNS:-1}
      - MAX_NUMBER_OF_RUNS=${MAX_NUMBER_OF_RUNS:-20}
      - REDIRECT_STDERR_TO_STDOUT=${REDIRECT_STDERR_TO_STDOUT:-false}
      - MAX_EXTRACT_SIZE=${MAX_EXTRACT_SIZE:-10240}
      - ALLOW_ENABLE_NETWORK=${ALLOW_ENABLE_NETWORK:-true}
      - ENABLE_NETWORK=${ENABLE_NETWORK:-false}
      # Rails configuration
      - RAILS_ENV=${RAILS_ENV:-production}
      - RAILS_MAX_THREADS=${RAILS_MAX_THREADS:-}
      - RAILS_SERVER_PROCESSES=${RAILS_SERVER_PROCESSES:-2}
      - SECRET_KEY_BASE=${SECRET_KEY_BASE:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:2358/version"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    <<: *default-logging

  worker:
    image: judge0/judge0:1.13.1
    command:
      - bash
      - -c
      - >
        sudo mkdir -p /box &&
        sudo chmod 1777 /box &&
        exec ./scripts/workers
    privileged: true
    environment:
      # Judge0 server configuration (shared with workers)
      - JUDGE0_TELEMETRY_ENABLE=${JUDGE0_TELEMETRY_ENABLE:-true}
      - RESTART_MAX_TRIES=${RESTART_MAX_TRIES:-10}
      - MAINTENANCE_MODE=${MAINTENANCE_MODE:-false}
      - MAINTENANCE_MESSAGE=${MAINTENANCE_MESSAGE:-Judge0 is currently in maintenance.}
      - ENABLE_WAIT_RESULT=${ENABLE_WAIT_RESULT:-true}
      - ENABLE_COMPILER_OPTIONS=${ENABLE_COMPILER_OPTIONS:-true}
      - ALLOWED_LANGUAGES_FOR_COMPILER_OPTIONS=${ALLOWED_LANGUAGES_FOR_COMPILER_OPTIONS:-}
      - ENABLE_COMMAND_LINE_ARGUMENTS=${ENABLE_COMMAND_LINE_ARGUMENTS:-true}
      - ENABLE_SUBMISSION_DELETE=${ENABLE_SUBMISSION_DELETE:-false}
      - ENABLE_BATCHED_SUBMISSIONS=${ENABLE_BATCHED_SUBMISSIONS:-true}
      - MAX_SUBMISSION_BATCH_SIZE=${MAX_SUBMISSION_BATCH_SIZE:-20}
      - ENABLE_CALLBACKS=${ENABLE_CALLBACKS:-true}
      - CALLBACKS_MAX_TRIES=${CALLBACKS_MAX_TRIES:-3}
      - CALLBACKS_TIMEOUT=${CALLBACKS_TIMEOUT:-5}
      - ENABLE_ADDITIONAL_FILES=${ENABLE_ADDITIONAL_FILES:-true}
      - SUBMISSION_CACHE_DURATION=${SUBMISSION_CACHE_DURATION:-1}
      - USE_DOCS_AS_HOMEPAGE=${USE_DOCS_AS_HOMEPAGE:-false}
      - DISABLE_IMPLICIT_BASE64_ENCODING=${DISABLE_IMPLICIT_BASE64_ENCODING:-false}
      - REDIS_HOST=${COOLIFY_REDIS_HOST:-redis}
      - REDIS_PORT=${REDIS_PORT:-6379}
      - REDIS_PASSWORD=${SERVICE_PASSWORD_REDIS}
      - POSTGRES_HOST=${COOLIFY_POSTGRES_HOST:-postgres}
      - POSTGRES_PORT=${POSTGRES_PORT:-5432}
      - POSTGRES_DB=${COOLIFY_POSTGRES_DB:-judge0}
      - POSTGRES_USER=${COOLIFY_POSTGRES_USER:-judge0}
      - POSTGRES_PASSWORD=${SERVICE_PASSWORD_POSTGRES}
      - AUTHZ_TOKEN=${SERVICE_PASSWORD_AUTHZ}
      - ENABLE_PER_PROCESS_AND_THREAD_TIME_LIMIT=true
      - ENABLE_PER_PROCESS_AND_THREAD_MEMORY_LIMIT=true
      - ALLOW_ENABLE_PER_PROCESS_AND_THREAD_TIME_LIMIT=${ALLOW_ENABLE_PER_PROCESS_AND_THREAD_TIME_LIMIT:-true}
      - ALLOW_ENABLE_PER_PROCESS_AND_THREAD_MEMORY_LIMIT=${ALLOW_ENABLE_PER_PROCESS_AND_THREAD_MEMORY_LIMIT:-true}
      - CPU_TIME_LIMIT=${CPU_TIME_LIMIT:-5}
      - MAX_CPU_TIME_LIMIT=${MAX_CPU_TIME_LIMIT:-15}
      - CPU_EXTRA_TIME=${CPU_EXTRA_TIME:-1}
      - MAX_CPU_EXTRA_TIME=${MAX_CPU_EXTRA_TIME:-5}
      - WALL_TIME_LIMIT=${WALL_TIME_LIMIT:-10}
      - MAX_WALL_TIME_LIMIT=${MAX_WALL_TIME_LIMIT:-20}
      - MEMORY_LIMIT=${MEMORY_LIMIT:-128000}
      - MAX_MEMORY_LIMIT=${MAX_MEMORY_LIMIT:-512000}
      - STACK_LIMIT=${STACK_LIMIT:-64000}
      - MAX_STACK_LIMIT=${MAX_STACK_LIMIT:-128000}
      - MAX_PROCESSES_AND_OR_THREADS=${MAX_PROCESSES_AND_OR_THREADS:-60}
      - MAX_MAX_PROCESSES_AND_OR_THREADS=${MAX_MAX_PROCESSES_AND_OR_THREADS:-120}
      - MAX_FILE_SIZE=${MAX_FILE_SIZE:-1024}
      - MAX_MAX_FILE_SIZE=${MAX_MAX_FILE_SIZE:-4096}
      - NUMBER_OF_RUNS=${NUMBER_OF_RUNS:-1}
      - MAX_NUMBER_OF_RUNS=${MAX_NUMBER_OF_RUNS:-20}
      - REDIRECT_STDERR_TO_STDOUT=${REDIRECT_STDERR_TO_STDOUT:-false}
      - MAX_EXTRACT_SIZE=${MAX_EXTRACT_SIZE:-10240}
      - ALLOW_ENABLE_NETWORK=${ALLOW_ENABLE_NETWORK:-true}
      - ENABLE_NETWORK=${ENABLE_NETWORK:-false}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "pgrep", "-f", "workers"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    <<: *default-logging

  postgres:
    image: postgres:16.2
    environment:
      - POSTGRES_DB=${COOLIFY_POSTGRES_DB:-judge0}
      - POSTGRES_USER=${COOLIFY_POSTGRES_USER:-judge0}
      - POSTGRES_PASSWORD=${SERVICE_PASSWORD_POSTGRES}
    volumes:
      - postgres-data:/var/lib/postgresql/data/
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 20s
      retries: 10
    <<: *default-logging

  redis:
    image: redis:7.2.4
    command:
      - bash
      - -c
      - docker-entrypoint.sh --appendonly no --requirepass "$REDIS_PASSWORD"
    environment:
      - REDIS_PASSWORD=${SERVICE_PASSWORD_REDIS}
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 20s
      retries: 10
    <<: *default-logging

volumes:
  postgres-data:
