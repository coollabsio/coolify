# documentation: https://ce.judge0.com/
# slogan: Judge0, where code happens.
# tags: code,run,compute
# logo: svgs/judge0.png
# port: 80

x-logging: &default-logging
  logging:
    driver: json-file
    options:
      max-size: "100M"

services:
  server:
    image: judge0/judge0:1.13.1
    environment:
      REDIS_HOST: ${SERVICE_REDIS_HOST:-redis}
      REDIS_PASSWORD: ${SERVICE_REDIS_PASSWORD:-changeme}
      POSTGRES_HOST: ${SERVICE_DB_HOST:-db}
      POSTGRES_DB: ${SERVICE_DB_NAME:-judge0}
      POSTGRES_USER: ${SERVICE_DB_USER:-judge0}
      POSTGRES_PASSWORD: ${SERVICE_DB_PASSWORD:-changeme}
      AUTHZ_TOKEN: ${AUTHZ_TOKEN:-changeme}
      PORT: ${PORT:-2358} # Coolify will inject PORT
    <<: *default-logging

  workers:
    image: judge0/judge0:1.13.1
    command: ["./scripts/workers"]
    environment:
      REDIS_HOST: ${SERVICE_REDIS_HOST:-redis}
      REDIS_PASSWORD: ${SERVICE_REDIS_PASSWORD:-changeme}
      POSTGRES_HOST: ${SERVICE_DB_HOST:-db}
      POSTGRES_DB: ${SERVICE_DB_NAME:-judge0}
      POSTGRES_USER: ${SERVICE_DB_USER:-judge0}
      POSTGRES_PASSWORD: ${SERVICE_DB_PASSWORD:-changeme}
      AUTHZ_TOKEN: ${AUTHZ_TOKEN:-changeme}
    <<: *default-logging

  db:
    image: postgres:16.2
    environment:
      POSTGRES_DB: ${SERVICE_DB_NAME:-judge0}
      POSTGRES_USER: ${SERVICE_DB_USER:-judge0}
      POSTGRES_PASSWORD: ${SERVICE_DB_PASSWORD:-changeme}
    volumes:
      - data:/var/lib/postgresql/data/
    <<: *default-logging

  redis:
    image: redis:7.2.4
    command:
      - bash
      - -c
      - docker-entrypoint.sh --appendonly no --requirepass "$$REDIS_PASSWORD"
    environment:
      REDIS_PASSWORD: ${SERVICE_REDIS_PASSWORD:-changeme}
    <<: *default-logging

volumes:
  data:
