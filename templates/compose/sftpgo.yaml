# documentation: https://docs.sftpgo.com/2.6/
# slogan: SFTPGo is an event-driven SFTP, FTP/S, HTTP/S and WebDAV server.
# tags: sftpgo,sftp,ftp,file,webdav
# logo: svgs/sftpgo.svg
# port: 8080

version: 3.8
services:
  sftpgo:
    image: "ghcr.io/drakkan/sftpgo:v2.6-alpine"
    depends_on:
      postgresql:
        condition: service_healthy
    ports:
      - 2022:2022
    environment:
      - SERVICE_FQDN_SFTPGO_8080
      - SFTPGO_DATA_PROVIDER__DRIVER=postgresql
      - SFTPGO_DATA_PROVIDER__CONNECTION_STRING=postgresql://${SERVICE_USER_POSTGRES}:${SERVICE_PASSWORD_64_POSTGRES}@postgresql:5432/${POSTGRES_DATABASE:-sftpgo}
    healthcheck:
      test:
       - "CMD-SHELL"
       - "wget -qO- http://127.0.0.1:8080/"
      interval: 5s
      timeout: 20s
      retries: 10
    volumes:
     - sftpgo-data:/srv/sftpgo/data

  postgresql:
    image: "postgres:17-alpine"
    environment:
      - POSTGRES_USER=${SERVICE_USER_POSTGRES}
      - POSTGRES_PASSWORD=${SERVICE_PASSWORD_64_POSTGRES}
      - POSTGRES_DB=${POSTGRES_DATABASE:-sftpgo}
    volumes:
      - "postgresql-data:/var/lib/postgresql/data"
    healthcheck:
      test:
        - CMD-SHELL
        - "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"
      interval: 5s
      timeout: 10s
      retries: 20
