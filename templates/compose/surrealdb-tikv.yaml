# documentation: https://surrealdb.com/docs
# slogan: SurrealDB with TiKV backend — a scalable, distributed, document-graph database backed by TiKV for horizontal scaling.
# category: database
# tags: database,nosql,graph,document,realtime,surrealdb,tikv,distributed
# logo: svgs/surrealdb.svg
# port: 8000

services:
  pd:
    image: pingcap/pd:latest
    command: >
      --name=pd
      --data-dir=/data/pd
      --client-urls=http://0.0.0.0:2379
      --peer-urls=http://0.0.0.0:2380
      --advertise-client-urls=http://pd:2379
      --advertise-peer-urls=http://pd:2380
    volumes:
      - pd-data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:2379/health"]
      interval: 5s
      timeout: 10s
      retries: 15

  tikv:
    image: pingcap/tikv:latest
    command: >
      --addr=0.0.0.0:20160
      --advertise-addr=tikv:20160
      --data-dir=/data/tikv
      --pd=http://pd:2379
    volumes:
      - tikv-data:/data
    depends_on:
      pd:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:20180/metrics"]
      interval: 5s
      timeout: 10s
      retries: 15

  surrealdb:
    image: surrealdb/surrealdb:latest
    command: start --log trace --user $SERVICE_USER_SURREALDB --pass $SERVICE_PASSWORD_SURREALDB tikv://pd:2379
    environment:
      - SERVICE_URL_SURREALDB_8000
    depends_on:
      tikv:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/health"]
      interval: 5s
      timeout: 10s
      retries: 15
