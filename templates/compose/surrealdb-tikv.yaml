# documentation: https://surrealdb.com/docs/surrealdb/installation/running/docker
# slogan: SurrealDB with TiKV distributed storage backend for production-grade multi-node deployments.
# category: database
# tags: database,nosql,graph,document,sql,realtime,surrealdb,tikv,distributed
# logo: svgs/surrealdb.svg
# port: 8000

services:
  pd:
    image: pingcap/pd:${TIKV_VERSION:-v8.5.0}
    restart: unless-stopped
    command:
      - --name=pd
      - --client-urls=http://0.0.0.0:2379
      - --peer-urls=http://0.0.0.0:2380
      - --advertise-client-urls=http://pd:2379
      - --advertise-peer-urls=http://pd:2380
      - --data-dir=/data/pd
    volumes:
      - pd-data:/data

  tikv:
    image: pingcap/tikv:${TIKV_VERSION:-v8.5.0}
    restart: unless-stopped
    depends_on:
      - pd
    command:
      - --addr=0.0.0.0:20160
      - --advertise-addr=tikv:20160
      - --pd=pd:2379
      - --data-dir=/data/tikv
    volumes:
      - tikv-data:/data

  surrealdb:
    image: surrealdb/surrealdb:${SURREALDB_VERSION:-v2}
    restart: unless-stopped
    depends_on:
      - tikv
    command: start --bind 0.0.0.0:8000 --user ${SERVICE_USER_SURREALDB} --pass ${SERVICE_PASSWORD_SURREALDB} tikv://pd:2379
    environment:
      - SERVICE_FQDN_SURREALDB_8000
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 5s
      timeout: 5s
      retries: 3
      start_period: 10s
