# documentation: https://surrealdb.com/docs/surrealdb/introduction/start
# slogan: SurrealDB with TiKV for distributed, scalable storage.
# category: database
# tags: database, multi-model, graph, document, sql, distributed, tikv
# logo: svgs/surrealdb.svg
# port: 8000

services:
  surrealdb:
    image: 'surrealdb/surrealdb:v2'
    command: start --log info --user $SERVICE_USER_SURREALDB --pass $SERVICE_PASSWORD_SURREALDB --bind 0.0.0.0:8000 tikv://tikv:2379
    environment:
      - SERVICE_FQDN_SURREALDB_8000
      - SERVICE_USER_SURREALDB
      - SERVICE_PASSWORD_SURREALDB
    depends_on:
      tikv:
        condition: service_healthy
      pd:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - 'curl'
        - '-f'
        - 'http://127.0.0.1:8000/health'
      interval: 5s
      timeout: 20s
      retries: 10

  pd:
    image: 'pingcap/pd:v8.1.0'
    command:
      - --name=pd
      - --client-urls=http://0.0.0.0:2379
      - --peer-urls=http://0.0.0.0:2380
      - --advertise-client-urls=http://pd:2379
      - --advertise-peer-urls=http://pd:2380
      - --initial-cluster=pd=http://pd:2380
      - --data-dir=/data/pd
    volumes:
      - pd-data:/data/pd
    healthcheck:
      test:
        - CMD
        - 'pd-ctl'
        - '-u'
        - 'http://127.0.0.1:2379'
        - 'health'
      interval: 5s
      timeout: 20s
      retries: 10

  tikv:
    image: 'pingcap/tikv:v8.1.0'
    command:
      - --addr=0.0.0.0:20160
      - --advertise-addr=tikv:20160
      - --pd=pd:2379
      - --data-dir=/data/tikv
    depends_on:
      pd:
        condition: service_healthy
    volumes:
      - tikv-data:/data/tikv
    healthcheck:
      test:
        - CMD
        - 'sh'
        - '-c'
        - 'tikv-ctl --host 127.0.0.1:20160 store'
      interval: 5s
      timeout: 20s
      retries: 10
