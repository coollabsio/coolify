    restart: on-failure:3
    depends_on:
      - appwrite-mongodb
      - appwrite-redis
    environment:
      - _APP_ENV=${_APP_ENV:-production}
      - _APP_WORKER_PER_CORE=${_APP_WORKER_PER_CORE:-6}
      - _APP_POOL_ADAPTER=${_APP_POOL_ADAPTER:-stack}
      - _APP_OPENSSL_KEY_V1=$SERVICE_PASSWORD_64_APPWRITE
      - _APP_DOMAIN=${_APP_DOMAIN:-$SERVICE_FQDN_APPWRITE}
      - _APP_DOMAIN_TARGET_CNAME=${_APP_DOMAIN_TARGET_CNAME}
      - _APP_DOMAIN_TARGET_AAAA=${_APP_DOMAIN_TARGET_AAAA}
      - _APP_DOMAIN_TARGET_A=${_APP_DOMAIN_TARGET_A}
      - _APP_DOMAIN_TARGET_CAA=${_APP_DOMAIN_TARGET_CAA}
      - _APP_DNS=${_APP_DNS}
      - _APP_DOMAIN_FUNCTIONS=${_APP_DOMAIN_FUNCTIONS:-functions.$SERVICE_FQDN_APPWRITE}
      - _APP_DOMAIN_SITES=${_APP_DOMAIN_SITES:-sites.$SERVICE_FQDN_APPWRITE}
      - _APP_REDIS_HOST=${_APP_REDIS_HOST:-appwrite-redis}
      - _APP_REDIS_PORT=${_APP_REDIS_PORT:-6379}
      - _APP_REDIS_USER=${_APP_REDIS_USER}
      - _APP_REDIS_PASS=${_APP_REDIS_PASS}
      - _APP_DB_ADAPTER=${_APP_DB_ADAPTER:-mongodb}
      - _APP_DB_HOST=${_APP_DB_HOST:-appwrite-mongodb}
      - _APP_DB_PORT=${_APP_DB_PORT:-27017}
      - _APP_DB_SCHEMA=${_APP_DB_SCHEMA:-appwrite}
      - _APP_DB_USER=$SERVICE_USER_MARIADB
      - _APP_DB_PASS=$SERVICE_PASSWORD_MARIADB
      - _APP_DB_ADAPTER_DOCUMENTSDB=${_APP_DB_ADAPTER_DOCUMENTSDB:-mongodb}
      - _APP_DB_HOST_DOCUMENTSDB=${_APP_DB_HOST_DOCUMENTSDB:-appwrite-mongodb}
      - _APP_DB_PORT_DOCUMENTSDB=${_APP_DB_PORT_DOCUMENTSDB:-27017}
      - _APP_DATABASE_SHARED_TABLES=${_APP_DATABASE_SHARED_TABLES}
      - _APP_INTERVAL_DOMAIN_VERIFICATION=${_APP_INTERVAL_DOMAIN_VERIFICATION:-120}
      - _APP_INTERVAL_CLEANUP_STALE_EXECUTIONS=${_APP_INTERVAL_CLEANUP_STALE_EXECUTIONS:-300}
    healthcheck:
      test: ["CMD-SHELL", "ps aux | grep -q '[p]hp' || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 3

  appwrite-mongodb:
    image: mongo:8.2.5
    container_name: appwrite-mongodb
    restart: on-failure:3
    volumes:
      - appwrite-mongodb:/data/db
      - appwrite-mongodb-keyfile:/data/keyfile
      - type: bind
        source: ./mongo-init.js
        target: /docker-entrypoint-initdb.d/mongo-init.js
        read_only: true
        content: |
          // mongo-init.js
          // Switch to the admin database
          const adminDb = db.getSiblingDB('admin');
          const username = process.env.MONGO_INITDB_USERNAME;
          const password = process.env.MONGO_INITDB_PASSWORD;
          const database = process.env.MONGO_INITDB_DATABASE;
          adminDb.createUser({
            user: username,
            pwd: password,
            roles: [
              { role: 'readWrite', db: database }
            ]
          });
      - type: bind
        source: ./mongo-entrypoint.sh
        target: /mongo-entrypoint.sh
        read_only: true
        content: |
          #!/bin/bash
          set -e
          KEYFILE_PATH="/data/keyfile/mongo-keyfile"
          if [ ! -f "$KEYFILE_PATH" ]; then
            echo "Generating random MongoDB keyfile..."
            mkdir -p /data/keyfile
            openssl rand -base64 756 > "$KEYFILE_PATH"
          fi
          chmod 400 "$KEYFILE_PATH"
          chown mongodb:mongodb "$KEYFILE_PATH" 2>/dev/null || chown 999:999 "$KEYFILE_PATH"
          exec docker-entrypoint.sh mongod --replSet rs0 --bind_ip_all --auth --keyFile "$KEYFILE_PATH"
    environment:
      - MONGO_INITDB_ROOT_USERNAME=root
      - MONGO_INITDB_ROOT_PASSWORD=$SERVICE_PASSWORD_MARIADBROOT
      - MONGO_INITDB_DATABASE=${_APP_DB_SCHEMA:-appwrite}
      - MONGO_INITDB_USERNAME=$SERVICE_USER_MARIADB
      - MONGO_INITDB_PASSWORD=$SERVICE_PASSWORD_MARIADB
    entrypoint:
      - /bin/bash
      - /mongo-entrypoint.sh
    healthcheck:
      test:
        - CMD-SHELL
        - >
          mongosh -u root -p "$SERVICE_PASSWORD_MARIADBROOT" --authenticationDatabase admin --quiet --eval "
            try { const hello = db.adminCommand({hello: 1}); if (hello.isWritablePrimary) { quit(0); } } catch (e) {}
            try { rs.initiate({_id: 'rs0', members: [{_id: 0, host: 'appwrite-mongodb:27017'}]}); } catch (e) {}
            quit(1);
          " 2>/dev/null
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 60s

  appwrite-mariadb:
    image: mariadb:10.11
    container_name: appwrite-mariadb
    volumes:
      - appwrite-mariadb:/var/lib/mysql:rw
    environment:
      - MYSQL_ROOT_PASSWORD=$SERVICE_PASSWORD_MARIADBROOT
      - MYSQL_DATABASE=${_APP_DB_SCHEMA:-appwrite}
      - MYSQL_USER=$SERVICE_USER_MARIADB
      - MYSQL_PASSWORD=$SERVICE_PASSWORD_MARIADB
      - MARIADB_AUTO_UPGRADE=1
    command: 'mysqld --innodb-flush-method=fsync'
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 20s
      timeout: 10s
      retries: 5

  appwrite-redis:
    image: redis:7.4.7-alpine
    container_name: appwrite-redis
    command: >
      redis-server
      --maxmemory            512mb
      --maxmemory-policy     allkeys-lru
      --maxmemory-samples    5
    volumes:
      - appwrite-redis:/data:rw
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 20s
      timeout: 10s
      retries: 5
