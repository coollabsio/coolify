      - _APP_REDIS_HOST=${_APP_REDIS_HOST:-appwrite-redis}
      - _APP_REDIS_PORT=${_APP_REDIS_PORT:-6379}
      - _APP_REDIS_USER=${_APP_REDIS_USER}
      - _APP_REDIS_PASS=${_APP_REDIS_PASS}
      - _APP_DB_ADAPTER=${_APP_DB_ADAPTER:-postgresql}
      - _APP_DB_HOST=${_APP_DB_HOST:-appwrite-postgresql}
      - _APP_DB_PORT=${_APP_DB_PORT:-5432}
      - _APP_DB_SCHEMA=${_APP_DB_SCHEMA:-appwrite}
      - _APP_DB_USER=$SERVICE_USER_POSTGRES
      - _APP_DB_PASS=$SERVICE_PASSWORD_POSTGRES
      - _APP_DB_ADAPTER_VECTORSDB=${_APP_DB_ADAPTER_VECTORSDB:-postgresql}
      - _APP_DB_HOST_VECTORSDB=${_APP_DB_HOST_VECTORSDB:-appwrite-postgresql}
      - _APP_DB_PORT_VECTORSDB=${_APP_DB_PORT_VECTORSDB:-5432}
      - _APP_DB_SCHEMA_VECTORSDB=${_APP_DB_SCHEMA_VECTORSDB:-appwrite}
      - _APP_DB_USER_VECTORSDB=$SERVICE_USER_POSTGRES
      - _APP_DB_PASS_VECTORSDB=$SERVICE_PASSWORD_POSTGRES
      - _APP_DB_ADAPTER_DOCUMENTSDB=${_APP_DB_ADAPTER_DOCUMENTSDB:-mongodb}
      - _APP_DB_HOST_DOCUMENTSDB=${_APP_DB_HOST_DOCUMENTSDB}
      - _APP_DB_PORT_DOCUMENTSDB=${_APP_DB_PORT_DOCUMENTSDB:-27017}
      - _APP_DB_SCHEMA_DOCUMENTSDB=${_APP_DB_SCHEMA_DOCUMENTSDB}
      - _APP_DB_USER_DOCUMENTSDB=${_APP_DB_USER_DOCUMENTSDB}
      - _APP_DB_PASS_DOCUMENTSDB=${_APP_DB_PASS_DOCUMENTSDB}
      - _APP_CONNECTIONS_DATABASE_DOCUMENTSDB=${_APP_CONNECTIONS_DATABASE_DOCUMENTSDB}
      - _APP_CONNECTIONS_DATABASE_VECTORSDB=${_APP_CONNECTIONS_DATABASE_VECTORSDB}
      - _APP_LOGGING_CONFIG=${_APP_LOGGING_CONFIG}
      - _APP_LOGGING_FORMAT=${_APP_LOGGING_FORMAT:-pretty}
      - _APP_LOGGING_CONFIG_REALTIME=${_APP_LOGGING_CONFIG_REALTIME}
      - _APP_DATABASE_SHARED_TABLES=${_APP_DATABASE_SHARED_TABLES}
      - _APP_LIMIT_DATABASE_BATCH=${_APP_LIMIT_DATABASE_BATCH:-100}
      - _APP_DOCUMENTSDB=${_APP_DOCUMENTSDB:-disabled}
      - _APP_VECTORSDB=${_APP_VECTORSDB:-disabled}
      - _APP_EMBEDDING=${_APP_EMBEDDING:-disabled}
      - _APP_POOL_ADAPTER=swoole
    healthcheck:
      test: ["CMD-SHELL", "curl -s localhost > /dev/null || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 3

  appwrite-console:
    image: appwrite/new:1.1.16
    depends_on:
      - appwrite
    environment:
      - SERVICE_URL_APPWRITE_3000=/
      - VITE_CONSOLE_PROFILE=self-hosted
      - APPWRITE_ENDPOINT_SAME_ORIGIN=true
      - VITE_GROWTH_ENDPOINT=${VITE_GROWTH_ENDPOINT:-https://growth.appwrite.io/v1}
    healthcheck:
      test: ["CMD-SHELL", "bun -e \"fetch('http://localhost:3000').then(r => process.exit(r.status < 500 ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 20s
      timeout: 5s
      retries: 3

  appwrite-worker:
    image: appwrite/appwrite:2.0.0
    entrypoint: worker
    depends_on:
      - appwrite-postgresql
      - appwrite-redis
      - appwrite-clickhouse
      - openruntimes-executor
      - orchestrator
    volumes:
      - appwrite-uploads:/storage/uploads:rw
      - appwrite-imports:/storage/imports:rw
      - appwrite-cache:/storage/cache:rw
      - appwrite-config:/storage/config:rw
      - appwrite-certificates:/storage/certificates:rw
      - appwrite-functions:/storage/functions:rw
      - appwrite-sites:/storage/sites:rw
      - appwrite-builds:/storage/builds:rw
    environment:
      - _APP_ENV=${_APP_ENV:-production}
      - _APP_USAGE_STATS=${_APP_USAGE_STATS:-enabled}
      - _APP_USAGE_PASS=$SERVICE_PASSWORD_CLICKHOUSE
      - _APP_CONNECTIONS_DB_USAGE=http://appwrite:$SERVICE_PASSWORD_CLICKHOUSE@appwrite-clickhouse:8123/appwrite
