  appwrite-clickhouse:
    image: clickhouse/clickhouse-server:26.4.3-alpine
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    volumes:
      - appwrite-clickhouse:/var/lib/clickhouse:rw
    environment:
      - CLICKHOUSE_DB=appwrite
      - CLICKHOUSE_USER=appwrite
      - CLICKHOUSE_PASSWORD=$SERVICE_PASSWORD_CLICKHOUSE
      - CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT=1
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --user \"$$CLICKHOUSE_USER\" --password \"$$CLICKHOUSE_PASSWORD\" --query \"SELECT 1\" > /dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  appwrite-postgresql:
    image: appwrite/postgres:0.1.0
    volumes:
      - appwrite-postgresql:/var/lib/postgresql:rw
    environment:
      - POSTGRES_DB=${_APP_DB_SCHEMA:-appwrite}
      - POSTGRES_USER=$SERVICE_USER_POSTGRES
      - POSTGRES_PASSWORD=$SERVICE_PASSWORD_POSTGRES
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  appwrite-redis:
    image: redis:7.4.7-alpine
    command: >
      redis-server
      --maxmemory            512mb
      --maxmemory-policy     allkeys-lru
      --maxmemory-samples    5
    volumes:
      - appwrite-redis:/data:rw
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 20s
      timeout: 10s
      retries: 5
