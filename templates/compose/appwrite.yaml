      - appwrite-functions:/storage/functions:rw
      - appwrite-sites:/storage/sites:rw
      - appwrite-builds:/storage/builds:rw
    depends_on:
      appwrite-postgresql:
        condition: service_healthy
      appwrite-redis:
        condition: service_healthy
      appwrite-clickhouse:
        condition: service_healthy
      appwrite-geo:
        condition: service_healthy
      appwrite-exiftool:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/.appwrite-ready && curl -fsS -o /dev/null http://localhost/v1/health/version || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 6
      start_period: 120s

  appwrite-console:
    image: appwrite/new:1.2.97-self-hosted
    environment:
      - SERVICE_URL_APPWRITE_3000=/
      - VITE_CONSOLE_PROFILE=self-hosted
      - VITE_APPWRITE_VERSION=2.6.1
      - APPWRITE_ENDPOINT_SAME_ORIGIN=true
    depends_on:
      appwrite:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bun -e \"fetch('http://localhost:3000').then(r => process.exit(r.status < 500 ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 20s
      timeout: 5s
      retries: 3

