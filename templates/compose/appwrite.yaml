      appwrite-postgresql:
        condition: service_healthy
      appwrite-redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -s localhost > /dev/null || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 3

