# documentation: https://github.com/decolua/9router
# slogan: FREE AI coding gateway. Routes Claude Code, Codex, Cursor, Cline, Copilot requests to 40+ LLM providers with auto-fallback and token savings.
# category: ai
# tags: ai, gateway, routing, coding, llm, providers
# logo: svgs/9router.svg
# port: 20128

services:
  9router:
    image: decolua/9router:${9ROUTER_VERSION:-latest}
    volumes:
      - '9router:/app/data'
    ports:
      - '20128:20128/tcp'
    environment:
      - SERVICE_URL_9ROUTER_20128
      - DATA_DIR=/app/data
      - INITIAL_PASSWORD=${INITIAL_PASSWORD:?123456}
      - JWT_SECRET=${SERVICE_PASSWORDWITHSYMBOLS_64_9ROUTER-JWT-SECRET}
      - API_KEY_SECRET=${SERVICE_PASSWORDWITHSYMBOLS_9ROUTER-KEY-SECRET}
      - MACHINE_ID_SALT=${SERVICE_HEX_64_9ROUTER-HMAC-SALT}
    healthcheck:
      test:
        - CMD
        - wget
        - --spider
        - 'http://127.0.0.1:20128/'
      interval: 5s
      timeout: 10s
      retries: 5
