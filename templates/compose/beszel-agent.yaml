# documentation: https://www.beszel.dev/guide/agent-installation
# slogan: Monitoring agent for Beszel
# category: monitoring
# tags: beszel,monitoring,server,stats,alerts
# logo: svgs/beszel.svg

services:
  beszel-agent:
    image: 'henrygd/beszel-agent:0.19.0'
    restart: unless-stopped
    network_mode: host
    environment:
      # Required
      LISTEN: '${LISTEN:-/beszel_socket/beszel.sock}'
      HUB_URL: '${HUB_URL}'
      TOKEN: '${TOKEN}'
      KEY: '${KEY}'
      # Optional
      DISABLE_SSH: '${DISABLE_SSH:-false}'
      LOG_LEVEL: '${LOG_LEVEL:-warn}'
      SKIP_GPU: '${SKIP_GPU:-false}'
      SYSTEM_NAME: '${SYSTEM_NAME}'
    volumes:
      - 'beszel_agent_data:/var/lib/beszel-agent'
      - 'beszel_socket:/beszel_socket'
      - '/var/run/docker.sock:/var/run/docker.sock:ro'
    healthcheck:
      test:
        - CMD
        - /agent
        - health
      interval: 60s
      timeout: 20s
      retries: 10
      start_period: 5s
volumes:
  beszel_agent_data: null
  beszel_socket: null
