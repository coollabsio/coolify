version: '3.8'

services:
  email:
    image: mailserver/docker-mailserver:latest
    container_name: mailserver
    hostname: mail
    domainname: example.com  # Set your domain here
    ports:
      - "25:25"
      - "143:143"
      - "587:587"
      - "993:993"
      - "465:465"
    environment:
      - MAIL_USER=user@example.com
      - MAIL_PASSWORD=strongpassword
    volumes:
      - mail_data:/var/mail
      - mail_config:/etc/mail
      - mail_cert:/etc/letsencrypt
    networks:
      - mail_network
    restart: unless-stopped

networks:
  mail_network:
    driver: bridge

volumes:
  mail_data:
    driver: local
  mail_config:
    driver: local
  mail_cert:
    driver: local
