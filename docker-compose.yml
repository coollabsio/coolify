version: "3.8"
services:
  surrealdb:
    image: surrealdb/surrealdb:latest
    container_name: surrealdb
    ports:
      - "8000:8000"
      - "8001:8001"
    environment:
      - SURREALDB_DB_PATH=/db
      - SURREALDB_BACKEND=${SURREALDB_BACKEND:-rockdb}  # 默认使用 rockdb, 可以通过环境变量切换
    volumes:
      - surrealdb_data:/db
    command: >
      /bin/sh -c "
        if [ "${SURREALDB_BACKEND}" = 'tikv' ]; then
          surrealdb server --db /db --tikv
        else
          surrealdb server --db /db --rockdb
        fi
      "
volumes:
  surrealdb_data: