images:
  - location: https://cloud.debian.org/images/cloud/trixie/latest/debian-13-generic-amd64.qcow2
    arch: x86_64
  - location: https://cloud.debian.org/images/cloud/trixie/latest/debian-13-generic-arm64.qcow2
    arch: aarch64

cpus: 2
memory: 2GiB
disk: 20GiB

containerd:
  system: false
  user: false

mounts: []

ssh:
  localPort: 2224
  loadDotSSHPubKeys: false

provision:
  - mode: system
    script: |
      #!/bin/bash
      set -euxo pipefail

      install -d -m 700 /root/.ssh
      cat >/root/.ssh/authorized_keys <<'EOF'
      ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIFuGmoeGq/pojrsyP1pszcNVuZx9iFkCELtxrh31QJ68 sail@76ff66d2e2dd
      EOF
      chmod 600 /root/.ssh/authorized_keys

      sed -i 's/^#\?PermitRootLogin .*/PermitRootLogin prohibit-password/' /etc/ssh/sshd_config
      sed -i 's/^#\?PubkeyAuthentication .*/PubkeyAuthentication yes/' /etc/ssh/sshd_config
      systemctl restart ssh
