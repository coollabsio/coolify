# Set client body buffer to handle Sentinel payloads in memory
client_body_buffer_size 256k;

# Proxy the realtime (Reverb) and terminal WebSockets that run in this container, so a
# reverse proxy that forwards only this port (for example Tailscale Serve) also serves them.
location /app/ {
    proxy_pass http://127.0.0.1:6001;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "Upgrade";
    proxy_set_header Host $host;
}

location = /terminal/ws {
    proxy_pass http://127.0.0.1:6002;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "Upgrade";
    proxy_set_header Host $host;
}
