error_reporting = E_ERROR
error_log = /var/www/html/storage/logs/php-error.log
log_errors = Off
log_errors_max_len = 8192
ignore_repeated_errors = On
ignore_repeated_source = On

upload_max_filesize = 256M
post_max_size = 256M
memory_limit = ${PHP_MEMORY_LIMIT:-512M}
session.upload_progress.enabled = Off

; The scheduler starts several short-lived `php artisan` processes each minute. The opcache of a CLI
; process is lost when it exits, so without this file cache each process compiles the full app again.
opcache.file_cache = /var/www/opcache
